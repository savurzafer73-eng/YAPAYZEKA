/* =========================================================
   MINA VIDEO AI
========================================================= */

const CLIENT_ID = "pk_QJfK0SKE0MqAqf3I";

const REDIRECT_URI =
"https://savurzafer73-eng.github.io/YAPAYZEKA/";

const AUTH_URL =
"https://enter.pollinations.ai/authorize";

const TOKEN_URL =
"https://enter.pollinations.ai/api/oauth/token";

const MAX_SEED = 2147483647;

let accessToken =
localStorage.getItem("mina_pollinations_token") || "";

let generatedScript = null;
let generatedScenes = [];
let finalVideoBlob = null;


/* =========================================================
   ELEMENTS
========================================================= */

const statusBox =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const scriptOutput =
document.getElementById("scriptOutput");

const scenesBox =
document.getElementById("scenes");

const videoPreview =
document.getElementById("videoPreview");

const downloadBtn =
document.getElementById("downloadBtn");


/* =========================================================
   STATUS
========================================================= */

function status(text){
    statusBox.textContent = text;
}

function progress(value){
    progressBar.style.width =
    Math.max(0,Math.min(100,value)) + "%";
}


/* =========================================================
   LANGUAGE
========================================================= */

function getLanguageName(){

    const lang =
    document.getElementById("language").value;

    if(lang === "de") return "German";
    if(lang === "en") return "English";

    return "Turkish";
}


/* =========================================================
   WPM
========================================================= */

function getWPM(){

    const lang =
    document.getElementById("language").value;

    if(lang === "de") return 130;

    if(lang === "en") return 145;

    return 140;
}


/* =========================================================
   STYLE
========================================================= */

function getStyle(){

    const value =
    document.getElementById("style").value;

    const styles = {

        cinematic:
        "cinematic, dramatic lighting, realistic movie frame",

        fantasy:
        "dark fantasy cinematic concept art",

        scifi:
        "science fiction cinematic futuristic scene",

        "3d":
        "high quality 3D animated movie style",

        "2d":
        "beautiful 2D animation illustration",

        dark:
        "dark mysterious atmospheric cinematic scene",

        photo:
        "photorealistic documentary photography",

        action:
        "dynamic action movie cinematic scene",

        medieval:
        "realistic medieval historical cinematic scene",

        epic:
        "epic cinematic masterpiece, dramatic atmosphere"

    };

    return styles[value] || styles.cinematic;
}


/* =========================================================
   SAFE SEED
========================================================= */

function createSafeSeed(sceneNumber){

    const timePart =
    Date.now() % MAX_SEED;

    const scenePart =
    sceneNumber * 100003;

    const seed =
    (timePart + scenePart) % MAX_SEED;

    return Math.floor(seed);
}


/* =========================================================
   PKCE
========================================================= */

function randomString(length=64){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    const array =
    new Uint8Array(length);

    crypto.getRandomValues(array);

    for(let i=0;i<length;i++){

        result +=
        chars[array[i] % chars.length];

    }

    return result;
}


async function sha256Base64Url(text){

    const data =
    new TextEncoder().encode(text);

    const digest =
    await crypto.subtle.digest("SHA-256",data);

    const bytes =
    new Uint8Array(digest);

    let binary = "";

    bytes.forEach(
        b => binary += String.fromCharCode(b)
    );

    return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");

}


/* =========================================================
   CONNECT POLLINATIONS
========================================================= */

async function connectPollinations(){

    const verifier =
    randomString(64);

    const challenge =
    await sha256Base64Url(verifier);

    const state =
    randomString(32);

    sessionStorage.setItem(
        "mina_pkce_verifier",
        verifier
    );

    sessionStorage.setItem(
        "mina_oauth_state",
        state
    );

    const params =
    new URLSearchParams({

        response_type:"code",

        client_id:CLIENT_ID,

        redirect_uri:REDIRECT_URI,

        scope:"profile usage",

        code_challenge:challenge,

        code_challenge_method:"S256",

        state:state

    });

    window.location.href =
    AUTH_URL + "?" + params.toString();
}


/* =========================================================
   OAUTH CALLBACK
========================================================= */

async function handleOAuthCallback(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    const code =
    params.get("code");

    const state =
    params.get("state");

    if(!code) return;

    const savedState =
    sessionStorage.getItem(
        "mina_oauth_state"
    );

    const verifier =
    sessionStorage.getItem(
        "mina_pkce_verifier"
    );

    if(state !== savedState){

        status("❌ OAuth state doğrulaması başarısız.");

        return;
    }

    status("🔐 Pollinations bağlantısı kuruluyor...");

    try{

        const response =
        await fetch(TOKEN_URL,{

            method:"POST",

            headers:{
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:new URLSearchParams({

                grant_type:"authorization_code",

                code:code,

                client_id:CLIENT_ID,

                redirect_uri:REDIRECT_URI,

                code_verifier:verifier

            })

        });

        const data =
        await response.json();

        if(!response.ok){

            throw new Error(
                data.error_description ||
                data.error ||
                "Token alınamadı"
            );

        }

        accessToken =
        data.access_token;

        localStorage.setItem(
            "mina_pollinations_token",
            accessToken
        );

        window.history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        status("✅ Pollinations bağlantısı başarılı.");

    }catch(error){

        console.error(error);

        status(
            "❌ Bağlantı hatası:\n" +
            error.message
        );

    }

}


/* =========================================================
   GENERATE SCRIPT
========================================================= */

async function generateScript(){

    if(!accessToken){

        status(
            "Önce 🔐 Pollinations Bağlantısı butonuna bas."
        );

        return;
    }

    const topic =
    document.getElementById("topic").value.trim();

    if(!topic){

        status("Önce video konusunu yaz.");

        return;
    }

    const minutes =
    Number(
        document.getElementById("duration").value
    );

    const sceneCount =
    Number(
        document.getElementById("sceneCount").value
    );

    const language =
    getLanguageName();

    const wpm =
    getWPM();

    const targetWords =
    minutes * wpm;

    const sceneWords =
    Math.round(targetWords / sceneCount);

    status(
        "🧠 Senaryo oluşturuluyor...\n" +
        "Hedef: yaklaşık " +
        targetWords +
        " kelime"
    );

    progress(5);

    const systemPrompt = `

You are a professional YouTube documentary
scriptwriter.

Create a highly engaging mystery documentary.

Language: ${language}

Target total length:
approximately ${targetWords} words.

Number of scenes:
${sceneCount}

Each scene should contain approximately
${sceneWords} words.

The narration must feel natural when spoken.

IMPORTANT:
Do NOT make extremely short sentences.

Create complete natural sentences.

The narration must be suitable for subtitles.

Return ONLY valid JSON.

Format:

{
 "title":"...",
 "scenes":[
   {
     "narration":"...",
     "imagePrompt":"..."
   }
 ]
}

The imagePrompt must be detailed and cinematic.

Do not include markdown.
Do not include explanations.
`;

    const userPrompt =
    "Topic: " + topic;


    try{

        let data =
        await callTextAPI(
            systemPrompt,
            userPrompt
        );

        generatedScript =
        data;

        let actualWords =
        countWords(
            data.scenes
            .map(x => x.narration)
            .join(" ")
        );

        /*
        If the generated script is much too short,
        automatically request a longer version.
        */

        if(actualWords < targetWords * 0.85){

            status(
                "📝 Senaryo kısa geldi. " +
                "Mina senaryoyu genişletiyor..."
            );

            progress(10);

            const expansionPrompt = `

Expand the following script naturally.

Target approximately ${targetWords} total words.

Keep exactly ${sceneCount} scenes.

Do not shorten existing information.

Add relevant details, chronology,
atmosphere and documentary narration.

Language: ${language}

Return ONLY valid JSON.

Format:

{
 "title":"...",
 "scenes":[
   {
     "narration":"...",
     "imagePrompt":"..."
   }
 ]

}

Existing script:

${JSON.stringify(data)}
`;

            data =
            await callTextAPI(
                expansionPrompt,
                "Expand the documentary script."
            );

            generatedScript =
            data;

        }

        renderScript();

        progress(25);

        status(
            "✅ Senaryo hazır.\n" +
            "Yaklaşık " +
            countWords(
                generatedScript.scenes
                .map(x=>x.narration)
                .join(" ")
            ) +
            " kelime."
        );

    }catch(error){

        console.error(error);

        status(
            "❌ Senaryo hatası:\n" +
            error.message
        );

    }

}


/* =========================================================
   TEXT API
========================================================= */

async function callTextAPI(
    systemPrompt,
    userPrompt
){

    const response =
    await fetch(
        "https://gen.pollinations.ai/v1/chat/completions",
        {

            method:"POST",

            headers:{

                "Content-Type":
                "application/json",

                "Authorization":
                "Bearer " + accessToken

            },

            body:JSON.stringify({

                model:"openai",

                messages:[

                    {
                        role:"system",
                        content:systemPrompt
                    },

                    {
                        role:"user",
                        content:userPrompt
                    }

                ],

                temperature:.8,

                max_tokens:16000

            })

        }
    );

    const data =
    await response.json();

    if(!response.ok){

        throw new Error(
            data?.error?.message ||
            data?.message ||
            "Text API hatası"
        );

    }

    let text =
    data?.choices?.[0]?.message?.content ||
    "";

    text =
    text
    .replace(/```json/gi,"")
    .replace(/```/g,"")
    .trim();

    try{

        return JSON.parse(text);

    }catch(e){

        /*
        Try extracting JSON object.
        */

        const start =
        text.indexOf("{");

        const end =
        text.lastIndexOf("}");

        if(start >= 0 && end > start){

            return JSON.parse(
                text.substring(start,end+1)
            );

        }

        throw new Error(
            "AI geçerli JSON döndürmedi."
        );

    }

}


/* =========================================================
   WORD COUNT
========================================================= */

function countWords(text){

    if(!text) return 0;

    return text
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;

}


/* =========================================================
   RENDER SCRIPT
========================================================= */

function renderScript(){

    if(!generatedScript) return;

    let html = "";

    html +=
    "<h3>" +
    escapeHtml(
        generatedScript.title || "Mina Video"
    ) +
    "</h3>";

    generatedScript.scenes.forEach(
        (scene,index)=>{

            html +=
            "<div class='sceneText'>" +
            "<b>Sahne " +
            (index+1) +
            "</b><br>" +
            escapeHtml(
                scene.narration
            ) +
            "</div><br>";

        }
    );

    scriptOutput.innerHTML =
    html;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

    return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   WAIT
========================================================= */

function wait(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


/* =========================================================
   GENERATE IMAGE
========================================================= */

async function generateImage(
    prompt,
    sceneNumber
){

    const encoded =
    encodeURIComponent(prompt);

    const seed =
    createSafeSeed(sceneNumber);

    const urls = [

        `https://gen.pollinations.ai/image/${encoded}?model=flux&width=1280&height=720&seed=${seed}`,

        `https://gen.pollinations.ai/image/${encoded}?model=flux&width=1280&height=720&seed=${seed}&nologo=true`

    ];


    let lastError =
    null;


    for(let attempt=0;attempt<5;attempt++){

        for(const url of urls){

            try{

                const response =
                await fetch(url,{

                    headers:{
                        "Authorization":
                        "Bearer " + accessToken
                    }

                });

                if(response.ok){

                    const blob =
                    await response.blob();

                    return URL.createObjectURL(blob);

                }


                if(response.status === 429){

                    lastError =
                    new Error(
                        "Queue dolu"
                    );

                    const delay =
                    [5000,10000,20000,30000,40000]
                    [attempt] || 40000;

                    status(
                        "⏳ Görsel sırası dolu.\n" +
                        Math.round(delay/1000) +
                        " saniye bekleniyor..."
                    );

                    await wait(delay);

                    continue;

                }


                const text =
                await response.text();

                lastError =
                new Error(
                    "HTTP " +
                    response.status +
                    " " +
                    text
                );

            }catch(error){

                lastError =
                error;

            }

        }

    }

    throw lastError ||
    new Error("Görsel oluşturulamadı.");

}


/* =========================================================
   GENERATE IMAGES
========================================================= */

async function generateImages(){

    if(!generatedScript){

        status(
            "Önce 📝 Senaryo Oluştur."
        );

        return;
    }

    generatedScenes = [];

    scenesBox.innerHTML = "";

    const scenes =
    generatedScript.scenes;

    status(
        "🖼️ Görseller oluşturuluyor...\n" +
        "Görseller sırayla hazırlanacak."
    );

    for(let i=0;i<scenes.length;i++){

        const scene =
        scenes[i];

        status(
            "🖼️ Görsel " +
            (i+1) +
            "/" +
            scenes.length +
            " oluşturuluyor..."
        );

        progress(
            25 +
            ((i / scenes.length) * 55)
        );


        const fullPrompt =
        scene.imagePrompt +
        ", " +
        getStyle() +
        ", 16:9 YouTube documentary frame, " +
        "high detail, no text, no watermark";


        try{

            const imageUrl =
            await generateImage(
                fullPrompt,
                i+1
            );

            generatedScenes.push({

                imageUrl:imageUrl,

                narration:
                scene.narration,

                imagePrompt:
                scene.imagePrompt

            });


            const div =
            document.createElement("div");

            div.className =
            "scene";

            div.innerHTML =
            `
            <img src="${imageUrl}">
            <div class="sceneText">
            <b>Sahne ${i+1}</b><br>
            ${escapeHtml(scene.narration)}
            </div>
            `;

            scenesBox.appendChild(div);

            /*
            Important:
            Pollinations anonymous queue limit can be 1.
            Therefore we intentionally wait between images.
            */

            if(i < scenes.length-1){

                await wait(2500);

            }

        }catch(error){

            console.error(error);

            status(
                "❌ Sahne " +
                (i+1) +
                " oluşturulamadı:\n" +
                error.message
            );

            return;

        }

    }

    progress(85);

    status(
        "✅ Tüm görseller hazır.\n" +
        "Şimdi 🎬 Videoyu Oluştur butonuna basabilirsin."
    );

}

/* =========================================================
   SUBTITLE ENGINE
   GELİŞTİRİLMİŞ SİSTEM
========================================================= */

/*

Buradaki sistem eski sistemden farklıdır.

Eski:
çok küçük kelime grupları
+
çok kısa süre

Yeni:
- Cümle bütünlüğü korunur.
- Ortalama 10-16 kelimelik altyazı blokları.
- Çok kısa bloklar birleştirilir.
- Çok uzun bloklar kontrollü bölünür.
- Her altyazının minimum ekranda kalma süresi vardır.
- Altyazılar sahne süresine yayılır.
- Son altyazı sahne sonunda aniden kaybolmaz.
*/


function normalizeText(text){

    return String(text || "")
    .replace(/\s+/g," ")
    .trim();

}


/*
Cümleyi önce doğal noktalama işaretlerinden böl.
*/

function splitSentences(text){

    text =
    normalizeText(text);

    const matches =
    text.match(
        /[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g
    );

    return matches
    ? matches.map(x=>x.trim()).filter(Boolean)
    : [text];

}


/*
Bir cümleyi doğal kelime bloklarına ayır.
*/

function splitSentenceIntoSubtitleChunks(
    sentence
){

    const words =
    sentence
    .split(/\s+/)
    .filter(Boolean);

    const chunks = [];

    /*
    Altyazı için daha büyük blok.
    */

    const MIN_WORDS = 9;
    const IDEAL_WORDS = 13;
    const MAX_WORDS = 17;


    let current = [];

    for(const word of words){

        current.push(word);

        /*
        Noktalama ile biten ve yeterince
        uzun olan blokları kapat.
        */

        const endsSentence =
        /[.!?。！？,:;]$/.test(word);

        if(
            current.length >= IDEAL_WORDS &&
            endsSentence
        ){

            chunks.push(
                current.join(" ")
            );

            current = [];

            continue;
        }


        if(current.length >= MAX_WORDS){

            chunks.push(
                current.join(" ")
            );

            current = [];

        }

    }


    if(current.length){

        chunks.push(
            current.join(" ")
        );

    }


    /*
    Son parça çok kısa ise öncekiyle birleştir.
    */

    if(chunks.length >= 2){

        const last =
        chunks[chunks.length-1];

        if(
            last.split(/\s+/).length <
            MIN_WORDS
        ){

            chunks[chunks.length-2] +=
            " " + last;

            chunks.pop();

        }

    }


    return chunks;

}


/*
Tüm sahnenin altyazılarını oluştur.
*/

function buildSubtitleChunks(text){

    const sentences =
    splitSentences(text);

    let result = [];

    sentences.forEach(sentence=>{

        const chunks =
        splitSentenceIntoSubtitleChunks(
            sentence
        );

        result =
        result.concat(chunks);

    });


    /*
    Tek kelimelik / çok kısa altyazı kalmışsa
    bir öncekiyle birleştir.
    */

    const cleaned = [];

    for(const item of result){

        const count =
        item.split(/\s+/).length;

        if(
            count < 6 &&
            cleaned.length
        ){

            cleaned[cleaned.length-1] +=
            " " + item;

        }else{

            cleaned.push(item);

        }

    }

    return cleaned;

}


/* =========================================================
   CREATE VIDEO
========================================================= */

async function createVideo(){

    if(!generatedScenes.length){

        status(
            "Önce görselleri oluştur."
        );

        return;

    }

    const minutes =
    Number(
        document.getElementById("duration").value
    );

    const totalSeconds =
    minutes * 60;

    const sceneDuration =
    totalSeconds /
    generatedScenes.length;


    status(
        "🎬 Video hazırlanıyor...\n" +
        "Süre: " +
        minutes +
        " dakika\n" +
        "Altyazılar yavaşlatılmış sistemle hazırlanıyor."
    );

    progress(88);


    const canvas =
    document.createElement("canvas");

    canvas.width = 1280;
    canvas.height = 720;

    const ctx =
    canvas.getContext("2d");


    /*
    Video stream.
    */

    const stream =
    canvas.captureStream(30);


    let recorderOptions = {

        mimeType:
        "video/webm;codecs=vp9"

    };


    let recorder;

    try{

        recorder =
        new MediaRecorder(
            stream,
            recorderOptions
        );

    }catch(e){

        recorder =
        new MediaRecorder(
            stream
        );

    }


    const chunks = [];

    recorder.ondataavailable =
    event => {

        if(event.data &&
           event.data.size > 0){

            chunks.push(event.data);

        }

    };


    recorder.onstop = ()=>{

        finalVideoBlob =
        new Blob(
            chunks,
            {
                type:"video/webm"
            }
        );

        const url =
        URL.createObjectURL(
            finalVideoBlob
        );

        videoPreview.src =
        url;

        downloadBtn.style.display =
        "block";

        progress(100);

        status(
            "🎉 Video hazır!\n\n" +
            "Süre: yaklaşık " +
            minutes +
            " dakika\n" +
            "Altyazılar videoya işlendi."
        );

    };


    recorder.start();


    /*
    ========================================================
    SAHNELER
    ========================================================
    */

    for(let i=0;
        i<generatedScenes.length;
        i++){

        const scene =
        generatedScenes[i];

        const image =
        new Image();

        image.src =
        scene.imageUrl;

        await new Promise(
            resolve=>{

                image.onload =
                resolve;

                image.onerror =
                resolve;

            }
        );


        /*
        Sahne altyazıları
        */

        const subtitleChunks =
        buildSubtitleChunks(
            scene.narration
        );


        /*
        Her altyazının doğal ağırlığı.
        */

        const weights =
        subtitleChunks.map(
            text => {

                const words =
                text.split(/\s+/)
                .filter(Boolean)
                .length;

                return Math.max(
                    words,
                    9
                );

            }
        );


        const totalWeight =
        weights.reduce(
            (a,b)=>a+b,
            0
        );


        /*
        Sahne süresinin küçük bir kısmını
        giriş/çıkış boşluğu olarak bırak.
        */

        const usableDuration =
        Math.max(
            1,
            sceneDuration - 1.2
        );


        /*
        Subtitle timeline
        */

        let subtitleTimeline = [];

        let elapsed = 0;


        subtitleChunks.forEach(
            (text,index)=>{

                let duration =
                usableDuration *
                (
                    weights[index] /
                    totalWeight
                );


                /*
                Minimum altyazı süresi.
                */

                duration =
                Math.max(
                    duration,
                    3.2
                );


                subtitleTimeline.push({

                    start:
                    elapsed + .6,

                    end:
                    elapsed +
                    duration +
                    .6,

                    text:text

                });


                elapsed += duration;

            }
        );


        /*
        Toplam süre sahne süresini aşarsa
        oranla küçült.
        */

        if(
            elapsed >
            usableDuration
        ){

            const scale =
            usableDuration /
            elapsed;

            subtitleTimeline =
            subtitleTimeline.map(
                item=>({

                    start:
                    item.start * scale + .6,

                    end:
                    item.end * scale + .6,

                    text:item.text

                })
            );

        }


        /*
        ====================================================
        FRAME LOOP
        ====================================================
        */

        const startTime =
        performance.now();


        await new Promise(
            resolve=>{

                function drawFrame(){

                    const now =
                    performance.now();

                    const elapsedMs =
                    now - startTime;

                    const seconds =
                    elapsedMs / 1000;


                    /*
                    Progress
                    */

                    const overall =
                    (
                        i +
                        seconds /
                        sceneDuration
                    )
                    /
                    generatedScenes.length;

                    progress(
                        88 +
                        overall * 12
                    );


                    /*
                    =================================================
                    BACKGROUND
                    =================================================
                    */

                    ctx.fillStyle =
                    "#000";

                    ctx.fillRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    /*
                    Cover image.
                    */

                    const scale =
                    Math.max(
                        canvas.width /
                        image.width,

                        canvas.height /
                        image.height
                    );

                    const width =
                    image.width *
                    scale;

                    const height =
                    image.height *
                    scale;

                    const x =
                    (canvas.width-width)/2;

                    const y =
                    (canvas.height-height)/2;


                    ctx.drawImage(
                        image,
                        x,
                        y,
                        width,
                        height
                    );


                    /*
                    =================================================
                    SUBTITLE
                    =================================================
                    */

                    let currentSubtitle =
                    null;


                    for(
                        const item
                        of subtitleTimeline
                    ){

                        if(
                            seconds >= item.start &&
                            seconds < item.end
                        ){

                            currentSubtitle =
                            item;

                            break;

                        }

                    }


                    if(currentSubtitle){

                        drawSubtitle(
                            ctx,
                            currentSubtitle.text
                        );

                    }


                    /*
                    Scene number
                    */

                    drawSceneIndicator(
                        ctx,
                        i+1,
                        generatedScenes.length
                    );


                    if(
                        seconds <
                        sceneDuration
                    ){

                        requestAnimationFrame(
                            drawFrame
                        );

                    }else{

                        resolve();

                    }

                }

                drawFrame();

            }
        );

    }


    /*
    Video bitişi.
    */

    recorder.stop();

}


/* =========================================================
   DRAW SUBTITLE
========================================================= */

function drawSubtitle(
    ctx,
    text
){

    /*
    Maksimum altyazı genişliği.
    */

    const maxWidth =
    1050;

    const fontSize =
    38;

    ctx.font =
    "bold " +
    fontSize +
    "px Arial";


    /*
    Metni satırlara böl.
    */

    const words =
    text.split(/\s+/);

    const lines = [];

    let current = "";

    for(const word of words){

        const test =
        current
        ? current + " " + word
        : word;

        const width =
        ctx.measureText(test).width;

        if(
            width > maxWidth &&
            current
        ){

            lines.push(current);

            current = word;

        }else{

            current = test;

        }

    }

    if(current){

        lines.push(current);

    }


    /*
    En fazla 2 satır.
    */

    while(lines.length > 2){

        lines[0] +=
        " " + lines[1];

        lines.splice(1,1);

    }


    const lineHeight =
    50;

    const paddingX =
    30;

    const paddingY =
    18;

    const boxHeight =
    lines.length *
    lineHeight +
    paddingY * 2;


    /*
    Alt bölüm.
    */

    const boxY =
    canvasHeightForSubtitle(ctx) -
    boxHeight -
    55;


    /*
    Siyah transparan kutu.
    */

    ctx.fillStyle =
    "rgba(0,0,0,.78)";


    roundRect(
        ctx,

        80,

        boxY,

        1120,

        boxHeight,

        16
    );


    ctx.fill();


    /*
    Yazı.
    */

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillStyle =
    "#ffffff";

    ctx.strokeStyle =
    "rgba(0,0,0,.9)";

    ctx.lineWidth =
    4;


    const firstY =
    boxY +
    paddingY +
    lineHeight/2;


    lines.forEach(
        (line,index)=>{

            const y =
            firstY +
            index *
            lineHeight;


            ctx.strokeText(
                line,
                640,
                y
            );


            ctx.fillText(
                line,
                640,
                y
            );

        }
    );


    ctx.textAlign =
    "left";

}


/* =========================================================
   HELPER
========================================================= */

function canvasHeightForSubtitle(ctx){

    return ctx.canvas.height;

}


function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

}


function drawSceneIndicator(
    ctx,
    current,
    total
){

    ctx.fillStyle =
    "rgba(0,0,0,.55)";

    roundRect(
        ctx,
        25,
        25,
        120,
        42,
        12
    );

    ctx.fill();

    ctx.font =
    "bold 20px Arial";

    ctx.fillStyle =
    "#fff";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillText(
        current + " / " + total,
        85,
        46
    );

    ctx.textAlign =
    "left";

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadVideo(){

    if(!finalVideoBlob){

        status(
            "Önce video oluştur."
        );

        return;

    }

    const url =
    URL.createObjectURL(
        finalVideoBlob
    );

    const a =
    document.createElement("a");

    a.href =
    url;

    a.download =
    "mina-video-" +
    Date.now() +
    ".webm";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        3000
    );

}
