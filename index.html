/* =========================================================
   RANDOM STATE
========================================================= */

function randomString(length=64){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    for(let i=0;i<length;i++){

        result +=
            chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];
    }

    return result;
}


/* =========================================================
   BASE64URL
========================================================= */

function base64Url(buffer){

    let binary = "";

    const bytes =
        new Uint8Array(buffer);

    for(let i=0;i<bytes.byteLength;i++){

        binary +=
            String.fromCharCode(
                bytes[i]
            );
    }

    return btoa(binary)
        .replace(/\+/g,"-")
        .replace(/\//g,"_")
        .replace(/=+$/,"");
}


/* =========================================================
   PKCE
========================================================= */

async function createPKCE(){

    const verifier =
        randomString(96);

    const encoder =
        new TextEncoder();

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            encoder.encode(verifier)
        );

    return {
        verifier:verifier,
        challenge:base64Url(digest)
    };
}

            await createPKCE();

        params.set(

        params.set(

            "profile usage"
        );

        params.set(
            "state",
            state
        );

        params.set(
            "code_challenge",
            pkce.challenge
        );

        params.set(
            "code_challenge_method",
            "S256"
        );

        /*
          Uygulamanın izin verilen modelleri.
        */

        params.set(
            "models",
            [
                TEXT_MODEL,
                IMAGE_MODEL,
                AUDIO_MODEL
            ].join(",")
        );

        window.location.href =
            AUTH_URL +
            "?" +
            params.toString();

    }catch(error){

        console.error(error);

        setStatus(
            "Bağlantı başlatılamadı: " +
            error.message,

}


/* =========================================================
   OAUTH CALLBACK
========================================================= */

async function handleOAuthCallback(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    const returnedState =
        params.get("state");

    const error =
        params.get("error");

    if(error){

        setStatus(
            "Pollinations bağlantısı reddedildi: " +
            error,
            "error"
        );

        return;
    }

    if(!code){

        return;
    }

    const savedState =
        sessionStorage.getItem(
            "mina_oauth_state"
        );

    if(
        savedState &&
        returnedState !== savedState
    ){

        setStatus(
            "OAuth güvenlik kontrolü başarısız.",
            "error"
        );

        return;
    }

    const verifier =
        sessionStorage.getItem(
            "mina_pkce_verifier"
        );

    if(!verifier){

        setStatus(
            "PKCE doğrulama bilgisi bulunamadı.",
            "error"
        );

        return;
    }

    setStatus(
        "Pollinations bağlantısı doğrulanıyor..."
    );

    try{

        const body =
            new URLSearchParams();

        body.set(
            "grant_type",
            "authorization_code"
        );

        body.set(
            "code",
            code
        );

        body.set(
            "client_id",
            APP_KEY
        );

        body.set(
            "redirect_uri",
            REDIRECT_URI
        );

        body.set(
            "code_verifier",
            verifier
        );

        const response =
            await fetch(
                TOKEN_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body:body.toString()
                }
            );

        if(!response.ok){

            const raw =
                await response.text();

            throw new Error(
                raw.substring(0,500)
            );
        }

        const data =
            await response.json();

        if(!data.access_token){

            throw new Error(
                "Access token alınamadı."
            );
        }

        accessToken =
            data.access_token;

        /*
          Token sadece sessionStorage'da tutuluyor.
          Kalıcı localStorage kullanılmıyor.
        */

        sessionStorage.setItem(
            "mina_access_token",
            accessToken
        );

        sessionStorage.removeItem(
            "mina_pkce_verifier"
        );

        sessionStorage.removeItem(
            "mina_oauth_state"
        );

        window.history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        updateAuthStatus();

        setStatus(
            "🟢 Mina AI bağlantısı aktif.",
            "success"
        );

        log(
            "OAuth bağlantısı başarıyla tamamlandı."
        );

    }catch(error){

        console.error(error);

        setStatus(
            "OAuth hatası: " +
            error.message,
            "error"
        );
    }
}

/* =========================================================
   TEXT API
========================================================= */

async function callTextAI(prompt){

    requireAuth();

    const response =
        await fetch(
            API_URL +
            "/v1/chat/completions",
            {
                method:"POST",

                headers:{
                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    model:TEXT_MODEL,

                    messages:[

                            content:

                        },
                        {
                            role:"user",
                            content:prompt
                        }
                    ],

                    temperature:.8
                })
            }
        );

    if(!response.ok){

        const raw =
            await response.text();

        throw new Error(
            "AI metin hatası: " +
            raw.substring(0,500)
        );
    }

    const data =
        await response.json();

    const text =
        data &&
        data.choices &&
        data.choices[0] &&
        data.choices[0].message &&
        data.choices[0].message.content;

    if(!text){

        throw new Error(
            "AI boş cevap döndürdü."
        );
    }

    return text;
}


/* =========================================================
   JSON TEMİZLEME
========================================================= */

function extractJSON(text){

    if(!text){

        throw new Error(
            "AI sahne cevabı boş."
        );
    }

    let cleaned =
        text.trim();

    cleaned =
        cleaned
        .replace(/```json/gi,"")
        .replace(/```/g,"")
        .trim();

    /*
      Önce doğrudan JSON.
    */

    try{

        return JSON.parse(cleaned);

    }catch(e){}


    /*
      Array bul.
    */

    const first =
        cleaned.indexOf("[");

    const last =
        cleaned.lastIndexOf("]");

    if(first !== -1 && last > first){

        const candidate =
            cleaned.substring(
                first,
                last + 1
            );

        try{

            return JSON.parse(
                candidate
            );

        }catch(e){}

    }


    /*
      Object içinden scenes bul.
    */

    const objectStart =
        cleaned.indexOf("{");

    const objectEnd =
        cleaned.lastIndexOf("}");

    if(
        objectStart !== -1 &&
        objectEnd > objectStart
    ){

        const candidate =
            cleaned.substring(
                objectStart,
                objectEnd + 1
            );

        try{

            const parsed =
                JSON.parse(candidate);

            if(
                parsed &&
                Array.isArray(
                    parsed.scenes
                )
            ){

                return parsed.scenes;
            }

        }catch(e){}
    }


    throw new Error(
        "AI sahne JSON'u okunamadı."
    );
}

/* =========================================================
   AUDIO
========================================================= */

async function createAudio(text){

    requireAuth();

    /*
      Güncel Pollinations GET audio endpoint.
      Nova varsayılan olarak güvenli seçimdir.
    */

    const url =
        API_URL +
        "/audio/" +
        encodeURIComponent(text) +
        "?voice=" +
        encodeURIComponent(
            voice.value
        );

    log(
        "AI ses isteği gönderiliyor..."
    );

    const response =
        await fetch(
            url,
            {
                method:"GET",

                headers:{
                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Accept":
                        "audio/mpeg,audio/*"
                }
            }
        );

    if(!response.ok){

        const raw =
            await response.text();

        throw new Error(
            "AI ses hatası: " +
            raw.substring(0,500)
        );
    }

    const contentType =
        (
            response.headers.get(
                "content-type"
            ) || ""
        ).toLowerCase();

    const arrayBuffer =
        await response.arrayBuffer();

    if(!arrayBuffer.byteLength){

        throw new Error(
            "AI ses dosyası boş döndü."
        );
    }

    /*
      Ses gerçekten geldiyse MP3/WAV/OGG vb.
      olmasını bekliyoruz.
    */

    if(
        contentType &&
        contentType.indexOf("audio") === -1
    ){

        /*
          Bazı sunucular doğru MIME göndermeyebilir.
          Boyutu yine kontrol ediyoruz.
        */

        if(arrayBuffer.byteLength < 1000){

            const decoder =
                new TextDecoder();

            const preview =
                decoder.decode(
                    arrayBuffer.slice(0,500)
                );

            throw new Error(
                "Ses yerine veri geldi: " +
                preview
            );
        }
    }

    log(
        "AI ses hazır. " +
        Math.round(
            arrayBuffer.byteLength / 1024
        ) +
        " KB"
    );

    return {
        arrayBuffer:arrayBuffer,
        type:
            contentType ||
            "audio/mpeg"
    };
}


/* =========================================================
   IMAGE LOAD
========================================================= */

function loadImage(blob){

    return new Promise(
        (resolve,reject)=>{

            const url =
                URL.createObjectURL(blob);

            const img =
                new Image();

            img.onload =
                ()=>{
                    URL.revokeObjectURL(url);
                    resolve(img);
                };

            img.onerror =
                ()=>{
                    URL.revokeObjectURL(url);
                    reject(
                        new Error(
                            "Görsel yüklenemedi."
                        )
                    );
                };

            img.src = url;
        }
    );
}


/* =========================================================
   AUDIO BUFFER
========================================================= */

async function decodeAudio(arrayBuffer){

    /*
      Kullanıcı butona bastığında AudioContext
      oluşturulduysa onu kullanıyoruz.
    */

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx){

            throw new Error(
                "Tarayıcı Web Audio API desteklemiyor."
            );
        }

        audioContext =
            new AudioCtx();
    }

    try{

        await audioContext.resume();

    }catch(e){

        console.warn(
            "AudioContext resume:",
            e
        );
    }

    /*
      decodeAudioData bazı Chrome sürümlerinde
      ArrayBuffer'ı tüketebilir.
    */

    const copy =
        arrayBuffer.slice(0);

    return await audioContext.decodeAudioData(
        copy
    );
}


/* =========================================================
   CANVAS GÖRSEL ÇİZİM
========================================================= */

function drawCover(
    ctx,
    img,
    canvas,
    zoom
){

    const cw =
        canvas.width;

    const ch =
        canvas.height;

    const iw =
        img.naturalWidth ||
        img.width;

    const ih =
        img.naturalHeight ||
        img.height;

    const scale =
        Math.max(
            cw / iw,
            ch / ih
        ) * zoom;

    const w =
        iw * scale;

    const h =
        ih * scale;

    const x =
        (cw - w) / 2;

    const y =
        (ch - h) / 2;

    ctx.drawImage(
        img,
        x,
        y,
        w,
        h
    );
}


/* =========================================================
   VIDEO OLUŞTUR
========================================================= */

async function createVideo(
    sceneData,
    audioData
){

    if(!sceneData.length){

        throw new Error(
            "Video için sahne yok."
        );
    }

    setStatus(
        "🎬 Video hazırlanıyor..."
    );

    const canvas =
        document.createElement(
            "canvas"
        );

    /*
      16:9 HD
    */

    canvas.width =
        1280;

    canvas.height =
        720;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
      Ses decode.
    */

    setStatus(
        "🔊 AI sesi videoya hazırlanıyor..."
    );

    const audioBuffer =
        await decodeAudio(
            audioData.arrayBuffer
        );

    log(
        "Ses çözüldü: " +
        audioBuffer.duration.toFixed(1) +
        " saniye"
    );


    /*
      Canvas video stream.
    */

    const videoStream =
        canvas.captureStream(30);


    /*
      Audio destination.
      MediaRecorder'a gerçek ses track'i ekleniyor.
    */

    const destination =
        audioContext.createMediaStreamDestination();


    /*
      Video + Audio birleşiyor.
    */

    destination.stream
        .getAudioTracks()
        .forEach(
            track=>{
                videoStream.addTrack(
                    track
                );
            }
        );


    /*
      MIME seç.
    */

    let mime =
        "";

    const candidates = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];

    for(
        let i=0;
        i<candidates.length;
        i++
    ){

        if(
            MediaRecorder.isTypeSupported(
                candidates[i]
            )
        ){

            mime =
                candidates[i];

            break;
        }
    }

    if(!mime){

        throw new Error(
            "Tarayıcı WebM video kaydını desteklemiyor."
        );
    }

    log(
        "Kayıt formatı: " +
        mime
    );


    const chunks = [];


    const recorder =
        new MediaRecorder(
            videoStream,
            {
                mimeType:mime,
                videoBitsPerSecond:5000000
            }
        );


    recorder.ondataavailable =
        event=>{

            if(
                event.data &&
                event.data.size > 0
            ){

                chunks.push(
                    event.data
                );
            }
        };


    /*
      Kayıt Promise'i.
    */

    const recordingFinished =
        new Promise(
            (resolve,reject)=>{

                recorder.onstop =
                    ()=>{

                        resolve(
                            new Blob(
                                chunks,
                                {
                                    type:mime
                                }
                            )
                        );
                    };

                recorder.onerror =
                    event=>{

                        reject(
                            event.error ||
                            new Error(
                                "MediaRecorder hatası."
                            )
                        );
                    };
            }
        );


    /*
      AudioBufferSource.
      HTMLAudioElement kullanmıyoruz.
      Böylece autoplay problemi ortadan kalkıyor.
    */

    const source =
        audioContext.createBufferSource();

    source.buffer =
        audioBuffer;

    source.connect(
        destination
    );

    /*
      Aynı sesi kullanıcının bilgisayarında
      da duyabilmesini sağlıyoruz.
    */

    source.connect(
        audioContext.destination
    );


    /*
      Toplam video süresi.
      En az ses kadar sürsün.
    */

    let totalDuration = 0;

    for(
        let i=0;
        i<sceneData.length;
        i++
    ){

        totalDuration +=
            Number(
                sceneData[i].duration
            ) || 6;
    }

    totalDuration =
        Math.max(
            totalDuration,
            audioBuffer.duration
        );


    /*
      Görselleri hazırla.
    */

    const images =
        sceneData.map(
            item=>item.image
        );


    /*
      Kayıt başlat.
    */

    recorder.start(
        250
    );

    log(
        "🎥 Video kaydı başladı."
    );

    setStatus(
        "🔴 Video + ses kaydediliyor..."
    );


    /*
      Ses başlat.
    */

    try{

        await audioContext.resume();

    }catch(e){}

    source.start(0);


    /*
      Zaman çizelgesi.
    */

    const startTime =
        performance.now();

    let lastIndex = -1;


    await new Promise(
        resolve=>{

            function frame(){

                const elapsed =
                    (
                        performance.now() -
                        startTime
                    ) / 1000;


                let accumulated = 0;

                let currentIndex =
                    sceneData.length - 1;

                let sceneElapsed = 0;

                for(
                    let i=0;
                    i<sceneData.length;
                    i++
                ){

                    const duration =
                        Number(
                            sceneData[i].duration
                        ) || 6;

                    if(
                        elapsed <
                        accumulated +
                        duration
                    ){

                        currentIndex =
                            i;

                        sceneElapsed =
                            elapsed -
                            accumulated;

                        break;
                    }

                    accumulated +=
                        duration;
                }


                const scene =
                    sceneData[
                        currentIndex
                    ];

                const duration =
                    Number(
                        scene.duration
                    ) || 6;


                /*
                  Zoom effect.
                */

                const progress =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            sceneElapsed /
                            duration
                        )
                    );

                const zoom =
                    1 +
                    progress * 0.08;


                ctx.fillStyle =
                    "#000";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                /*
                  Görsel.
                */

                drawCover(
                    ctx,
                    images[currentIndex],
                    canvas,
                    zoom
                );


                /*
                  Hafif siyah gradient.
                */

                const gradient =
                    ctx.createLinearGradient(
                        0,
                        canvas.height * .55,
                        0,
                        canvas.height
                    );

                gradient.addColorStop(
                    0,
                    "rgba(0,0,0,0)"
                );

                gradient.addColorStop(
                    1,
                    "rgba(0,0,0,.78)"
                );

                ctx.fillStyle =
                    gradient;

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                /*
                  Sahne numarası.
                */

                ctx.fillStyle =
                    "rgba(255,255,255,.8)";

                ctx.font =
                    "bold 24px Arial";

                ctx.fillText(
                    "MINA AI",
                    42,
                    54
                );


                if(
                    currentIndex !==
                    lastIndex
                ){

                    lastIndex =
                        currentIndex;

                    log(
                        "Sahne " +
                        (currentIndex + 1) +
                        " oynatılıyor."
                    );
                }


                setProgress(
                    55 +
                    (
                        elapsed /
                        totalDuration
                    ) *
                    40
                );


                if(
                    elapsed <
                    totalDuration
                ){

                    requestAnimationFrame(
                        frame
                    );

                }else{

                    resolve();
                }
            }

            requestAnimationFrame(
                frame
            );
        }
    );


    /*
      Birkaç frame daha.
    */

    await new Promise(
        resolve=>
            setTimeout(
                resolve,
                400
            )
    );


    try{

        source.stop();

    }catch(e){}


    recorder.stop();


    /*
      Stream track'lerini kapat.
    */

    videoStream
        .getTracks()
        .forEach(
            track=>{
                track.stop();
            }
        );


    finalVideoBlob =
        await recordingFinished;


    if(
        !finalVideoBlob ||
        finalVideoBlob.size < 1000
    ){

        throw new Error(
            "Video dosyası oluşturulamadı."
        );
    }


    log(
        "Video tamamlandı: " +
        Math.round(
            finalVideoBlob.size /
            1024 /
            1024 *
            100
        ) / 100 +
        " MB"
    );


    /*
      Video göster.
    */

    const videoURL =
        URL.createObjectURL(
            finalVideoBlob
        );

    videoElement.src =
        videoURL;

    videoCard.classList.remove(
        "hidden"
    );

    setProgress(100);

    setStatus(
        "🎉 Video + ses hazır!",
        "success"
    );
}


/* =========================================================
   SAHNELERİ EKRANA BAS
========================================================= */

function renderScenes(sceneData){

    scenesBox.innerHTML = "";

    scenesCard.classList.remove(
        "hidden"
    );

    sceneData.forEach(
        (scene,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "scene";

            const img =
                document.createElement(
                    "img"
                );

            img.src =
                scene.image.src;

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "sceneText";

            text.innerHTML =
                "<b>Sahne " +
                (index+1) +
                "</b><br>" +
                escapeHTML(
                    scene.narration
                );

            div.appendChild(img);

            div.appendChild(text);

            scenesBox.appendChild(div);
        }
    );
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   ANA VİDEO ÜRETİMİ
========================================================= */

async function generateVideo(){

    /*
      AudioContext'i kullanıcı butonuna mümkün olduğunca
      yakın oluşturuyoruz.
    */

    try{

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioCtx){

            if(
                !audioContext ||
                audioContext.state ===
                "closed"
            ){

                audioContext =
                    new AudioCtx();
            }

            await audioContext.resume();
        }

    }catch(e){

        console.warn(
            "AudioContext:",
            e
        );
    }


    generateBtn.disabled =
        true;

    scenesCard.classList.add(
        "hidden"
    );

    videoCard.classList.add(
        "hidden"
    );

    scenesBox.innerHTML = "";

    logBox.textContent = "";

    setProgress(2);


    try{

        requireAuth();

        const subject =
            topic.value.trim();

        if(!subject){

            throw new Error(
                "Önce video konusunu yaz."
            );
        }


        /*
          1 — SENARYO
        */

        setStatus(
            "🧠 AI senaryoyu hazırlıyor..."
        );

        log(
            "Senaryo oluşturuluyor."
        );

        setProgress(8);

        const scenes =
            await createScenes();


        if(
            !Array.isArray(scenes) ||
            scenes.length === 0
        ){

            throw new Error(
                "AI sahne oluşturamadı."
            );
        }


        /*
          En fazla 6 sahne.
        */

        const selectedScenes =
            scenes
                .slice(0,6)
                .map(
                    scene=>({

                        narration:
                            String(
                                scene.narration ||
                                ""
                            ),

                        image_prompt:
                            String(
                                scene.image_prompt ||
                                ""
                            ),

                        duration:
                            Math.max(
                                4,
                                Math.min(
                                    10,
                                    Number(
                                        scene.duration
                                    ) || 6
                                )
                            )
                    })
                );


        log(
            selectedScenes.length +
            " sahne oluşturuldu."
        );


        /*
          2 — GÖRSELLER
        */

        const preparedScenes = [];


        for(
            let i=0;
            i<selectedScenes.length;
            i++
        ){

            const scene =
                selectedScenes[i];

            setStatus(
                "🖼️ Sahne " +
                (i+1) +
                "/" +
                selectedScenes.length +
                " görseli oluşturuluyor..."
            );

            setProgress(
                10 +
                (
                    i /
                    selectedScenes.length
                ) *
                25
            );

            log(
                "Görsel " +
                (i+1) +
                " oluşturuluyor."
            );

            const blob =
                await createImage(
                    scene.image_prompt
                );

            const img =
                await loadImage(
                    blob
                );

            preparedScenes.push({
                narration:
                    scene.narration,

                image_prompt:
                    scene.image_prompt,

                duration:
                    scene.duration,

                image:img
            });
        }


        /*
          Ekrana göster.
        */

        renderScenes(
            preparedScenes
        );


        /*
          3 — SES METNİ
        */

        setStatus(
            "🎙️ AI anlatıcı metni hazırlanıyor..."
        );

        setProgress(40);

        let narrationText = "";

        for(
            let i=0;
            i<preparedScenes.length;
            i++
        ){

            narrationText +=
                preparedScenes[i]
                    .narration
                    .trim() +
                " ";
        }

        narrationText =
            narrationText.trim();


        if(!narrationText){

            throw new Error(
                "Seslendirme metni boş."
            );
        }


        /*
          4 — AI SES
        */

        setStatus(
            "🔊 AI ses oluşturuluyor..."
        );

        setProgress(45);

        const audioData =
            await createAudio(
                narrationText
            );


        /*
          Sesi gerçekten decode edip
          test ediyoruz.
        */

        setStatus(
            "🔊 AI sesi kontrol ediliyor..."
        );

        const testBuffer =
            await decodeAudio(
                audioData.arrayBuffer
            );

        if(
            !testBuffer ||
            testBuffer.duration <= 0
        ){

            throw new Error(
                "AI ses dosyası çözülemedi."
            );
        }

        log(
            "Ses süresi: " +
            testBuffer.duration.toFixed(1) +
            " saniye"
        );


        /*
          5 — VİDEO
        */

        setProgress(55);

        await createVideo(
            preparedScenes,
            audioData
        );


        /*
          Başarılı.
        */

        setStatus(
            "🎉 Mina Video AI videoyu tamamladı!",
            "success"
        );


    }catch(error){

        console.error(
            error
        );

        log(
            "HATA: " +
            error.message
        );

        setStatus(
            "❌ " +
            error.message,
            "error"
        );

    }finally{

        generateBtn.disabled =
            false;
    }
}


/* =========================================================
   DOWNLOAD
========================================================= */

downloadBtn.onclick =
    function(){

        if(!finalVideoBlob){

            return;
        }

        const url =
            URL.createObjectURL(
                finalVideoBlob
            );

        const a =
            document.createElement(
                "a"
            );

        a.href =
            url;

        a.download =
            "mina-video-" +
            Date.now() +
            ".webm";

        document.body.appendChild(
            a
        );

        a.click();

        a.remove();

        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            3000
        );
    };


/* =========================================================
   EVENTS
========================================================= */

connectBtn.onclick =
    startOAuth;

generateBtn.onclick =
    generateVideo;


/* =========================================================
   BAŞLANGIÇ
========================================================= */

loadAuth();

</script>
