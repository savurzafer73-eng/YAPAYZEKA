<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mina AI Görsel Test</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080b14;
    color:white;
    font-family:Arial,sans-serif;
    padding:25px;
}

.box{
    max-width:700px;
    margin:auto;
    background:#111827;
    border:1px solid #263247;
    border-radius:18px;
    padding:25px;
}

h1{
    margin-top:0;
    text-align:center;
}

textarea{
    width:100%;
    min-height:120px;
    background:#080b14;
    color:white;
    border:1px solid #334155;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#6366f1;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

#status{
    margin-top:18px;
    padding:12px;
    background:#0b1220;
    border-radius:10px;
    line-height:1.5;
}

#result{
    margin-top:20px;
    text-align:center;
}

#result img{
    max-width:100%;
    border-radius:14px;
    display:none;
}

#error{
    color:#ff8a8a;
    margin-top:15px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="box">

<h1>🎨 Mina AI Görsel Test</h1>

<textarea id="prompt">A dark mysterious abandoned castle at night, heavy fog, moonlight, cinematic realistic photography, extremely detailed, dramatic atmosphere</textarea>

<button id="generate">🎨 GÖRSEL OLUŞTUR</button>

<div id="status">Hazır.</div>

<div id="result">
    <img id="image">
</div>

<div id="error"></div>

</div>

<script>

const API = "https://aihorde.net/api/v2";
const KEY = "0000000000";

const generateBtn = document.getElementById("generate");
const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");
const image = document.getElementById("image");

function status(text){
    statusBox.textContent = text;
}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

async function requestJSON(url,options={}){
    const response = await fetch(url,options);

    const text = await response.text();

    let data;

    try{
        data = JSON.parse(text);
    }catch{
        throw new Error(
            "Sunucu JSON yerine başka bir cevap verdi.\nHTTP " +
            response.status +
            "\n\n" + text.substring(0,500)
        );
    }

    if(!response.ok){
        let message =
            data.message ||
            data.error ||
            ("HTTP " + response.status);

        const retry =
            response.headers.get("Retry-After");

        if(retry){
            message +=
                "\nRetry-After: " + retry + " saniye";
        }

        throw new Error(message);
    }

    return data;
}

async function createImage(){

    errorBox.textContent = "";
    image.style.display = "none";

    generateBtn.disabled = true;

    try{

        const prompt =
            document.getElementById("prompt").value.trim();

        if(!prompt){
            throw new Error("Önce bir görsel açıklaması yaz.");
        }

        status("⏳ AI Horde'a istek gönderiliyor...");

        const body = {
            prompt: prompt,

            params:{
                width:1024,
                height:576,
                steps:20,
                cfg_scale:7,
                sampler_name:"k_euler_a",
                n:1
            },

            models:[
                "AlbedoBase XL 3.1"
            ],

            nsfw:false,
            censor_nsfw:true
        };

        const job = await requestJSON(
            API + "/generate/async",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":KEY,
                    "Client-Agent":"MinaVideoAI:1.0"
                },

                body:JSON.stringify(body)
            }
        );

        if(!job.id){
            throw new Error(
                "İstek oluşturuldu ama görev ID'si alınamadı."
            );
        }

        const id = job.id;

        status(
            "✅ İstek alındı.\n" +
            "Görev: " + id +
            "\n\n" +
            "⏳ Gönüllü GPU bekleniyor..."
        );

        /*
         * ÖNEMLİ:
         * Daha önceki 429 hatasının temel nedeni
         * status endpoint'ini çok sık çağırmaktı.
         *
         * Burada önce 8 saniye bekliyoruz,
         * sonra giderek daha uzun aralıklarla kontrol ediyoruz.
         */

        let wait = 8000;
        let attempts = 0;

        while(attempts < 30){

            attempts++;

            await sleep(wait);

            status(
                "⏳ Görsel hazırlanıyor...\n" +
                "Kontrol " + attempts + "/30"
            );

            let result;

            try{

                result = await requestJSON(
                    API + "/generate/status/" + id,
                    {
                        headers:{
                            "apikey":KEY,
                            "Client-Agent":"MinaVideoAI:1.0"
                        }
                    }
                );

            }catch(err){

                /*
                 * 429 gelirse tekrar hemen istemiyoruz.
                 */

                if(
                    err.message.includes("429") ||
                    err.message.toLowerCase().includes("too many")
                ){

                    status(
                        "⏳ Sunucu yoğun.\n" +
                        "Biraz daha bekliyorum..."
                    );

                    wait = Math.min(
                        wait * 1.5,
                        30000
                    );

                    continue;
                }

                throw err;
            }

            if(result.done === true){

                if(
                    !result.generations ||
                    !result.generations.length
                ){
                    throw new Error(
                        "AI Horde işlemi tamamladı fakat görsel döndürmedi."
                    );
                }

                const generation =
                    result.generations[0];

                const url =
                    generation.img ||
                    generation.image_url;

                if(!url){
                    throw new Error(
                        "Görsel URL'si bulunamadı."
                    );
                }

                image.src = url;
                image.style.display = "block";

                status(
                    "🎉 GÖRSEL HAZIR!\n\n" +
                    "Mina AI görseli başarıyla aldı."
                );

                return;
            }

            if(result.faulted === true){

                throw new Error(
                    "AI Horde görevi başarısız oldu."
                );
            }

            if(result.wait_time){

                status(
                    "⏳ Kuyrukta bekliyor...\n\n" +
                    "Tahmini bekleme: " +
                    result.wait_time +
                    " saniye"
                );
            }

            /*
             * Normal durumda 8 → 12 → 18 → 27 → 30 sn
             */

            wait = Math.min(
                Math.round(wait * 1.5),
                30000
            );
        }

        throw new Error(
            "Görsel 30 kontrolden sonra hâlâ hazır değil.\n" +
            "AI Horde kuyruğu yoğun olabilir."
        );

    }catch(error){

        console.error(error);

        status("❌ İşlem başarısız.");

        errorBox.textContent =
            "HATA:\n" + error.message;

    }finally{

        generateBtn.disabled = false;
    }
}

generateBtn.addEventListener(
    "click",
    createImage
);

</script>

</body>
</html>
