<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#182544 0%,#0b1020 45%,#070b15 100%);
    color:#fff;
}

.container{

    margin:auto;

}

h1{
    text-align:center;
    font-size:34px;
    margin:5px 0 4px;
}

.subtitle{
    text-align:center;
    color:#aeb9d5;
    margin-bottom:20px;
}

.card{
    background:rgba(20,27,49,.94);
    border:1px solid #2b3858;
    border-radius:18px;
    padding:17px;
    margin-bottom:15px;
    box-shadow:0 10px 35px rgba(0,0,0,.18);
}

label{
    display:block;
    font-weight:bold;
    color:#dce3f5;
    margin:10px 0 6px;
}

input,
select,
textarea{
    width:100%;
    background:#080d1a;
    border:1px solid #354361;
    border-radius:11px;
    color:#fff;
    padding:12px;
    font-size:15px;

}

input:focus,
select:focus,
textarea:focus{

}

textarea{
    min-height:115px;

}

button{
    width:100%;

}

button:hover{

}

button:disabled{

}

}

button.green{
    background:#12835b;
}

button.orange{
    background:#a36d12;
}

}

.row{

}

.status{

}

.progress{
    height:9px;
    margin-top:11px;
    border-radius:20px;
    overflow:hidden;

}

.progressBar{
    height:100%;
    width:0%;
    background:#6472ff;
    transition:.25s;
}

.good{
    color:#5be5a6;
}

.warning{
    color:#ffd166;
}

.error{
    color:#ff7588;
}

.small{
    color:#929db8;
    font-size:12px;
    line-height:1.45;
}

.scene{
    background:#090f1d;
    border:1px solid #293753;
    border-radius:13px;
    padding:12px;
    margin-top:10px;
}

.sceneTitle{
    font-weight:bold;
    margin-bottom:7px;
}

.sceneText{
    color:#b7c1d8;
    font-size:13px;

}

.scene img{
    width:100%;
    border-radius:10px;
    display:block;
    margin-top:11px;
}

.loading{
    padding:12px;
    border-radius:10px;
    background:#111a30;
    color:#bac5df;
    margin-top:10px;
}

.voiceBox{
    background:#090f1d;
    border:1px solid #293753;
    border-radius:13px;
    padding:12px;
}

audio,
video{
    width:100%;
    margin-top:10px;
    border-radius:11px;
}

video{
    background:#000;
}

.download{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#12835b;
    color:#fff;
    border-radius:11px;

    margin-top:10px;

}

.badge{

    padding:5px 8px;

    background:#202b49;

    font-size:11px;
    margin-top:5px;
}

hr{
    border:0;
    border-top:1px solid #293653;
    margin:16px 0;
}

@media(max-width:650px){
    .row{
        grid-template-columns:1fr;
    }

    h1{
        font-size:27px;
    }

    .container{
        padding:12px;
    }
}
</style>

<!-- =====================================================
     WEBLLM
===================================================== -->

<script type="module">

import {
    CreateMLCEngine
} from "https://esm.run/@mlc-ai/web-llm";


/* =====================================================
   DOM
===================================================== */

const topicEl =
    document.getElementById("topic");

const languageEl =
    document.getElementById("language");

const durationEl =
    document.getElementById("duration");

const sceneCountEl =
    document.getElementById("sceneCount");

const styleEl =
    document.getElementById("style");

const aiBtn =
    document.getElementById("aiBtn");

const templateBtn =
    document.getElementById("templateBtn");

const imageBtn =
    document.getElementById("imageBtn");

const voiceBtn =
    document.getElementById("voiceBtn");

const videoBtn =
    document.getElementById("videoBtn");

const statusEl =
    document.getElementById("status");

const progressBar =
    document.getElementById("progressBar");

const modelCard =
    document.getElementById("modelCard");

const modelStatus =
    document.getElementById("modelStatus");

const scriptOutput =
    document.getElementById("scriptOutput");

const scenesEl =
    document.getElementById("scenes");

const voiceStatus =
    document.getElementById("voiceStatus");

const voicePreview =
    document.getElementById("voicePreview");

const videoPreview =
    document.getElementById("videoPreview");

const downloadVideo =
    document.getElementById("downloadVideo");


/* =====================================================
   STATE
===================================================== */

let engine =
    null;

let currentScript =
    null;

let currentScenes =
    [];

let currentVideoBlob =
    null;


/*
  WebLLM model.
  Küçük model seçiyoruz ki tarayıcıda çalışması
  mümkün olduğunca kolay olsun.
*/

const MODEL =
    "Qwen3-0.6B-q4f16_1-MLC";


/* =====================================================
   HELPERS
===================================================== */

function setStatus(
    text,
    type=""
){

    statusEl.className =
        "status";

    if(type === "good"){
        statusEl.innerHTML =
            `<span class="good">${escapeHtml(text)}</span>`;
        return;
    }

    if(type === "warning"){
        statusEl.innerHTML =
            `<span class="warning">${escapeHtml(text)}</span>`;
        return;
    }

    if(type === "error"){
        statusEl.innerHTML =
            `<span class="error">${escapeHtml(text)}</span>`;
        return;
    }

    statusEl.textContent =
        text;
}


function setProgress(value){

    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        ) + "%";

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );

}


/* =====================================================
   WEBGPU CHECK
===================================================== */

function hasWebGPU(){

    return !!navigator.gpu;

}


/* =====================================================
   MODEL LOAD
===================================================== */

async function loadAI(){

    if(engine)
        return engine;

    if(!hasWebGPU()){

        throw new Error(
            "Bu tarayıcı WebGPU desteklemiyor. Güncel Google Chrome veya Microsoft Edge kullan."
        );

    }

    modelCard.style.display =
        "block";

    modelStatus.textContent =
        "🤖 Mina'nın yerel AI modeli hazırlanıyor...";

    setStatus(
        "🤖 İlk kullanımda AI modeli indiriliyor. Lütfen bekle..."
    );

    setProgress(5);

    engine =
        await CreateMLCEngine(

            MODEL,

            {

                initProgressCallback:
                    progress => {

                        const text =
                            progress?.text ||
                            "AI modeli yükleniyor...";

                        const loaded =
                            Number(
                                progress?.progress ||
                                0
                            );

                        modelStatus.textContent =
                            "🤖 " +
                            text;

                        setProgress(
                            Math.max(
                                5,
                                Math.min(
                                    45,
                                    loaded * 45
                                )
                            )
                        );

                    }

            }

        );

    modelStatus.textContent =
        "✅ Yerel AI hazır.";

    setProgress(50);

    return engine;

}


/* =====================================================
   PROMPT
===================================================== */

function buildPrompt(){

    const topic =
        topicEl.value.trim();

    const lang =
        languageEl.value;

    const duration =
        Number(
            durationEl.value
        );

    const scenes =
        Number(
            sceneCountEl.value
        );

    const languageName = {

        de:"German",

        tr:"Turkish",

        en:"English"

    }[lang];


    return `

You are a professional YouTube documentary writer.

Create a mysterious, suspenseful and realistic
documentary story for a YouTube channel.

TOPIC:
${topic}

LANGUAGE:
${languageName}

VIDEO LENGTH:
${duration} minutes

NUMBER OF SCENES:
${scenes}

Write the complete narration.

IMPORTANT:

- Start with a strong hook.
- Keep the viewer curious.
- Use realistic documentary language.
- Do not invent that something is proven if it is only a mystery.
- Build suspense gradually.
- Every scene must have useful narration.
- End with an intriguing conclusion.
- The narration should be suitable for voice-over.

Return ONLY valid JSON.

EXACT FORMAT:

{
  "title":"Video title",
  "scenes":[
    {
      "scene":1,
      "title":"Scene title",
      "narration":"Narration text",
      "imagePrompt":"Detailed cinematic image prompt in English"
    }
  ]
}

No markdown.
No code block.
No explanation outside JSON.

`;

}


/* =====================================================
   JSON PARSER
===================================================== */

function parseJSON(text){

    let value =
        String(text || "")
            .trim();

    value =
        value
        .replace(/^```json/i,"")
        .replace(/^```/i,"")
        .replace(/```$/i,"")
        .trim();

    try{

        return JSON.parse(value);

    }catch(e){}


    const first =
        value.indexOf("{");

    const last =
        value.lastIndexOf("}");

    if(
        first >= 0 &&
        last > first
    ){

        const extracted =
            value.substring(
                first,
                last + 1
            );

        return JSON.parse(
            extracted
        );

    }

    throw new Error(
        "AI geçerli JSON üretmedi."
    );

}


/* =====================================================
   VALIDATE
===================================================== */

function validateScript(data){

    if(
        !data ||
        !Array.isArray(
            data.scenes
        )
    ){

        throw new Error(
            "AI senaryo formatı geçersiz."
        );

    }

    if(
        data.scenes.length === 0
    ){

        throw new Error(
            "AI hiç sahne üretmedi."
        );

    }

    data.scenes.forEach(
        (scene,index)=>{

            if(!scene.title)
                scene.title =
                    "Sahne " +
                    (index + 1);

            if(!scene.narration)
                scene.narration =
                    "";

            if(!scene.imagePrompt)
                scene.imagePrompt =
                    scene.narration;

            scene.scene =
                index + 1;

        }
    );

}


/* =====================================================
   AI SCRIPT
===================================================== */

async function createAIScript(){

    const topic =
        topicEl.value.trim();

    if(!topic){

        setStatus(
            "⚠️ Önce video konusunu yaz.",
            "warning"
        );

        topicEl.focus();

        return;

    }


    aiBtn.disabled =
        true;

    templateBtn.disabled =
        true;


    try{

        const ai =
            await loadAI();

        setStatus(
            "🧠 Mina yerel AI ile senaryoyu yazıyor..."
        );

        setProgress(55);


        const response =
            await ai.chat.completions.create({

                messages:[

                    {
                        role:"system",
                        content:
                            "You are a professional documentary writer. Follow the requested JSON format exactly."
                    },

                    {
                        role:"user",
                        content:
                            buildPrompt()
                    }

                ],

                temperature:.7,

                max_tokens:4000

            });


        const content =
            response
            ?.choices?.[0]
            ?.message
            ?.content;


        if(!content){

            throw new Error(
                "AI boş cevap verdi."
            );

        }


        setProgress(75);


        const data =
            parseJSON(
                content
            );


        validateScript(
            data
        );


        currentScript =
            data;


        renderScript(
            data
        );


        setProgress(100);


        imageBtn.disabled =
            false;

        voiceBtn.disabled =
            false;

        videoBtn.disabled =
            false;


        setStatus(
            "🎉 Gerçek yerel AI senaryosu hazır. Pollinations kredisi kullanılmadı.",
            "good"
        );


    }catch(error){

        console.error(
            error
        );


        setStatus(
            "❌ AI senaryo hatası:\n\n" +
            error.message,
            "error"
        );

    }finally{

        aiBtn.disabled =
            false;

        templateBtn.disabled =
            false;

    }

}


/* =====================================================
   FALLBACK SCRIPT
===================================================== */

function createFallbackScript(){

    const topic =
        topicEl.value.trim();

    if(!topic){

        setStatus(
            "⚠️ Önce konu yaz.",
            "warning"
        );

        return;

    }

    const lang =
        languageEl.value;

    const count =
        Number(
            sceneCountEl.value
        );


    const texts = {

        de:{

            titles:[
                "Das Geheimnis beginnt",
                "Die erste Spur",
                "Eine unerwartete Wendung",
                "Neue Fragen",
                "Was wirklich geschah",
                "Das ungelöste Rätsel"
            ],

            opening:
                `Die Geschichte von ${topic} beginnt mit einem scheinbar gewöhnlichen Ereignis. Doch schon bald tauchten Hinweise auf, die niemand erklären konnte.`,

            middle:
                `Mit jedem neuen Hinweis wurde die Geschichte rätselhafter. Einzelne Details schienen miteinander verbunden zu sein, doch eine eindeutige Erklärung gab es nicht.`,

            ending:
                `Bis heute bleiben wichtige Fragen offen. Vielleicht liegt die Wahrheit in einem Detail, das bisher niemand richtig beachtet hat.`
        },


        tr:{

            titles:[
                "Gizem Başlıyor",
                "İlk İz",
                "Beklenmedik Dönüş",
                "Yeni Sorular",
                "Gerçekte Ne Oldu?",
                "Çözülemeyen Gizem"
            ],

            opening:
                `${topic} hikâyesi, ilk bakışta sıradan görünen bir olayla başladı. Ancak kısa süre sonra kimsenin açıklayamadığı bazı ayrıntılar ortaya çıktı.`,

            middle:
                `Her yeni ipucu hikâyeyi daha da gizemli hale getirdi. Bazı ayrıntılar birbirleriyle bağlantılı görünüyordu fakat kesin bir açıklama bulunamıyordu.`,

            ending:
                `Bugün bile önemli sorular cevapsız durumda. Belki de gerçeğin anahtarı, şimdiye kadar kimsenin önemsemediği küçük bir ayrıntıda saklıdır.`
        },


        en:{

            titles:[
                "The Mystery Begins",
                "The First Clue",
                "An Unexpected Turn",
                "New Questions",
                "What Really Happened?",
                "The Unsolved Mystery"
            ],

            opening:
                `The story of ${topic} began with what seemed to be an ordinary event. But soon, strange details appeared that nobody could explain.`,

            middle:
                `With every new clue, the story became more mysterious. Some details appeared connected, yet no clear explanation could be found.`,

            ending:
                `Even today, important questions remain unanswered. Perhaps the key to the truth is hidden in a small detail that everyone overlooked.`
        }

    };


    const t =
        texts[lang];


    const result = {

        title:
            topic,

        scenes:[]

    };


    for(
        let i=0;
        i<count;
        i++
    ){

        let narration;

        if(i === 0){

            narration =
                t.opening;

        }else if(
            i === count - 1
        ){

            narration =
                t.ending;

        }else{

            narration =
                t.middle +
                " " +
                t.opening;

        }


        result.scenes.push({

            scene:
                i + 1,

            title:
                t.titles[
                    i %
                    t.titles.length
                ],

            narration,

            imagePrompt:
                buildImagePrompt(
                    narration,
                    i + 1
                )

        });

    }


    currentScript =
        result;


    renderScript(
        result
    );


    imageBtn.disabled =
        false;

    voiceBtn.disabled =
        false;

    videoBtn.disabled =
        false;


    setStatus(
        "🆓 Basit ücretsiz senaryo hazır.",
        "good"
    );

}


/* =====================================================
   IMAGE STYLE
===================================================== */

function buildImagePrompt(
    text,
    number
){

    const style =
        styleEl.value;


    const styles = {

        cinematic:
            "cinematic documentary photography, realistic, dramatic lighting",

        fantasy:
            "dark fantasy cinematic artwork, highly detailed",

        scifi:
            "cinematic science fiction, futuristic atmosphere, dramatic lighting",

        "3d":
            "high quality 3D animation, cinematic composition",

        "2d":
            "detailed 2D animated illustration, cinematic",

        dark:
            "dark mysterious cinematic scene, realistic, atmospheric shadows",

        photo:
            "photorealistic documentary photograph, realistic lighting",

        action:
            "dynamic cinematic action scene, realistic",

        medieval:
            "realistic medieval cinematic scene, atmospheric",

        epic:
            "epic cinematic scene, grand scale, dramatic atmosphere"

    };


    return (
        styles[style] ||
        styles.dark
    ) +
    `, scene ${number}, based on: ` +
    text.substring(
        0,
        600
    ) +
    ", no text, no subtitles, no watermark";

}


/* =====================================================
   RENDER SCRIPT
===================================================== */

function renderScript(
    script
){

    let output =
        "";

    output +=
        (
            script.title ||
            "Mina Video"
        ) +
        "\n\n";


    scenesEl.innerHTML =
        "";

    currentScenes =
        [];


    script.scenes.forEach(
        (scene,index)=>{

            output +=
                "SAHNE " +
                (index + 1) +
                " — " +
                scene.title +
                "\n\n";

            output +=
                scene.narration +
                "\n\n";


            currentScenes.push({

                ...scene,

                imageUrl:null

            });


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "scene";


            div.innerHTML = `

                <div class="sceneTitle">
                    🎬 ${escapeHtml(
                        scene.title
                    )}
                </div>

                <div class="sceneText">
                    ${escapeHtml(
                        scene.narration
                    )}
                </div>

                <div class="small">
                    🖼️ ${escapeHtml(
                        scene.imagePrompt
                    )}
                </div>

                <div class="imageArea"></div>

            `;


            scenesEl.appendChild(
                div
            );

        }
    );


    scriptOutput.value =
        output;

}


/* =====================================================
   IMAGE
===================================================== */

function safeSeed(
    number
){

    const max =
        2147483647;

    return Math.floor(
        (
            Date.now() %
            max +
            number * 100003
        ) % max
    );

}


async function generateImage(
    prompt,
    number
){

    const seed =
        safeSeed(
            number
        );


    /*
      Önce eski anonymous endpoint.
      Başarılı olursa görsel alınır.
    */

    const url =
        "https://image.pollinations.ai/prompt/" +
        encodeURIComponent(
            prompt
        ) +
        "?width=1280" +
        "&height=720" +
        "&seed=" +
        seed;


    const response =
        await fetch(
            url
        );


    if(!response.ok){

        throw new Error(
            "Pollinations görsel servisi HTTP " +
            response.status
        );

    }


    const blob =
        await response.blob();


    return URL.createObjectURL(
        blob
    );

}


/* =====================================================
   GENERATE IMAGES
===================================================== */

async function createImages(){

    if(!currentScript){

        setStatus(
            "⚠️ Önce senaryo oluştur.",
            "warning"
        );

        return;

    }


    imageBtn.disabled =
        true;


    try{

        for(
            let i=0;
            i<currentScenes.length;
            i++
        ){

            const scene =
                currentScenes[i];


            const card =
                scenesEl.children[i];


            const area =
                card.querySelector(
                    ".imageArea"
                );


            area.innerHTML =
                `<div class="loading">
                    🖼️ Görsel ${i+1}/${currentScenes.length} hazırlanıyor...
                 </div>`;


            setStatus(
                `🖼️ ${i+1}/${currentScenes.length} görsel oluşturuluyor...`
            );


            try{

                const url =
                    await generateImage(
                        scene.imagePrompt,
                        i + 1
                    );


                scene.imageUrl =
                    url;


                area.innerHTML =
                    "";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    url;


                area.appendChild(
                    img
                );


            }catch(error){

                area.innerHTML =
                    `<div class="loading">
                        ❌ Görsel oluşturulamadı.
                        <br><br>
                        ${escapeHtml(
                            error.message
                        )}
                     </div>`;


                throw error;

            }


            setProgress(
                (
                    (i + 1) /
                    currentScenes.length
                ) * 100
            );


            /*
              Anonymous queue'nun dolmasını
              azaltmak için sahneler arasında bekle.
            */

            await sleep(
                2500
            );

        }


        setStatus(
            "🎉 Görseller hazır.",
            "good"
        );


    }catch(error){

        setStatus(
            "❌ Görsel üretimi durdu:\n\n" +
            error.message +
            "\n\n" +
            "Pollinations görsel servisi kredi veya kota isteyebilir.",
            "warning"
        );

    }finally{

        imageBtn.disabled =
            false;

    }

}


/* =====================================================
   BROWSER VOICE
===================================================== */

function speakScript(){

    if(!currentScript){

        setStatus(
            "⚠️ Önce senaryo oluştur.",
            "warning"
        );

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        setStatus(
            "❌ Tarayıcı ses sistemi desteklenmiyor.",
            "error"
        );

        return;

    }


    speechSynthesis.cancel();


    const text =
        currentScript.scenes
        .map(
            scene =>
                scene.narration
        )
        .join(
            "\n\n"
        );


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const lang =
        languageEl.value;


    utterance.lang =
        lang === "de"
        ? "de-DE"
        : lang === "en"
        ? "en-US"
        : "tr-TR";


    utterance.rate =
        .88;

    utterance.pitch =
        1;


    utterance.onstart =
        () => {

            voiceStatus.textContent =
                "🗣️ Senaryo tarayıcı sesiyle okunuyor...";

        };


    utterance.onend =
        () => {

            voiceStatus.textContent =
                "✅ Sesli önizleme tamamlandı.";

        };


    speechSynthesis.speak(
        utterance
    );


    setStatus(
        "🗣️ Sesli önizleme başladı.",
        "good"
    );

}


/* =====================================================
   SUBTITLE TIMELINE
===================================================== */

function buildSubtitleTimeline(){

    if(!currentScript)
        return [];


    const total =
        Number(
            durationEl.value
        ) * 60;


    const sceneDuration =
        total /
        currentScenes.length;


    const result =
        [];


    currentScenes.forEach(
        (scene,index)=>{

            const words =
                String(
                    scene.narration ||
                    ""
                )
                .split(/\s+/)
                .filter(Boolean);


            if(!words.length)
                return;


            const start =
                index *
                sceneDuration;


            const each =
                sceneDuration /
                words.length;


            words.forEach(
                (word,wordIndex)=>{

                    result.push({

                        text:word,

                        start:
                            start +
                            wordIndex *
                            each,

                        end:
                            start +
                            (
                                wordIndex +
                                1
                            ) *
                            each

                    });

                }
            );

        }
    );


    return result;

}


/* =====================================================
   IMAGE LOADER
===================================================== */

function loadImage(
    src
){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();


            img.crossOrigin =
                "anonymous";


            img.onload =
                () =>
                    resolve(img);


            img.onerror =
                () =>
                    reject(
                        new Error(
                            "Görsel yüklenemedi."
                        )
                    );


            img.src =
                src;

        }
    );

}


/* =====================================================
   SUBTITLE DRAW
===================================================== */

function drawSubtitle(
    ctx,
    text,
    width,
    height
){

    if(!text)
        return;


    ctx.font =
        "bold 31px Arial";


    const maxWidth =
        width * .82;


    const words =
        text.split(
            " "
        );


    const lines =
        [];


    let line =
        "";


    words.forEach(
        word => {

            const test =
                line
                ? line + " " + word
                : word;


            if(
                ctx.measureText(
                    test
                ).width >
                maxWidth
            ){

                if(line)
                    lines.push(
                        line
                    );

                line =
                    word;

            }else{

                line =
                    test;

            }

        }
    );


    if(line)
        lines.push(
            line
        );


    const lineHeight =
        39;


    const boxHeight =
        lines.length *
        lineHeight +
        28;


    const y =
        height -
        boxHeight -
        30;


    ctx.fillStyle =
        "rgba(0,0,0,.72)";


    ctx.fillRect(
        width*.07,
        y,
        width*.86,
        boxHeight
    );


    ctx.fillStyle =
        "#fff";


    ctx.textAlign =
        "center";


    lines.forEach(
        (line,index)=>{

            ctx.fillText(
                line,
                width/2,
                y +
                28 +
                index *
                lineHeight
            );

        }
    );

}


/* =====================================================
   CREATE VIDEO
===================================================== */

async function createVideo(){

    if(
        !currentScenes.length
    ){

        setStatus(
            "⚠️ Önce senaryo oluştur.",
            "warning"
        );

        return;

    }


    const hasImages =
        currentScenes.some(
            scene =>
                !!scene.imageUrl
        );


    if(!hasImages){

        setStatus(
            "⚠️ Önce görselleri oluştur.",
            "warning"
        );

        return;

    }


    videoBtn.disabled =
        true;


    try{

        setStatus(
            "🎥 WebM video hazırlanıyor..."
        );


        setProgress(
            0
        );


        const width =
            1280;

        const height =
            720;


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d"
            );


        const images =
            [];


        for(
            let i=0;
            i<currentScenes.length;
            i++
        ){

            if(
                currentScenes[i]
                .imageUrl
            ){

                images.push(
                    await loadImage(
                        currentScenes[i]
                        .imageUrl
                    )
                );

            }else{

                images.push(
                    null
                );

            }

        }


        const totalSeconds =
            Number(
                durationEl.value
            ) * 60;


        const sceneDuration =
            totalSeconds /
            currentScenes.length;


        const stream =
            canvas.captureStream(
                30
            );


        let mimeType =
            "video/webm";


        if(
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp9"
            )
        ){

            mimeType =
                "video/webm;codecs=vp9";

        }


        const recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType
                }
            );


        const chunks =
            [];


        recorder.ondataavailable =
            event => {

                if(
                    event.data &&
                    event.data.size
                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        const stopped =
            new Promise(
                resolve => {

                    recorder.onstop =
                        resolve;

                }
            );


        recorder.start(
            250
        );


        const timeline =
            buildSubtitleTimeline();


        const start =
            performance.now();


        let previousScene =
            -1;


        while(true){

            const elapsed =
                (
                    performance.now() -
                    start
                ) / 1000;


            if(
                elapsed >=
                totalSeconds
            )
                break;


            const sceneIndex =
                Math.min(
                    currentScenes.length - 1,
                    Math.floor(
                        elapsed /
                        sceneDuration
                    )
                );


            const image =
                images[
                    sceneIndex
                ];


            if(
                sceneIndex !==
                previousScene
            ){

                previousScene =
                    sceneIndex;


                setStatus(
                    `🎥 Video oluşturuluyor... ${sceneIndex+1}/${currentScenes.length}`
                );

            }


            ctx.fillStyle =
                "#000";


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            if(image){

                const scale =
                    Math.max(
                        width /
                        image.width,

                        height /
                        image.height
                    );


                const dw =
                    image.width *
                    scale;


                const dh =
                    image.height *
                    scale;


                const dx =
                    (
                        width -
                        dw
                    ) / 2;


                const dy =
                    (
                        height -
                        dh
                    ) / 2;


                ctx.drawImage(
                    image,
                    dx,
                    dy,
                    dw,
                    dh
                );

            }


            /*
              Üst başlık
            */

            ctx.fillStyle =
                "rgba(0,0,0,.55)";


            ctx.fillRect(
                30,
                28,
                width-60,
                58
            );


            ctx.fillStyle =
                "#fff";


            ctx.font =
                "bold 27px Arial";


            ctx.textAlign =
                "left";


            ctx.fillText(
                currentScenes[
                    sceneIndex
                ].title || "",
                50,
                66
            );


            /*
              Aktif kelime
            */

            const active =
                timeline.find(
                    item =>
                        elapsed >=
                        item.start &&
                        elapsed <
                        item.end
                );


            if(active){

                drawSubtitle(
                    ctx,
                    active.text,
                    width,
                    height
                );

            }


            setProgress(
                (
                    elapsed /
                    totalSeconds
                ) * 100
            );


            await new Promise(
                requestAnimationFrame
            );

        }


        recorder.stop();


        await stopped;


        currentVideoBlob =
            new Blob(
                chunks,
                {
                    type:
                        mimeType
                }
            );


        const url =
            URL.createObjectURL(
                currentVideoBlob
            );


        videoPreview.src =
            url;


        videoPreview.style.display =
            "block";


        downloadVideo.href =
            url;


        downloadVideo.style.display =
            "block";


        setProgress(
            100
        );


        setStatus(
            "🎉 WebM video hazır! Görseller + altyazılar videoya işlendi.",
            "good"
        );


    }catch(error){

        console.error(
            error
        );


        setStatus(
            "❌ Video hatası:\n\n" +
            error.message,
            "error"
        );

    }finally{

        videoBtn.disabled =
            false;

    }

}
