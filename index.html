/* =========================================================
   CALLBACK
========================================================= */

(function checkCallback(){

    const hash =
    window.location.hash;

    if(!hash) return;

    const params =
    new URLSearchParams(
        hash.substring(1)
    );

    const key =
    params.get("api_key");

    if(key){

        accessToken = key;

        sessionStorage.setItem(
            "mina_pollinations_key",
            key
        );

        history.replaceState(
            null,
            "",
            window.location.pathname
        );

        setConnected();
    }

})();


/* =========================================================
   STORED TOKEN
========================================================= */

const storedToken =
sessionStorage.getItem(
    "mina_pollinations_key"
);

if(storedToken){

/* =========================================================
   BAĞLAN
========================================================= */

function connectPollinations(){

    const params =
    new URLSearchParams({

        redirect_uri:
        REDIRECT_URI,

        client_id:
        APP_KEY,

        scope:
        "usage"

    });

    window.location.href =
    AUTH_URL +
    "?" +
    params.toString();
}


/* =========================================================
   CONNECTED
========================================================= */

function setConnected(){

    connectionStatus.innerHTML =

    connectBtn.textContent =
    "🟢 Mina AI Bağlı";

    connectBtn.disabled = true;

}


/* =========================================================
   API CHAT
========================================================= */

async function apiChat(messages){

    if(!accessToken){

        throw new Error(
            "Mina AI bağlantısı yok."
        );

    }

    const response =
    await fetch(
        API_URL +
        "/v1/chat/completions",
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json",

                "Authorization":
                "Bearer " +
                accessToken
            },

            body:JSON.stringify({

                model:
                TEXT_MODEL,

                messages:
                messages,

                temperature:
                0.8
            })
        }
    );

    const text =
    await response.text();

    if(!response.ok){

        throw new Error(
            "AI HTTP " +
            response.status +
            ": " +
            text
        );

    }

    const data =
    JSON.parse(text);

    return (
        data?.choices?.[0]?.message?.content ||
        data?.choices?.[0]?.text ||
        ""
    );

}

Her sahne için tam olarak şu formatı kullan:

/* =========================================================
   PARSE SCENES
========================================================= */

function parseScenes(text){

    const parts =
    text.split(
        /SAHNE\s+\d+\s*:/gi
    )
    .map(x => x.trim())
    .filter(Boolean);

    return parts.map(
        (part,index)=>{

            let visual = "";
            let narration = "";

            const v =
            part.match(
                /Görsel\s*:\s*([\s\S]*?)(?=Anlatım\s*:|$)/i
            );

            const a =
            part.match(
                /Anlatım\s*:\s*([\s\S]*)/i
            );

            if(v)
                visual =
                v[1].trim();

            if(a)
                narration =
                a[1].trim();

            if(!visual)
                visual = part;

            return {

                number:index+1,

                visual:

                visual,

                narration:

                narration
            };

        }
    );

}


/* =========================================================
   RENDER SCENES
========================================================= */

function renderScenes(){

    scenes.innerHTML = "";

    scenesData.forEach(
        (s,i)=>{

            const div =
            document.createElement(
                "div"
            );

            div.className =
            "scene";

            div.innerHTML = `

                <b>🎬 Sahne ${i+1}</b>

                <div class="small"
                     style="margin-top:7px">

                    ${escapeHTML(
                        s.visual
                    )}

                </div>

                <div style="margin-top:9px">

                    <b>🎙️ Anlatım:</b>

                    <div class="small">

                    ${escapeHTML(
                        s.narration
                    )}

                    </div>

                </div>

                <div id="img-${i}"></div>

            `;

            scenes.appendChild(div);

        }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(str){

    return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   IMAGE
========================================================= */

/* =========================================================
   AUDIO MODEL LİSTESİ
========================================================= */

async function getAudioModels(){

    const endpoints = [

        API_URL +
        "/audio/models",

        API_URL +
        "/v1/models"

    ];

    let lastError = null;

    for(
        const endpoint
        of endpoints
    ){

        try{

            const response =
            await fetch(
                endpoint,
                {
                    headers:{
                        "Authorization":
                        "Bearer " +
                        accessToken
                    }
                }
            );

            const raw =
            await response.text();

            if(!response.ok){

                lastError =
                new Error(
                    endpoint +
                    " HTTP " +
                    response.status +
                    " " +
                    raw
                );

                continue;
            }

            const data =
            JSON.parse(raw);

            let list = [];

            if(
                Array.isArray(data)
            ){

                list = data;

            }
            else if(
                Array.isArray(data.data)
            ){

                list = data.data;

            }
            else if(
                Array.isArray(
                    data.models
                )
            ){

                list = data.models;

            }

            return list;

        }catch(e){

            lastError = e;

        }

    }

    throw (
        lastError ||
        new Error(
            "Ses modelleri alınamadı."
        )
    );

}


/* =========================================================
   MODEL ID ÇIKAR
========================================================= */

function modelId(item){

    if(typeof item === "string")
        return item;

    return (
        item?.id ||
        item?.model ||
        item?.name ||
        ""
    );

}


/* =========================================================
   AUDIO MODEL SEÇ
========================================================= */

async function findWorkingAudioModel(){

    const models =
    await getAudioModels();

    const candidates = [];

    for(
        const item
        of models
    ){

        const id =
        modelId(item);

        if(!id)
            continue;

        const lower =
        id.toLowerCase();

        const isAudio =
        lower.includes("eleven") ||
        lower.includes("tts") ||
        lower.includes("speech") ||
        lower.includes("audio") ||
        lower.includes("qwen") ||
        lower.includes("kokoro") ||
        lower.includes("csm");

        if(!isAudio)
            continue;

        /*
         * Özellikle problem çıkaran modeli
         * listenin başına almıyoruz.
         */

        if(
            lower ===
            "elevenlabs/eleven-v3"
        ){

            continue;
        }

        candidates.push(id);

    }


    /*
     * Tercih sırası
     */

    const preferred = [

        "elevenlabs/eleven-multilingual-v2",

        "elevenlabs/eleven-flash-v2.5",

        "qwen/qwen3-tts-flash",

        "qwen/qwen3-tts-instruct-flash",

        "hexgrad/kokoro-82m",

        "sesame/csm-1b"

    ];


    const ordered = [

        ...preferred.filter(
            x => candidates.includes(x)
        ),

        ...candidates.filter(
            x => !preferred.includes(x)
        )

    ];


    if(!ordered.length){

        throw new Error(
            "Kullanılabilir ses modeli bulunamadı."
        );

    }


    /*
     * Modelleri gerçekten deneyerek
     * izin verilen ilk modeli buluyoruz.
     */

    const testText =
    "Merhaba, Mina AI ses testi.";

    const failed = [];


    for(
        const model
        of ordered
    ){

        try{

            const response =
            await fetch(
                API_URL +
                "/v1/audio/speech",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json",

                        "Authorization":
                        "Bearer " +
                        accessToken
                    },

                    body:JSON.stringify({

                        model:model,

                        input:testText,

                        voice:
                        getVoice(),

                        response_format:
                        "mp3"

                    })
                }
            );


            if(
                response.ok
            ){

                return {

                    model:model,

                    failed:failed

                };

            }


            const errorText =
            await response.text();

            failed.push(
                model +
                " → HTTP " +
                response.status
            );

        }catch(e){

            failed.push(
                model +
                " → " +
                e.message
            );

        }

    }


    throw new Error(
        "API anahtarının izin verdiği "
        +
        "kullanılabilir ses modeli bulunamadı.\n\n"
        +
        "Denemeler:\n" +
        failed.join("\n")
    );

}


/* =========================================================
   SES
========================================================= */

function getVoice(){

    if(
        language.value === "tr"
    ){

        /*
         * Pollinations'ın desteklediği
         * genel ElevenLabs seslerinden biri.
         */

        return "nova";

    }

    if(
        language.value === "de"
    ){

        return "daniel";

    }

    return "alloy";

}


/* =========================================================
   AUDIO ÜRET
========================================================= */

async function generateVoice(){

    const text =
    script.value.trim();

    if(!text){

        alert(
            "Önce senaryo oluştur."
        );

        return;
    }


    const btn =
    document.getElementById(
        "audioBtn"
    );

    btn.disabled = true;

    btn.textContent =
    "🎙️ Ses modeli aranıyor...";


    audioStatus.innerHTML =
    "⏳ API anahtarına izin verilen ses modeli bulunuyor...";


    try{

        const result =
        await findWorkingAudioModel();

        selectedAudioModel =
        result.model;

        audioStatus.innerHTML =
        "🟢 Kullanılan ses modeli: " +
        "<b>" +
        escapeHTML(
            selectedAudioModel
        ) +
        "</b>";

        btn.textContent =
        "🎙️ Ses oluşturuluyor...";


        const response =
        await fetch(
            API_URL +
            "/v1/audio/speech",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " +
                    accessToken
                },

                body:JSON.stringify({

                    model:
                    selectedAudioModel,

                    input:text,

                    voice:
                    getVoice(),

                    response_format:
                    "mp3"

                })
            }
        );


        if(!response.ok){

            const errorText =
            await response.text();

            throw new Error(
                "AI ses servisi HTTP " +
                response.status +
                " döndürdü. " +
                errorText
            );

        }


        const blob =
        await response.blob();


        if(
            !blob.size
        ){

            throw new Error(
                "Ses servisi boş dosya döndürdü."
            );

        }


        generatedAudioURL =
        URL.createObjectURL(
            blob
        );


        audioBox.innerHTML = `

            <audio
                controls
                src="${generatedAudioURL}">
            </audio>

        `;


        audioStatus.innerHTML =
        "🟢 AI seslendirme hazır.<br>" +
        "<span class='badge'>" +
        escapeHTML(
            selectedAudioModel
        ) +
        "</span>";


        document.getElementById(
            "videoBtn"
        ).disabled = false;


    }catch(error){

        audioStatus.innerHTML =
        "<span class='error'>" +
        "❌ AI ses hatası:<br>" +
        escapeHTML(
            error.message
        ) +
        "</span>";

        console.error(
            error
        );

    }


    btn.disabled = false;

    btn.textContent =
    "🎙️ 4. AI Seslendirme Oluştur";

}


/* =========================================================
   VIDEO OLUŞTUR
========================================================= */

async function createVideo(){

    if(
        !generatedImages.length
    ){

        alert(
            "Önce görselleri oluştur."
        );

        return;
    }


    if(
        !window.MediaRecorder
    ){

        alert(
            "Tarayıcın MediaRecorder desteklemiyor."
        );

        return;
    }


    const btn =
    document.getElementById(
        "videoBtn"
    );

    btn.disabled = true;

    videoStatus.innerHTML =
    "🎬 Video hazırlanıyor...";


    progressBar.style.width =
    "5%";


    try{

        const canvas =
        document.createElement(
            "canvas"
        );

        canvas.width =
        1280;

        canvas.height =
        720;


        const ctx =
        canvas.getContext("2d");


        const stream =
        canvas.captureStream(
            30
        );


        const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:
                "video/webm;codecs=vp9"
            }
        );


        const chunks = [];


        recorder.ondataavailable =
        function(e){

            if(e.data.size){

                chunks.push(
                    e.data
                );

            }

        };


        const stopped =
        new Promise(
            resolve => {

                recorder.onstop =
                resolve;

            }
        );


        recorder.start();


        for(
            let i=0;
            i<generatedImages.length;
            i++
        ){

            const img =
            new Image();

            img.crossOrigin =
            "anonymous";

            img.src =
            generatedImages[i];


            await new Promise(
                (resolve,reject)=>{

                    img.onload =
                    resolve;

                    img.onerror =
                    reject;

                }
            );


            const start =
            performance.now();

            const duration =
            3500;


            await new Promise(
                resolve => {

                    function draw(){

                        const elapsed =
                        performance.now()
                        - start;

                        const p =
                        Math.min(
                            elapsed /
                            duration,
                            1
                        );


                        ctx.fillStyle =
                        "#000";

                        ctx.fillRect(
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );


                        const scale =
                        Math.max(
                            canvas.width /
                            img.width,

                            canvas.height /
                            img.height
                        );


                        const w =
                        img.width *
                        scale *
                        (1 + p*0.04);

                        const h =
                        img.height *
                        scale *
                        (1 + p*0.04);


                        const x =
                        (canvas.width-w)/2;

                        const y =
                        (canvas.height-h)/2;


                        ctx.drawImage(
                            img,
                            x,
                            y,
                            w,
                            h
                        );


                        progressBar.style.width =
                        (
                            5 +
                            (
                                (i+p) /
                                generatedImages.length
                            ) * 90
                        ) +
                        "%";


                        if(p<1){

                            requestAnimationFrame(
                                draw
                            );

                        }else{

                            resolve();

                        }

                    }

                    draw();

                }
            );

        }


        recorder.stop();

        await stopped;


        const blob =
        new Blob(
            chunks,
            {
                type:
                "video/webm"
            }
        );


        const url =
        URL.createObjectURL(
            blob
        );


        videoBox.innerHTML = `

            <video
                controls
                src="${url}">
            </video>

            <a
                href="${url}"
                download="mina-video.webm"
                style="
                display:block;
                text-align:center;
                margin-top:12px;
                color:#8fa2ff;
                font-weight:bold;
                "
            >
            ⬇️ Videoyu Kaydet
            </a>

        `;


        progressBar.style.width =
        "100%";


        videoStatus.innerHTML =
        "<span class='success'>" +
        "🟢 Video başarıyla oluşturuldu."
        +
        "</span>";


    }catch(error){

        videoStatus.innerHTML =
        "<span class='error'>" +
        "❌ Video hatası: " +
        escapeHTML(
            error.message
        ) +
        "</span>";

        console.error(
            error
        );

    }


    btn.disabled = false;

}
