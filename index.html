/* =========================================================

const APP_KEY = "pk_QJfK0SKE0MqAqf3I";

function setStatus(text,type=""){
  mainStatus.className="status "+type;
  mainStatus.textContent=text;
}

function setProgress(value){
  progressBar.style.width =
  Math.max(0,Math.min(100,value))+"%";
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function base64url(buffer){

  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
  .replace(/\+/g,"-")
  .replace(/\//g,"_")
  .replace(/=+$/,"");

}

function randomString(length=32){

  const chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result="";

  const array =
  new Uint8Array(length);

  crypto.getRandomValues(array);

  for(let i=0;i<length;i++){
    result += chars[array[i] % chars.length];
  }

  return result;

}

/* =========================================================
   PKCE
========================================================= */

async function createPKCE(){

  const verifier =
  randomString(64);

  const data =
  new TextEncoder().encode(verifier);

  const digest =
  await crypto.subtle.digest(
    "SHA-256",
    data
  );

  const challenge =
  base64url(digest);

  return {
    verifier,
    challenge
  };

}

/* =========================================================
   OAUTH
========================================================= */

async function connectPollinations(){

  try{

    const pkce =
    await createPKCE();

    const state =
    randomString(32);

    sessionStorage.setItem(
      "mina_oauth_state",
      state
    );

    sessionStorage.setItem(
      "mina_pkce_verifier",
      pkce.verifier
    );

    const params =
    new URLSearchParams();

    params.set(
      "response_type",
      "code"
    );

    params.set(
      "client_id",
      APP_KEY
    );

    params.set(
      "redirect_uri",
      REDIRECT_URI
    );

    params.set(
      "scope",
      "profile usage"
    );

    params.set(
      "state",
      state
    );

    params.set(
      "code_challenge",
      pkce.challenge
    );

    params.set(
      "code_challenge_method",
      "S256"
    );

    params.set(
      "expiry",
      "7"
    );

    const url =
      AUTH_URL+"?"+params.toString();

    authStatus.innerHTML =
      "Pollinations giriş ekranı açılıyor...";

    window.location.href = url;

  }catch(error){

    authStatus.innerHTML =
      "Bağlantı hatası: "+error.message;

  }

}

/* =========================================================
   CALLBACK
========================================================= */

async function handleOAuthCallback(){

  const params =
  new URLSearchParams(
    window.location.search
  );

  const error =
  params.get("error");

  if(error){

    authStatus.innerHTML =
    "OAuth hatası: "+
    error;

    return;

  }

  const code =
  params.get("code");

  if(!code){

    if(accessToken){

      authStatus.innerHTML =
      "🟢 Pollinations bağlantısı aktif.";

      authStatus.classList.add(
        "success"
      );

      connectBtn.textContent =
      "🟢 Bağlandı";

      return;

    }

    return;

  }

  const state =
  params.get("state");

  const savedState =
  sessionStorage.getItem(
    "mina_oauth_state"
  );

  if(!state || state !== savedState){

    authStatus.innerHTML =
    "Güvenlik doğrulaması başarısız.";

    return;

  }

  const verifier =
  sessionStorage.getItem(
    "mina_pkce_verifier"
  );

  if(!verifier){

    authStatus.innerHTML =
    "PKCE doğrulama bilgisi bulunamadı.";

    return;

  }

  try{

    authStatus.innerHTML =
    "🔄 Yetkilendirme tamamlanıyor...";

    const body =
    new URLSearchParams();

    body.set(
      "grant_type",
      "authorization_code"
    );

    body.set(
      "code",
      code
    );

    body.set(
      "client_id",
      APP_KEY
    );

    body.set(
      "redirect_uri",
      REDIRECT_URI
    );

    body.set(
      "code_verifier",
      verifier
    );

    const response =
    await fetch(
      TOKEN_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body
      }
    );

    const data =
    await response.json();

    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.error ||
        "Token alınamadı."
      );

    }

    accessToken =
    data.access_token;

    sessionStorage.setItem(
      "mina_pollinations_token",
      accessToken
    );

    sessionStorage.removeItem(
      "mina_oauth_state"
    );

    sessionStorage.removeItem(
      "mina_pkce_verifier"
    );

    authStatus.innerHTML =
      "🟢 Pollinations bağlantısı başarılı.";

    authStatus.className =
      "status success";

    connectBtn.textContent =
      "🟢 Pollinations Bağlandı";

    const cleanUrl =
      window.location.origin+
      window.location.pathname;

    history.replaceState(
      {},
      document.title,
      cleanUrl
    );

  }catch(error){

    authStatus.innerHTML =
      "❌ Bağlantı başarısız: "+
      error.message;

    authStatus.className =
      "status error";

  }

}

/* =========================================================
   API KONTROL
========================================================= */

function requireAuth(){

  if(!accessToken){

    setStatus(
      "Önce 🔐 Pollinations'a Bağlan butonuna bas.",
      "warning"
    );

    return false;

  }

  return true;

}

/* =========================================================
   SENARYO
========================================================= */

async function createScript(){

  if(!requireAuth()) return;

  const count =
  Number(sceneCount.value);

  const lang =
  language.value;

  const langName =
  lang==="de"
  ? "German"
  : lang==="en"
  ? "English"
  : "Turkish";

  setStatus(
    "🎬 Senaryo oluşturuluyor..."
  );

  setProgress(10);

  scriptBtn.disabled=true;

  try{

    const prompt = `
Create a short cinematic mystery video script.

Topic:
${topic.value}

Language:
${langName}

Number of scenes:
${count}

Requirements:

- Exactly ${count} scenes.
- Each scene must have a short narration.
- Each scene must have a visual prompt.
- The story should be mysterious and cinematic.
- Keep narration suitable for a short YouTube video.
- Do not use markdown.
- Return ONLY valid JSON.

Format:

{
 "scenes":[
   {
     "narration":"...",
     "visual":"..."
   }
 ]
}
`;

    const response =
    await fetch(
      "https://gen.pollinations.ai/v1/chat/completions",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/json",
          "Authorization":
          "Bearer "+accessToken
        },
        body:JSON.stringify({
          model:TEXT_MODEL,
          messages:[
            {
              role:"user",
              content:prompt
            }
          ],
          temperature:.8
        })
      }
    );

    const data =
    await response.json();

    if(!response.ok){

      throw new Error(
        data.error?.message ||
        data.message ||
        "Senaryo API hatası."
      );

    }

    let content =
    data.choices?.[0]?.message?.content || "";

    content =
    content
    .replace(/```json/gi,"")
    .replace(/```/g,"")
    .trim();

    let parsed;

    try{

      parsed =
      JSON.parse(content);

    }catch(e){

      const start =
      content.indexOf("{");

      const end =
      content.lastIndexOf("}");

      if(start>=0 && end>start){

        parsed =
        JSON.parse(
          content.slice(
            start,
            end+1
          )
        );

      }else{

        throw new Error(
          "AI geçerli JSON döndürmedi."
        );

      }

    }

    if(!parsed.scenes ||
       !Array.isArray(parsed.scenes)){

      throw new Error(
        "Sahne verisi bulunamadı."
      );

    }

    scenesData =
    parsed.scenes
    .slice(0,count)
    .map((s,i)=>({

      narration:
      String(
        s.narration ||
        ""
      ),

      visual:
      String(
        s.visual ||
        ""
      ),

      image:null

    }));

    scriptOutput.value =
    scenesData
    .map(
      (s,i)=>
      `SAHNE ${i+1}\n${s.narration}`
    )
    .join("\n\n");

    renderScenes();

    imageBtn.disabled=false;

    setProgress(25);

    setStatus(
      "✅ Senaryo hazır. Şimdi görselleri oluşturabilirsin.",
      "success"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Senaryo oluşturulamadı: "+
      error.message,
      "error"
    );

  }finally{

    scriptBtn.disabled=false;

  }

}

/* =========================================================
   GÖRSEL STİL
========================================================= */

function getStyleText(){

  const map={

    cinematic:
    "cinematic movie scene, dramatic lighting, cinematic composition",

    fantasy:
    "dark fantasy cinematic artwork, magical atmosphere",

    scifi:
    "cinematic science fiction scene, futuristic atmosphere",

    "3d":
    "high quality 3D animated movie style",

    "2d":
    "beautiful 2D animated illustration style",

    dark:
    "dark mysterious horror atmosphere, eerie cinematic lighting",

    realistic:
    "photorealistic cinematic photography",

    action:
    "dynamic action movie scene, dramatic movement",

    medieval:
    "dark medieval cinematic scene",

    epic:
    "epic cinematic fantasy movie scene"

  };

  return map[style.value] ||
  map.cinematic;

}

/* =========================================================
   SAHNELERİ GÖSTER
========================================================= */

function renderScenes(){

  scenes.innerHTML="";

  scenesData.forEach(
    (scene,index)=>{

      const div =
      document.createElement("div");

      div.className="scene";

      div.innerHTML=`

        <div class="sceneTitle">
          🎬 SAHNE ${index+1}
        </div>

        <p>
          ${escapeHtml(
            scene.narration
          )}
        </p>

        <div class="small">
          🎨 ${escapeHtml(
            scene.visual
          )}
        </div>

        <div id="image-${index}"></div>

      `;

      scenes.appendChild(div);

    }
  );

}

function escapeHtml(text){

  return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

/* =========================================================
   GÖRSELLER
========================================================= */

${getStyleText()}

High quality.
Cinematic composition.
No text.
No subtitles.
16:9 landscape.
Detailed lighting.
Professional movie frame.

`;

    setStatus(
      "✅ Görseller hazır. Ses önizlemesi yapabilir veya doğrudan videoyu oluşturabilirsin.",

    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Görsel oluşturma hatası: "+

    );

  }finally{

  }

/* =========================================================
   TARAYICI SES ÖNİZLEME
========================================================= */

function stopBrowserVoice(){

  try{

    speechSynthesis.cancel();

  }catch(e){}

}

function playBrowserVoice(){

  if(!("speechSynthesis" in window)){

    setStatus(
      "Bu tarayıcı sesli konuşmayı desteklemiyor.",
      "warning"
    );

    return;

  }

  stopBrowserVoice();

  let index=0;

  const langCode =
  language.value==="de"
  ? "de-DE"
  : language.value==="en"
  ? "en-US"
  : "tr-TR";

  function next(){

    if(index>=scenesData.length){

      setStatus(
        "🔊 Ses önizlemesi tamamlandı.",
        "success"
      );

      return;

    }

    const text =
    scenesData[index].narration;

    const utterance =
    new SpeechSynthesisUtterance(
      text
    );

    utterance.lang =
    langCode;

    utterance.rate =
    .95;

    utterance.pitch =
    1;

    utterance.onstart=()=>{

      setStatus(
        `🔊 Sahne ${index+1}/${scenesData.length} seslendiriliyor...`
      );

    };

    utterance.onend=()=>{

      index++;

      next();

    };

    utterance.onerror=()=>{

      index++;

      next();

    };

    speechSynthesis.speak(
      utterance
    );

  }

  next();

}

/* =========================================================
   VIDEO
========================================================= */

async function makeVideo(){

  if(!scenesData.length){

    setStatus(
      "Önce senaryo oluştur.",
      "warning"
    );

    return;

  }

  const missing =
  scenesData.some(
    s=>!s.image
  );

  if(missing){

    setStatus(
      "Önce görselleri oluştur.",
      "warning"
    );

    return;

  }

  videoBtn.disabled=true;

  setProgress(75);

  setStatus(
    "🎥 Video hazırlanıyor..."
  );

  try{

    const canvas =
    document.createElement("canvas");

    canvas.width=1280;
    canvas.height=720;

    const ctx =
    canvas.getContext("2d");

    /*
      Video stream.
      Burada ayrıca sessiz bir audio track
      oluşturuyoruz. Böylece WebM dosyası
      ses kanalı içerebilir ama ücretli AI
      ses isteği yapılmaz.
    */

    const videoStream =
    canvas.captureStream(30);

    const audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    const audioDestination =
    audioContext.createMediaStreamDestination();

    /*
      Sessiz audio track
    */

    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    gain.gain.value=0;

    oscillator.connect(gain);
    gain.connect(
      audioDestination
    );

    oscillator.start();

    const finalStream =
    new MediaStream();

    videoStream
    .getVideoTracks()
    .forEach(
      track=>
      finalStream.addTrack(track)
    );

    audioDestination
    .stream
    .getAudioTracks()
    .forEach(
      track=>
      finalStream.addTrack(track)
    );

    let mimeType =
    "video/webm;codecs=vp9,opus";

    if(!MediaRecorder.isTypeSupported(
      mimeType
    )){

      mimeType =
      "video/webm;codecs=vp8,opus";

    }

    if(!MediaRecorder.isTypeSupported(
      mimeType
    )){

      mimeType =
      "video/webm";

    }

    const chunks=[];

    const recorder =
    new MediaRecorder(
      finalStream,
      {
        mimeType,
        videoBitsPerSecond:
        5000000
      }
    );

    recorder.ondataavailable =
    e=>{

      if(e.data &&
         e.data.size>0){

        chunks.push(e.data);

      }

    };

    const recorderFinished =
    new Promise(
      resolve=>{

        recorder.onstop=resolve;

      }
    );

    recorder.start(200);

    /*
      Arka plan
    */

    ctx.fillStyle="#000";
    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    /*
      Her sahneyi yaklaşık 5 saniye
      gösteriyoruz.
    */

    const sceneDuration =
    5000;

    for(
      let i=0;
      i<scenesData.length;
      i++
    ){

      const scene =
      scenesData[i];

      setStatus(
        `🎥 Video sahnesi ${i+1}/${scenesData.length} hazırlanıyor...`
      );

      setProgress(
        75+
        (i/scenesData.length)*20
      );

      const img =
      await loadImage(
        scene.image
      );

      const start =
      performance.now();

      while(
        performance.now()-
        start <
        sceneDuration
      ){

        const elapsed =
        performance.now()-
        start;

        const alpha =
        Math.min(
          1,
          elapsed/500
        );

        ctx.globalAlpha=1;

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        /*
          Hafif karartma
        */

        ctx.fillStyle=
        "rgba(0,0,0,.18)";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        /*
          Sahne numarası
        */

        ctx.fillStyle=
        "rgba(0,0,0,.55)";

        roundRect(
          ctx,
          35,
          30,
          155,
          45,
          12
        );

        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.font=
        "bold 22px Arial";

        ctx.fillText(
          `SAHNE ${i+1}`,
          55,
          60
        );

        /*
          Altyazı
        */

        drawSubtitle(
          ctx,
          scene.narration
        );

        await nextFrame();

      }

    }

    recorder.stop();

    oscillator.stop();

    await recorderFinished;

    audioContext.close();

    videoBlob =
    new Blob(
      chunks,
      {
        type:mimeType
      }
    );

    const videoUrl =
    URL.createObjectURL(
      videoBlob
    );

    videoPreview.src =
    videoUrl;

    downloadBtn.href =
    videoUrl;

    downloadBtn.download =
    "mina-video-"+Date.now()+".webm";

    downloadBtn.style.display =
    "block";

    setProgress(100);

    setStatus(
      "🎉 VİDEO HAZIR! Altyazılar videonun içine işlendi.",
      "success"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Video oluşturulamadı: "+
      error.message,
      "error"
    );

  }finally{

    videoBtn.disabled=false;

  }

}

/* =========================================================
   GÖRSEL YÜKLE
========================================================= */

function loadImage(src){

  return new Promise(
    (resolve,reject)=>{

      const img =
      new Image();

      img.onload=()=>
      resolve(img);

      img.onerror=()=>
      reject(
        new Error(
          "Görsel yüklenemedi."
        )
      );

      img.src=src;

    }
  );

}

/* =========================================================
   FRAME
========================================================= */

function nextFrame(){

  return new Promise(
    resolve=>
    requestAnimationFrame(
      ()=>resolve()
    )
  );

}

/* =========================================================
   YUVARLAK KUTU
========================================================= */

function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(
    x+r,
    y
  );

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    r
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    r
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    r
  );

  ctx.closePath();

}

/* =========================================================
   ALTYAZI
========================================================= */

function drawSubtitle(
  ctx,
  text
){

  const maxWidth =
  1050;

  const words =
  String(text)
  .split(/\s+/);

  const lines=[];

  let current="";

  ctx.font=
  "bold 32px Arial";

  for(
    const word of words
  ){

    const test =
    current
    ? current+" "+word
    : word;

    if(
      ctx.measureText(test)
      .width >
      maxWidth
    ){

      if(current)
        lines.push(current);

      current=word;

    }else{

      current=test;

    }

  }

  if(current)
    lines.push(current);

  const lineHeight=42;

  const padding=25;

  const boxHeight =
  lines.length*
  lineHeight+
  padding*2;

  const boxY =
  canvasSafeHeight()-
  boxHeight-
  30;

  ctx.fillStyle=
  "rgba(0,0,0,.72)";

  roundRect(
    ctx,
    70,
    boxY,
    1140,
    boxHeight,
    18
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.textAlign="center";

  lines.forEach(
    (line,index)=>{

      ctx.fillText(
        line,
        640,
        boxY+
        padding+
        30+
        index*
        lineHeight
      );

    }
  );

  ctx.textAlign="left";

}

function canvasSafeHeight(){

  return 720;

}
