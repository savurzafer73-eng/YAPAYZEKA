<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080b14;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(900px,94%);
    margin:auto;
    padding:25px 0 50px;
}

h1{
    text-align:center;
    margin:5px 0 8px;
    font-size:32px;
}

.sub{
    text-align:center;
    color:#9fa8bd;
    margin-bottom:25px;
}

.box{
    background:#111827;
    border:1px solid #263147;
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,select,textarea{
    width:100%;
    border:1px solid #354158;
    background:#090e19;
    color:white;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:180px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    filter:brightness(1.12);
}

button.secondary{
    background:#1f2937;
}

button.green{
    background:#16a34a;
}

button.red{
    background:#b91c1c;
}

.status{
    padding:13px;
    border-radius:10px;
    background:#0b1220;
    color:#cbd5e1;
    margin-top:12px;
    line-height:1.5;
}

.scene{
    background:#0b1220;
    border:1px solid #263147;
    border-radius:14px;
    padding:12px;
    margin-top:12px;
}

.scene img{
    width:100%;
    display:block;
    border-radius:10px;
    margin-top:10px;
    max-height:430px;
    object-fit:cover;
}

.scene textarea{
    min-height:100px;
    margin-top:8px;
}

#preview{
    width:100%;
    background:#000;
    border-radius:14px;
    display:none;
    margin-top:15px;
}

.download{
    display:none;
    text-decoration:none;
    text-align:center;
    background:#16a34a;
    color:#fff;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    margin-top:12px;
}

.small{
    color:#94a3b8;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:650px){
    .row{
        grid-template-columns:1fr;
    }

    h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Mina Video AI</h1>
<div class="sub">Mystery Nacht Video Generator</div>

<div class="box">

<label>Video konusu</label>

<input
id="topic"
placeholder="Örnek: Der mysteriöse Tod von Elisa Lam"
>

<div class="row">

<div>
<label>Dil</label>
<select id="language">
<option value="de">Deutsch</option>
<option value="tr">Türkçe</option>
<option value="en">English</option>
</select>
</div>

<div>
<label>Sahne sayısı</label>
<select id="sceneCount">
<option value="1">1 Sahne</option>
<option value="4">4 Sahne</option>
<option value="5">5 Sahne</option>
<option value="6" selected>6 Sahne</option>
</select>
</div>

</div>

<div class="row">

<div>
<label>Görsel stil</label>
<select id="style">
<option>🎬 Cinematic</option>
<option>🌑 Dark Mystery</option>
<option>📸 Photorealistic</option>
<option>💥 Action</option>
<option>🏰 Medieval</option>
<option>🌌 Epic</option>
<option>🤖 Science Fiction</option>
<option>🧙 Fantasy</option>
</select>
</div>

<div>
<label>Sahne süresi</label>
<select id="duration">
<option value="5">5 saniye</option>
<option value="7" selected>7 saniye</option>
<option value="10">10 saniye</option>
</select>
</div>

</div>

<button onclick="createScript()">
🧠 Senaryo Oluştur
</button>

</div>


<div class="box">

<label>Senaryo</label>

<textarea id="script"
placeholder="Senaryo burada oluşacak..."></textarea>

<button
class="secondary"
onclick="makeScenes()"
>
🎞️ Sahnelere Ayır
</button>

</div>


<div class="box">

<label>Sahneler</label>

<div id="scenes"></div>

</div>


<div class="box">

<button
class="green"
onclick="createVideo()"
>
🎥 Videoyu Oluştur
</button>

<div id="status" class="status">
Hazır.
</div>

<video id="preview" controls></video>

<a
id="download"
class="download"
download="mina-video.webm"
>
⬇️ Videoyu İndir
</a>

</div>

<div class="box small">

<b>Not:</b><br>
Bu sürüm tarayıcı içinde çalışır. Görseller için ücretsiz
Picsum kaynağını kullanır. Altyazılar videonun içine işlenir.
Gerçek AI ses için sonraki aşamada ayrı bir ücretsiz/uygun
TTS çözümü ekleyeceğiz.

</div>

</div>


<script>

const $ = id => document.getElementById(id);


/* =========================
   SENARYO
========================= */

function createScript(){

    const topic = $("topic").value.trim();

    if(!topic){
        alert("Önce video konusunu yaz.");
        return;
    }

    const lang = $("language").value;

    let text = "";

    if(lang === "de"){

        text =
`Stell dir vor, du wachst mitten in der Nacht auf und bemerkst, dass etwas nicht stimmt.

Das heutige Geheimnis dreht sich um ${topic}.

Was zunächst wie ein gewöhnlicher Vorfall aussieht, entwickelt sich schnell zu einer Geschichte voller ungelöster Fragen.

Zeugen berichten von merkwürdigen Ereignissen.

Doch je genauer man die Spuren untersucht, desto mehr Widersprüche tauchen auf.

Bis heute gibt es Fragen, auf die niemand eine eindeutige Antwort geben kann.

Was wirklich passiert ist, bleibt eines der faszinierendsten Geheimnisse dieser Geschichte.`;

    }else if(lang === "en"){

        text =
`Imagine waking up in the middle of the night and realizing that something is terribly wrong.

Today's mystery is about ${topic}.

What first appears to be an ordinary incident quickly becomes a story filled with unanswered questions.

Witnesses describe strange events.

But the closer investigators look, the more contradictions appear.

Even today, some questions remain unanswered.

What really happened remains one of the most fascinating mysteries surrounding this case.`;

    }else{

        text =
`Gece yarısı uyandığınızı ve bir şeylerin hiç normal olmadığını fark ettiğinizi düşünün.

Bugünkü gizemimizin konusu: ${topic}.

İlk başta sıradan görünen olay, kısa süre içinde cevaplanması zor sorularla dolu bir hikâyeye dönüşüyor.

Tanıklar birbirinden tuhaf olaylardan bahsediyor.

Ancak izler incelendikçe daha fazla çelişki ortaya çıkıyor.

Aradan yıllar geçmesine rağmen bazı sorular hâlâ cevapsız.

Gerçekte ne olduğu ise bu hikâyenin en büyük gizemlerinden biri olmaya devam ediyor.`;

    }

    $("script").value = text;

    $("status").innerHTML =
        "✅ Senaryo hazır. Şimdi sahnelere ayırabilirsin.";
}


/* =========================
   SAHNELER
========================= */

function makeScenes(){

    const text = $("script").value.trim();

    if(!text){
        alert("Önce senaryo oluştur.");
        return;
    }

    const count = Number($("sceneCount").value);
    const topic = $("topic").value.trim();
    const style = $("style").value;

    const paragraphs =
        text
        .split(/\n+/)
        .map(x => x.trim())
        .filter(Boolean);

    let scenes = [];

    for(let i=0;i<count;i++){

        let base =
            paragraphs[i % paragraphs.length] || text;

        scenes.push({
            text:base,
            prompt:
            `${topic}, ${style}, dark mysterious documentary atmosphere, cinematic lighting, realistic details, dramatic composition, no text`
        });

    }

    window.minaScenes = scenes;

    renderScenes();

    $("status").innerHTML =
        `🎞️ ${count} sahne hazır.`;

}


function renderScenes(){

    const container = $("scenes");

    container.innerHTML = "";

    window.minaScenes.forEach((scene,index)=>{

        const div = document.createElement("div");

        div.className = "scene";

        div.innerHTML = `
            <b>SAHNE ${index+1}</b>

            <textarea
            id="sceneText${index}"
            >${escapeHTML(scene.text)}</textarea>

            <input
            id="prompt${index}"
            value="${escapeAttr(scene.prompt)}"
            placeholder="Görsel açıklaması"
            >

            <button
            class="secondary"
            onclick="loadImage(${index})"
            >
            🖼️ Görsel Oluştur
            </button>

            <div id="imageStatus${index}" class="small">
            Görsel bekleniyor...
            </div>

            <img
            id="img${index}"
            style="display:none"
            >
        `;

        container.appendChild(div);

    });

}


/* =========================
   GÖRSEL
========================= */

async function loadImage(index){

    const prompt =
        document.getElementById("prompt"+index).value;

    const status =
        document.getElementById("imageStatus"+index);

    const img =
        document.getElementById("img"+index);

    /*
       Burada gerçek AI yerine güvenilir ücretsiz
       görsel kaynağı kullanıyoruz.
    */

    const seed =
        encodeURIComponent(
            $("topic").value +
            "-" +
            index
        );

    const url =
        `https://picsum.photos/seed/${seed}/1280/720`;

    status.innerHTML =
        "🖼️ Görsel yükleniyor...";

    img.onload = function(){

        img.style.display = "block";

        window.minaScenes[index].image =
            img.src;

        status.innerHTML =
            "✅ Görsel hazır.";
    };

    img.onerror = function(){

        status.innerHTML =
            "❌ Görsel yüklenemedi.";
    };

    img.src = url;

}


/* =========================
   TÜM GÖRSELLER
========================= */

async function loadAllImages(){

    for(let i=0;i<window.minaScenes.length;i++){

        await loadImagePromise(i);

        await sleep(1800);
    }

}


function loadImagePromise(index){

    return new Promise(resolve=>{

        const img =
            document.getElementById("img"+index);

        const status =
            document.getElementById("imageStatus"+index);

        const seed =
            encodeURIComponent(
                $("topic").value +
                "-" +
                Date.now() +
                "-" +
                index
            );

        img.onload = ()=>{

            img.style.display = "block";

            window.minaScenes[index].image =
                img.src;

            status.innerHTML =
                "✅ Görsel hazır.";

            resolve();
        };

        img.onerror = ()=>{

            status.innerHTML =
                "❌ Görsel yüklenemedi.";

            resolve();
        };

        img.src =
            `https://picsum.photos/seed/${seed}/1280/720`;
    });
}


/* =========================
   VIDEO
========================= */

async function createVideo(){

    if(!window.minaScenes ||
       !window.minaScenes.length){

        alert("Önce sahneleri oluştur.");
        return;
    }

    $("status").innerHTML =
        "🎬 Görseller hazırlanıyor...";

    await loadAllImages();

    $("status").innerHTML =
        "🎥 Video oluşturuluyor...";

    const canvas =
        document.createElement("canvas");

    canvas.width = 1280;
    canvas.height = 720;

    const ctx =
        canvas.getContext("2d");

    const stream =
        canvas.captureStream(30);

    let mime =
        "video/webm;codecs=vp9";

    if(!MediaRecorder.isTypeSupported(mime)){

        mime =
            "video/webm";
    }

    const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:mime,
                videoBitsPerSecond:5000000
            }
        );

    const chunks = [];

    recorder.ondataavailable =
        e => {

            if(e.data.size > 0)
                chunks.push(e.data);
        };

    const finished =
        new Promise(resolve=>{

            recorder.onstop = ()=>{

                const blob =
                    new Blob(
                        chunks,
                        {type:"video/webm"}
                    );

                resolve(blob);
            };
        });

    recorder.start();

    const duration =
        Number($("duration").value) * 1000;

    for(let i=0;i<window.minaScenes.length;i++){

        const scene =
            window.minaScenes[i];

        const img =
            document.getElementById("img"+i);

        if(!img ||
           !img.complete ||
           img.naturalWidth === 0){

            continue;
        }

        const start =
            performance.now();

        while(
            performance.now() - start
            <
            duration
        ){

            drawScene(
                ctx,
                img,
                scene.text,
                i + 1,
                window.minaScenes.length
            );

            await sleep(33);
        }
    }

    recorder.stop();

    const blob =
        await finished;

    const url =
        URL.createObjectURL(blob);

    $("preview").src = url;

    $("preview").style.display =
        "block";

    const download =
        $("download");

    download.href = url;

    download.style.display =
        "block";

    $("status").innerHTML =
        "✅ Video hazır!";

}


function drawScene(
    ctx,
    img,
    text,
    number,
    total
){

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,0,1280,720
    );

    /*
       Görseli 16:9 cover olarak çiz
    */

    const iw = img.naturalWidth;
    const ih = img.naturalHeight;

    const scale =
        Math.max(
            1280/iw,
            720/ih
        );

    const w = iw * scale;
    const h = ih * scale;

    const x =
        (1280-w)/2;

    const y =
        (720-h)/2;

    ctx.drawImage(
        img,
        x,y,w,h
    );


    /*
       Karanlık alt gradient
    */

    const gradient =
        ctx.createLinearGradient(
            0,430,
            0,720
        );

    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.88)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,350,
        1280,
        370
    );


    /*
       Üst başlık
    */

    ctx.fillStyle =
        "rgba(0,0,0,.55)";

    roundRect(
        ctx,
        35,30,
        300,55,
        12
    );

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 25px Arial";

    ctx.fillText(
        "MYSTERY NACHT",
        55,
        66
    );


    /*
       Altyazı
    */

    const maxWidth = 1080;

    const words =
        text.split(" ");

    const lines = [];

    let line = "";

    ctx.font =
        "bold 34px Arial";

    for(const word of words){

        const test =
            line
            ? line + " " + word
            : word;

        if(
            ctx.measureText(test).width
            >
            maxWidth
        ){

            lines.push(line);

            line = word;

        }else{

            line = test;
        }
    }

    if(line)
        lines.push(line);


    const lineHeight = 44;

    const totalHeight =
        lines.length *
        lineHeight;

    let yText =
        670 -
        totalHeight;

    ctx.textAlign =
        "center";

    for(const l of lines){

        /*
           gölge
        */

        ctx.strokeStyle =
            "rgba(0,0,0,.9)";

        ctx.lineWidth =
            8;

        ctx.strokeText(
            l,
            640,
            yText
        );

        ctx.fillStyle =
            "#fff";

        ctx.fillText(
            l,
            640,
            yText
        );

        yText +=
            lineHeight;
    }

    ctx.textAlign =
        "left";


    /*
       Sahne numarası
    */

    ctx.fillStyle =
        "rgba(0,0,0,.6)";

    roundRect(
        ctx,
        1110,
        30,
        120,
        50,
        12
    );

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 20px Arial";

    ctx.fillText(
        `${number}/${total}`,
        1140,
        63
    );
}


/* =========================
   YARDIMCI
========================= */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.roundRect(
        x,y,w,h,r
    );

    ctx.fill();
}


function sleep(ms){

    return new Promise(
        resolve =>
        setTimeout(resolve,ms)
    );
}


function escapeHTML(str){

    return str
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}


function escapeAttr(str){

    return str
        .replaceAll("&","&amp;")
        .replaceAll('"',"&quot;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

</script>

</body>
</html>
