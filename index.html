<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#18264e,#080d1b 55%,#04060c);
color:#fff;
min-height:100vh
}

.container{
max-width:760px;
margin:auto;
padding:20px 15px 50px
}

.header{
text-align:center;
padding:15px 0 20px
}

.logo{
width:72px;
height:72px;
margin:auto;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
background:linear-gradient(135deg,#7555ff,#00cfff);
box-shadow:0 10px 35px rgba(0,190,255,.25)
}

h1{
margin:14px 0 5px;
font-size:30px
}

.subtitle{
color:#aeb9d5;
font-size:14px
}

.status{
margin:15px 0;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.1);
text-align:center
}

.status.ok{
color:#6dffad;
border-color:rgba(80,255,150,.3)
}

.status.error{
color:#ff8585;
border-color:rgba(255,80,80,.3)
}

.card{
background:rgba(12,18,37,.9);
border:1px solid rgba(255,255,255,.09);
border-radius:20px;
padding:18px;
margin-bottom:16px;
box-shadow:0 12px 35px rgba(0,0,0,.25)
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#b8c4df
}

textarea,select{
width:100%;
background:#080d1d;
color:#fff;
border:1px solid #293454;
border-radius:12px;
padding:13px;
font-size:15px;
outline:none
}

textarea{
min-height:120px;
resize:vertical
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:12px
}

button{
width:100%;
border:0;
border-radius:13px;
padding:14px;
margin-top:10px;
color:#fff;
font-size:15px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(135deg,#6654ff,#00aeea)
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.secondary{
background:#171e34;
border:1px solid #293452
}

.progress{
width:100%;
height:8px;
background:#11182b;
border-radius:10px;
overflow:hidden;
margin-top:14px
}

.progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#6b55ff,#00d4ff);
transition:width .3s
}

#log{
white-space:pre-wrap;
color:#9faccc;
font-size:13px;
line-height:1.55;
max-height:250px;
overflow:auto
}

.scene{
padding:12px;
border-radius:12px;
background:#0a1022;
border:1px solid #202b49;
margin-top:10px
}

.sceneTitle{
font-weight:bold;
color:#72dfff;
margin-bottom:6px
}

.sceneText{
color:#c5cee2;
font-size:14px;
line-height:1.5
}

.imageGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:12px
}

.imageGrid img{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
border-radius:12px;
border:1px solid #263252;
background:#050814
}

audio{
width:100%;
margin-top:12px
}

video{
width:100%;
margin-top:12px;
border-radius:15px;
background:#000
}

.hidden{
display:none
}

.small{
font-size:12px;
color:#7f8ba9;
margin-top:8px;
line-height:1.5
}

@media(max-width:600px){
.row{
grid-template-columns:1fr
}
h1{
font-size:26px
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">🎬</div>
<h1>Mina Video AI</h1>
<div class="subtitle">
Fikirden senaryoya, görsele, sese ve videoya
</div>
</div>

<div id="status" class="status">
🔴 Mina AI bağlantısı yapılmadı.
</div>

<div class="card">

<label>🎯 Video konusu</label>

<textarea id="topic"
placeholder="Örneğin: Sıfırdan başlayıp büyük bir başarı elde eden bir insanın hikâyesi"></textarea>

<div class="row">

<div>
<label>Dil</label>

<select id="language">
<option value="tr">🇹🇷 Türkçe</option>
<option value="de">🇩🇪 Almanca</option>
<option value="en">🇺🇸 İngilizce</option>
</select>
</div>

<div>
<label>Sahne sayısı</label>

<select id="sceneCount">
<option value="3">3</option>
<option value="4" selected>4</option>
<option value="5">5</option>
<option value="6">6</option>
</select>
</div>

</div>

<button id="connectBtn" onclick="connectAI()">
🔐 Mina AI'yi Bağla
</button>

<button id="scriptBtn" onclick="generateScript()">
✍️ Senaryo Oluştur
</button>

</div>


<div class="card">

<label>📝 Senaryo</label>

<textarea id="script"
placeholder="Senaryo burada oluşacak..."></textarea>

<button id="sceneBtn" onclick="generateScenes()">
🎬 Sahneleri Oluştur
</button>

</div>


<div class="card">

<label>🎞️ Sahneler</label>

<div id="scenes">
Henüz sahne oluşturulmadı.
</div>

<button id="imageBtn" onclick="generateImages()">
🖼️ Görselleri Oluştur
</button>

</div>


<div class="card">

<label>🖼️ Görseller</label>

<div id="images" class="imageGrid"></div>

</div>


<div class="card">

<label>🎙️ Yapay Zekâ Sesi</label>

<div class="small">
Mina'nın Fish Audio S2.1 Pro modeli kullanılacaktır.
</div>

<button id="audioBtn" onclick="generateAudio()">
🎙️ Sesi Oluştur
</button>

<audio id="audio" controls></audio>

</div>


<div class="card">

<label>🎥 Video</label>

<button id="videoBtn" onclick="createVideo()">
🎥 Videoyu Oluştur
</button>

<video id="video" controls playsinline></video>

<button
id="downloadBtn"
class="secondary hidden"
onclick="downloadVideo()">
⬇️ Videoyu Kaydet
</button>

</div>


<div class="card">

<label>📊 İşlem Durumu</label>

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<div id="log">
Mina Video AI hazır.
</div>

</div>

</div>


<script>

/* =====================================================
   AYARLAR
===================================================== */

const APP_KEY =
"pk_QJfK0SKE0MqAqf3I";

const REDIRECT_URI =
"https://savurzafer73-eng.github.io/YAPAYZEKA/";

const API_URL =
"https://gen.pollinations.ai";

const AUTH_URL =
"https://enter.pollinations.ai/authorize";

const TEXT_MODEL =
"openai/gpt-5.4-nano";

const IMAGE_MODEL =
"black-forest-labs/flux.1-schnell";

/*
   GÜNCEL FISH AUDIO MODEL
*/
const AUDIO_MODEL =
"fish-audio/s2.1-pro";


let accessToken = null;

let sceneData = [];

let imageData = [];

let audioURL = "";

let videoURL = "";


/* =====================================================
   ELEMENTLER
===================================================== */

const statusBox =
document.getElementById("status");

const logBox =
document.getElementById("log");

const progressBar =
document.getElementById("progressBar");

const scriptBox =
document.getElementById("script");

const scenesBox =
document.getElementById("scenes");

const imagesBox =
document.getElementById("images");

const audioPlayer =
document.getElementById("audio");

const videoPlayer =
document.getElementById("video");

const downloadBtn =
document.getElementById("downloadBtn");


/* =====================================================
   LOG
===================================================== */

function log(message){

logBox.textContent +=
"\n" + message;

logBox.scrollTop =
logBox.scrollHeight;
}


function setProgress(value){

progressBar.style.width =
Math.max(0,Math.min(100,value)) + "%";
}


function setStatus(text,type){

statusBox.textContent = text;

statusBox.className =
"status " + (type || "");
}


/* =====================================================
   AUTH
===================================================== */

function checkAuth(){

const hash =
window.location.hash;

if(hash){

const params =
new URLSearchParams(
hash.substring(1)
);

const key =
params.get("api_key");

if(key){

accessToken = key;

sessionStorage.setItem(
"mina_access_token",
key
);

history.replaceState(
null,
document.title,
window.location.pathname +
window.location.search
);

setConnected();

return;
}

}

const saved =
sessionStorage.getItem(
"mina_access_token"
);

if(saved){

accessToken = saved;

setConnected();

return;
}

setStatus(
"🔴 Mina AI bağlantısı yapılmadı.",
"error"
);

}


function setConnected(){

setStatus(
"🟢 Mina AI bağlantısı aktif.",
"ok"
);

log(
"Mina AI bağlantısı başarılı."
);

}


function connectAI(){

const params =
new URLSearchParams();

params.set(
"redirect_uri",
REDIRECT_URI
);

params.set(
"client_id",
APP_KEY
);

params.set(
"scope",
"usage"
);

window.location.href =
AUTH_URL +
"?" +
params.toString();

}


/* =====================================================
   CHAT API
===================================================== */

async function apiChat(messages){

if(!accessToken){

throw new Error(
"Önce Mina AI'yi bağla."
);

}

const response =
await fetch(
API_URL +
"/v1/chat/completions",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer " +
accessToken
},

body:JSON.stringify({

model:TEXT_MODEL,

messages:messages,

temperature:.8

})

}
);

const text =
await response.text();

if(!response.ok){

throw new Error(
"AI metin servisi HTTP " +
response.status +
"\n" +
text
);

}

let data;

try{

data =
JSON.parse(text);

}
catch(e){

throw new Error(
"AI cevabı okunamadı."
);

}

if(
!data.choices ||
!data.choices[0] ||
!data.choices[0].message
){

throw new Error(
"AI cevabında sonuç bulunamadı."
);

}

return data.choices[0]
.message.content;

}


/* =====================================================
   SENARYO
===================================================== */

async function generateScript(){

const topic =
document.getElementById("topic")
.value.trim();

if(!topic){

alert(
"Önce video konusunu yaz."
);

return;
}

try{

disableButtons(true);

setProgress(5);

log(
"\n✍️ Senaryo oluşturuluyor..."
);

const lang =
document.getElementById(
"language"
).value;

const languageName =
lang === "tr"
? "Türkçe"
: lang === "de"
? "Almanca"
: "İngilizce";

const result =
await apiChat([

{
role:"system",

content:
"Sen profesyonel sinematik video " +
"senaryosu yazan bir yapay zekâsın. " +
"İzleyiciyi ilk saniyelerde yakala."
},

{
role:"user",

content:
"Video konusu: " +
topic +

"\nDil: " +
languageName +

"\n\n60-90 saniyelik etkileyici " +
"bir video senaryosu yaz. " +
"İlk cümle çok güçlü olsun. " +
"Gereksiz başlık ve açıklama ekleme."
}

]);

scriptBox.value =
result.trim();

setProgress(25);

log(
"✅ Senaryo oluşturuldu."
);

}
catch(error){

log(
"❌ Senaryo hatası:\n" +
error.message
);

alert(error.message);

}
finally{

disableButtons(false);

}

}


/* =====================================================
   SAHNELER
===================================================== */

async function generateScenes(){

const script =
scriptBox.value.trim();

const count =
Number(
document.getElementById(
"sceneCount"
).value
);

if(!script){

alert(
"Önce senaryo oluştur."
);

return;
}

try{

disableButtons(true);

setProgress(30);

log(
"\n🎬 Sahneler oluşturuluyor..."
);

const result =
await apiChat([

{
role:"system",

content:
"Sen profesyonel storyboard " +
"yönetmenisin."
},

{
role:"user",

content:
"Bu senaryoyu tam olarak " +
count +
" sinematik sahneye böl.\n\n" +

script +

"\n\nHer satırı şu formatta ver:\n" +
"SAHNE 1: açıklama\n" +
"SAHNE 2: açıklama\n" +
"SAHNE 3: açıklama"
}

]);

sceneData =
parseScenes(result,count);

renderScenes();

setProgress(45);

log(
"✅ " +
sceneData.length +
" sahne hazır."
);

}
catch(error){

log(
"❌ Sahne hatası:\n" +
error.message
);

}
finally{

disableButtons(false);

}

}


function parseScenes(text,count){

let lines =
text.split("\n")
.map(x=>x.trim())
.filter(Boolean);

let result = [];

for(
let i=0;
i<lines.length;
i++
){

let line =
lines[i];

if(
/^(SAHNE|SCENE)\s*\d+/i
.test(line)
){

line =
line.replace(
/^(SAHNE|SCENE)\s*\d+\s*:?\s*/i,
""
);

if(line)
result.push(line);

}

}

if(result.length === 0){

result =
lines.slice(0,count);

}

while(result.length < count){

result.push(
"Sinema kalitesinde dramatik sahne: " +
scriptBox.value
);

}

return result.slice(0,count);

}


function renderScenes(){

scenesBox.innerHTML = "";

sceneData.forEach(
(scene,index)=>{

const div =
document.createElement("div");

div.className =
"scene";

div.innerHTML =
'<div class="sceneTitle">' +
"SAHNE " +
(index+1) +
"</div>" +

'<div class="sceneText">' +
escapeHTML(scene) +
"</div>";

scenesBox.appendChild(div);

}
);

}


/* =====================================================
   GÖRSELLER
===================================================== */

async function generateImages(){

if(!sceneData.length){

alert(
"Önce sahneleri oluştur."
);

return;
}

try{

disableButtons(true);

imagesBox.innerHTML = "";

imageData = [];

setProgress(50);

log(
"\n🖼️ Görseller oluşturuluyor..."
);

for(
let i=0;
i<sceneData.length;
i++
){

const prompt =
"Cinematic photorealistic movie scene, " +
"professional film still, dramatic lighting, " +
"realistic human details, high detail, " +
"16:9 composition. " +
sceneData[i];

const url =
API_URL +
"/image/" +
encodeURIComponent(prompt) +

"?model=" +
encodeURIComponent(IMAGE_MODEL) +

"&width=1280" +
"&height=720" +

"&nologo=true" +

"&key=" +
encodeURIComponent(accessToken);

const img =
document.createElement("img");

img.src = url;

img.alt =
"Sahne " + (i+1);

imagesBox.appendChild(img);

imageData.push(url);

setProgress(
50 +
((i+1)/sceneData.length)*25
);

await wait(1000);

}

log(
"✅ Görseller hazır."
);

}
catch(error){

log(
"❌ Görsel hatası:\n" +
error.message
);

}
finally{

disableButtons(false);

}

}


/* =====================================================
   SES - YENİ VE BASİT SİSTEM
===================================================== */

async function generateAudio(){

const script =
scriptBox.value.trim();

if(!script){

alert(
"Önce senaryo oluştur."
);

return;
}

if(!accessToken){

alert(
"Önce Mina AI'yi bağla."
);

return;
}

try{

disableButtons(true);

setProgress(78);

log(
"\n🎙️ Fish Audio S2.1 Pro başlatılıyor..."
);

/*
   ÇOK ÖNEMLİ:

   Fish Audio için voice göndermiyoruz.

   Böylece "nova", "alloy" gibi başka
   sağlayıcılara ait ses isimlerinin
   Fish Audio ile çakışmasını önlüyoruz.
*/

const response =
await fetch(
API_URL +
"/v1/audio/speech",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer " +
accessToken
},

body:JSON.stringify({

model:
AUDIO_MODEL,

input:
script,

response_format:
"mp3"

})
}
);

const responseType =
response.headers.get(
"content-type"
) || "";


/*
   API hata döndürürse önce metni oku.
*/

if(!response.ok){

const errorText =
await response.text();

throw new Error(
"HTTP " +
response.status +
"\n" +
errorText
);

}


/*
   Başarılı cevap doğrudan
   ses dosyasıdır.
*/

if(
responseType.indexOf(
"audio/"
) === -1
){

const unexpected =
await response.text();

throw new Error(
"API ses yerine beklenmeyen cevap verdi:\n" +
unexpected.substring(0,1000)
);

}

const blob =
await response.blob();

if(!blob || blob.size < 100){

throw new Error(
"Ses dosyası boş geldi."
);

}

if(audioURL){

URL.revokeObjectURL(
audioURL
);

}

audioURL =
URL.createObjectURL(
blob
);

audioPlayer.src =
audioURL;

audioPlayer.load();

setProgress(90);

log(
"✅ AI SESİ BAŞARIYLA OLUŞTURULDU."
);

}
catch(error){

log(
"\n❌ AI SES HATASI:\n" +
error.message
);

alert(
"❌ AI ses hatası:\n\n" +
error.message
);

}
finally{

disableButtons(false);

}

}


/* =====================================================
   VİDEO
===================================================== */

async function createVideo(){

if(!imageData.length){

alert(
"Önce görselleri oluştur."
);

return;
}

try{

disableButtons(true);

setProgress(90);

log(
"\n🎥 Video hazırlanıyor..."
);

const canvas =
document.createElement("canvas");

canvas.width = 1280;
canvas.height = 720;

const ctx =
canvas.getContext("2d");

const stream =
canvas.captureStream(30);

let audioStream = null;

try{

if(audioPlayer.captureStream){

audioStream =
audioPlayer.captureStream();

audioStream
.getAudioTracks()
.forEach(
track=>{
stream.addTrack(track);
}
);

}

}
catch(e){}

let mimeType =
"video/webm;codecs=vp9,opus";

if(
!MediaRecorder.isTypeSupported(
mimeType
)
){

mimeType =
"video/webm";
}

const recorder =
new MediaRecorder(
stream,
{
mimeType:mimeType
}
);

const chunks = [];

recorder.ondataavailable =
function(e){

if(
e.data &&
e.data.size > 0
){

chunks.push(e.data);

}

};

const stopped =
new Promise(
resolve=>{
recorder.onstop =
resolve;
}
);

recorder.start();

for(
let i=0;
i<imageData.length;
i++
){

await cinematicHold(
ctx,
imageData[i],
1280,
720,
3500
);

setProgress(
90 +
((i+1)/imageData.length)*8
);

}

recorder.stop();

await stopped;

const blob =
new Blob(
chunks,
{
type:mimeType
}
);

if(videoURL){

URL.revokeObjectURL(
videoURL
);

}

videoURL =
URL.createObjectURL(blob);

videoPlayer.src =
videoURL;

videoPlayer.load();

downloadBtn.classList.remove(
"hidden"
);

setProgress(100);

log(
"✅ Video hazır!"
);

}
catch(error){

log(
"❌ Video hatası:\n" +
error.message
);

alert(
"Video hatası:\n\n" +
error.message
);

}
finally{

disableButtons(false);

}

}


/* =====================================================
   GÖRSEL OKUMA
===================================================== */

function loadImage(url){

return new Promise(
(resolve,reject)=>{

const img =
new Image();

img.crossOrigin =
"anonymous";

img.onload =
()=>resolve(img);

img.onerror =
()=>reject(
new Error(
"Görsel yüklenemedi."
)
);

img.src = url;

}
);

}


/* =====================================================
   SİNEMATİK GÖRSEL
===================================================== */

async function cinematicHold(
ctx,
url,
width,
height,
duration
){

const img =
await loadImage(url);

const start =
performance.now();

return new Promise(
resolve=>{

function frame(now){

const elapsed =
now-start;

const p =
Math.min(
1,
elapsed/duration
);

const zoom =
1 +
p*.07;

const ratio =
Math.max(
width/img.width,
height/img.height
);

const w =
img.width*ratio*zoom;

const h =
img.height*ratio*zoom;

const x =
(width-w)/2;

const y =
(height-h)/2;

ctx.fillStyle =
"#000";

ctx.fillRect(
0,
0,
width,
height
);

ctx.drawImage(
img,
x,
y,
w,
h
);

if(p<1){

requestAnimationFrame(
frame
);

}
else{

resolve();

}

}

requestAnimationFrame(
frame
);

}
);

}


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadVideo(){

if(!videoURL)
return;

const a =
document.createElement("a");

a.href =
videoURL;

a.download =
"mina-video.webm";

document.body.appendChild(a);

a.click();

a.remove();

}


/* =====================================================
   YARDIMCI
===================================================== */

function wait(ms){

return new Promise(
resolve=>
setTimeout(resolve,ms)
);

}


function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function disableButtons(disabled){

[
"connectBtn",
"scriptBtn",
"sceneBtn",
"imageBtn",
"audioBtn",
"videoBtn"
]
.forEach(id=>{

const el =
document.getElementById(id);

if(el)
el.disabled =
disabled;

});

}


/* =====================================================
   BAŞLAT
===================================================== */

checkAuth();

</script>

</body>
</html>
