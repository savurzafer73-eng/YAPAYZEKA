<script>

/* =========================================================
   POLLINATIONS
========================================================= */

const CLIENT_ID =
"pk_QJfK0SKE0MqAqf3I";

const REDIRECT_URI =
"https://savurzafer73-eng.github.io/YAPAYZEKA/";

const AUTH_URL =
"https://enter.pollinations.ai/authorize";

const TOKEN_URL =
"https://enter.pollinations.ai/api/oauth/token";

let accessToken =
localStorage.getItem(
    "mina_pollinations_token"
) || "";

const MAX_SEED = 2147483647;


/* =========================================================
   PROJECT
========================================================= */

let project = {

    script:"",

    title:"",

    scenes:[],

    images:[],

    audioBuffers:[],

    videoBlob:null

};

let audioContext=null;

let voices=[];


/* =========================================================
   DOM
========================================================= */

const $ =
id => document.getElementById(id);


function status(text){

    $("status").textContent =
    text;
}


function progress(n){

    $("progress").style.width =
    Math.max(
        0,
        Math.min(100,n)
    ) + "%";
}


/* =========================================================
   SAFE ERROR TEXT
========================================================= */

function cleanErrorText(text){

    if(!text) return "";

    return String(text)
    .replace(/\s+/g," ")
    .trim()
    .slice(0,700);
}


/* =========================================================
   SAFE RESPONSE READER
========================================================= */

async function readResponse(response){

    const raw =
    await response.text();

    let data=null;

    try{

        data =
        raw ? JSON.parse(raw) : null;

    }catch(e){

        data=null;
    }

    return {

        ok:response.ok,

        status:response.status,

        raw,

        data,

        text:
        data
        ? JSON.stringify(data)
        : raw

    };
}


/* =========================================================
   SAFE SEED
========================================================= */

function createSafeSeed(sceneNumber){

    const timePart =
    Date.now() % MAX_SEED;

    const scenePart =
    sceneNumber * 100003;

    return Math.floor(
        (timePart + scenePart) %
        MAX_SEED
    );
}


/* =========================================================
   OAUTH
========================================================= */

function randomString(length=64){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    const arr =
    new Uint8Array(length);

    crypto.getRandomValues(arr);

    let result="";

    for(let i=0;i<arr.length;i++){

        result +=
        chars[arr[i] % chars.length];
    }

    return result;
}


async function sha256Base64Url(text){

    const data =
    new TextEncoder()
    .encode(text);

    const hash =
    await crypto.subtle
    .digest(
        "SHA-256",
        data
    );

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(hash)
        )
    )
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}


async function loginPollinations(){

    const verifier =
    randomString(64);

    const challenge =
    await sha256Base64Url(
        verifier
    );

    const state =
    randomString(32);

    localStorage.setItem(
        "mina_pkce_verifier",
        verifier
    );

    localStorage.setItem(
        "mina_oauth_state",
        state
    );

    const params =
    new URLSearchParams({

        client_id:CLIENT_ID,

        redirect_uri:REDIRECT_URI,

        response_type:"code",

        scope:"profile usage",

        code_challenge:challenge,

        code_challenge_method:"S256",

        state:state

    });

    location.href =
    AUTH_URL +
    "?" +
    params.toString();
}


async function exchangeCode(){

    const params =
    new URLSearchParams(
        location.search
    );

    const code =
    params.get("code");

    if(!code) return;

    const state =
    params.get("state");

    const savedState =
    localStorage.getItem(
        "mina_oauth_state"
    );

    if(
        state !== savedState
    ){

        status(
            "❌ OAuth güvenlik kontrolü başarısız."
        );

        return;
    }

    const verifier =
    localStorage.getItem(
        "mina_pkce_verifier"
    );

    try{

        status(
            "🔐 Pollinations bağlantısı kuruluyor..."
        );

        const response =
        await fetch(
            TOKEN_URL,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/x-www-form-urlencoded"
                },

                body:
                new URLSearchParams({

                    grant_type:
                    "authorization_code",

                    code,

                    client_id:
                    CLIENT_ID,

                    redirect_uri:
                    REDIRECT_URI,

                    code_verifier:
                    verifier

                })

            }
        );

        const result =
        await readResponse(
            response
        );

        if(!result.ok){

            throw new Error(
                cleanErrorText(
                    result.data?.error ||
                    result.raw ||
                    "OAuth hatası"
                )
            );
        }

        accessToken =
        result.data?.access_token;

        if(!accessToken){

            throw new Error(
                "Access token alınamadı."
            );
        }

        localStorage.setItem(
            "mina_pollinations_token",
            accessToken
        );

        history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        $("loginBtn").textContent =
        "✅ Pollinations Bağlı";

        status(
            "✅ Pollinations bağlantısı başarılı ❤️"
        );

    }catch(err){

        status(
            "❌ Pollinations bağlantı hatası:\n" +
            cleanErrorText(err.message)
        );
    }
}


/* =========================================================
   TOKEN
========================================================= */

function requireToken(){

    if(!accessToken){

        throw new Error(
            "Önce Pollinations bağlantısını kur."
        );
    }
}


/* =========================================================
   LANGUAGE
========================================================= */

function getLanguageName(){

    const lang =
    $("language").value;

    if(lang==="de")
        return "German";

    if(lang==="en")
        return "English";

    return "Turkish";
}


/* =========================================================
   STYLE
========================================================= */

function getStylePrompt(){

    const styles={

        cinematic:
        "cinematic realistic movie look",

        fantasy:
        "dark fantasy cinematic",

        scifi:
        "high quality science fiction cinematic",

        "3d":
        "high quality 3D animation",

        "2d":
        "high quality 2D animation",

        dark:
        "dark mysterious cinematic realistic",

        photo:
        "photorealistic documentary photography",

        action:
        "dynamic action movie cinematic",

        medieval:
        "historical medieval cinematic",

        epic:
        "epic cinematic movie scene"

    };

    return styles[
        $("style").value
    ] || styles.dark;
}


/* =========================================================
   WORD COUNT
========================================================= */

function wordCount(text){

    return String(text || "")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


/* =========================================================
   JSON PARSER
========================================================= */

function parseJsonSafe(text){

    let clean =
    String(text || "")
    .trim();

    clean =
    clean
    .replace(/```json/gi,"")
    .replace(/```/g,"")
    .trim();

    const first =
    clean.indexOf("{");

    const last =
    clean.lastIndexOf("}");

    if(
        first>=0 &&
        last>first
    ){

        clean =
        clean.slice(
            first,
            last+1
        );
    }

    try{

        return JSON.parse(clean);

    }catch(err){

        throw new Error(
            "AI JSON yerine geçersiz cevap verdi:\n" +
            cleanErrorText(text)
        );
    }
}


/* =========================================================
   POLLINATIONS TEXT REQUEST
========================================================= */

async function pollinationsTextRequest(
    systemPrompt,
    userPrompt
){

    requireToken();

    const response =
    await fetch(
        "https://gen.pollinations.ai/v1/chat/completions",
        {

            method:"POST",

            headers:{

                "Content-Type":
                "application/json",

                "Authorization":
                "Bearer " +
                accessToken

            },

            body:JSON.stringify({

                model:"openai",

                messages:[

                    {
                        role:"system",
                        content:
                        systemPrompt
                    },

                    {
                        role:"user",
                        content:
                        userPrompt
                    }

                ],

                max_tokens:16000,

                temperature:.8

            })

        }
    );

    const result =
    await readResponse(
        response
    );

    if(
        result.status===402
    ){

        throw new Error(
            "Pollinations hesabının kullanılabilir bakiyesi 0.0000. " +
            "Bu hesapla ücretli text API isteği yapılamıyor."
        );
    }

    if(!result.ok){

        throw new Error(
            "Text API HTTP " +
            result.status +
            ":\n" +
            cleanErrorText(
                result.raw
            )
        );
    }

    const content =
    result.data
    ?.choices?.[0]
    ?.message
    ?.content;

    if(!content){

        throw new Error(
            "Text API boş cevap döndürdü."
        );
    }

    return content;
}


/* =========================================================
   SCRIPT
========================================================= */

async function generateScript(){

    requireToken();

    const topic =
    $("topic").value.trim();

    if(!topic){

        alert(
            "Önce konu yaz canım ❤️"
        );

        return;
    }

    const minutes =
    Number(
        $("duration").value
    );

    const sceneCount =
    Number(
        $("sceneCount").value
    );

    const language =
    getLanguageName();

    const wpm =
    language==="German"
    ?130
    :language==="Turkish"
    ?140
    :145;

    const targetWords =
    Math.round(
        minutes*wpm
    );

    status(
        "🧠 Mina senaryoyu hazırlıyor...\n" +
        "Hedef: yaklaşık " +
        targetWords +
        " kelime"
    );

    progress(5);

    const systemPrompt=`

You are a professional YouTube mystery documentary narrator.

Language: ${language}

Create a factual, atmospheric and suspenseful narration.

Target length:
approximately ${targetWords} words.

Rules:
- Do not invent facts.
- Clearly identify uncertainty.
- Strong opening hook.
- Cinematic storytelling.
- Natural spoken language.
- Suitable for voice narration.
- No unnecessary headings.

Return ONLY valid JSON.

{
 "title":"...",
 "scenes":[
   {
     "narration":"...",
     "image_prompt":"..."
   }
 ]
}

Exactly ${sceneCount} scenes.
`;

    const userPrompt =
    "Topic:\n" +
    topic +
    "\n\nVisual style:\n" +
    getStylePrompt();

    const text =
    await pollinationsTextRequest(
        systemPrompt,
        userPrompt
    );

    const parsed =
    parseJsonSafe(text);

    if(
        !parsed.scenes ||
        !Array.isArray(
            parsed.scenes
        )
    ){

        throw new Error(
            "AI cevabında sahneler bulunamadı."
        );
    }

    project.title =
    parsed.title ||
    "Mina Video";

    project.script =
    text;

    project.scenes =
    parsed.scenes
    .slice(0,sceneCount)
    .map(scene=>({

        narration:
        String(
            scene.narration || ""
        ).trim(),

        image_prompt:
        String(
            scene.image_prompt || ""
        ).trim()

    }));

    let actualWords =
    project.scenes
    .map(
        s=>wordCount(
            s.narration
        )
    )
    .reduce(
        (a,b)=>a+b,
        0
    );

    if(
        actualWords <
        targetWords*.85
    ){

        status(
            "🧠 Senaryo kısa geldi.\n" +
            "Mina genişletmeyi deniyor..."
        );

        const expandPrompt=`

Expand this narration to approximately
${targetWords} words.

Language: ${language}

Keep the same story and facts.
Do not invent unsupported facts.

Return ONLY valid JSON:

{
 "scenes":[
  {
   "narration":"...",
   "image_prompt":"..."
  }
 ]
}

Exactly ${sceneCount} scenes.

CURRENT:
${JSON.stringify(
    project.scenes
)}

`;

        const expanded =
        await pollinationsTextRequest(
            "You are a professional documentary editor.",
            expandPrompt
        );

        const parsedExpanded =
        parseJsonSafe(
            expanded
        );

        if(
            parsedExpanded.scenes &&
            Array.isArray(
                parsedExpanded.scenes
            )
        ){

            project.scenes =
            parsedExpanded.scenes
            .slice(0,sceneCount)
            .map(scene=>({

                narration:
                String(
                    scene.narration || ""
                ).trim(),

                image_prompt:
                String(
                    scene.image_prompt || ""
                ).trim()

            }));
        }
    }

    actualWords =
    project.scenes
    .map(
        s=>wordCount(
            s.narration
        )
    )
    .reduce(
        (a,b)=>a+b,
        0
    );

    status(
        "✅ SENARYO HAZIR ❤️\n\n" +
        "Başlık: " +
        project.title +
        "\nKelime: " +
        actualWords +
        "\nSahne: " +
        project.scenes.length
    );

    progress(20);

    $("imageBtn").disabled=false;
}


/* =========================================================
   IMAGE
========================================================= */

function sleep(ms){

    return new Promise(
        resolve =>
        setTimeout(
            resolve,
            ms
        )
    );
}


async function fetchImageUrl(
    url,
    useAuth
){

    const options={};

    if(useAuth){

        options.headers={
            "Authorization":
            "Bearer " +
            accessToken
        };
    }

    return fetch(
        url,
        options
    );
}


async function generateOneImage(
    prompt,
    sceneNumber
){

    const seed =
    createSafeSeed(
        sceneNumber
    );

    const encoded =
    encodeURIComponent(
        prompt
    );

    /*
      Önce eski/public image endpoint'i.
      Sonra authenticated gen endpoint.
    */

    const attempts=[

        {
            name:
            "Public image",
            url:
            `https://image.pollinations.ai/prompt/${encoded}?width=1280&height=720&seed=${seed}&nologo=true`,
            auth:false
        },

        {
            name:
            "Gen image",
            url:
            `https://gen.pollinations.ai/image/${encoded}?model=flux&width=1280&height=720&seed=${seed}&nologo=true`,
            auth:true
        }

    ];

    let errors=[];

    for(
        const attempt
        of attempts
    ){

        try{

            status(
                "🖼️ Görsel deneniyor:\n" +
                attempt.name
            );

            const response =
            await fetchImageUrl(
                attempt.url,
                attempt.auth
            );

            if(response.ok){

                const blob =
                await response.blob();

                if(
                    blob.size>1000
                ){

                    return URL.createObjectURL(
                        blob
                    );
                }
            }

            const result =
            await readResponse(
                response
            );

            if(
                result.status===402
            ){

                errors.push(
                    attempt.name +
                    ": 402 — bakiye yetersiz"
                );

                continue;
            }

            if(
                result.status===429
            ){

                errors.push(
                    attempt.name +
                    ": 429 — kuyruk dolu"
                );

                await sleep(
                    5000
                );

                continue;
            }

            errors.push(
                attempt.name +
                ": HTTP " +
                result.status +
                " " +
                cleanErrorText(
                    result.raw
                )
            );

        }catch(err){

            errors.push(
                attempt.name +
                ": " +
                cleanErrorText(
                    err.message
                )
            );
        }
    }

    throw new Error(
        "Görsel üretilemedi.\n\n" +
        errors.join("\n")
    );
}


async function generateImages(){

    if(!project.scenes.length){

        alert(
            "Önce senaryo oluştur."
        );

        return;
    }

    $("imageBtn").disabled=true;

    project.images=[];

    const style =
    getStylePrompt();

    for(
        let i=0;
        i<project.scenes.length;
        i++
    ){

        const scene =
        project.scenes[i];

        const prompt =
        `${style},
${scene.image_prompt},
16:9 cinematic composition,
high detail,
dramatic lighting,
no text,
no subtitles,
no watermark`;

        status(
            `🖼️ Görsel ${i+1}/${project.scenes.length}\n\n` +
            "Mina görseli hazırlıyor..."
        );

        try{

            const url =
            await generateOneImage(
                prompt,
                i+1
            );

            project.images.push(
                url
            );

            progress(
                20 +
                (
                    (i+1) /

async function loadVoices(){

    try{

        const response =
        await fetch(
            "https://ahm7xmakki.com/api/voices"
        );

        if(!response.ok){

            throw new Error(
                "Ses listesi HTTP " +
                response.status
            );
        }

        const data =
        await response.json();

        voices =
        data.voices || [];

        chooseVoice();

    }catch(err){

        $("voiceStatus").textContent =
        "⚠️ Ses motoru yüklenemedi.";

        $("voiceInfo").textContent =
        err.message;
    }
}


function chooseVoice(){

    if(!voices.length){

        return;
    }

    const lang =
    $("language").value;

    const wanted={

        de:[
            "German",
            "Deutsch",
            "de-DE"
        ],

        tr:[
            "Turkish",
            "Türk",
            "tr-TR"
        ],

        en:[
            "English",
            "en-US"
        ]

    };

    let found =
    voices.find(
        v =>
        wanted[lang]
        .some(
            x =>
            String(
                v.language ||
                ""
            )
            .toLowerCase()
            .includes(
                x.toLowerCase()
            )
        )
    );

    if(!found){

        found =
        voices[0];
    }

    window.selectedVoice =
    found;

    window.selectedVoiceIndex =
    found.index;

    $("voiceStatus").innerHTML =
    "🎙️ <span class='success'>Ses hazır</span>";

    $("voiceInfo").textContent =
    `${found.name || "AI Voice"} — ` +
    `${found.language || ""}`;
}


/* =========================================================
   TTS CHUNK
========================================================= */

function splitText(
    text,
    max=1600
){

    const sentences =
    String(text)
    .replace(/\s+/g," ")
    .trim()
    .split(
        /(?<=[.!?。！？])\s+/
    );

    const chunks=[];

    let current="";

    for(
        const sentence
        of sentences
    ){

        if(
            current &&
            current.length +
            sentence.length +
            1 >
            max
        ){

            chunks.push(
                current.trim()
            );

            current="";
        }

        current +=
        " " +
        sentence;
    }

    if(
        current.trim()
    ){

        chunks.push(
            current.trim()
        );
    }

    return chunks;
}


async function synthesizeChunk(
    text,
    voiceIndex
){

    const response =
    await fetch(
        "https://ahm7xmakki.com/api/tts",
        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                voiceIndex,

                text,

                pitch:0,

                rate:-5

            })

        }
    );

    if(!response.ok){

        const result =
        await readResponse(
            response
        );

        throw new Error(
            "TTS HTTP " +
            result.status +
            "\n" +
            cleanErrorText(
                result.raw
            )
        );
    }

    return response.blob();
}


/* =========================================================
   NARRATION
========================================================= */

async function createNarration(){

    if(
        !project.scenes.length
    ){

        throw new Error(
            "Önce senaryo oluştur."
        );
    }

    chooseVoice();

    const voiceIndex =
    window.selectedVoiceIndex;

    if(
        voiceIndex === undefined ||
        voiceIndex === null
    ){

        throw new Error(
            "Uygun anlatıcı sesi bulunamadı."
        );
    }

    $("voiceBtn").disabled=true;

    project.audioBuffers=[];

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        await audioContext.resume();
    }

    for(
        let i=0;
        i<project.scenes.length;
        i++
    ){

        const narration =
        project.scenes[i]
        .narration;

        const chunks =
        splitText(
            narration
        );

        const blobs=[];

        for(
            let j=0;
            j<chunks.length;
            j++
        ){

            status(
                `🎙️ Ses oluşturuluyor\n` +
                `Sahne ${i+1}/${project.scenes.length}\n` +
                `Parça ${j+1}/${chunks.length}`
            );

            const blob =
            await synthesizeChunk(
                chunks[j],
                voiceIndex
            );

            blobs.push(
                blob
            );
        }

        const merged =
        new Blob(
            blobs,
            {
                type:
                "audio/mpeg"
            }
        );

        const arrayBuffer =
        await merged.arrayBuffer();

        const audioBuffer =
        await audioContext
        .decodeAudioData(
            arrayBuffer.slice(0)
        );

        project.audioBuffers.push(
            audioBuffer
        );

        progress(
            60 +
            (
                (i+1) /
                project.scenes.length
            ) * 20
        );
    }

    $("voiceStatus").innerHTML =
    "🎙️ <span class='success'>" +
    "Ses başarıyla hazırlandı!" +
    "</span>";

    $("voiceInfo").textContent =
    "Ses WebM içine eklenmeye hazır.";

    status(
        "✅ Gerçek anlatıcı sesi hazır! ❤️\n\n" +
        "🎬 Şimdi sesli WebM oluşturabiliriz."
    );

    $("videoBtn").disabled=false;
}

/* =========================================================
   SUBTITLES
========================================================= */

function subtitleChunks(text){

    const words =
    String(text)
    .trim()
    .split(/\s+/);

    const result=[];

    let current=[];

    for(
        const word
        of words
    ){

        current.push(word);

        if(
            current.length>=10 &&
            /[.!?,;:!?]$/.test(word)
        ){

            result.push(
                current.join(" ")
            );

            current=[];
        }

        if(
            current.length>=16
        ){

            result.push(
                current.join(" ")
            );

            current=[];
        }
    }

    if(current.length){

        result.push(
            current.join(" ")
        );
    }

    return result;
}


function buildSubtitleTimeline(){

    const totalSeconds =
    Number(
        $("duration").value
    ) * 60;

    const sceneDuration =
    totalSeconds /
    project.scenes.length;

    const timeline=[];

    for(
        let i=0;
        i<project.scenes.length;
        i++
    ){

        const chunks =
        subtitleChunks(
            project.scenes[i]
            .narration
        );

        const counts =
        chunks.map(
            wordCount
        );

        const totalWords =
        counts.reduce(
            (a,b)=>a+b,
            0
        );

        let t=0;

        for(
            let j=0;
            j<chunks.length;
            j++
        ){

            const dur =
            Math.max(
                3.2,
                sceneDuration *
                (
                    counts[j] /
                    Math.max(
                        1,
                        totalWords
                    )
                )
            );

            timeline.push({

                start:
                i *
                sceneDuration +
                t,

                end:
                Math.min(
                    (i+1) *
                    sceneDuration,
                    i *
                    sceneDuration +
                    t +
                    dur
                ),

                text:
                chunks[j]

            });

            t += dur;
        }
    }

    return timeline;
}


/* =========================================================
   DRAW SUBTITLE
========================================================= */

function drawSubtitle(
    ctx,
    text
){

    if(!text) return;

    ctx.font =
    "bold 31px Arial";

    const maxWidth =
    1050;

    const words =
    text.split(/\s+/);

    const lines=[];

    let line="";

    for(
        const word
        of words
    ){

        const test =
        line
        ? line +
          " " +
          word
        : word;

        if(
            ctx.measureText(
                test
            ).width >
            maxWidth
        ){

            if(line)
                lines.push(
                    line
                );

            line=word;

        }else{

            line=test;
        }
    }

    if(line)
        lines.push(line);

    const lineHeight=42;

    const boxHeight =
    lines.length *
    lineHeight +
    30;

    const y =
    720 -
    boxHeight -
    35;

    ctx.fillStyle =
    "rgba(0,0,0,.72)";

    ctx.fillRect(
        75,
        y,
        1130,
        boxHeight
    );

    ctx.fillStyle="#fff";

    ctx.textAlign="center";

    for(
        let i=0;
        i<lines.length;
        i++
    ){

        ctx.fillText(
            lines[i],
            640,
            y +
            35 +
            i *
            lineHeight
        );
    }

    ctx.textAlign="left";
}


/* =========================================================
   AUDIO SOURCES
========================================================= */

function prepareAudioSources(
    destination,
    sceneDuration
){

    const sources=[];

    for(
        let i=0;
        i<project.audioBuffers.length;
        i++
    ){

        const buffer =
        project.audioBuffers[i];

        const source =
        audioContext
        .createBufferSource();

        source.buffer =
        buffer;

        const rate =
        buffer.duration /
        sceneDuration;

        source.playbackRate.value =
        Math.max(
            .70,
            Math.min(
                1.45,
                rate
            )
        );

        const gain =
        audioContext
        .createGain();

        gain.gain.value=.95;

        source.connect(gain);

        gain.connect(
            destination
        );

        sources.push(
            source
        );
    }

    return sources;
}


/* =========================================================
   VIDEO
========================================================= */

async function createVideo(){

    if(
        !project.images.length
    ){

        throw new Error(
            "Önce görselleri oluştur."
        );
    }

    if(
        !project.audioBuffers.length
    ){

        throw new Error(
            "Önce sesi oluştur."
        );
    }

    $("videoBtn").disabled=true;

    const totalSeconds =
    Number(
        $("duration").value
    ) * 60;

    const sceneDuration =
    totalSeconds /
    project.images.length;

    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width=1280;
    canvas.height=720;

    const ctx =
    canvas.getContext("2d");

    const images=[];

    status(
        "🖼️ Görseller hazırlanıyor..."
    );

    for(
        const src
        of project.images
    ){

        images.push(
            await loadImage(src)
        );
    }

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    await audioContext.resume();

    const destination =
    audioContext
    .createMediaStreamDestination();

    const videoStream =
    canvas.captureStream(30);

    const combinedStream =
    new MediaStream();

    videoStream
    .getVideoTracks()
    .forEach(
        track =>
        combinedStream
        .addTrack(track)
    );

    destination
    .stream
    .getAudioTracks()
    .forEach(
        track =>
        combinedStream
        .addTrack(track)
    );

    let mime =
    "video/webm;codecs=vp9,opus";

    if(
        !MediaRecorder
        .isTypeSupported(mime)
    ){

        mime =
        "video/webm;codecs=vp8,opus";
    }

    if(
        !MediaRecorder
        .isTypeSupported(mime)
    ){

        mime="video/webm";
    }

    const recorder =
    new MediaRecorder(
        combinedStream,
        {

            mimeType:mime,

            videoBitsPerSecond:
            5000000,

            audioBitsPerSecond:
            128000

        }
    );

    const chunks=[];

    recorder.ondataavailable =
    event => {

        if(
            event.data &&
            event.data.size
        ){

            chunks.push(
                event.data
            );
        }
    };

    const stopped =
    new Promise(
        resolve =>
        recorder.onstop =
        resolve
    );

    const subtitles =
    buildSubtitleTimeline();

    const audioSources =
    prepareAudioSources(
        destination,
        sceneDuration
    );

    const startAt =
    audioContext.currentTime +
    .15;

    recorder.start(250);

    for(
        let i=0;
        i<audioSources.length;
        i++
    ){

        audioSources[i].start(
            startAt +
            i *
            sceneDuration
        );
    }

    const videoStart =
    performance.now();

    for(
        let i=0;
        i<images.length;
        i++
    ){

        const image =
        images[i];

        const sceneStart =
        performance.now();

        while(
            performance.now() -
            sceneStart <
            sceneDuration *
            1000
        ){

            ctx.fillStyle="#000";

            ctx.fillRect(
                0,
                0,
                1280,
                720
            );

            const scale =
            Math.max(
                1280 /
                image.width,

                720 /
                image.height
            );

            const w =
            image.width *
            scale;

            const h =
            image.height *
            scale;

            const x =
            (1280-w)/2;

            const y =
            (720-h)/2;

            ctx.drawImage(
                image,
                x,
                y,
                w,
                h
            );

            const elapsed =
            (
                performance.now() -
                videoStart
            ) / 1000;

            const subtitle =
            subtitles.find(
                s =>
                elapsed >= s.start &&
                elapsed < s.end
            );

            if(subtitle){

                drawSubtitle(
                    ctx,
                    subtitle.text
                );
            }

            progress(
                80 +
                Math.min(
                    19,
                    (
                        elapsed /
                        totalSeconds
                    ) * 19
                )
            );

            await new Promise(
                requestAnimationFrame
            );
        }
    }

    recorder.stop();

    await stopped;

    project.videoBlob =
    new Blob(
        chunks,
        {
            type:mime
        }
    );

    const url =
    URL.createObjectURL(
        project.videoBlob
    );

    $("video").src =
    url;

    $("downloadBtn")
    .disabled=false;

    progress(100);

    status(
        "🎉 VİDEO HAZIR! ❤️\n\n" +
        "🖼️ Görseller: OK\n" +
        "📝 Altyazı: OK\n" +
        "🎙️ Ses: OK\n" +
        "🔊 WebM ses kanalı: OK\n" +
        "🎬 Video: OK"
    );
}
