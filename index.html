<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080d18;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(850px,94%);
    margin:25px auto 50px;
}

h1{
    text-align:center;
    margin:0;
    font-size:32px;
}

.sub{
    text-align:center;
    color:#9ba8bd;
    margin:8px 0 25px;
}

.card{
    background:#121a2b;
    border:1px solid #293752;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,select,textarea{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #394867;
    background:#080e1c;
    color:white;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    padding:15px;
    margin-top:14px;
    border:0;
    border-radius:10px;
    background:#5865f2;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

.secondary{
    background:#293650;
}

.red{
    background:#963333;
}

.status{
    margin-top:15px;
    padding:14px;
    background:#080e1c;
    border-radius:10px;
    color:#cbd5e1;
    white-space:pre-wrap;
    line-height:1.5;
}

.progress{
    height:10px;
    background:#080e1c;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.bar{
    width:0%;
    height:100%;
    background:#5865f2;
    transition:.3s;
}

.scene{
    margin-top:16px;
    padding:12px;
    background:#080e1c;
    border:1px solid #293752;
    border-radius:14px;
}

.scene img{
    width:100%;
    max-height:400px;
    object-fit:cover;
    display:block;
    border-radius:10px;
}

.sceneTitle{
    font-weight:bold;
    margin-bottom:10px;
}

.sceneText{
    margin-top:10px;
    color:#b8c2d3;
    line-height:1.5;
}

.small{
    margin-top:8px;
    color:#7f8ca4;
    font-size:12px;
}

video{
    width:100%;
    border-radius:14px;
    background:#000;
}

.download{
    display:block;
    width:100%;
    margin-top:14px;
    padding:15px;
    background:#168b4b;
    color:white;
    text-decoration:none;
    text-align:center;
    border-radius:10px;
    font-weight:bold;
}

.hidden{
    display:none;
}

@media(max-width:600px){
    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Mina Video AI</h1>

<div class="sub">
KONU → FARKLI SAHNELER → GÖRSELLER → ALTYAZI → VİDEO
</div>


<div class="card">

<label>Konu</label>

<input
id="topic"
value="gizemli orman evi"
placeholder="Örneğin: Berlin'de gizemli kaybolma olayı"
>


<div class="row" style="margin-top:15px">

<div>

<label>Sahne sayısı</label>

<select id="count">
<option value="1">1</option>
<option value="4" selected>4</option>
<option value="5">5</option>
<option value="6">6</option>
</select>

</div>


<div>

<label>Sahne süresi</label>

<select id="duration">
<option value="4" selected>4 saniye</option>
<option value="5">5 saniye</option>
<option value="6">6 saniye</option>
<option value="8">8 saniye</option>
</select>

</div>

</div>


<label style="margin-top:15px">
Dil
</label>

<select id="language">

<option value="tr">
Türkçe
</option>

<option value="de" selected>
Almanca
</option>

<option value="en">
İngilizce
</option>

</select>


<button id="create">
🎬 VİDEO OLUŞTUR
</button>


<div class="progress">
<div id="bar" class="bar"></div>
</div>


<div id="status" class="status">
Hazır.
</div>

</div>


<div id="scriptCard" class="card hidden">

<h2>📝 Senaryo</h2>

<textarea id="script"></textarea>

<button id="speak" class="secondary">
🔊 SENARYOYU SESLENDİR
</button>

<button id="stop" class="red">
⏹️ DURDUR
</button>

</div>


<div id="sceneCard" class="card hidden">

<h2>🖼️ Sahneler</h2>

<div id="scenes"></div>

</div>


<div id="videoCard" class="card hidden">

<h2>🎥 Video</h2>

<video id="video" controls playsinline></video>

<a
id="download"
class="download"
download="mina-video.webm">
⬇️ VİDEOYU İNDİR
</a>

</div>

</div>


<script>

const topic =
document.getElementById("topic");

const count =
document.getElementById("count");

const duration =
document.getElementById("duration");

const language =
document.getElementById("language");

const create =
document.getElementById("create");

const status =
document.getElementById("status");

const bar =
document.getElementById("bar");

const scriptCard =
document.getElementById("scriptCard");

const script =
document.getElementById("script");

const sceneCard =
document.getElementById("sceneCard");

const scenesBox =
document.getElementById("scenes");

const videoCard =
document.getElementById("videoCard");

const video =
document.getElementById("video");

const download =
document.getElementById("download");

const speak =
document.getElementById("speak");

const stop =
document.getElementById("stop");


let scenes=[];
let videoURL=null;


/* =====================================================
   DURUM
===================================================== */

function setStatus(t){
    status.textContent=t;
}

function setProgress(n){
    bar.style.width=n+"%";
}

function wait(ms){
    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );
}


/* =====================================================
   FARKLI SAHNE KAVRAMLARI
===================================================== */

function getSceneSearches(topic){

    return [

        topic +
        " forest trees landscape",

        topic +
        " abandoned old house building",

        topic +
        " night dark investigation",

        topic +
        " mysterious object discovery",

        topic +
        " person searching forest",

        topic +
        " historical mystery location"

    ];

}


/* =====================================================
   SENARYO
===================================================== */

function makeScript(topic,n,lang){

    const tr=[

        `Her şey ${topic} ile başladı. İlk başta kimse bunun sıradan bir olay olmadığını düşünmedi.`,

        `Ancak terk edilmiş evin çevresinde yapılan incelemelerde garip ayrıntılar ortaya çıktı.`,

        `Gece çöktüğünde araştırmacılar daha önce fark edilmeyen bazı izlerle karşılaştı.`,

        `Bulunan gizemli nesne olayın düşündüklerinden çok daha eski olduğunu gösteriyordu.`,

        `Araştırma derinleştikçe olayın geçmişte yaşanan başka bir gizemle bağlantısı ortaya çıktı.`,

        `Ve sonunda herkesin aklında aynı soru kaldı: O gece gerçekte ne olmuştu?`

    ];

    const de=[

        `Alles begann mit ${topic}. Zunächst dachte niemand, dass dies ein gewöhnlicher Fall sein würde.`,

        `Doch bei der Untersuchung des verlassenen Hauses tauchten seltsame Hinweise auf.`,

        `Als die Nacht hereinbrach, entdeckten die Ermittler Spuren, die zuvor niemand bemerkt hatte.`,

        `Ein mysteriöser Gegenstand zeigte, dass die Geschichte viel älter war als gedacht.`,

        `Je tiefer die Untersuchung ging, desto deutlicher wurde die Verbindung zu einem alten Geheimnis.`,

        `Am Ende blieb nur eine Frage: Was war in dieser Nacht wirklich passiert?`

    ];

    const en=[

        `Everything began with ${topic}. At first, nobody thought it was an ordinary mystery.`,

        `But strange clues appeared during the investigation of the abandoned house.`,

        `When night fell, investigators discovered traces that nobody had noticed before.`,

        `A mysterious object revealed that the story was much older than expected.`,

        `The deeper the investigation went, the clearer the connection to an old mystery became.`,

        `In the end, only one question remained: What really happened that night?`

    ];

    const source =
        lang==="de" ? de :
        lang==="en" ? en :
        tr;

    return source.slice(0,n);
}


/* =====================================================
   WIKIMEDIA
===================================================== */

async function searchImages(query){

    const api =
    "https://commons.wikimedia.org/w/api.php";


    const params =
    new URLSearchParams({

        action:"query",

        format:"json",

        formatversion:"2",

        generator:"search",

        gsrsearch:query,

        gsrnamespace:"6",

        gsrlimit:"30",

        prop:"imageinfo",

        iiprop:"url|mime",

        iiurlwidth:"1000",

        origin:"*"

    });


    const response =
    await fetch(
        api+"?"+params.toString()
    );


    if(!response.ok){
        throw new Error(
            "Görsel arama HTTP "+
            response.status
        );
    }


    const data =
    await response.json();


    if(
        !data.query ||
        !data.query.pages
    ){
        return [];
    }


    const pages =
    data.query.pages;


    const output=[];


    for(
        const page of pages
    ){

        if(
            !page.imageinfo ||
            !page.imageinfo[0]
        ){
            continue;
        }


        const info =
        page.imageinfo[0];


        if(
            !info.mime ||
            !info.mime.startsWith("image/")
        ){
            continue;
        }


        const url =
        info.thumburl ||
        info.url;


        if(!url){
            continue;
        }


        output.push({

            title:
            (page.title||"")
            .replace(/^File:/,""),

            url:url,

            original:
            info.url||url

        });

    }


    return output;
}


/* =====================================================
   FARKLI GÖRSEL SEÇ
===================================================== */

function chooseUnused(results,used){

    /*
      İlk 10 sonuçtan rastgele birini seç.
      Ama daha önce kullanılan URL'yi seçme.
    */

    const candidates =
    results.filter(
        item=>!used.has(item.url)
    );


    if(!candidates.length){
        return null;
    }


    const limit =
    Math.min(
        candidates.length,
        10
    );


    const index =
    Math.floor(
        Math.random()*limit
    );


    return candidates[index];
}


/* =====================================================
   GÖRSELİ YÜKLE
===================================================== */

function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
            new Image();

            img.crossOrigin="anonymous";

            img.onload=
            ()=>resolve(img);

            img.onerror=
            ()=>reject(
                new Error(
                    "Görsel yüklenemedi"
                )
            );

            img.src=url;

        }
    );
}


/* =====================================================
   SAHNELERİ OLUŞTUR
===================================================== */

async function buildScenes(){

    const name =
    topic.value.trim();

    const n =
    Number(count.value);

    const lang =
    language.value;


    const texts =
    makeScript(
        name,
        n,
        lang
    );


    const searches =
    getSceneSearches(name);


    const used =
    new Set();


    scenes=[];

    scenesBox.innerHTML="";


    sceneCard.classList.remove(
        "hidden"
    );


    for(
        let i=0;
        i<n;
        i++
    ){

        const search =
        searches[i];


        setStatus(
            "🔎 SAHNE "+
            (i+1)+
            "/"+
            n+
            "\n\n"+
            "Farklı görsel aranıyor:\n"+
            search
        );


        setProgress(
            10+(i/n)*45
        );


        let results=[];


        try{

            results =
            await searchImages(
                search
            );

        }catch(error){

            console.error(error);

        }


        /*
          Eğer özel aramada sonuç yoksa
          daha genel arama.
        */

        if(!results.length){

            try{

                results =
                await searchImages(
                    name
                );

            }catch(error){}

        }


        /*
          Daha önce kullanılan görseli
          kesinlikle seçme.
        */

        let selected =
        chooseUnused(
            results,
            used
        );


        /*
          Aynı aramada yeni sonuç yoksa
          farklı bir offset arama yap.
        */

        if(!selected){

            try{

                const extra =
                await searchImages(
                    search+
                    " landscape photograph"
                );


                selected =
                chooseUnused(
                    extra,
                    used
                );

            }catch(error){}

        }


        if(!selected){

            setStatus(
                "⚠️ SAHNE "+
                (i+1)+
                " için farklı görsel bulunamadı."
            );

            continue;

        }


        used.add(
            selected.url
        );


        const scene={

            url:selected.url,

            original:
            selected.original,

            title:
            selected.title,

            text:
            texts[i],

            image:null

        };


        /*
          Görseli canvas için yükle.
        */

        try{

            scene.image =
            await loadImage(
                selected.url
            );

        }catch(error){

            console.warn(
                error
            );

        }


        /*
          Sahneyi kaydet.
        */

        scenes.push(scene);


        /*
          Ekrana göster.
        */

        const box =
        document.createElement(
            "div"
        );

        box.className="scene";


        const title =
        document.createElement(
            "div"
        );

        title.className=
        "sceneTitle";

        title.textContent=
        "🎬 SAHNE "+
        scenes.length;


        const img =
        document.createElement(
            "img"
        );

        img.src=
        selected.url;

        img.alt=
        selected.title;


        const txt =
        document.createElement(
            "div"
        );

        txt.className=
        "sceneText";

        txt.textContent=
        texts[i];


        const small =
        document.createElement(
            "div"
        );

        small.className="small";

        small.textContent=
        "Görsel: "+
        selected.title;


        box.appendChild(title);

        box.appendChild(img);

        box.appendChild(txt);

        box.appendChild(small);


        scenesBox.appendChild(box);


        await wait(600);

    }


    if(!scenes.length){

        throw new Error(
            "Hiç görsel bulunamadı."
        );

    }


    setStatus(
        "✅ "+
        scenes.length+
        " farklı sahne hazır.\n\n"+
        "Şimdi video oluşturuluyor..."
    );


    setProgress(55);

}


/* =====================================================
   GÖRSELİ CANVAS'A SIĞDIR
===================================================== */

function drawCover(
    ctx,
    img,
    w,
    h
){

    const ratio =
    Math.max(
        w/img.width,
        h/img.height
    );


    const nw =
    img.width*ratio;

    const nh =
    img.height*ratio;


    const x =
    (w-nw)/2;

    const y =
    (h-nh)/2;


    ctx.drawImage(
        img,
        x,
        y,
        nw,
        nh
    );

}


/* =====================================================
   ALTYAZI
===================================================== */

function drawSubtitle(
    ctx,
    text,
    w,
    h
){

    ctx.font=
    "bold 30px Arial";


    const words =
    text.split(" ");


    const lines=[];

    let line="";


    for(
        const word of words
    ){

        const test =
        line
        ? line+" "+word
        : word;


        if(
            ctx.measureText(test).width >
            w-100
        ){

            lines.push(line);

            line=word;

        }else{

            line=test;

        }

    }


    if(line){
        lines.push(line);
    }


    const lh=40;

    const boxH=
    lines.length*lh+35;


    const y=
    h-boxH-25;


    ctx.fillStyle=
    "rgba(0,0,0,.72)";


    ctx.fillRect(
        25,
        y,
        w-50,
        boxH
    );


    ctx.fillStyle="#fff";

    ctx.textAlign="center";

    ctx.textBaseline="top";


    lines.forEach(
        (line,i)=>{

            ctx.fillText(
                line,
                w/2,
                y+17+i*lh
            );

        }
    );

}


/* =====================================================
   VİDEO
===================================================== */

async function makeVideo(){

    const usable =
    scenes.filter(
        scene=>scene.image
    );


    if(!usable.length){

        setStatus(
            "✅ Görseller bulundu fakat tarayıcı "+
            "video için görsellere erişemedi."
        );

        return;

    }


    const canvas =
    document.createElement(
        "canvas"
    );


    canvas.width=1280;

    canvas.height=720;


    const ctx =
    canvas.getContext("2d");


    const stream =
    canvas.captureStream(30);


    let type="video/webm";


    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9"
        )
    ){

        type=
        "video/webm;codecs=vp9";

    }


    const recorder =
    new MediaRecorder(
        stream,
        {
            mimeType:type,
            videoBitsPerSecond:5000000
        }
    );


    const chunks=[];


    recorder.ondataavailable=
    e=>{

        if(e.data.size){
            chunks.push(e.data);
        }

    };


    const stopped =
    new Promise(
        resolve=>{
            recorder.onstop=
            resolve;
        }
    );


    recorder.start(200);


    const seconds =
    Number(duration.value);


    for(
        let s=0;
        s<usable.length;
        s++
    ){

        const scene =
        usable[s];


        const frames =
        seconds*30;


        for(
            let frame=0;
            frame<frames;
            frame++
        ){

            ctx.fillStyle="#000";

            ctx.fillRect(
                0,
                0,
                1280,
                720
            );


            /*
              Her sahnede hafif zoom
            */

            ctx.save();


            const zoom =
            1+
            (frame/frames)*0.035;


            ctx.translate(
                640,
                360
            );


            ctx.scale(
                zoom,
                zoom
            );


            ctx.translate(
                -640,
                -360
            );


            drawCover(
                ctx,
                scene.image,
                1280,
                720
            );


            ctx.restore();


            /*
              Üst başlık
            */

            ctx.fillStyle=
            "rgba(0,0,0,.5)";


            ctx.fillRect(
                0,
                0,
                1280,
                70
            );


            ctx.fillStyle="#fff";

            ctx.font=
            "bold 28px Arial";

            ctx.textAlign="left";

            ctx.textBaseline="middle";


            ctx.fillText(
                "MYSTERY NACHT",
                30,
                35
            );


            ctx.textAlign="right";


            ctx.fillText(
                (s+1)+
                "/"+
                usable.length,
                1250,
                35
            );


            /*
              Altyazı
            */

            drawSubtitle(
                ctx,
                scene.text,
                1280,
                720
            );


            const percent =
            55+
            (
                (
                    s+
                    frame/frames
                )/
                usable.length
            )*42;


            setProgress(percent);


            await wait(
                1000/30
            );

        }

    }


    recorder.stop();


    await stopped;


    const blob =
    new Blob(
        chunks,
        {
            type:"video/webm"
        }
    );


    if(videoURL){

        URL.revokeObjectURL(
            videoURL
        );

    }


    videoURL =
    URL.createObjectURL(
        blob
    );


    video.src=
    videoURL;


    download.href=
    videoURL;


    videoCard.classList.remove(
        "hidden"
    );


    setProgress(100);


    setStatus(
        "✅ VİDEO HAZIR!\n\n"+
        "Bu sürümde her sahne farklı "+
        "arama sorgusundan seçildi."
    );

}


/* =====================================================
   ANA BUTON
===================================================== */

create.onclick=
async function(){

    const value =
    topic.value.trim();


    if(!value){

        setStatus(
            "❌ Konu yaz."
        );

        return;

    }


    create.disabled=true;


    scriptCard.classList.remove(
        "hidden"
    );


    videoCard.classList.add(
        "hidden"
    );


    try{

        /*
          Senaryo
        */

        const text =
        makeScript(
            value,
            Number(count.value),
            language.value
        );


        script.value =
        text.join(
            "\n\n"
        );


        setProgress(5);


        /*
          Farklı görseller
        */

        await buildScenes();


        /*
          Video
        */

        await makeVideo();


    }catch(error){

        console.error(error);


        setStatus(
            "❌ HATA\n\n"+
            error.message
        );

    }finally{

        create.disabled=false;

    }

};


/* =====================================================
   SES
===================================================== */

speak.onclick=
function(){

    if(
        !("speechSynthesis" in window)
    ){

        setStatus(
            "❌ Tarayıcı seslendirmeyi desteklemiyor."
        );

        return;

    }


    speechSynthesis.cancel();


    const u =
    new SpeechSynthesisUtterance(
        script.value
    );


    if(language.value==="de"){
        u.lang="de-DE";
    }

    else if(language.value==="en"){
        u.lang="en-US";
    }

    else{
        u.lang="tr-TR";
    }


    u.rate=.92;

    u.pitch=1;

    u.volume=1;


    speechSynthesis.speak(u);


    setStatus(
        "🔊 Senaryo seslendiriliyor..."
    );

};


stop.onclick=
function(){

    speechSynthesis.cancel();

    setStatus(
        "⏹️ Ses durduruldu."
    );

};


setStatus(
    "Hazır.\n\n"+
    "Konu yazıp VİDEO OLUŞTUR'a bas."
);

</script>

</body>
</html>
