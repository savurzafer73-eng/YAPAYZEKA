<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina Video AI V6.1</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0d12;
    color:#f2f2f2;
}

header{
    padding:18px;
    background:linear-gradient(135deg,#171b27,#0d1018);
    border-bottom:1px solid #292f3d;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:7px 0 0;
    color:#9da7ba;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:18px;
}

.panel{
    background:#121620;
    border:1px solid #282f3c;
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
}

h2{
    margin-top:0;
    font-size:19px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#b8c0d0;
    font-size:14px;
}

input,
textarea,
select{
    width:100%;
    background:#090c12;
    color:#fff;
    border:1px solid #303747;
    border-radius:9px;
    padding:11px;
    outline:none;
    font-family:inherit;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#6575ff;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    cursor:pointer;
    color:white;
    background:#4d5cff;
    font-weight:bold;
    margin:4px;
}

button:hover{
    filter:brightness(1.12);
}

button.secondary{
    background:#252c39;
}

button.green{
    background:#16865a;
}

button.red{
    background:#a83245;
}

button.orange{
    background:#a66a16;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:12px;
}

#status{
    margin-top:12px;
    padding:11px;
    border-radius:8px;
    background:#080a0f;
    color:#8fe0bd;
    min-height:40px;
}

.scenes{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.scene{
    background:#0c1018;
    border:1px solid #2b3240;
    border-radius:13px;
    padding:14px;
}

.scene h3{
    margin:0 0 12px;
    color:#fff;
}

.scene-number{
    display:inline-block;
    padding:4px 8px;
    border-radius:6px;
    background:#4d5cff;
    margin-right:6px;
    font-size:12px;
}

.subtitle-box{
    background:#111a18;
    border:1px solid #285744;
    border-radius:9px;
    padding:10px;
    margin:10px 0;
}

.subtitle-box strong{
    color:#75e0aa;
    display:block;
    margin-bottom:7px;
    font-size:12px;
}

.scene-image{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#07090d;
    border-radius:9px;
    display:block;
    margin-bottom:10px;
}

.viewer{
    position:relative;
    width:100%;
    max-width:900px;
    margin:auto;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
    border-radius:12px;
    border:1px solid #303747;
}

.viewer img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .4s ease;
}

.viewer-subtitle{
    position:absolute;
    left:5%;
    right:5%;
    bottom:7%;
    padding:10px 15px;
    text-align:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    line-height:1.35;
    text-shadow:
        2px 2px 3px #000,
        -1px -1px 2px #000;
    background:rgba(0,0,0,.35);
    border-radius:8px;
}

.viewer-info{
    text-align:center;
    margin-top:10px;
    color:#9da7ba;
}

.progress{
    width:100%;
    height:8px;
    background:#202632;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.progress div{
    height:100%;
    width:0%;
    background:#4d5cff;
    transition:width .2s;
}

.small{
    font-size:12px;
    color:#8f99ab;
}

.file{
    margin-top:7px;
}

@media(max-width:850px){
    .grid,
    .scenes{
        grid-template-columns:1fr;
    }

    .viewer-subtitle{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎬 Mina Video AI V6.1</h1>
    <p>Stabil Almanca gizem filmi stüdyosu — 6 sahne</p>
</header>

<div class="container">

    <!-- PROJE -->
    <div class="panel">

        <h2>🎞️ Film Projesi</h2>

        <div class="grid">

            <div>
                <label>Film adı</label>
                <input id="filmName" value="Das Haus am Waldrand">
            </div>

            <div>
                <label>Dil</label>
                <select id="language">
                    <option value="de-DE">Deutsch</option>
                    <option value="tr-TR">Türkçe</option>
                    <option value="en-US">English</option>
                </select>
            </div>

        </div>

        <br>

        <label>Hikâye</label>

        <textarea id="story">Anna fährt um 23:47 Uhr durch einen dunklen Wald. Am Waldrand entdeckt sie ein verlassenes Haus. Plötzlich geht im oberen Fenster ein Licht an. Im Haus hört sie Schritte. Eine dunkle Gestalt erscheint.</textarea>

        <div class="toolbar">
            <button onclick="createStoryScenes()">🔄 6 Sahneyi Hazırla</button>
            <button class="green" onclick="generateAllImages()">🖼️ Tüm AI Görsellerini Oluştur</button>
            <button class="secondary" onclick="saveProject()">💾 Kaydet</button>
            <button class="secondary" onclick="loadProject()">📂 Yükle</button>
            <button class="red" onclick="resetProject()">♻️ Sıfırla</button>
        </div>

        <div id="status">Hazır. Önce 6 sahneyi hazırlayabilirsin.</div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

    </div>


    <!-- AI AYARLARI -->
    <div class="panel">

        <h2>🤖 AI Görsel Ayarları</h2>

        <div class="grid">

            <div>
                <label>AI Model</label>

                <select id="aiModel">
                    <option value="flux">FLUX</option>
                    <option value="zimage">ZImage</option>
                    <option value="klein">Klein</option>
                </select>
            </div>

            <div>
                <label>Görsel boyutu</label>

                <select id="imageSize">
                    <option value="1280x720">1280 × 720</option>
                    <option value="1024x576">1024 × 576</option>
                    <option value="960x540">960 × 540</option>
                    <option value="768x432">768 × 432</option>
                </select>
            </div>

        </div>

        <br>

        <label>Görsel stil</label>

        <select id="style">
            <option value="cinematic dark mystery film">Cinematic Dark Mystery Film</option>
            <option value="realistic cinematic">Realistic Cinematic</option>
            <option value="dark horror thriller">Dark Horror Thriller</option>
            <option value="photorealistic night scene">Photorealistic Night Scene</option>
        </select>

        <p class="small">
            ℹ️ V5.2'de çalışan anahtarsız AI görsel sistemi korunmuştur.
        </p>

    </div>


    <!-- SAHNELER -->
    <div class="panel">

        <h2>🎬 Sahne Listesi</h2>

        <div id="scenes" class="scenes"></div>

    </div>


    <!-- İZLEYİCİ -->
    <div class="panel">

        <h2>▶️ Film Önizleme</h2>

        <div class="viewer">

            <img id="viewerImage" src="" alt="Sahne">

            <div id="viewerSubtitle" class="viewer-subtitle">
                Sahne altyazısı burada görünecek.
            </div>

        </div>

        <div id="viewerInfo" class="viewer-info">
            Sahne 1 / 6
        </div>

        <div class="toolbar" style="justify-content:center">

            <button class="secondary" onclick="previousScene()">
                ◀ Önceki
            </button>

            <button onclick="playCurrentScene()">
                ▶ Sahneyi Oynat
            </button>

            <button class="green" onclick="playFilm()">
                🎬 Filmi Oynat
            </button>

            <button class="orange" onclick="stopFilm()">
                ⏹ Durdur
            </button>

            <button class="secondary" onclick="nextScene()">
                Sonraki ▶
            </button>

        </div>

        <div class="toolbar" style="justify-content:center">

            <button onclick="speakCurrentScene()">
                🔊 Altyazıyı Seslendir
            </button>

            <button class="red" onclick="stopSpeech()">
                🔇 Sesi Durdur
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   MINA VIDEO AI V6.1
   STABİL ALTYAZI SİSTEMİ
========================================================= */


/* ---------------------------------------------------------
   POLLINATIONS
--------------------------------------------------------- */

const AI_BASE = "https://gen.pollinations.ai/image/";


/* ---------------------------------------------------------
   SABİT 6 SAHNE
   ÖNEMLİ:
   HER SAHNENİN ALTYAZISI AYRI.
   HİKÂYE METNİ BU ALTYAZILARI EZEMEZ.
--------------------------------------------------------- */

const FIXED_SCENES = [

    {
        title:"Die Fahrt",
        subtitle:"Es war 23 Uhr 47. Anna fuhr allein durch den dunklen Wald. Seit Minuten war kein anderes Auto zu sehen.",
        prompt:"A young German woman named Anna driving alone through a dark forest at 23:47, mysterious road, night, cinematic thriller atmosphere, realistic, headlights, fog, dark blue tones"
    },

    {
        title:"Das alte Haus",
        subtitle:"Nach einer Weile entdeckte Anna ein altes verlassenes Haus am Waldrand. Es wirkte, als wäre dort seit Jahren niemand gewesen.",
        prompt:"Anna standing in front of an abandoned old house at the edge of a dark forest, broken windows, mysterious atmosphere, fog, cinematic German mystery thriller, realistic night photography"
    },

    {
        title:"Das Fenster",
        subtitle:"Plötzlich ging im oberen Fenster ein Licht an. Anna blieb stehen. Sie wusste genau, dass das Haus keinen Strom haben sollte.",
        prompt:"An old abandoned house in a dark forest, one single upper window suddenly glowing with warm light, Anna watching from outside, mysterious fog, cinematic thriller, realistic"
    },

    {
        title:"Die Schritte",
        subtitle:"Anna öffnete vorsichtig die Tür. Im Haus war es vollkommen still. Dann hörte sie plötzlich langsame Schritte über ihrem Kopf.",
        prompt:"Anna cautiously entering an abandoned dark house, old wooden interior, staircase, darkness, mysterious shadows, cinematic horror thriller, realistic film still"
    },

    {
        title:"Die Tür",
        subtitle:"Anna ging langsam den dunklen Flur entlang. Am Ende begann eine alte Tür ganz von allein, sich langsam zu öffnen.",
        prompt:"Anna walking slowly through a dark abandoned hallway, an old wooden door opening by itself at the end of the corridor, terrifying mysterious atmosphere, cinematic realistic thriller"
    },

    {
        title:"Die Gestalt",
        subtitle:"Am Ende des Flurs erschien eine dunkle Gestalt. Anna konnte kein Gesicht erkennen. Dann flüsterte eine Stimme leise ihren Namen.",
        prompt:"A mysterious dark human silhouette standing at the end of an abandoned hallway, face completely hidden in darkness, Anna frightened in foreground, cinematic supernatural mystery thriller, realistic"
    }

];


/* ---------------------------------------------------------
   SAHNE VERİSİ
--------------------------------------------------------- */

let scenes = [];
let currentScene = 0;
let filmPlaying = false;
let filmTimer = null;
let speechUtterance = null;


/* ---------------------------------------------------------
   YARDIMCI
--------------------------------------------------------- */

function status(message){

    const el = document.getElementById("status");

    if(el){
        el.textContent = message;
    }

}


function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ---------------------------------------------------------
   SAHNELERİ OLUŞTUR
--------------------------------------------------------- */

function createStoryScenes(){

    stopFilm();
    stopSpeech();

    scenes = [];

    for(let i=0;i<FIXED_SCENES.length;i++){

        const base = FIXED_SCENES[i];

        scenes.push({

            id:i+1,

            title:base.title,

            narration:base.subtitle,

            prompt:base.prompt,

            image:"",

            imageName:"",

            audio:"",

            audioName:"",

            motion:"zoom-in",

            duration:6

        });

    }

    currentScene = 0;

    renderScenes();
    updateViewer();

    status("✅ 6 sahne hazırlandı. Her sahnenin altyazısı birbirinden farklı.");

}


/* ---------------------------------------------------------
   SAHNE KARTLARINI ÇİZ
--------------------------------------------------------- */

function renderScenes(){

    const container = document.getElementById("scenes");

    container.innerHTML = "";

    scenes.forEach((scene,index)=>{

        const card = document.createElement("div");

        card.className = "scene";

        card.innerHTML = `

            <h3>
                <span class="scene-number">
                    SAHNE ${index+1}
                </span>
                ${escapeHTML(scene.title)}
            </h3>

            <label>🖼️ Sahne görseli</label>

            <img
                id="sceneImage${index}"
                class="scene-image"
                src="${scene.image || ""}"
                alt=""
            >

            <input
                class="file"
                type="file"
                accept="image/*"
                onchange="uploadImage(event,${index})"
            >

            <br>

            <button onclick="generateImage(${index})">
                🤖 AI Görsel Oluştur
            </button>

            <div class="subtitle-box">

                <strong>🔒 BU SAHNENİN ALTYAZISI</strong>

                <textarea
                    id="subtitle${index}"
                    onchange="changeSubtitle(${index},this.value)"
                >${escapeHTML(scene.narration)}</textarea>

            </div>

            <label>🎥 AI Görsel Promptu</label>

            <textarea
                id="prompt${index}"
                onchange="changePrompt(${index},this.value)"
            >${escapeHTML(scene.prompt)}</textarea>

            <div class="grid">

                <div>

                    <label>Hareket</label>

                    <select onchange="changeMotion(${index},this.value)">

                        <option value="static" ${scene.motion==="static"?"selected":""}>
                            Sabit
                        </option>

                        <option value="zoom-in" ${scene.motion==="zoom-in"?"selected":""}>
                            Yaklaş
                        </option>

                        <option value="zoom-out" ${scene.motion==="zoom-out"?"selected":""}>
                            Uzaklaş
                        </option>

                        <option value="pan-left" ${scene.motion==="pan-left"?"selected":""}>
                            Sola Kaydır
                        </option>

                        <option value="pan-right" ${scene.motion==="pan-right"?"selected":""}>
                            Sağa Kaydır
                        </option>

                    </select>

                </div>

                <div>

                    <label>Süre</label>

                    <select onchange="changeDuration(${index},this.value)">

                        <option value="4" ${scene.duration==4?"selected":""}>
                            4 saniye
                        </option>

                        <option value="6" ${scene.duration==6?"selected":""}>
                            6 saniye
                        </option>

                        <option value="8" ${scene.duration==8?"selected":""}>
                            8 saniye
                        </option>

                        <option value="10" ${scene.duration==10?"selected":""}>
                            10 saniye
                        </option>

                    </select>

                </div>

            </div>

            <br>

            <label>🔊 Sahne ses dosyası</label>

            <input
                class="file"
                type="file"
                accept="audio/*"
                onchange="uploadAudio(event,${index})"
            >

            <div class="small">
                ${scene.audioName ? "Ses: "+escapeHTML(scene.audioName) : "Ses dosyası seçilmedi."}
            </div>

        `;

        container.appendChild(card);

    });

}


/* ---------------------------------------------------------
   ALTYAZI DEĞİŞTİR
--------------------------------------------------------- */

function changeSubtitle(index,value){

    if(!scenes[index]) return;

    scenes[index].narration = value;

    if(currentScene === index){

        updateViewer();

    }

}


/* ---------------------------------------------------------
   PROMPT DEĞİŞTİR
--------------------------------------------------------- */

function changePrompt(index,value){

    if(!scenes[index]) return;

    scenes[index].prompt = value;

}


/* ---------------------------------------------------------
   HAREKET
--------------------------------------------------------- */

function changeMotion(index,value){

    if(!scenes[index]) return;

    scenes[index].motion = value;

    if(currentScene === index){

        updateViewer();

    }

}


/* ---------------------------------------------------------
   SÜRE
--------------------------------------------------------- */

function changeDuration(index,value){

    if(!scenes[index]) return;

    scenes[index].duration = Number(value);

}


/* ---------------------------------------------------------
   GÖRSEL YÜKLE
--------------------------------------------------------- */

function uploadImage(event,index){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

        scenes[index].image = reader.result;

        scenes[index].imageName = file.name;

        const img = document.getElementById("sceneImage"+index);

        if(img){

            img.src = reader.result;

        }

        if(currentScene === index){

            updateViewer();

        }

        status("✅ Sahne "+(index+1)+" görseli yüklendi.");

    };

    reader.readAsDataURL(file);

}


/* ---------------------------------------------------------
   SES YÜKLE
--------------------------------------------------------- */

function uploadAudio(event,index){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

        scenes[index].audio = reader.result;

        scenes[index].audioName = file.name;

        status("🔊 Sahne "+(index+1)+" ses dosyası yüklendi.");

    };

    reader.readAsDataURL(file);

}


/* ---------------------------------------------------------
   AI URL
--------------------------------------------------------- */

function makeAIUrl(prompt){

    const size =
        document.getElementById("imageSize").value || "1280x720";

    const parts = size.split("x");

    const width = parts[0];
    const height = parts[1];

    const model =
        document.getElementById("aiModel").value || "flux";

    const style =
        document.getElementById("style").value ||
        "cinematic dark mystery film";

    const finalPrompt =
        prompt +
        ", " +
        style +
        ", high quality cinematic film still, 16:9";

    return AI_BASE +
        encodeURIComponent(finalPrompt) +
        "?model=" +
        encodeURIComponent(model) +
        "&width=" +
        width +
        "&height=" +
        height +
        "&nologo=true" +
        "&enhance=true" +
        "&safe=true" +
        "&seed=" +
        Math.floor(Math.random()*999999);

}


/* ---------------------------------------------------------
   AI GÖRSEL
--------------------------------------------------------- */

async function generateImage(index){

    if(!scenes[index]) return;

    const scene = scenes[index];

    status("⏳ Sahne "+(index+1)+" için AI görsel oluşturuluyor...");

    try{

        const url = makeAIUrl(scene.prompt);

        const response = await fetch(url);

        if(!response.ok){

            throw new Error(
                "AI servis HTTP "+response.status
            );

        }

        const blob = await response.blob();

        if(!blob.type.startsWith("image/")){

            throw new Error("AI görsel yerine farklı bir veri döndürdü.");

        }

        const reader = new FileReader();

        reader.onload = function(){

            scene.image = reader.result;
            scene.imageName = "AI_Sahne_"+(index+1)+".png";

            const img =
                document.getElementById("sceneImage"+index);

            if(img){

                img.src = scene.image;

            }

            if(currentScene === index){

                updateViewer();

            }

            status(
                "✅ Sahne "+(index+1)+" AI görseli hazır."
            );

        };

        reader.readAsDataURL(blob);

    }catch(error){

        console.error(error);

        status(
            "❌ Sahne "+(index+1)+" AI görseli oluşturulamadı: "+
            error.message
        );

    }

}


/* ---------------------------------------------------------
   TÜM GÖRSELLER
--------------------------------------------------------- */

async function generateAllImages(){

    if(scenes.length !== 6){

        createStoryScenes();

    }

    status("⏳ 6 sahnenin AI görselleri oluşturuluyor...");

    const progress =
        document.getElementById("progressBar");

    for(let i=0;i<scenes.length;i++){

        progress.style.width =
            Math.round((i/scenes.length)*100)+"%";

        await generateImage(i);

        await new Promise(
            resolve=>setTimeout(resolve,500)
        );

    }

    progress.style.width = "100%";

    status("🎉 6 sahnenin AI görselleri tamamlandı.");

}


/* ---------------------------------------------------------
   VIEWER
--------------------------------------------------------- */

function updateViewer(){

    if(!scenes.length){

        return;

    }

    const scene = scenes[currentScene];

    const img =
        document.getElementById("viewerImage");

    const subtitle =
        document.getElementById("viewerSubtitle");

    const info =
        document.getElementById("viewerInfo");

    if(scene.image){

        img.src = scene.image;

    }else{

        img.removeAttribute("src");

    }

    subtitle.textContent =
        scene.narration;

    info.textContent =
        "Sahne "+
        (currentScene+1)+
        " / "+
        scenes.length+
        " — "+
        scene.title;

    applyMotion();

}


/* ---------------------------------------------------------
   HAREKET
--------------------------------------------------------- */

function applyMotion(){

    const img =
        document.getElementById("viewerImage");

    if(!img || !scenes[currentScene]) return;

    const motion =
        scenes[currentScene].motion;

    if(motion==="zoom-in"){

        img.style.transform =
            "scale(1.12) translate(0px,0px)";

    }

    else if(motion==="zoom-out"){

        img.style.transform =
            "scale(1.0) translate(0px,0px)";

    }

    else if(motion==="pan-left"){

        img.style.transform =
            "scale(1.08) translate(-3%,0)";

    }

    else if(motion==="pan-right"){

        img.style.transform =
            "scale(1.08) translate(3%,0)";

    }

    else{

        img.style.transform =
            "scale(1) translate(0,0)";

    }

}


/* ---------------------------------------------------------
   SONRAKİ SAHNE
--------------------------------------------------------- */

function nextScene(){

    if(!scenes.length) return;

    stopSpeech();

    currentScene++;

    if(currentScene >= scenes.length){

        currentScene = 0;

    }

    updateViewer();

}


/* ---------------------------------------------------------
   ÖNCEKİ SAHNE
--------------------------------------------------------- */

function previousScene(){

    if(!scenes.length) return;

    stopSpeech();

    currentScene--;

    if(currentScene < 0){

        currentScene =
            scenes.length-1;

    }

    updateViewer();

}


/* ---------------------------------------------------------
   TEK SAHNE OYNAT
--------------------------------------------------------- */

function playCurrentScene(){

    if(!scenes.length) return;

    stopFilm();
    stopSpeech();

    updateViewer();

    speakCurrentScene();

}


/* ---------------------------------------------------------
   FİLM OYNAT
--------------------------------------------------------- */

function playFilm(){

    if(!scenes.length){

        status("Önce 6 sahneyi hazırla.");

        return;

    }

    stopFilm();
    stopSpeech();

    filmPlaying = true;

    playSceneSequence();

}


/* ---------------------------------------------------------
   SAHNE SIRASI
--------------------------------------------------------- */

function playSceneSequence(){

    if(!filmPlaying) return;

    if(currentScene >= scenes.length){

        currentScene = 0;

        filmPlaying = false;

        status("🎬 Film önizlemesi tamamlandı.");

        return;

    }

    updateViewer();

    speakCurrentScene();

    const seconds =
        Number(scenes[currentScene].duration) || 6;

    filmTimer = setTimeout(function(){

        if(!filmPlaying) return;

        stopSpeech();

        currentScene++;

        playSceneSequence();

    },seconds*1000);

}


/* ---------------------------------------------------------
   FİLM DURDUR
--------------------------------------------------------- */

function stopFilm(){

    filmPlaying = false;

    if(filmTimer){

        clearTimeout(filmTimer);

        filmTimer = null;

    }

    stopSpeech();

}


/* ---------------------------------------------------------
   SESLENDİR
--------------------------------------------------------- */

function speakCurrentScene(){

    if(!scenes.length) return;

    if(!("speechSynthesis" in window)){

        status("Bu tarayıcı konuşma özelliğini desteklemiyor.");

        return;

    }

    stopSpeech();

    const text =
        scenes[currentScene].narration;

    if(!text) return;

    speechUtterance =
        new SpeechSynthesisUtterance(text);

    speechUtterance.lang =
        document.getElementById("language").value ||
        "de-DE";

    speechUtterance.rate = 0.88;

    speechUtterance.pitch = 1;

    const voices =
        window.speechSynthesis.getVoices();

    let selected = null;

    if(speechUtterance.lang==="de-DE"){

        selected =
            voices.find(v =>
                v.lang &&
                v.lang.toLowerCase().indexOf("de")===0
            );

    }

    if(!selected){

        selected =
            voices.find(v =>
                v.lang === speechUtterance.lang
            );

    }

    if(selected){

        speechUtterance.voice = selected;

    }

    window.speechSynthesis.speak(
        speechUtterance
    );

}


/* ---------------------------------------------------------
   SES DURDUR
--------------------------------------------------------- */

function stopSpeech(){

    if("speechSynthesis" in window){

        window.speechSynthesis.cancel();

    }

}


/* ---------------------------------------------------------
   KAYDET
--------------------------------------------------------- */

function saveProject(){

    try{

        const project = {

            version:"V6.1",

            filmName:
                document.getElementById("filmName").value,

            language:
                document.getElementById("language").value,

            story:
                document.getElementById("story").value,

            aiModel:
                document.getElementById("aiModel").value,

            imageSize:
                document.getElementById("imageSize").value,

            style:
                document.getElementById("style").value,

            scenes:scenes

        };

        localStorage.setItem(
            "minaVideoAIV61",
            JSON.stringify(project)
        );

        status("💾 Proje kaydedildi.");

    }catch(error){

        status(
            "❌ Kaydetme hatası: "+
            error.message
        );

    }

}


/* ---------------------------------------------------------
   YÜKLE
--------------------------------------------------------- */

function loadProject(){

    try{

        const data =
            localStorage.getItem(
                "minaVideoAIV61"
            );

        if(!data){

            status("ℹ️ Kayıtlı V6.1 projesi bulunamadı.");

            return;

        }

        const project =
            JSON.parse(data);

        document.getElementById("filmName").value =
            project.filmName || "Das Haus am Waldrand";

        document.getElementById("language").value =
            project.language || "de-DE";

        document.getElementById("story").value =
            project.story || "";

        document.getElementById("aiModel").value =
            project.aiModel || "flux";

        document.getElementById("imageSize").value =
            project.imageSize || "1280x720";

        document.getElementById("style").value =
            project.style || "cinematic dark mystery film";

        scenes =
            Array.isArray(project.scenes)
                ? project.scenes
                : [];

        currentScene = 0;

        renderScenes();

        updateViewer();

        status("📂 Proje yüklendi.");

    }catch(error){

        status(
            "❌ Proje yükleme hatası: "+
            error.message
        );

    }

}


/* ---------------------------------------------------------
   SIFIRLA
--------------------------------------------------------- */

function resetProject(){

    const answer =
        confirm(
            "V6.1 projesi sıfırlansın mı?"
        );

    if(!answer) return;

    stopFilm();
    stopSpeech();

    localStorage.removeItem(
        "minaVideoAIV61"
    );

    createStoryScenes();

    status("♻️ Proje sıfırlandı.");

}


/* ---------------------------------------------------------
   SAYFA AÇILINCA
--------------------------------------------------------- */

window.addEventListener(
    "load",
    function(){

        createStoryScenes();

        if(
            "speechSynthesis" in window &&
            window.speechSynthesis.onvoiceschanged !== undefined
        ){

            window.speechSynthesis.onvoiceschanged =
                function(){};

        }

    }
);


/* ---------------------------------------------------------
   TARAYICI KAPATMA / TEMİZLEME
--------------------------------------------------------- */

window.addEventListener(
    "beforeunload",
    function(){

        stopFilm();
        stopSpeech();

    }
);

</script>
