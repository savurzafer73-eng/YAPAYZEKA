<script type="module">

/* =========================================================
   MINA VIDEO AI
   ========================================================= */

import { pipeline, env }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

/* =========================================================
   AYARLAR
   ========================================================= */

env.allowLocalModels = false;
env.allowRemoteModels = true;

const MODEL =
"onnx-community/SmolLM2-135M-Instruct-ONNX-MHA";

let generator = null;
let generatedData = null;
let videoBlob = null;

const $ = id => document.getElementById(id);


/* =========================================================
   LOG
   ========================================================= */

function log(text){

    const box = $("log");

    box.textContent +=
        "\n" + text;

    box.scrollTop =
        box.scrollHeight;
}


/* =========================================================
   STATUS
   ========================================================= */

function status(text){

    $("status").textContent =
        text;

    log(text);
}


/* =========================================================
   PROGRESS
   ========================================================= */

function progress(value){

    $("progressBar").style.width =
        Math.max(0,Math.min(100,value)) + "%";

}


/* =========================================================
   MODEL
   ========================================================= */

async function loadModel(){

    if(generator)
        return generator;

    status(
        "🧠 Küçük yerel AI hazırlanıyor... İlk kullanımda model indiriliyor."
    );

    progress(5);

    try{

        generator =
            await pipeline(
                "text-generation",
                MODEL,
                {
                    dtype:"q8"
                }
            );

        progress(15);

        status(
            "✅ Yerel AI hazır!"
        );

        return generator;

    }catch(error){

        console.error(error);

        status(
            "❌ Yerel AI yüklenemedi: " +
            error.message
        );

        log(
            "\nMODEL HATASI:\n" +
            error.stack
        );

        throw error;
    }
}


/* =========================================================
   LANGUAGE
   ========================================================= */

function languageName(){

    const lang =
        $("language").value;

    if(lang === "de")
        return "German";

    if(lang === "en")
        return "English";

    return "Turkish";
}


/* =========================================================
   STYLE
   ========================================================= */

function styleName(){

    const value =
        $("style").value;

    const styles = {

        cinematic:
        "cinematic movie still, dramatic lighting",

        fantasy:
        "fantasy movie scene, magical atmosphere",

        scifi:
        "science fiction movie scene, futuristic",

        "3d":
        "high quality 3D animation",

        "2d":
        "beautiful 2D animation",

        dark:
        "dark mysterious cinematic atmosphere",

        photo:
        "ultra realistic photography",

        action:
        "dynamic action movie scene",

        medieval:
        "historical medieval cinematic scene",

        epic:
        "epic cinematic movie scene"
    };

    return styles[value] ||
        styles.cinematic;
}


/* =========================================================
   ESCAPE
   ========================================================= */

function cleanText(text){

    return String(text || "")
        .replace(/\r/g,"")
        .trim();
}


/* =========================================================
   PARSE AI
   ========================================================= */

function parseAI(text){

    text = cleanText(text);

    /*
      AI düzgün format vermezse bile
      metni tamamen çöpe atmıyoruz.
    */

    let title =
        "Mystery Nacht";

    let intro =
        "";

    let ending =
        "";

    const titleMatch =
        text.match(
            /TITLE\s*:\s*([\s\S]*?)(?=\nINTRO\s*:|$)/i
        );

    if(titleMatch)
        title =
            cleanText(titleMatch[1]);


    const introMatch =
        text.match(
            /INTRO\s*:\s*([\s\S]*?)(?=\nSCENE\s*1\s*:|$)/i
        );

    if(introMatch)
        intro =
            cleanText(introMatch[1]);


    const endingMatch =
        text.match(
            /ENDING\s*:\s*([\s\S]*)$/i
        );

    if(endingMatch)
        ending =
            cleanText(endingMatch[1]);


    const sceneMatches =
        [...text.matchAll(
            /SCENE\s*(\d+)\s*:\s*([\s\S]*?)(?=\nSCENE\s*\d+\s*:|\nENDING\s*:|$)/gi
        )];


    const scenes = [];

    for(const match of sceneMatches){

        const number =
            Number(match[1]);

        const block =
            match[2];

        const narrationMatch =
            block.match(
                /NARRATION\s*:\s*([\s\S]*?)(?=\nVISUAL\s*:|$)/i
            );

        const visualMatch =
            block.match(
                /VISUAL\s*:\s*([\s\S]*?)(?=\nIMAGE\s*:|$)/i
            );

        const imageMatch =
            block.match(
                /IMAGE\s*:\s*([\s\S]*)$/i
            );

        scenes.push({

            number,

            narration:
                cleanText(
                    narrationMatch ?
                    narrationMatch[1] :
                    block
                ),

            visual:
                cleanText(
                    visualMatch ?
                    visualMatch[1] :
                    block
                ),

            image:
                cleanText(
                    imageMatch ?
                    imageMatch[1] :
                    visualMatch ?
                    visualMatch[1] :
                    block
                ),

            imageUrl:null
        });
    }


    /*
      Model formatı bozarsa otomatik
      sahne oluştur.
    */

    if(!scenes.length){

        const requested =
            Number($("sceneCount").value);

        for(let i=1;i<=requested;i++){

            scenes.push({

                number:i,

                narration:
                    text,

                visual:
                    $("topic").value,

                image:
                    $("topic").value,

                imageUrl:null
            });
        }
    }


    return {

        title,
        intro,
        scenes,
        ending
    };
}


/* =========================================================
   AI SCRIPT
   ========================================================= */

async function generateScript(){

    const topic =
        $("topic").value.trim();

    if(!topic){

        alert(
            "Önce bir konu yaz canım ❤️"
        );

        return;
    }


    $("generateBtn").disabled =
        true;

    $("voiceBtn").disabled =
        true;

    $("imageBtn").disabled =
        true;

    $("videoBtn").disabled =
        true;


    try{

        const ai =
            await loadModel();

        status(
            "✍️ Mina senaryoyu yazıyor..."
        );

        progress(20);


        const count =
            Number($("sceneCount").value);

        const language =
            languageName();

        const style =
            styleName();


        const prompt = `
You are a professional mystery YouTube script writer.

Write a short cinematic YouTube mystery story.

Topic:
${topic}

Language:
${language}

Number of scenes:
${count}

Visual style:
${style}

Return ONLY this format:

TITLE:
short title

INTRO:
short dramatic introduction

SCENE 1:
NARRATION:
short narration
VISUAL:
visual description
IMAGE:
image generation prompt

SCENE 2:
NARRATION:
short narration
VISUAL:
visual description
IMAGE:
image generation prompt

Continue until SCENE ${count}.

ENDING:
short mysterious ending.

Rules:
- Keep narration simple.
- Make the story cinematic.
- Do not explain the format.
- Do not use markdown.
- Do not add commentary.
`;


        const result =
            await ai(
                prompt,
                {
                    max_new_tokens:
                        count <= 1 ? 180 :
                        count <= 4 ? 320 :
                        430,

                    do_sample:false
                }
            );


        let output = "";

        if(
            result &&
            result[0] &&
            result[0].generated_text
        ){

            output =
                result[0].generated_text;
        }

        /*
          Bazı modeller generated_text
          içinde promptu da döndürebilir.
        */

        if(
            output.startsWith(prompt)
        ){

            output =
                output.slice(
                    prompt.length
                );
        }


        generatedData =
            parseAI(output);


        renderScript();

        progress(40);

        status(
            "✅ Senaryo hazır!"
        );


        $("voiceBtn").disabled =
            false;

        $("imageBtn").disabled =
            false;


    }catch(error){

        console.error(error);

        status(
            "❌ Senaryo oluşturulamadı: " +
            error.message
        );

    }finally{

        $("generateBtn").disabled =
            false;
    }
}


/* =========================================================
   RENDER SCRIPT
   ========================================================= */

function renderScript(){

    $("scriptCard")
        .classList.remove("hidden");


    $("titleBox").innerHTML =
        "<h3>🎬 " +
        escapeHTML(generatedData.title) +
        "</h3>";


    $("introBox").innerHTML =
        "<p>" +
        escapeHTML(generatedData.intro) +
        "</p>";


    const container =
        $("scenes");

    container.innerHTML =
        "";


    generatedData.scenes.forEach(
        (scene,index)=>{

            const div =
                document.createElement("div");

            div.className =
                "scene";

            div.innerHTML = `

                <h3>
                    🎞️ Sahne ${index+1}
                </h3>

                <div class="small">
                    ANLATIM
                </div>

                <p>
                    ${escapeHTML(scene.narration)}
                </p>

                <div class="small">
                    GÖRSEL
                </div>

                <p>
                    ${escapeHTML(scene.visual)}
                </p>

                <img
                    id="img-${index}"
                    class="hidden"
                >

            `;

            container.appendChild(div);
        }
    );


    $("endingBox").innerHTML =
        "<h3>🌙 Final</h3><p>" +
        escapeHTML(generatedData.ending) +
        "</p>";
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   SAFE SEED
   ========================================================= */

function safeSeed(index){

    const max =
        2147483647;

    return Math.floor(
        (
            Date.now() % max +
            index * 100003
        ) % max
    );
}


/* =========================================================
   IMAGE URL
   ========================================================= */

function pollinationsURL(
    prompt,
    index
){

    const encoded =
        encodeURIComponent(
            prompt
        );

    return (
        "https://gen.pollinations.ai/image/" +
        encoded +
        "?width=1280" +
        "&height=720" +
        "&seed=" +
        safeSeed(index) +
        "&nologo=true"
    );
}


/* =========================================================
   FALLBACK IMAGE
   ========================================================= */

function fallbackImage(
    title,
    index
){

    const colors = [
        ["#050505","#19243b"],
        ["#080b12","#351f42"],
        ["#05080c","#203b39"],
        ["#090706","#382516"],
        ["#04070d","#162d52"],
        ["#08050b","#321c3b"]
    ];

    const c =
        colors[index % colors.length];

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="1280"
         height="720">

        <defs>

            <linearGradient
                id="g"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0"
                    stop-color="${c[0]}"/>

                <stop
                    offset="1"
                    stop-color="${c[1]}"/>

            </linearGradient>

        </defs>

        <rect
            width="1280"
            height="720"
            fill="url(#g)"/>

        <circle
            cx="900"
            cy="220"
            r="130"
            fill="rgba(255,255,255,.05)"/>

        <text
            x="70"
            y="600"
            fill="white"
            font-family="Arial"
            font-size="42"
            font-weight="bold">
            ${escapeSVG(title)}
        </text>

        <text
            x="70"
            y="650"
            fill="rgba(255,255,255,.6)"
            font-family="Arial"
            font-size="24">
            MYSTERY NACHT
        </text>

    </svg>
    `;

    return (
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg)
    );
}


function escapeSVG(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&apos;");
}


/* =========================================================
   IMAGE LOAD
   ========================================================= */

function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.crossOrigin =
                "anonymous";

            img.onload =
                ()=>resolve(img);

            img.onerror =
                ()=>reject(
                    new Error(
                        "Görsel yüklenemedi"
                    )
                );

            img.src =
                url;
        }
    );
}


/* =========================================================
   GENERATE IMAGES
   ========================================================= */

async function generateImages(){

    if(!generatedData)
        return;


    $("imageBtn").disabled =
        true;

    $("videoBtn").disabled =
        true;


    try{

        const scenes =
            generatedData.scenes;


        for(
            let i=0;
            i<scenes.length;
            i++
        ){

            status(
                `🖼️ Görsel ${i+1}/${scenes.length} hazırlanıyor...`
            );

            progress(
                40 +
                (i / scenes.length) * 35
            );


            const scene =
                scenes[i];


            /*
              Önce Pollinations deneniyor.
            */

            const prompt =
                scene.image +
                ", " +
                styleName() +
                ", 16:9, no text, no logo";


            let url =
                pollinationsURL(
                    prompt,
                    i
                );


            try{

                const img =
                    await loadImage(url);

                scene.imageUrl =
                    img.src;


            }catch(error){

                /*
                  Ücretsiz hesapta 402 gelirse
                  video üretimi yine çalışabilsin.
                */

                log(
                    `\nGörsel ${i+1} AI üretilemedi. Yerel fallback kullanılıyor.`
                );

                scene.imageUrl =
                    fallbackImage(
                        generatedData.title,
                        i
                    );
            }


            const imageElement =
                $("img-"+i);

            imageElement.src =
                scene.imageUrl;

            imageElement.classList.remove(
                "hidden"
            );


            /*
              Anonymous queue limitini
              zorlamamak için kısa bekleme.
            */

            if(i < scenes.length-1){

                await wait(2200);
            }
        }


        progress(78);

        status(
            "✅ Görseller hazır!"
        );


        $("videoBtn").disabled =
            false;


    }catch(error){

        status(
            "❌ Görsel işlemi: " +
            error.message
        );

    }finally{

        $("imageBtn").disabled =
            false;
    }
}


/* =========================================================
   WAIT
   ========================================================= */

function wait(ms){

    return new Promise(
        resolve =>
        setTimeout(resolve,ms)
    );
}


/* =========================================================
   VOICE
   ========================================================= */

function speakText(){

    if(!generatedData)
        return;


    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Bu tarayıcı sesli okumayı desteklemiyor."
        );

        return;
    }


    speechSynthesis.cancel();


    let text =
        generatedData.intro +
        " ";


    generatedData.scenes.forEach(
        scene=>{
            text +=
                scene.narration +
                " ";
        }
    );


    text +=
        generatedData.ending;


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const lang =
        $("language").value;

    if(lang === "de")
        utterance.lang =
            "de-DE";

    else if(lang === "en")
        utterance.lang =
            "en-US";

    else
        utterance.lang =
            "tr-TR";


    utterance.rate =
        .92;

    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );


    status(
        "🔊 Ses oynatılıyor..."
    );
}


/* =========================================================
   DRAW TEXT
   ========================================================= */

function wrapText(
    ctx,
    text,
    maxWidth
){

    const words =
        text.split(" ");

    const lines = [];

    let line = "";


    for(
        const word of words
    ){

        const test =
            line ?
            line + " " + word :
            word;

        if(
            ctx.measureText(test)
                .width >
            maxWidth
        ){

            if(line)
                lines.push(line);

            line =
                word;

        }else{

            line =
                test;
        }
    }


    if(line)
        lines.push(line);


    return lines;
}


/* =========================================================
   DRAW SCENE
   ========================================================= */

function drawScene(
    ctx,
    canvas,
    image,
    title,
    narration
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const scale =
        Math.max(
            canvas.width/image.width,
            canvas.height/image.height
        );


    const w =
        image.width * scale;

    const h =
        image.height * scale;


    const x =
        (canvas.width-w)/2;

    const y =
        (canvas.height-h)/2;


    ctx.drawImage(
        image,
        x,
        y,
        w,
        h
    );


    /*
      Koyu alt gradient
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            canvas.height*.45,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.9)"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
      Başlık
    */

    ctx.fillStyle =
        "rgba(255,255,255,.92)";

    ctx.font =
        "bold 30px Arial";

    ctx.fillText(
        title,
        45,
        55
    );


    /*
      Altyazı
    */

    ctx.font =
        "bold 27px Arial";


    const lines =
        wrapText(
            ctx,
            narration,
            canvas.width-100
        );


    const lineHeight =
        38;

    const startY =
        canvas.height -
        55 -
        lines.length *
        lineHeight;


    /*
      Siyah kutu
    */

    ctx.fillStyle =
        "rgba(0,0,0,.65)";

    ctx.fillRect(
        25,
        startY-25,
        canvas.width-50,
        lines.length *
        lineHeight + 45
    );


    ctx.fillStyle =
        "#fff";


    lines.forEach(
        (line,index)=>{

            ctx.fillText(
                line,
                50,
                startY +
                index *
                lineHeight
            );
        }
    );
}


/* =========================================================
   VIDEO
   ========================================================= */

async function createVideo(){

    if(!generatedData)
        return;


    $("videoBtn").disabled =
        true;


    $("videoCard")
        .classList.add("hidden");


    try{

        status(
            "🎬 Video hazırlanıyor..."
        );

        progress(80);


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            1280;

        canvas.height =
            720;


        const ctx =
            canvas.getContext("2d");


        const stream =
            canvas.captureStream(30);


        let mime =
            "video/webm;codecs=vp9";


        if(
            !MediaRecorder.isTypeSupported(
                mime
            )
        ){

            mime =
                "video/webm";
        }


        const recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:mime,
                    videoBitsPerSecond:
                        5000000
                }
            );


        const chunks = [];


        recorder.ondataavailable =
            event=>{

                if(
                    event.data &&
                    event.data.size
                ){

                    chunks.push(
                        event.data
                    );
                }
            };


        const stopped =
            new Promise(
                resolve=>{

                    recorder.onstop =
                        resolve;
                }
            );


        recorder.start();


        const duration =
            Number(
                $("duration").value
            ) * 1000;


        for(
            let i=0;
            i<generatedData.scenes.length;
            i++
        ){

            status(
                `🎬 Sahne ${i+1}/${generatedData.scenes.length} videoya ekleniyor...`
            );


            const scene =
                generatedData.scenes[i];


            let image;

            try{

                image =
                    await loadImage(
                        scene.imageUrl
                    );

            }catch(error){

                image =
                    await loadImage(
                        fallbackImage(
                            generatedData.title,
                            i
                        )
                    );
            }


            const start =
                performance.now();


            while(
                performance.now() -
                start <
                duration
            ){

                drawScene(
                    ctx,
                    canvas,
                    image,
                    generatedData.title,
                    scene.narration
                );


                await wait(33);
            }


            progress(
                80 +
                ((i+1) /
                generatedData.scenes.length)
                * 18
            );
        }


        /*
          Final ekranı
        */

        ctx.fillStyle =
            "#05070b";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "#fff";

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 54px Arial";

        ctx.fillText(
            generatedData.title,
            canvas.width/2,
            canvas.height/2
        );


        ctx.font =
            "28px Arial";

        ctx.fillStyle =
            "#aab4c5";

        ctx.fillText(
            "MYSTERY NACHT",
            canvas.width/2,
            canvas.height/2+55
        );


        await wait(1800);


        recorder.stop();

        await stopped;


        videoBlob =
            new Blob(
                chunks,
                {
                    type:mime
                }
            );


        const url =
            URL.createObjectURL(
                videoBlob
            );


        $("video").src =
            url;


        $("videoCard")
            .classList.remove(
                "hidden"
            );


        progress(100);

        status(
            "🎉 Video hazır! Altyazılar videonun içine işlendi."
        );


    }catch(error){

        console.error(error);

        status(
            "❌ Video oluşturulamadı: " +
            error.message
        );

        log(
            "\nVIDEO HATASI:\n" +
            error.stack
        );

    }finally{

        $("videoBtn").disabled =
            false;
    }
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadVideo(){

    if(!videoBlob)
        return;


    const url =
        URL.createObjectURL(
            videoBlob
        );


    const a =
        document.createElement("a");


    a.href =
        url;

    a.download =
        "mina-video-ai.webm";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );
}
