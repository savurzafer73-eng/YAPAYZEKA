<body>

<div class="container">

<div id="scenes"></div>

<script type="module">

/* =========================================================
   MINA VIDEO AI V48.2
   ========================================================= */

let scenes=[];
let sceneCounter=1;

let ttsModule=null;
let ttsSession=null;

let previewTimer=null;
let renderStopRequested=false;
let batchStopRequested=false;

const story=document.getElementById("story");
const scenesEl=document.getElementById("scenes");
const statusEl=document.getElementById("status");
const ttsMessageEl=document.getElementById("ttsMessage");
const batchProgress=document.getElementById("batchProgress");
const renderProgress=document.getElementById("renderProgress");

function status(t){
  statusEl.textContent=t;
}

function ttsMessage(t){
  ttsMessageEl.textContent=t;
}

function renderStatus(t){
  document.getElementById("renderStatus").textContent=t;
}


/* =========================================================
   SENTENCE SPLITTER
   ========================================================= */

function splitSentences(text){

  text=text
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();

  if(!text) return [];

  const result=text.match(
    /[^.!?…]+[.!?…]+(?=\s|$)|[^.!?…]+$/g
  );

  return (result || [text])
    .map(x=>x.trim())
    .filter(Boolean);
}


/* =========================================================
   VISUAL DIRECTOR
   ========================================================= */

function safeAnalyzeScene(text){

  const t=text.toLowerCase();

  let person="realistic human subject";
  let location="authentic real-world environment";
  let emotion="natural emotional expression";
  let period="contemporary realistic setting";
  let action="performing the action described in the narration";
  let camera="cinematic medium shot";
  let lens="35mm documentary lens";
  let lighting="natural cinematic lighting";
  let composition="strong cinematic composition";
  let atmosphere="authentic documentary atmosphere";

  if(
    t.includes("j.k.") ||
    t.includes("rowling") ||
    t.includes("joanne")
  ){
    person="Joanne Rowling";
  }

  if(
    t.includes("mutter") ||
    t.includes("alleinerziehend") ||
    t.includes("mother")
  ){
    person="struggling single mother";
  }

  if(
    t.includes("kind") ||
    t.includes("tochter") ||
    t.includes("sohn")
  ){
    person+=" with a child";
  }

  if(
    t.includes("küche") ||
    t.includes("küchentisch")
  ){
    location="modest home kitchen";
  }

  if(
    t.includes("wohnung") ||
    t.includes("wohnung")
  ){
    location="modest apartment";
  }

  if(
    t.includes("café") ||
    t.includes("cafe")
  ){
    location="authentic small European café";
  }

  if(
    t.includes("bahnhof") ||
    t.includes("zug")
  ){
    location="realistic European railway station";
  }

  if(
    t.includes("büro") ||
    t.includes("office")
  ){
    location="realistic professional office";
  }

  if(
    t.includes("1990") ||
    t.includes("neunziger")
  ){
    period="authentic 1990s setting";
  }

  if(
    t.includes("arm") ||
    t.includes("geld") ||
    t.includes("schulden") ||
    t.includes("kein geld")
  ){
    emotion="tired, worried but quietly hopeful";
  }

  if(
    t.includes("glücklich") ||
    t.includes("freude") ||
    t.includes("erfolg")
  ){
    emotion="genuine happiness and restrained excitement";
  }

  if(
    t.includes("schreibt") ||
    t.includes("schreiben") ||
    t.includes("geschichte") ||
    t.includes("roman")
  ){
    action="writing a story with focused determination";
  }

  if(
    t.includes("weint") ||
    t.includes("tränen")
  ){
    emotion="deep sadness with realistic tears";
  }

  if(
    t.includes("nachts") ||
    t.includes("nacht") ||
    t.includes("spät")
  ){
    lighting="soft warm practical light mixed with subtle night window light";
    atmosphere="quiet late-night documentary atmosphere";
  }

  if(
    t.includes("morgen") ||
    t.includes("sonne")
  ){
    lighting="soft natural morning sunlight";
  }

  if(
    t.length<110
  ){
    camera="cinematic medium shot";
  }else if(
    t.length<230
  ){
    camera="cinematic medium-wide shot";
  }else{
    camera="cinematic wide establishing shot";
  }

  return {
    person,
    location,
    emotion,
    period,
    action,
    camera,
    lens,
    lighting,
    composition,
    atmosphere
  };
}


/* =========================================================
   V48.2 Z-IMAGE OPTIMIZED PROMPT
   ========================================================= */

function createImagePrompt(text,index){

  const a=safeAnalyzeScene(text);

  /*
    ÖNEMLİ:
    V48.2'de prompt özellikle kısa tutuluyor.
    Meta talimatları, başlıklar ve gereksiz uzun
    teknik açıklamalar kaldırıldı.

    Amaç:
    ForVideo / Z-Image tarafına doğrudan
    temiz bir görsel tarif göndermek.
  */

  const prompt =
`Photorealistic cinematic documentary photograph of ${a.person} in ${a.location}, ${a.action}. ${a.emotion}. ${a.period}. ${a.lighting}. ${a.camera}, ${a.lens}, shallow depth of field, realistic skin texture, natural clothing, authentic environment, subtle film grain, professional documentary photography, strong visual storytelling, realistic proportions, highly detailed, cinematic composition, ${a.atmosphere}, no text, no subtitles, no logo, no watermark.`;

  return prompt.trim();
}


/* =========================================================
   NEGATIVE PROMPT
   ========================================================= */

function createNegativePrompt(){

  return `
text, subtitles, captions, logo, watermark,
cartoon, anime, illustration, CGI,
plastic skin, deformed face, distorted body,
extra fingers, missing fingers, extra limbs,
bad anatomy, blurry, low quality,
oversaturated, unrealistic proportions
`.replace(/\s+/g," ").trim();

}


/* =========================================================
   CREATE SCENES
   ========================================================= */

function createScenes(){

  const text=story.value.trim();

  if(!text){
    alert("Önce hikâyeyi gir.");
    return;
  }

  const sentences=splitSentences(text);

  if(!sentences.length){
    alert("Cümle bulunamadı.");
    return;
  }

  scenes=[];
  sceneCounter=1;

  for(let i=0;i<sentences.length;i+=2){

    let textPart=sentences[i];

    if(sentences[i+1]){
      textPart+=" "+sentences[i+1];
    }

    scenes.push({

      id:sceneCounter++,

      text:textPart,

      subtitle:textPart,

      subtitleEnabled:false,

      prompt:createImagePrompt(
        textPart,
        scenes.length
      ),

      negativePrompt:createNegativePrompt(),

      image:null,

      imageURL:null,

      imageObject:null,

      audio:null,

      audioURL:null,

      duration:4,

      motion:"zoomIn",

      ttsState:"Hazır",

      analysis:safeAnalyzeScene(textPart)

    });

  }

  renderScenes();

  status(
    "✅ "+scenes.length+
    " sahne oluşturuldu."
  );
}


/* =========================================================
   ADD SCENE
   ========================================================= */

function addScene(){

  scenes.push({

    id:sceneCounter++,

    text:"",

    subtitle:"",

    subtitleEnabled:false,

    prompt:"",

    negativePrompt:createNegativePrompt(),

    image:null,

    imageURL:null,

    imageObject:null,

    audio:null,

    audioURL:null,

    duration:4,

    motion:"zoomIn",

    ttsState:"Hazır",

    analysis:null

  });

  renderScenes();

}


/* =========================================================
   RENDER SCENES UI
   ========================================================= */

function renderScenes(){

  scenesEl.innerHTML="";

  scenes.forEach((scene,index)=>{

    const div=document.createElement("div");

    div.className="scene";

    div.innerHTML=`

      <div class="sceneHead">

        <div class="sceneTitle">
          🎬 SAHNE ${index+1}
        </div>

        <div class="badge">
          ${scene.duration.toFixed(2)} sn
        </div>

      </div>


      <div class="sceneGrid">

        <div>

          <label>Sahne Metni</label>

          <textarea
            class="sceneText"
            data-index="${index}"
            style="min-height:130px"
          >${escapeHTML(scene.text)}</textarea>


          <div class="controls">

            <button
              data-action="refreshAnalysis"
              data-index="${index}"
            >
              🧠 ANALİZİ YENİLE
            </button>

            <button
              data-action="refreshPrompt"
              data-index="${index}"
            >
              🔄 PROMPT YENİLE
            </button>

            <button
              data-action="copyPrompt"
              data-index="${index}"
            >
              📋 PROMPT KOPYALA
            </button>

            <button
              data-action="subtitle"
              data-index="${index}"
            >
              💬 ALTYAZI:
              ${scene.subtitleEnabled ? "AÇIK" : "KAPALI"}
            </button>

          </div>


          <label>🎙️ Seslendirme</label>

          <button
            class="success"
            data-action="voice"
            data-index="${index}"
          >
            🎙️ SAHNEYİ SESLENDİR
          </button>

          <div class="ttsStatus">
            ${escapeHTML(scene.ttsState)}
          </div>

          ${
            scene.audioURL
            ?
            `
              <audio
                controls
                src="${scene.audioURL}"
              ></audio>

              <a
                href="${scene.audioURL}"
                download="GeldStory_Sahne_${index+1}.wav"
              >
                <button>⬇️ WAV KAYDET</button>
              </a>
            `
            :
            ""
          }


          <label style="margin-top:12px">
            🎥 Hareket
          </label>

          <select
            class="motionSelect"
            data-index="${index}"
          >

            ${motionOption("zoomIn","Zoom In",scene.motion)}
            ${motionOption("zoomOut","Zoom Out",scene.motion)}
            ${motionOption("panLeft","Pan Left",scene.motion)}
            ${motionOption("panRight","Pan Right",scene.motion)}
            ${motionOption("panUp","Pan Up",scene.motion)}
            ${motionOption("panDown","Pan Down",scene.motion)}
            ${motionOption("kenBurns","Ken Burns",scene.motion)}
            ${motionOption("static","Static",scene.motion)}

          </select>


          <label style="margin-top:12px">
            🖼️ Görsel Yükle
          </label>

          <label class="fileLabel">

            Görsel Seç

            <input
              type="file"
              accept="image/*"
              data-action="image"
              data-index="${index}"
            >

          </label>

        </div>


        <div>

          <div class="preview">

            <canvas
              id="canvas-${index}"
              width="1280"
              height="720"
            ></canvas>

            <div class="brand">
              GELDSTORY
            </div>

          </div>


          <label style="margin-top:12px">
            🧠 Visual Director Analizi
          </label>

          <div class="analysis">

            ${
              scene.analysis
              ?
              `
              <b>👤 Kişi:</b>
              ${escapeHTML(scene.analysis.person)}<br>

              <b>📍 Mekân:</b>
              ${escapeHTML(scene.analysis.location)}<br>

              <b>🎭 Duygu:</b>
              ${escapeHTML(scene.analysis.emotion)}<br>

              <b>📅 Dönem:</b>
              ${escapeHTML(scene.analysis.period)}<br>

              <b>🎬 Kamera:</b>
              ${escapeHTML(scene.analysis.camera)}<br>

              <b>🔭 Lens:</b>
              ${escapeHTML(scene.analysis.lens)}<br>

              <b>💡 Işık:</b>
              ${escapeHTML(scene.analysis.lighting)}
              `
              :
              "Henüz analiz yapılmadı."
            }

          </div>


          <label style="margin-top:12px">
            🖼️ Z-IMAGE PROMPT
          </label>

          <textarea
            class="promptBox"
            data-index="${index}"
          >${escapeHTML(scene.prompt)}</textarea>


          <div class="small">
            V48.2: Z-Image için kısa ve temiz İngilizce prompt.
          </div>


          <label style="margin-top:10px">
            🚫 NEGATIVE PROMPT
          </label>

          <textarea
            class="promptBox"
            style="min-height:80px"
            data-negative="${index}"
          >${escapeHTML(scene.negativePrompt)}</textarea>

        </div>

      </div>

    `;

    scenesEl.appendChild(div);

    drawScene(index);

  });

}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function motionOption(value,label,current){

  return `
    <option
      value="${value}"
      ${value===current ? "selected" : ""}
    >
      ${label}
    </option>
  `;

}


/* =========================================================
   SCENE EVENTS
   ========================================================= */

scenesEl.addEventListener("input",e=>{

  const index=e.target.dataset.index;

  if(
    e.target.classList.contains("sceneText")
  ){

    scenes[index].text=e.target.value;

    scenes[index].subtitle=e.target.value;

  }

  if(
    e.target.classList.contains("promptBox")
  ){

    if(e.target.dataset.negative!==undefined){

      scenes[index].negativePrompt=e.target.value;

    }else{

      scenes[index].prompt=e.target.value;

    }

  }

});


scenesEl.addEventListener("change",async e=>{

  const index=e.target.dataset.index;

  if(
    e.target.classList.contains("motionSelect")
  ){

    scenes[index].motion=e.target.value;

  }


  if(
    e.target.dataset.action==="image"
  ){

    const file=e.target.files[0];

    if(!file)return;

    const url=URL.createObjectURL(file);

    scenes[index].image=file;

    scenes[index].imageURL=url;

    const img=new Image();

    img.onload=()=>{

      scenes[index].imageObject=img;

      drawScene(index);

    };

    img.src=url;

  }

});


scenesEl.addEventListener("click",async e=>{

  const btn=e.target.closest("button");

  if(!btn)return;

  const action=btn.dataset.action;

  const index=Number(btn.dataset.index);

  if(
    action==="refreshAnalysis"
  ){

    scenes[index].analysis=
      safeAnalyzeScene(
        scenes[index].text
      );

    renderScenes();

  }


  if(
    action==="refreshPrompt"
  ){

    scenes[index].analysis=
      safeAnalyzeScene(
        scenes[index].text
      );

    scenes[index].prompt=
      createImagePrompt(
        scenes[index].text,
        index
      );

    scenes[index].negativePrompt=
      createNegativePrompt();

    renderScenes();

  }


  if(
    action==="copyPrompt"
  ){

    try{

      await navigator.clipboard.writeText(
        scenes[index].prompt
      );

      status(
        "📋 Sahne "+
        (index+1)+
        " Z-Image promptu kopyalandı."
      );

    }catch(err){

      alert("Prompt kopyalanamadı.");

    }

  }


  if(
    action==="subtitle"
  ){

    scenes[index].subtitleEnabled=
      !scenes[index].subtitleEnabled;

    renderScenes();

  }


  if(
    action==="voice"
  ){

    await generateSceneVoice(index);

  }

});


/* =========================================================
   TTS LOAD
   ========================================================= */

async function loadTTS(){

  if(ttsModule)
    return ttsModule;

  ttsMessage(
    "⏳ Piper TTS yükleniyor..."
  );

  try{

    ttsModule=
      await import(
        "https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm"
      );

    ttsMessage(
      "✅ Piper TTS hazır."
    );

    return ttsModule;

  }catch(error){

    console.error(error);

    ttsMessage(
      "❌ Piper TTS yüklenemedi: "+
      error.message
    );

    throw error;

  }

}


/* =========================================================
   VOICE
   ========================================================= */

function getVoice(){

  return document.getElementById("voice").value;

}


/* =========================================================
   AUDIO DURATION
   ========================================================= */

function getAudioDuration(url){

  return new Promise(resolve=>{

    const audio=new Audio();

    audio.preload="metadata";

    audio.onloadedmetadata=()=>{

      const d=audio.duration;

      resolve(
        Number.isFinite(d) ? d : 0
      );

    };

    audio.onerror=()=>resolve(0);

    audio.src=url;

  });

}


/* =========================================================
   SINGLE SCENE VOICE
   ========================================================= */

async function generateSceneVoice(index){

  const scene=scenes[index];

  if(!scene.text.trim()){

    alert(
      "Sahne metni boş."
    );

    return;

  }

  scene.ttsState=
    "⏳ Ses oluşturuluyor...";

  renderScenes();

  try{

    const tts=await loadTTS();

    const voice=getVoice();

    ttsMessage(
      "🎙️ Sahne "+
      (index+1)+
      " seslendiriliyor..."
    );


    if(tts.TtsSession){

      if(
        !ttsSession ||
        ttsSession.voiceId!==voice
      ){

        ttsSession=
          new tts.TtsSession({

            voiceId:voice,

            allowLocalModels:true,

            fallbackStrategy:"auto",

            progress:p=>{

              if(
                p &&
                p.total
              ){

                const percent=
                  Math.round(
                    p.loaded*100/p.total
                  );

                ttsMessage(
                  "🎙️ Model yükleniyor: "+
                  percent+
                  "%"
                );

              }

            },

            logger:message=>{

              console.log(
                "Piper:",
                message
              );

            }

          });

        ttsSession.voiceId=voice;

      }

      const wav=
        await ttsSession.predict(
          scene.text.trim()
        );

      scene.audio=wav;

      scene.audioURL=
        URL.createObjectURL(wav);

    }else{

      const wav=
        await tts.predict({

          text:scene.text.trim(),

          voiceId:voice

        });

      scene.audio=wav;

      scene.audioURL=
        URL.createObjectURL(wav);

    }


    const duration=
      await getAudioDuration(
        scene.audioURL
      );

    if(duration>0){

      scene.duration=duration;

    }


    scene.ttsState=
      "✅ WAV hazır — "+
      scene.duration.toFixed(2)+
      " sn";

    ttsMessage(
      "✅ Sahne "+
      (index+1)+
      " WAV hazır."
    );

    renderScenes();

  }catch(error){

    console.error(error);

    scene.ttsState=
      "❌ Hata: "+
      error.message;

    ttsMessage(
      "❌ TTS hatası: "+
      error.message
    );

    renderScenes();

  }

}


/* =========================================================

async function generateAllSceneVoices(){

  if(!scenes.length){

  batchStopRequested=false;

  document.getElementById(
    "allVoiceBtn"
  ).disabled=true;

  document.getElementById(
    "stopBatchBtn"
  ).disabled=false;

  batchProgress.value=0;

  try{

    await loadTTS();

    for(
      let i=0;
      i<scenes.length;
      i++
    ){

      if(batchStopRequested){

        ttsMessage(
          "⏹ Toplu seslendirme durduruldu."
        );

      }

      ttsMessage(
        "🎙️ "+
        (i+1)+

        scenes.length+
        " sahne seslendiriliyor..."
      );

      await generateSceneVoice(i);

      !batchStopRequested
    ){

        "🎉 Tüm sahnelerin WAV sesleri hazır."
      );

    }

  }catch(error){

    );

    ).disabled=false;

    document.getElementById(
      "stopBatchBtn"
    ).disabled=true;

  }

}


/* =========================================================
   CANVAS DRAW
   ========================================================= */

function drawScene(index,progress=0){

  const canvas=
    document.getElementById(
      "canvas-"+index
    );

  if(!canvas)return;

  const ctx=
    canvas.getContext("2d");

  const scene=scenes[index];

  const W=canvas.width;
  const H=canvas.height;

  ctx.fillStyle="#05070a";
  ctx.fillRect(0,0,W,H);

  if(scene.imageObject){

    const img=scene.imageObject;

    const scale=
      Math.max(
        W/img.width,
        H/img.height
      );

    let dw=img.width*scale;
    let dh=img.height*scale;

    let x=(W-dw)/2;
    let y=(H-dh)/2;

    const motion=
      scene.motion;

    if(motion==="zoomIn"){

      const z=
        1+
        progress*0.10;

      dw*=z;
      dh*=z;

      x=(W-dw)/2;
      y=(H-dh)/2;

    }

    if(motion==="zoomOut"){

      const z=
        1.10-
        progress*0.10;

      dw*=z;
      dh*=z;

      x=(W-dw)/2;
      y=(H-dh)/2;

    }

    if(motion==="panLeft"){

      x=
        (W-dw)/2-
        progress*(dw-W)*0.35;

    }

    if(motion==="panRight"){

      x=
        (W-dw)/2+
        progress*(dw-W)*0.35;

    }

    if(motion==="panUp"){

      y=
        (H-dh)/2-
        progress*(dh-H)*0.35;

    }

    if(motion==="panDown"){

      y=
        (H-dh)/2+
        progress*(dh-H)*0.35;

    }

    if(motion==="kenBurns"){

      const z=
        1+
        progress*0.08;

      dw*=z;
      dh*=z;

      x=
        (W-dw)/2-
        progress*20;

      y=
        (H-dh)/2+
        progress*10;

    }

    ctx.drawImage(
      img,
      x,
      y,
      dw,
      dh
    );

  }else{

    const g=
      ctx.createLinearGradient(
        0,0,W,H
      );

    g.addColorStop(
      0,
      "#18202b"
    );

    g.addColorStop(
      1,
      "#05070a"
    );

    ctx.fillStyle=g;
    ctx.fillRect(
      0,0,W,H
    );

    ctx.fillStyle=
      "rgba(255,255,255,.45)";

    ctx.font=
      "28px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "Görsel yüklenmedi",
      W/2,
      H/2
    );

  }


  /* Brand */

  ctx.fillStyle=
    "rgba(0,0,0,.30)";

  ctx.fillRect(
    18,
    15,
    170,
    38
  );

  ctx.fillStyle="#fff";

  ctx.font=
    "bold 17px Arial";

  ctx.textAlign="left";

  ctx.fillText(
    "GELDSTORY",
    30,
    40
  );


  /* Subtitle */

  if(
    scene.subtitleEnabled &&
    scene.subtitle
  ){

    const text=
      scene.subtitle;

    const maxWidth=
      W*0.82;

    ctx.font=
      "bold 27px Arial";

    const words=
      text.split(" ");

    let lines=[];
    let line="";

    words.forEach(word=>{

      const test=
        line+
        (line?" ":"")+
        word;

      if(
        ctx.measureText(test).width>
        maxWidth
      ){

        lines.push(line);

        line=word;

      }else{

        line=test;

      }

    });

    if(line)
      lines.push(line);

    const lineHeight=34;

    const totalHeight=
      lines.length*
      lineHeight;

    const baseY=
      H-55-totalHeight;

    ctx.fillStyle=
      "rgba(0,0,0,.65)";

    ctx.fillRect(
      W*.08,
      baseY-18,
      W*.84,
      totalHeight+30
    );

    ctx.fillStyle="#fff";

    ctx.textAlign="center";

    lines.forEach(
      (line,i)=>{

        ctx.fillText(
          line,
          W/2,
          baseY+
          i*lineHeight+
          24
        );

      }
    );

  }

}


/* =========================================================
   PREVIEW
   ========================================================= */

function previewScenes(){

  if(!scenes.length){

    alert(
      "Önce sahneleri oluştur."
    );

    return;

  }

  clearInterval(
    previewTimer
  );

  let sceneIndex=0;
  let start=performance.now();

  function tick(now){

    if(
      sceneIndex>=scenes.length
    ){

      clearInterval(
        previewTimer
      );

      return;

    }

    const scene=
      scenes[sceneIndex];

    const elapsed=
      (now-start)/1000;

    let p=
      elapsed/
      Math.max(
        scene.duration,
        .1
      );

    if(p>=1){

      sceneIndex++;

      start=now;

      p=0;

    }

    if(
      sceneIndex<scenes.length
    ){

      drawScene(
        sceneIndex,
        p
      );

    }

    requestAnimationFrame(
      tick
    );

  }

  requestAnimationFrame(
    tick
  );

}


/* =========================================================
   VIDEO DIMENSIONS
   ========================================================= */

function getVideoSize(){

  const f=
    document.getElementById(
      "format"
    ).value;

  if(f==="9:16"){

    return {
      width:720,
      height:1280
    };

  }

  if(f==="1:1"){

    return {
      width:1080,
      height:1080
    };

  }

  return {
    width:1280,
    height:720
  };

}


/* =========================================================
   AUDIO BUFFER
   ========================================================= */

async function decodeAudio(
  audioBlob,
  audioContext
){

  const arrayBuffer=
    await audioBlob.arrayBuffer();

  return await audioContext.decodeAudioData(
    arrayBuffer
  );

}


/* =========================================================
   RENDER WEBM
   ========================================================= */

async function renderVideo(){

  if(!scenes.length){

    alert(
      "Önce sahneleri oluştur."
    );

    return;

  }

  renderStopRequested=false;

  document.getElementById(
    "renderBtn"
  ).disabled=true;

  document.getElementById(
    "stopRenderBtn"
  ).disabled=false;

  document.getElementById(
    "downloadArea"
  ).innerHTML="";

  renderProgress.value=0;

  try{

    const size=
      getVideoSize();

    const canvas=
      document.createElement(
        "canvas"
      );

    canvas.width=size.width;
    canvas.height=size.height;

    const ctx=
      canvas.getContext("2d");

    const fps=
      Number(
        document.getElementById(
          "fps"
        ).value
      );

    const videoStream=
      canvas.captureStream(
        fps
      );

    const audioContext=
      new AudioContext();

    const destination=
      audioContext.createMediaStreamDestination();

    const combinedStream=
      new MediaStream();

    videoStream
      .getVideoTracks()
      .forEach(track=>
        combinedStream.addTrack(track)
      );

    destination
      .stream
      .getAudioTracks()
      .forEach(track=>
        combinedStream.addTrack(track)
      );


    let recorderOptions={
      mimeType:
        "video/webm;codecs=vp8,opus"
    };

    if(
      !MediaRecorder.isTypeSupported(
        recorderOptions.mimeType
      )
    ){

      recorderOptions={
        mimeType:"video/webm"
      };

    }

    const chunks=[];

    const recorder=
      new MediaRecorder(
        combinedStream,
        recorderOptions
      );

    recorder.ondataavailable=e=>{

      if(e.data.size>0){

        chunks.push(e.data);

      }

    };


    recorder.start(
      250
    );

    renderStatus(
      "🎥 Render başladı..."
    );


    for(
      let i=0;
      i<scenes.length;
      i++
    ){

      if(
        renderStopRequested
      ){

        break;

      }

      const scene=
        scenes[i];

      renderStatus(
        "🎥 Sahne "+
        (i+1)+
        "/"+
        scenes.length
      );


      let source=null;

      if(scene.audio){

        try{

          const buffer=
            await decodeAudio(
              scene.audio,
              audioContext
            );

          source=
            audioContext.createBufferSource();

          source.buffer=buffer;

          source.connect(
            destination
          );

          source.connect(
            audioContext.destination
          );

          source.start();

        }catch(e){

          console.warn(
            "Audio decode:",
            e
          );

        }

      }


      const duration=
        Math.max(
          scene.duration || 4,
          .1
        );

      const start=
        performance.now();

      await new Promise(resolve=>{

        function frame(now){

          if(
            renderStopRequested
          ){

            resolve();
            return;

          }

          const elapsed=
            (now-start)/1000;

          let p=
            elapsed/duration;

          if(p>1)p=1;

          ctx.fillStyle="#000";

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          drawSceneOnCanvas(
            ctx,
            canvas.width,
            canvas.height,
            scene,
            p
          );

          renderProgress.value=
            (
              (
                i+
                p
              )/
              scenes.length
            )*100;

          if(
            elapsed>=duration
          ){

            resolve();

          }else{

            requestAnimationFrame(
              frame
            );

          }

        }

        requestAnimationFrame(
          frame
        );

      });


      if(source){

        try{

          source.stop();

        }catch(e){}

      }

    }


    if(
      recorder.state!=="inactive"
    ){

      recorder.stop();

    }


    await new Promise(resolve=>{

      recorder.onstop=resolve;

    });


    const blob=
      new Blob(
        chunks,
        {
          type:
            "video/webm"
        }
      );

    const url=
      URL.createObjectURL(blob);

    document.getElementById(
      "downloadArea"
    ).innerHTML=`

      <div class="panel">

        <h3>✅ Video Hazır</h3>

        <video
          controls
          style="
            width:100%;
            max-height:500px;
            background:#000;
            border-radius:10px;
          "
          src="${url}"
        ></video>

        <br>

        <a
          href="${url}"
          download="GeldStory_V48.2.webm"
        >

          <button class="success">
            ⬇️ WEBM VİDEOYU KAYDET
          </button>

        </a>

      </div>

    `;

    renderStatus(
      "🎉 Render tamamlandı."
    );

  }catch(error){

    console.error(error);

    renderStatus(
      "❌ Render hatası: "+
      error.message
    );

  }finally{

    document.getElementById(
      "renderBtn"
    ).disabled=false;

    document.getElementById(
      "stopRenderBtn"
    ).disabled=true;

  }

}


/* =========================================================
   CANVAS DRAW FOR RENDER
   ========================================================= */

function drawSceneOnCanvas(
  ctx,
  W,
  H,
  scene,
  progress
){

  ctx.fillStyle="#05070a";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(scene.imageObject){

    const img=
      scene.imageObject;

    const scale=
      Math.max(
        W/img.width,
        H/img.height
      );

    let dw=
      img.width*scale;

    let dh=
      img.height*scale;

    let x=
      (W-dw)/2;

    let y=
      (H-dh)/2;


    switch(scene.motion){

      case "zoomIn":{

        const z=
          1+
          progress*.10;

        dw=
          img.width*
          scale*
          z;

        dh=
          img.height*
          scale*
          z;

        x=(W-dw)/2;
        y=(H-dh)/2;

        break;

      }


      case "zoomOut":{

        const z=
          1.10-
          progress*.10;

        dw=
          img.width*
          scale*
          z;

        dh=
          img.height*
          scale*
          z;

        x=(W-dw)/2;
        y=(H-dh)/2;

        break;

      }


      case "panLeft":

        x=
          (W-dw)/2-
          progress*
          Math.max(
            0,
            dw-W
          )*.40;

        break;


      case "panRight":

        x=
          (W-dw)/2+
          progress*
          Math.max(
            0,
            dw-W
          )*.40;

        break;


      case "panUp":

        y=
          (H-dh)/2-
          progress*
          Math.max(
            0,
            dh-H
          )*.40;

        break;


      case "panDown":

        y=
          (H-dh)/2+
          progress*
          Math.max(
            0,
            dh-H
          )*.40;

        break;


      case "kenBurns":{

        const z=
          1+
          progress*.08;

        dw=
          img.width*
          scale*
          z;

        dh=
          img.height*
          scale*
          z;

        x=
          (W-dw)/2-
          progress*25;

        y=
          (H-dh)/2+
          progress*10;

        break;

      }

    }


    ctx.drawImage(
      img,
      x,
      y,
      dw,
      dh
    );

  }


  /* Brand */

  ctx.fillStyle=
    "rgba(0,0,0,.35)";

  ctx.fillRect(
    18,
    15,
    175,
    40
  );

  ctx.fillStyle="#fff";

  ctx.font=
    "bold 18px Arial";

  ctx.textAlign="left";

  ctx.fillText(
    "GELDSTORY",
    30,
    42
  );


  /* Subtitle */

  if(
    scene.subtitleEnabled &&
    scene.subtitle
  ){

    const text=
      scene.subtitle;

    const maxWidth=
      W*.82;

    ctx.font=
      "bold 28px Arial";

    const words=
      text.split(" ");

    const lines=[];

    let line="";

    words.forEach(word=>{

      const test=
        line+
        (line?" ":"")+
        word;

      if(
        ctx.measureText(test).width>
        maxWidth
      ){

        if(line)
          lines.push(line);

        line=word;

      }else{

        line=test;

      }

    });

    if(line)
      lines.push(line);


    const lineHeight=36;

    const total=
      lines.length*
      lineHeight;

    const boxX=
      W*.07;

    const boxY=
      H-total-70;

    const boxW=
      W*.86;

    ctx.fillStyle=
      "rgba(0,0,0,.67)";

    ctx.fillRect(
      boxX,
      boxY,
      boxW,
      total+30
    );

    ctx.fillStyle="#fff";

    ctx.textAlign="center";

    lines.forEach(
      (line,i)=>{

        ctx.fillText(
          line,
          W/2,
          boxY+
          28+
          i*lineHeight
        );

      }
    );

  }

}
