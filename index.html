<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina AI Görsel Testi</title>

<style>
body{
    margin:0;
    background:#080d18;
    color:white;
    font-family:Arial;
    padding:25px;
}

.box{
    max-width:700px;
    margin:auto;
}

input,button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border-radius:10px;
    border:0;
    font-size:16px;
}

input{
    background:#151e30;
    color:white;
}

button{
    background:#5865f2;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#status{
    margin-top:20px;
    padding:15px;
    background:#111827;
    border-radius:10px;
    white-space:pre-wrap;
}

img{
    width:100%;
    margin-top:20px;
    border-radius:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>🎨 Mina AI Görsel Test</h1>

<input
id="prompt"
value="A dark abandoned wooden house deep inside a foggy German forest at midnight, cinematic horror atmosphere, realistic photography, dramatic moonlight, highly detailed, 16:9"
>

<button onclick="generate()">
🎨 AI GÖRSEL OLUŞTUR
</button>

<div id="status">
Hazır.
</div>

<img id="image" style="display:none">

</div>

<script>

const status=
document.getElementById("status");

const image=
document.getElementById("image");


async function generate(){

    const prompt=
    document
    .getElementById("prompt")
    .value
    .trim();


    if(!prompt){

        status.textContent=
        "❌ Prompt boş.";

        return;

    }


    status.textContent=
    "⏳ AI görsel hazırlanıyor...\n"+
    "Bu ücretsiz sistemde sıra beklenebilir.";


    image.style.display="none";


    try{

        /*
          AI Horde ücretsiz anonim API
        */

        const response=
        await fetch(
            "https://aihorde.net/api/v2/generate/async",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "apikey":
                    "0000000000"
                },

                body:JSON.stringify({

                    prompt:prompt,

                    params:{

                        width:1024,

                        height:576,

                        steps:25,

                        cfg_scale:7,

                        sampler_name:
                        "k_euler"

                    },

                    models:[
                        "AlbedoBase XL 3.1",
                        "Juggernaut XL"
                    ],

                    nsfw:false,

                    censor_nsfw:true,

                    r2:true

                })
            }
        );


        if(!response.ok){

            const text=
            await response.text();

            throw new Error(
                "HTTP "+
                response.status+
                "\n"+
                text
            );

        }


        const data=
        await response.json();


        if(!data.id){

            throw new Error(
                "AI Horde görev ID'si döndürmedi."
            );

        }


        const id=
        data.id;


        status.textContent=
        "⏳ Görsel sıraya alındı.\n\n"+
        "Görev: "+
        id+
        "\n\n"+
        "AI çalışanı bekleniyor...";


        /*
          Sonucu kontrol et
        */

        for(
            let i=0;
            i<60;
            i++
        ){

            await sleep(5000);


            const check=
            await fetch(
                "https://aihorde.net/api/v2/generate/status/"+
                id,
                {
                    headers:{
                        "apikey":
                        "0000000000"
                    }
                }
            );


            if(!check.ok){

                throw new Error(
                    "Durum kontrolü HTTP "+
                    check.status
                );

            }


            const result=
            await check.json();


            status.textContent=
            "⏳ AI görsel hazırlanıyor...\n\n"+
            "İlerleme: "+
            Math.round(
                (result.done?1:result.finished?1:0)
                *100
            )+
            "%\n"+
            "Sıradaki bekleme devam ediyor...";


            if(
                result.done &&
                result.generations &&
                result.generations.length
            ){

                const gen=
                result.generations[0];


                /*
                  Horde r2 sonucu
                */

                if(gen.img){

                    image.src=
                    gen.img;

                    image.style.display=
                    "block";


                    status.textContent=
                    "✅ GÖRSEL HAZIR!\n\n"+
                    "Mina AI artık gerçek AI görseli üretebiliyor.";

                    return;

                }

            }

        }


        throw new Error(
            "Görsel zamanında hazırlanmadı. "+
            "Anonim AI Horde kuyruğu yoğun olabilir."
        );


    }catch(error){

        console.error(error);

        status.textContent=
        "❌ HATA\n\n"+
        error.message;

    }

}


function sleep(ms){

    return new Promise(
        resolve=>setTimeout(
            resolve,
            ms
        )
    );

}

</script>

</body>
</html>
