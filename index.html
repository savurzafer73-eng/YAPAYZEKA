/* =====================================================

function randomString(length=64){

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

let result="";

for(let i=0;i<length;i++){

result +=
chars[Math.floor(Math.random()*chars.length)];

}

return result;

}


async function sha256(text){

const data =
new TextEncoder().encode(text);

return crypto.subtle.digest(
"SHA-256",
data
);

}


function base64url(buffer){

return btoa(
String.fromCharCode(
...new Uint8Array(buffer)
)
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

/* =====================================================
   JSON CLEANER
===================================================== */

function cleanAIJson(text){

if(!text)
return null;


let s =
String(text)
.trim();


s =
s.replace(
/```json/gi,
""
);

s =
s.replace(
/```/g,
""
);

s =
s.trim();


const first =
s.indexOf("[");

const last =
s.lastIndexOf("]");


if(first>=0 && last>first){

s =
s.substring(
first,
last+1
);

}


s =
s
.replace(/[“”]/g,'"')
.replace(/[‘’]/g,"'")
.replace(/\u00a0/g," ");


/*
   Bozuk AI JSON düzeltmeleri.
*/

s =
s.replace(
/,\s*,/g,
","
);

s =
s.replace(
/{\s*,/g,
"{"
);

s =
s.replace(
/,\s*}/g,
"}"
);

s =
s.replace(
/,\s*]/g,
"]"
);

s =
s.replace(
/}\s*,\s*}/g,
"}}"
);

s =
s.replace(
/}\s*,\s*{/g,
"},{"
);


try{

return JSON.parse(s);

}catch(error){

/*
   İkinci kurtarma.
*/

const result=[];

const regex =
/\{[\s\S]*?\}/g;

const matches =
s.match(regex)||[];


for(
const item of matches
){

try{

const object =
JSON.parse(item);

if(
object &&
(
object.narration ||
object.text ||
object.visual ||
object.prompt ||
object.description
)
){

result.push(object);

}

}catch(_){}

}


if(result.length)
return result;


return null;

}

}

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function blobToDataURL(blob){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload =
()=>resolve(reader.result);

reader.onerror =
reject;

reader.readAsDataURL(blob);

}
);


/* =====================================================
   PIPER WEB TTS
===================================================== */

/*
   Piper paketini CDN üzerinden yüklemeyi deniyoruz.

   NOT:
   Piper sürümleri arasında API farklılıkları olabilir.
   Bu nedenle aşağıdaki fonksiyon birden fazla API
   biçimini desteklemeye çalışır.
*/

let PiperModule=null;


async function loadPiper(){

if(PiperModule)
return PiperModule;


voiceStatus.textContent =
"⏳ AI ses motoru yükleniyor...";


const urls=[

"https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web/+esm",

"https://esm.sh/@mintplex-labs/piper-tts-web",

"https://unpkg.com/@mintplex-labs/piper-tts-web?module"

];


let lastError=null;


for(
const url of urls
){

try{

PiperModule =
await import(url);

return PiperModule;

}catch(error){

lastError=error;

}

}


throw new Error(
"Piper ses motoru yüklenemedi. "+
(lastError?.message||"")
);

}


/* =====================================================
   PIPER VOICE
===================================================== */

async function createPiperVoice(
tts,
voiceId
){

/*
   Olası API 1
*/

if(
typeof tts.createVoice ===
"function"
){

return await tts.createVoice(
voiceId
);

}


/*
   Olası API 2
*/

if(
typeof tts.Voice ===
"function"
){

return new tts.Voice(
voiceId
);

}


/*
   Olası API 3
*/

if(
typeof tts.loadVoice ===
"function"
){

return await tts.loadVoice(
voiceId
);

}


return null;

}


/* =====================================================
   PIPER SYNTH
===================================================== */

async function synthesizeWithPiper(
text
){

const tts =
await loadPiper();


const candidates =
getVoiceCandidates();


let lastError=null;


for(
const voiceId of candidates
){

try{

voiceStatus.textContent =
"🎙️ "+
getLanguageName()+
" sesi hazırlanıyor...";


/*
   Önce modern predict API.
*/

if(
typeof tts.predict ===
"function"
){

const result =
await tts.predict({

text:text,

voiceId:voiceId

});


if(result){

return result;

}

}


/*
   Voice oluşturup predict.
*/

const voice =
await createPiperVoice(
tts,
voiceId
);


if(
voice &&
typeof voice.predict ===
"function"
){

const result =
await voice.predict(
text
);

if(result)
return result;

}


}catch(error){

lastError=error;

}

}


throw new Error(
"Piper için uygun "+
getLanguageName()+
" ses modeli bulunamadı. "+
(lastError?.message||"")
);

}


/* =====================================================
   WAV PARÇALAMA
===================================================== */

function splitText(text,maxLength=650){

const words =
text.split(/\s+/);

const chunks=[];

let current="";


for(
const word of words
){

const test =
current
? current+" "+word
: word;


if(
test.length>maxLength
){

if(current)
chunks.push(current);

current=word;

}else{

current=test;

}

}


if(current)
chunks.push(current);


return chunks;

}

async function mergeWavs(blobs){

if(!blobs.length)
throw new Error(
"Ses üretilemedi."
);


if(blobs.length===1)
return blobs[0];


const buffers=[];


for(
const blob of blobs
){

buffers.push(
await blob.arrayBuffer()
);

}


const first =
new DataView(
buffers[0]
);


const channels =
first.getUint16(
22,
true
);

const sampleRate =
first.getUint32(
24,
true
);

const bits =
first.getUint16(
34,
true
);


let totalPCM=0;

const pcmParts=[];


for(
const buffer of buffers
){

const view =
new DataView(buffer);


let dataOffset=44;

let dataSize =
view.getUint32(
40,
true
);


/*
   WAV formatı farklı header
   kullanıyorsa data chunk'ını ara.
*/

if(
String.fromCharCode(
view.getUint8(36),
view.getUint8(37),
view.getUint8(38),
view.getUint8(39)
)!=="data"
){

let offset=12;

while(
offset+8<
buffer.byteLength
){

const id =
String.fromCharCode(
view.getUint8(offset),
view.getUint8(offset+1),
view.getUint8(offset+2),
view.getUint8(offset+3)
);

const size =
view.getUint32(
offset+4,
true
);

if(id==="data"){

dataOffset=
offset+8;

dataSize=size;

break;

}

offset +=
8+size;

}

}


const pcm =
buffer.slice(
dataOffset,
dataOffset+dataSize
);


pcmParts.push(pcm);

totalPCM +=
pcm.byteLength;

}


const output =
new ArrayBuffer(
44+totalPCM
);

const out =
new DataView(output);


function writeString(
offset,
text
){

for(
let i=0;
i<text.length;
i++
){

out.setUint8(
offset+i,
text.charCodeAt(i)
);

}

}


writeString(
0,
"RIFF"
);

out.setUint32(
4,
36+totalPCM,
true
);

writeString(
8,
"WAVE"
);

writeString(
12,
"fmt "
);

out.setUint32(
16,
16,
true
);

out.setUint16(
20,
1,
true
);

out.setUint16(
22,
channels,
true
);

out.setUint32(
24,
sampleRate,
true
);

const byteRate =
sampleRate*
channels*
bits/8;

out.setUint32(
28,
byteRate,
true
);

const blockAlign =
channels*
bits/8;

out.setUint16(
32,
blockAlign,
true
);

out.setUint16(
34,
bits,
true
);

writeString(
36,
"data"
);

out.setUint32(
40,
totalPCM,
true
);


let offset=44;


for(
const part of pcmParts
){

new Uint8Array(
output,
offset,
part.byteLength
).set(
new Uint8Array(part)
);

offset +=
part.byteLength;

}


return new Blob(
[output],
{
type:"audio/wav"
}
);

}

/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src){

return new Promise(
(resolve,reject)=>{

const image =
new Image();

image.onload =
()=>resolve(image);

image.onerror =
()=>reject(
new Error(
"Görsel yüklenemedi."
)
);

image.src=src;

}
);


/* =====================================================
   VIDEO
===================================================== */

videoBtn.onclick =
async()=>{

if(!selectedAudioBlob){

alert(
"Önce AI seslendirmeyi oluştur."
);

return;

}


if(!scenesData.length){

alert(
"Önce sahneleri oluştur."
);

return;

}


videoBtn.disabled=true;

downloadBtn.style.display="none";

preview.style.display="none";


videoStatus.textContent =
"⏳ Sesli video hazırlanıyor...";


try{

const audio =
new Audio();

audio.src =
URL.createObjectURL(
selectedAudioBlob
);

audio.preload="auto";


await new Promise(
(resolve,reject)=>{

audio.onloadedmetadata =
resolve;

audio.onerror =
()=>reject(
new Error(
"AI ses dosyası okunamadı."
)
);

}
);


const AudioContextClass =
window.AudioContext ||
window.webkitAudioContext;


if(!AudioContextClass){

throw new Error(
"Tarayıcı Web Audio desteklemiyor."
);

}


const audioContext =
new AudioContextClass();


const source =
audioContext.createMediaElementSource(
audio
);


const destination =
audioContext.createMediaStreamDestination();


source.connect(
destination
);

source.connect(
audioContext.destination
);


const canvas =
document.createElement(
"canvas"
);

canvas.width=1280;

canvas.height=720;


const ctx =
canvas.getContext("2d");


const videoStream =
canvas.captureStream(30);


const finalStream =
new MediaStream();


videoStream
.getVideoTracks()
.forEach(
track=>
finalStream.addTrack(track)
);


destination.stream
.getAudioTracks()
.forEach(
track=>
finalStream.addTrack(track)
);


let mime =
"video/webm;codecs=vp9,opus";


if(
!MediaRecorder
.isTypeSupported(mime)
){

mime =
"video/webm;codecs=vp8,opus";

}


if(
!MediaRecorder
.isTypeSupported(mime)
){

mime =
"video/webm";

}


const recorder =
new MediaRecorder(
finalStream,
{
mimeType:mime
}
);


const chunks=[];


recorder.ondataavailable =
event=>{

if(
event.data &&
event.data.size>0
){

chunks.push(
event.data
);

}

};


const finished =
new Promise(
resolve=>{

recorder.onstop =
resolve;

}
);


const images=[];


for(
let i=0;
i<scenesData.length;
i++
){

if(
scenesData[i].image
){

try{

images[i] =
await loadImage(
scenesData[i].image
);

}catch(_){}

}

}


const duration =
Math.max(
audio.duration||30,
10
);


const sceneDuration =
duration/
scenesData.length;


recorder.start(250);


await audioContext.resume();


audio.currentTime=0;

await audio.play();


const start =
performance.now();


function drawFrame(){

const elapsed =
(
performance.now()-
start
)/1000;


if(
elapsed>=duration
){

recorder.stop();

return;

}


const index =
Math.min(
scenesData.length-1,
Math.floor(
elapsed/
sceneDuration
)
);


const img =
images[index];


ctx.fillStyle="#000";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


if(img){

const local =
elapsed-
index*sceneDuration;


const zoom =
1+
Math.min(
0.08,
local/
sceneDuration*
0.08
);


const ratio =
Math.max(
canvas.width/img.width,
canvas.height/img.height
);


const width =
img.width*
ratio*
zoom;


const height =
img.height*
ratio*
zoom;


ctx.drawImage(
img,

(canvas.width-width)/2,

(canvas.height-height)/2,

width,
height
);

}


/*
   Altyazı
*/

const text =
scenesData[index].text;


if(text){

ctx.fillStyle =
"rgba(0,0,0,.68)";


ctx.fillRect(
35,
canvas.height-140,
canvas.width-70,
95
);


ctx.fillStyle="#fff";

ctx.font =
"bold 29px Arial";

ctx.textAlign =
"center";


drawWrappedText(
ctx,
text,
canvas.width/2,
canvas.height-98,
canvas.width-120
);

}


progressBar.style.width =
Math.min(
100,
elapsed/duration*100
)+
"%";


requestAnimationFrame(
drawFrame
);

}


drawFrame();


await finished;


audio.pause();


try{

audioContext.close();

}catch(_){}


videoBlob =
new Blob(
chunks,
{
type:mime
}
);


const videoURL =
URL.createObjectURL(
videoBlob
);


preview.src =
videoURL;

preview.style.display =
"block";


downloadBtn.style.display =
"block";


downloadBtn.onclick =
()=>{

const link =
document.createElement("a");

link.href =
videoURL;

link.download =
"mina-video-"+
Date.now()+
".webm";

document.body.appendChild(
link
);

link.click();

link.remove();

};


progressBar.style.width =
"100%";


videoStatus.textContent =
"✅ Video hazır! "+
getLanguageName()+
" AI sesi videoya eklendi.";


}catch(error){

console.error(error);


videoStatus.textContent =
"❌ Video hatası: "+
error.message;

}


videoBtn.disabled=false;

};


/* =====================================================
   WRAPPED TEXT
===================================================== */

function drawWrappedText(
ctx,
text,
x,
y,
maxWidth
){

const words =
String(text)
.split(/\s+/);

let line="";

const lines=[];


for(
const word of words
){

const test =
line
? line+" "+word
: word;


if(
ctx.measureText(test)
.width>
maxWidth &&
line
){

lines.push(line);

line=word;

}else{

line=test;

}

}


if(line)
lines.push(line);


const lineHeight=34;


const startY =
y-
(lines.length-1)*
lineHeight/
2;


lines.forEach(
(line,index)=>{

ctx.fillText(
line,
x,
startY+
index*lineHeight
);

});

}
