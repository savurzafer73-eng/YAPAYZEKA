<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Mina Video Test</title>
<style>
body{
    background:#080b12;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:30px;
}
button{
    padding:15px 25px;
    border:0;
    border-radius:10px;
    background:#356df3;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
video{
    width:90%;
    max-width:700px;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>🎬 Mina Video Motor Testi</h1>

<button onclick="startTest()">
🎥 TEST VİDEOSU OLUŞTUR
</button>

<p id="status">Hazır</p>

<video id="video" controls></video>

<br><br>

<a id="download"
style="display:none;color:white;background:#159447;padding:14px 20px;border-radius:10px;text-decoration:none;">
⬇️ VİDEOYU İNDİR
</a>

<script>

async function startTest(){

    const status=document.getElementById("status");

    status.textContent="Video oluşturuluyor...";

    const canvas=document.createElement("canvas");

    canvas.width=1280;
    canvas.height=720;

    const ctx=canvas.getContext("2d");

    const stream=canvas.captureStream(30);

    if(!window.MediaRecorder){

        status.textContent=
        "❌ Bu tarayıcı MediaRecorder desteklemiyor.";

        return;
    }

    let type="video/webm";

    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9"
        )
    ){
        type="video/webm;codecs=vp9";
    }

    const recorder=
        new MediaRecorder(
            stream,
            {mimeType:type}
        );

    const chunks=[];

    recorder.ondataavailable=function(e){

        if(e.data.size>0){
            chunks.push(e.data);
        }

    };

    recorder.onerror=function(e){

        status.textContent=
        "❌ MediaRecorder hatası";

        console.error(e);

    };

    const finished=new Promise(resolve=>{

        recorder.onstop=resolve;

    });

    recorder.start(100);

    const start=Date.now();

    while(Date.now()-start<5000){

        const elapsed=
            Date.now()-start;

        const sec=
            elapsed/1000;

        /* Arka plan */

        const gradient=
            ctx.createLinearGradient(
                0,
                0,
                1280,
                720
            );

        gradient.addColorStop(
            0,
            "#101b35"
        );

        gradient.addColorStop(
            1,
            "#03050a"
        );

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,
            0,
            1280,
            720
        );

        /* Hareketli daire */

        ctx.beginPath();

        ctx.arc(
            640+
            Math.sin(sec)*250,
            360,
            80,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#356df3";

        ctx.fill();

        /* Yazı */

        ctx.fillStyle="white";

        ctx.font=
            "bold 48px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "MYSTERY NACHT",
            640,
            180
        );

        ctx.font=
            "30px Arial";

        ctx.fillText(
            "MINA VIDEO AI TEST",
            640,
            580
        );

        await new Promise(
            r=>setTimeout(r,33)
        );

    }

    recorder.stop();

    await finished;

    const blob=
        new Blob(
            chunks,
            {type:"video/webm"}
        );

    if(blob.size===0){

        status.textContent=
        "❌ Video dosyası boş oluştu.";

        return;
    }

    const url=
        URL.createObjectURL(blob);

    document.getElementById("video").src=url;

    const download=
        document.getElementById("download");

    download.href=url;

    download.download=
        "mina-test.webm";

    download.style.display="inline-block";

    status.textContent=
        "✅ BAŞARILI! Video oluşturuldu. Dosya boyutu: "+
        Math.round(blob.size/1024)+
        " KB";

}

</script>

</body>
</html>
