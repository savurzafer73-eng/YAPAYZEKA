<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mina Gemini Görsel Test</title>

<style>
body{
    margin:0;
    background:#090d18;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

.box{
    max-width:700px;
    margin:auto;
    background:#121a2a;
    padding:25px;
    border-radius:18px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:120px;
    box-sizing:border-box;
    padding:15px;
    border-radius:12px;
    border:1px solid #39445c;
    background:#080c15;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    margin-top:15px;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#5b5ff0;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

#status{
    margin-top:20px;
    padding:14px;
    background:#080c15;
    border-radius:10px;
    white-space:pre-wrap;
}

img{
    width:100%;
    margin-top:20px;
    border-radius:14px;
    display:none;
}

#error{
    margin-top:15px;
    color:#ff8585;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="box">

<h1>🍌 Mina Gemini Görsel Test</h1>

<textarea id="prompt">A mysterious abandoned castle in Germany at midnight, thick fog surrounding the castle, full moon behind dark clouds, cinematic realistic photography, extremely detailed, dark mysterious atmosphere, 16:9</textarea>

<button id="btn">🎨 GÖRSEL OLUŞTUR</button>

<div id="status">Hazır.</div>

<img id="image">

<div id="error"></div>

</div>

<script>

const API_KEY = "BURAYA_API_ANAHTARINI_YAPIŞTIR";

const MODEL = "gemini-3.1-flash-image";

const ENDPOINT =
"https://generativelanguage.googleapis.com/v1beta/interactions";

const btn = document.getElementById("btn");
const status = document.getElementById("status");
const image = document.getElementById("image");
const errorBox = document.getElementById("error");

btn.onclick = async function(){

    const prompt =
        document.getElementById("prompt").value.trim();

    if(!prompt){
        errorBox.textContent = "Bir konu yaz.";
        return;
    }

    if(
        API_KEY === "BURAYA_API_ANAHTARINI_YAPIŞTIR"
    ){
        errorBox.textContent =
            "Önce kodun içindeki API_KEY bölümüne kendi Google API anahtarını yapıştır.";
        return;
    }

    btn.disabled = true;

    image.style.display = "none";
    errorBox.textContent = "";

    status.textContent =
        "⏳ Gemini görsel oluşturuyor...\n\n" +
        "Lütfen bekle.";

    try{

        const response = await fetch(
            ENDPOINT,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "x-goog-api-key":API_KEY
                },

                body:JSON.stringify({

                    model:MODEL,

                    input:prompt,

                    response_format:{
                        type:"image",
                        mime_type:"image/jpeg",
                        aspect_ratio:"16:9",
                        image_size:"1K"
                    }

                })
            }
        );

        const data = await response.json();

        console.log("Gemini:",data);

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                "\n\n" +
                (
                    data.error?.message ||
                    JSON.stringify(data,null,2)
                )
            );
        }

        let imageData = null;

        if(data.outputImage){

            imageData =
                data.outputImage.data ||
                data.outputImage.image?.data;
        }

        if(!imageData && data.outputs){

            for(const item of data.outputs){

                if(
                    item.type === "image" &&
                    item.image
                ){

                    imageData =
                        item.image.data ||
                        item.data;

                    break;
                }
            }
        }

        if(!imageData){

            throw new Error(
                "Gemini cevap verdi fakat görsel verisi bulunamadı.\n\n" +
                JSON.stringify(data,null,2)
            );
        }

        image.src =
            "data:image/jpeg;base64," +
            imageData;

        image.style.display = "block";

        status.textContent =
            "✅ BAŞARILI!\n\n" +
            "Gemini AI görseli oluşturdu.";

    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Görsel oluşturulamadı.";

        errorBox.textContent =
            error.message;

    }finally{

        btn.disabled = false;
    }

};

</script>

</body>
</html>
