<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b14;color:#fff;font-family:Arial,sans-serif
}
.wrap{max-width:900px;margin:auto;padding:18px}
h1{text-align:center;color:#8b5cf6;margin:8px 0}
.sub{text-align:center;color:#aaa;margin-bottom:20px}
.box{

 padding:16px;margin-bottom:15px
}
label{display:block;font-weight:bold;margin:10px 0 6px}
select,input,textarea,button{
 width:100%;padding:12px;border-radius:10px;border:1px solid #374151;
 background:#0b1220;color:white;font-size:15px
}
textarea{min-height:210px;resize:vertical;line-height:1.5}
button{
 cursor:pointer;background:#7c3aed;border:0;font-weight:bold;margin-top:8px
}
button:hover{background:#6d28d9}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
.card{
 background:#0b1220;border:1px solid #30394c;border-radius:12px;
 padding:12px
}
.small{font-size:12px;color:#9ca3af}
.counter{text-align:right;color:#a78bfa;font-weight:bold;margin-top:5px}
.progress{
 height:10px;background:#252b38;border-radius:20px;overflow:hidden;margin-top:10px
}
.bar{height:100%;width:0;background:#8b5cf6}
.sceneTitle{color:#c4b5fd;font-weight:bold}
img.preview{
 width:100%;height:150px;object-fit:cover;border-radius:8px;margin-top:8px
}
canvas{
 width:100%;max-width:800px;display:block;margin:15px auto;
 background:#000;border-radius:12px
}
#status{text-align:center;color:#a78bfa;min-height:24px;margin:10px}
.danger{color:#f87171}
.ok{color:#4ade80}
@media(max-width:650px){
 .row,.grid{grid-template-columns:1fr}
 .wrap{padding:10px}
}
</style>
</head>

<div class="wrap">

<h1>🎬 MINA VIDEO AI</h1>
<div class="sub">V12.5 • Mystery Nacht Video Studio</div>

<div class="box">
<label>🔎 Gizemli Olay</label>
<select id="mystery"></select>

<div>

<option value="4">4 dakika</option>
<option value="5">5 dakika</option>
<option value="6">6 dakika</option>

<option value="10">10 dakika</option>
<option value="11">11 dakika</option>
<option value="12" selected>12 dakika</option>
</select>
</div>
</div>

<div class="row">
<div>
<label>🎬 Sahne Sayısı</label>
<select id="sceneCount">
<option value="4">4 Sahne</option>
<option value="5">5 Sahne</option>
<option value="6" selected>6 Sahne</option>
</select>
</div>

<div>
<label>🎨 Stil</label>
<select id="style">
<option>Sinematik</option>
<option>Karanlık/Gizemli</option>
<option>Fotogerçekçi</option>
<option>Fantastik</option>

<option>2D Animasyon</option>
<option>Aksiyon</option>
<option>Orta Çağ</option>
<option>Epik</option>
</select>
</div>
</div>

<button onclick="generateScript()">🧠 SENARYO OLUŞTUR</button>
</div>

<div class="box">
<label>📝 Senaryo</label>
<textarea id="script" maxlength="999"
placeholder="Burada maksimum 999 karakterlik senaryo olacak..."></textarea>
<div class="counter"><span id="count">0</span> / 999</div>

<div class="small">
⚠️ Bu sürümde kullanılabilir maksimum alan 999 karakterdir.
</div>

<div class="row">
<button onclick="copyScript()">📋 Kopyala</button>
<button onclick="clearScript()">🗑️ Temizle</button>
</div>
</div>

<div class="box">
<label>🎙️ TTSMaker Ses Dosyası</label>
<input type="file" id="audioFile" accept="audio/*">
<div id="audioInfo" class="small">Henüz ses yüklenmedi.</div>
</div>

<div class="box">
<label>🎬 Sahneler</label>
<div id="scenes" class="grid"></div>
</div>

<div class="box">
<button onclick="prepareScenes()">🔄 SAHNELERİ HAZIRLA</button>
<button onclick="renderVideo()">🎥 VİDEOYU OLUŞTUR</button>
</div>

<div id="status"></div>
<div class="progress"><div id="bar" class="bar"></div></div>

<canvas id="canvas" width="1280" height="720"></canvas>

<div class="box">
<button id="downloadBtn" style="display:none">⬇️ VİDEOYU İNDİR</button>
</div>

</div>

const count=document.getElementById("count");
script.addEventListener("input",()=>{
 if(script.value.length>MAX)script.value=script.value.slice(0,MAX);
 count.textContent=script.value.length;
});

let audioFile=null;
let audioDuration=0;
let scenes=[];
let finalBlob=null;

document.getElementById("audioFile").addEventListener("change",e=>{
 audioFile=e.target.files[0];
 if(!audioFile)return;
 const a=new Audio();
 a.preload="metadata";
 a.onloadedmetadata=()=>{
  audioDuration=a.duration;
  document.getElementById("audioInfo").innerHTML=
   "🎵 "+audioFile.name+" • "+formatTime(audioDuration);
 };
 a.src=URL.createObjectURL(audioFile);
});

function formatTime(s){
 if(!isFinite(s))return "--:--";
 let m=Math.floor(s/60);
 let sec=Math.floor(s%60).toString().padStart(2,"0");
 return m+":"+sec;
}

function clampText(t){
 t=(t||"").replace(/\s+/g," ").trim();
 if(t.length<=MAX)return t;
 let x=t.slice(0,MAX);
 let p=Math.max(x.lastIndexOf("."),x.lastIndexOf("!"),x.lastIndexOf("?"));
 if(p>700)x=x.slice(0,p+1);
 else{
  let s=x.lastIndexOf(" ");
  if(s>800)x=x.slice(0,s);
 }
 return x.slice(0,MAX).trim();
}

function generateScript(){
 const item=M[Number(mystery.value)];
 const lang=document.getElementById("language").value;
 const min=document.getElementById("duration").value;
 const style=document.getElementById("style").value;

 let intro="",body="",end="";

 if(lang==="de"){
  intro="Heute erzählen wir einen der rätselhaftesten Fälle der Geschichte. ";
  body=item[1]+" ";
  end="Bis heute bleiben wichtige Fragen offen. Was wirklich geschah, wissen wir nicht. ";
 }else if(lang==="en"){
  intro="Today we explore one of the most mysterious cases in history. ";
  body=item[1]+" ";
  end="Important questions remain unanswered. What really happened is still unknown. ";
 }else{
  intro="Bugün tarihin en gizemli olaylarından birini inceliyoruz. ";
  body=item[1]+" ";
  end="Önemli sorular hâlâ cevapsız. Gerçekte ne olduğunu kesin olarak bilmiyoruz. ";
 }

 let extra=lang==="de"
 ? "Forscher haben verschiedene Erklärungen vorgeschlagen. Einige Hinweise sind bekannt, andere bleiben umstritten. Der Fall fasziniert Menschen bis heute. "
 :lang==="en"
 ? "Researchers have proposed several explanations. Some clues are known, while others remain disputed. The case still fascinates people today. "
 : "Araştırmacılar çeşitli açıklamalar ortaya koydu. Bazı ipuçları biliniyor, bazıları ise tartışmalı. Bu olay bugün bile insanları meraklandırıyor. ";

 let text=intro+body;
 while((text+extra+end).length<Math.min(MAX,Math.max(350,Number(min)*80))){
  text+=extra;
 }
 text+=end;

 script.value=clampText(text);
 count.textContent=script.value.length;
 prepareScenes();
 setStatus("✅ "+script.value.length+" karakterlik senaryo hazır.","ok");
}

function copyScript(){
 script.select();
 document.execCommand("copy");
 setStatus("📋 Senaryo kopyalandı.","ok");
}

function clearScript(){
 script.value="";
 count.textContent="0";
 document.getElementById("scenes").innerHTML="";
 scenes=[];
}

function splitText(text,n){
 let words=text.trim().split(/\s+/);
 let result=[];
 let total=words.length;
 for(let i=0;i<n;i++){
  let a=Math.floor(i*total/n);
  let b=Math.floor((i+1)*total/n);
  result.push(words.slice(a,b).join(" "));
 }
 return result;
}

function prepareScenes(){
 let text=clampText(script.value);
 script.value=text;
 count.textContent=text.length;

 const n=Number(document.getElementById("sceneCount").value);
 const style=document.getElementById("style").value;
 const parts=splitText(text,n);
 scenes=[];

 const box=document.getElementById("scenes");
 box.innerHTML="";

 parts.forEach((p,i)=>{
  let obj={
   subtitle:p,
   prompt:`${style}, mysterious cinematic scene, ${M[i%M.length][0]}, dark atmosphere, dramatic lighting, realistic details`,
   image:null
  };
  scenes.push(obj);

  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`
   <div class="sceneTitle">🎬 SAHNE ${i+1}</div>
   <label>📝 Altyazı</label>
   <textarea id="sub${i}" maxlength="999">${p}</textarea>
   <label>🖼️ Görsel</label>
   <input type="file" accept="image/*" onchange="loadImage(${i},this)">
   <img id="img${i}" class="preview" style="display:none">
   <label>🤖 Görsel Promptu</label>
   <textarea id="prompt${i}" style="min-height:90px">${obj.prompt}</textarea>
  `;
  box.appendChild(div);
 });
}

function loadImage(i,input){
 const file=input.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{
  scenes[i].image=e.target.result;
  const im=document.getElementById("img"+i);
  im.src=e.target.result;
  im.style.display="block";
 };
 reader.readAsDataURL(file);
}

function setStatus(t,c=""){
 const s=document.getElementById("status");
 s.textContent=t;
 s.className=c;
}

function drawFrame(ctx,w,h,text,img,i,total){
 ctx.fillStyle="#05070d";
 ctx.fillRect(0,0,w,h);

 if(img){
  const image=new Image();
  image.src=img;
  if(image.complete){
   drawCover(ctx,image,w,h);
  }else{
   image.onload=()=>{
    drawCover(ctx,image,w,h);
    drawOverlay(ctx,w,h,text,i,total);
   };
  }
 }else{
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,"#111827");
  g.addColorStop(1,"#020617");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,w,h);
 }

 drawOverlay(ctx,w,h,text,i,total);
}

function drawCover(ctx,img,w,h){
 const r=Math.max(w/img.width,h/img.height);
 const nw=img.width*r,nh=img.height*r;
 ctx.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh);
 ctx.fillStyle="rgba(0,0,0,.42)";
 ctx.fillRect(0,0,w,h);
}

function drawOverlay(ctx,w,h,text,i,total){
 ctx.fillStyle="rgba(0,0,0,.45)";
 ctx.fillRect(0,0,w,70);

 ctx.fillStyle="#fff";
 ctx.font="bold 28px Arial";
 ctx.fillText("MYSTERY NACHT",35,45);

 ctx.font="bold 22px Arial";
 ctx.fillText(`SZENE ${i+1}/${total}`,w-190,45);

 ctx.fillStyle="rgba(0,0,0,.82)";
 ctx.fillRect(45,h-180,w-90,125);

 ctx.fillStyle="#fff";
 ctx.font="bold 27px Arial";

 let lines=wrapText(ctx,text,w-140);
 let y=h-140;

 lines.slice(0,4).forEach(line=>{
  ctx.fillText(line,70,y);
  y+=34;
 });
}

function wrapText(ctx,text,max){
 const words=(text||"").split(/\s+/);
 const lines=[];
 let line="";
 words.forEach(word=>{
  const test=line?line+" "+word:word;
  if(ctx.measureText(test).width>max){
   if(line)lines.push(line);
   line=word;
  }else line=test;
 });
 if(line)lines.push(line);
 return lines;
}

async function renderVideo(){
 if(!script.value.trim()){
  setStatus("❌ Önce senaryo oluştur.","danger");
  return;
 }
 if(!audioFile){
  setStatus("❌ Önce TTSMaker ses dosyasını yükle.","danger");
  return;
 }
 if(!audioDuration){
  setStatus("❌ Ses süresi okunamadı.","danger");
  return;
 }

 prepareScenes();

 const canvas=document.getElementById("canvas");
 const ctx=canvas.getContext("2d");
 const stream=canvas.captureStream(30);

 const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 const dest=audioCtx.createMediaStreamDestination();

 const buf=await audioFile.arrayBuffer();
 const decoded=await audioCtx.decodeAudioData(buf.slice(0));

 const source=audioCtx.createBufferSource();
 source.buffer=decoded;
 source.connect(dest);
 source.connect(audioCtx.destination);

 dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));

 let recorder;
 try{
  recorder=new MediaRecorder(stream,{mimeType:"video/webm;codecs=vp9,opus"});
 }catch(e){
  recorder=new MediaRecorder(stream);
 }

 const chunks=[];
 recorder.ondataavailable=e=>{
  if(e.data.size)chunks.push(e.data);
 };

 recorder.onstop=()=>{
  finalBlob=new Blob(chunks,{type:"video/webm"});
  const url=URL.createObjectURL(finalBlob);
  const btn=document.getElementById("downloadBtn");
  btn.style.display="block";
  btn.onclick=()=>{
   const a=document.createElement("a");
   a.href=url;
   a.download="mystery-nacht.webm";
   a.click();
  };
  setProgress(100);
  setStatus("✅ Video hazır! Ses + görüntü + altyazı işlendi.","ok");
 };

 await audioCtx.resume();
 recorder.start(100);

 const start=performance.now();

 function frame(now){
  const elapsed=(now-start)/1000;

  if(elapsed>=audioDuration){
   source.stop();
   recorder.stop();
   audioCtx.close();
   return;
  }

  const ratio=elapsed/audioDuration;
  let index=Math.min(scenes.length-1,Math.floor(ratio*scenes.length));
  let scene=splitText(script.value,scenes.length)[index]||"";
  let image=scenes[index]?.image||null;

  drawFrame(ctx,canvas.width,canvas.height,scene,image,index,scenes.length);

  setProgress((elapsed/audioDuration)*100);
  requestAnimationFrame(frame);
 }

 requestAnimationFrame(frame);
}

function setProgress(v){
 document.getElementById("bar").style.width=Math.max(0,Math.min(100,v))+"%";
}
