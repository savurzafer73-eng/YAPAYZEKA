<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina AI Görsel Test</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080c18;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(700px,94%);
    margin:30px auto;
}

h1{
    text-align:center;
    font-size:30px;
    margin-bottom:8px;
}

.sub{
    text-align:center;
    color:#9da8bd;
    margin-bottom:25px;
}

.box{
    background:#12192b;
    border:1px solid #293653;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #3a4969;
    background:#0a1020;
    color:white;
    font-size:16px;
    outline:none;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#5865f2;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

#status{
    margin-top:15px;
    padding:14px;
    border-radius:10px;
    background:#0a1020;
    color:#cbd5e1;
    white-space:pre-wrap;
    line-height:1.5;
}

#resultBox{
    display:none;
}

#result{
    width:100%;
    display:block;
    border-radius:14px;
    margin-top:15px;
}

#download{
    display:none;
    margin-top:15px;
    width:100%;
    padding:14px;
    background:#159447;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Mina AI Görsel</h1>

<div class="sub">
KONU → AI GÖRSEL → EKRANDA
</div>

<div class="box">

<label>Görsel konusu</label>

<input
    id="topic"
    value="Gece yarısı terk edilmiş bir ormanda bulunan gizemli eski ev"
    placeholder="Bir konu yaz..."
>

<button id="generate">
🖼️ AI GÖRSEL OLUŞTUR
</button>

<div id="status">
Hazır.
</div>

</div>

<div id="resultBox" class="box">

<h2>✨ AI Görsel</h2>

<img id="result">

<a id="download" download="mina-ai-gorsel.png">
⬇️ GÖRSELİ KAYDET
</a>

</div>

</div>

<script>

const topic = document.getElementById("topic");
const generate = document.getElementById("generate");
const status = document.getElementById("status");
const resultBox = document.getElementById("resultBox");
const result = document.getElementById("result");
const download = document.getElementById("download");


function setStatus(text){
    status.textContent = text;
}


generate.onclick = async function(){

    const konu = topic.value.trim();

    if(!konu){
        setStatus("❌ Önce bir konu yaz.");
        return;
    }

    /*
      Daha önce Pollinations OAuth ile aldığımız token.
    */
    const token =
        localStorage.getItem("mina_pollinations_token");

    if(!token){

        setStatus(
            "❌ Pollinations bağlantısı bulunamadı.\n\n" +
            "Önce Mina Video AI içindeki Pollinations OAuth bağlantısını yap."
        );

        return;
    }


    generate.disabled = true;

    resultBox.style.display = "none";
    download.style.display = "none";

    setStatus(
        "⏳ AI görsel oluşturuluyor...\n\n" +
        "Lütfen bekle."
    );


    try{

        const prompt =
            konu +
            ", cinematic, mysterious atmosphere, " +
            "dramatic lighting, realistic photography, " +
            "high detail, dark cinematic style";


        /*
          Güncel Pollinations Images API
        */

        const response = await fetch(
            "https://gen.pollinations.ai/v1/images/generations",
            {
                method:"POST",

                headers:{
                    "Authorization":"Bearer " + token,
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    prompt:prompt,

                    model:
                    "black-forest-labs/flux.1-schnell",

                    size:"1024x1024",

                    n:1,

                    response_format:"b64_json"

                })
            }
        );


        const text = await response.text();


        if(!response.ok){

            let errorMessage = text;

            try{

                const json = JSON.parse(text);

                if(json.error){

                    if(typeof json.error === "string"){
                        errorMessage = json.error;
                    }
                    else if(json.error.message){
                        errorMessage = json.error.message;
                    }

                }

                else if(json.message){
                    errorMessage = json.message;
                }

            }catch(e){}


            throw new Error(
                "HTTP " +
                response.status +
                "\n\n" +
                errorMessage
            );
        }


        let data;

        try{

            data = JSON.parse(text);

        }catch(e){

            throw new Error(
                "Sunucudan geçerli JSON cevabı gelmedi.\n\n" +
                text.substring(0,500)
            );
        }


        if(
            !data ||
            !data.data ||
            !data.data[0]
        ){

            throw new Error(
                "AI görsel verisi bulunamadı.\n\n" +
                text.substring(0,500)
            );
        }


        const item = data.data[0];


        let imageURL;


        /*
          Base64 cevap
        */

        if(item.b64_json){

            imageURL =
                "data:image/png;base64," +
                item.b64_json;

        }

        /*
          URL cevap gelirse
        */

        else if(item.url){

            imageURL = item.url;

        }

        else{

            throw new Error(
                "Görsel URL veya base64 verisi bulunamadı."
            );
        }


        result.src = imageURL;

        download.href = imageURL;

        resultBox.style.display = "block";

        download.style.display = "block";


        setStatus(
            "✅ BAŞARILI!\n\n" +
            "Konu:\n" +
            konu +
            "\n\n" +
            "AI görsel ekranda gösterildi."
        );


    }catch(error){

        console.error(error);

        setStatus(
            "❌ AI GÖRSEL HATASI\n\n" +
            error.message
        );

    }finally{

        generate.disabled = false;

    }

};

</script>

</body>
</html>
