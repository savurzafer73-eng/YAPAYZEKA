<script>

"use strict";

/* =========================================================
   GLOBAL
========================================================= */

var scenes=[];
var ttsModule=null;
var characterLocked=false;
var mediaRecorder=null;
var recordedChunks=[];
var previewTimer=null;

var characterProfile={
  gender:"auto",
  age:"auto",
  hair:"auto",
  hairLength:"auto",
  eyes:"auto",
  build:"auto"
};

function $(id){
  return document.getElementById(id);
}

function status(text){
  $("status").textContent=text;
  console.log(text);
}

function setProgress(value){
  value=Math.max(0,Math.min(100,value));
  $("progressBar").style.width=value+"%";
}

function normalize(text){
  return String(text||"")
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();
}

/* =========================================================
   NO TEXT ENGINE
========================================================= */

function noTextBlock(){

  return [
    "ABSOLUTELY NO TEXT IN THE IMAGE",
    "NO SUBTITLES",
    "NO CAPTIONS",
    "NO LETTERS",
    "NO WORDS",
    "NO TYPOGRAPHY",
    "NO TITLES",
    "NO LOGOS",
    "NO WATERMARKS",
    "NO WRITTEN LANGUAGE",
    "NO READABLE SIGNS",
    "NO NUMBERS",
    "NO SYMBOLS THAT LOOK LIKE WRITING",
    "NO TEXT ON CLOTHING",
    "NO TEXT ON SCREENS",
    "NO TEXT ON PAPERS",
    "NO TEXT ON BOOKS",
    "NO TEXT ON WALLS",
    "NO TEXT ON OBJECTS",
    "ONLY THE VISUAL SCENE",
    "SUBTITLES WILL BE ADDED SEPARATELY"
  ].join(". ");

}

/* =========================================================
   SENTENCE ENGINE
========================================================= */

function splitSentences(text){

  text=normalize(text);

  if(!text) return [];

  var matches=text.match(
    /[^.!?…]+(?:[.!?…]+|$)/g
  );

  if(!matches){
    return [text];
  }

  var result=[];

  for(var i=0;i<matches.length;i++){

    var s=matches[i].trim();

    if(s){
      result.push(s);
    }

  }

  return result;
}

function sentenceLength(s){
  return normalize(s).length;
}

function createSmartSceneGroups(text){

  var sentences=splitSentences(text);

  var groups=[];
  var i=0;

  while(i<sentences.length){

    var s=sentences[i];
    var len=sentenceLength(s);

    if(len>150){

      groups.push([s]);
      i++;
      continue;

    }

    if(len<65){

      var group=[s];

      if(i+1<sentences.length &&
         sentenceLength(sentences[i+1])<65){

        group.push(sentences[i+1]);
        i++;

      }

      if(i+1<sentences.length &&
         sentenceLength(sentences[i+1])<65){

        group.push(sentences[i+1]);
        i++;

      }

      groups.push(group);
      i++;
      continue;

    }

    if(i+1<sentences.length &&
       sentenceLength(sentences[i+1])<110){

      groups.push([
        s,
        sentences[i+1]
      ]);

      i+=2;
      continue;
    }

    groups.push([s]);
    i++;

  }

  /* Final tiny group */

  if(groups.length>1){

    var last=groups[groups.length-1];

    if(last.length===1 &&
       sentenceLength(last[0])<45){

      var previous=groups[groups.length-2];

      if(previous.length<3){

        previous.push(last[0]);
        groups.pop();

      }

    }

  }

  return groups;
}

/* =========================================================
   CHARACTER DETECTION
========================================================= */

function detectGenderStrong(text){

  var t=normalize(text).toLowerCase();
  var sentences=splitSentences(t);

  var first=sentences.slice(0,4).join(" ");
  var firstSentence=sentences.length?
    sentences[0]:"";

  var femaleScore=0;
  var maleScore=0;

  if(
    /alleinerziehende mutter|mutter|frau|tochter|schriftstellerin|unternehmerin|gründerin|gruenderin|schauspielerin|köchin|koechin|studentin|ärztin|aerztin|sportlerin|erfinderin|sängerin|saengerin|ehefrau|freundin|verkäuferin|verkaeuferin/.test(first)
  ){
    femaleScore+=20;
  }

  if(
    /alleinerziehender vater|vater|mann|sohn|bruder|schriftsteller|unternehmer|gründer|gruender|schauspieler|koch|student|arzt|sportler|erfinder|sänger|saenger|ehemann|freund|verkäufer|verkaeufer/.test(first)
  ){
    maleScore+=20;
  }

  if(/^\s*sie\b/.test(firstSentence)){
    femaleScore+=12;
  }

  if(/^\s*er\b/.test(firstSentence)){
    maleScore+=12;
  }

  if(/frau/.test(first)){
    femaleScore+=10;
  }

  if(/mann/.test(first)){
    maleScore+=10;
  }

  if(femaleScore>maleScore && femaleScore>=8){
    return "female";
  }

  if(maleScore>femaleScore && maleScore>=8){
    return "male";
  }

  return "auto";
}

function detectAge(text){

  var t=normalize(text).toLowerCase();

  if(/kind|junge|mädchen|maedchen|teenager/.test(t)){
    return "young";
  }

  if(/älter|aelter|alt|großvater|grossvater|großmutter|grossmutter/.test(t)){
    return "elderly";
  }

  return "adult";
}

function detectCharacterFromStory(){

  if(characterLocked){
    return;
  }

  var text=$("story").value;

  var gender=detectGenderStrong(text);

  if(gender!=="auto"){
    characterProfile.gender=gender;
  }

  characterProfile.age=detectAge(text);

  $("gender").value=characterProfile.gender;
  $("age").value=characterProfile.age;

  updateCharacterStatus();

}

function updateCharacterStatus(){

  var g=characterProfile.gender;
  var a=characterProfile.age;

  var genderText=
    g==="female"?"Kadın":
    g==="male"?"Erkek":
    "Otomatik";

  var ageText=
    a==="young"?"Genç":
    a==="elderly"?"Yaşlı":
    a==="middle"?"Orta yaş":
    "Yetişkin";

  $("characterStatus").textContent=
    "Karakter: "+genderText+
    " • Yaş: "+ageText+
    (characterLocked?" • 🔒 KİLİTLİ":"");

}

function characterPrompt(){

  var gender=characterProfile.gender;

  var p="";

  if(gender==="female"){
    p+="MAIN CHARACTER: ADULT WOMAN. FEMALE CHARACTER. WOMAN, NOT MAN. ";
  }
  else if(gender==="male"){
    p+="MAIN CHARACTER: ADULT MAN. MALE CHARACTER. MAN, NOT WOMAN. ";
  }
  else{
    p+="MAIN CHARACTER: HUMAN PROTAGONIST. ";
  }

  if(characterProfile.age==="young"){
    p+="Young adult appearance. ";
  }
  else if(characterProfile.age==="middle"){
    p+="Middle aged appearance. ";
  }
  else if(characterProfile.age==="elderly"){
    p+="Older adult appearance. ";
  }

  if(characterProfile.hair!=="auto"){
    p+="Hair color: "+characterProfile.hair+". ";
  }

  if(characterProfile.hairLength!=="auto"){
    p+="Hair length: "+characterProfile.hairLength+". ";
  }

  if(characterProfile.eyes!=="auto"){
    p+="Eyes: "+characterProfile.eyes+". ";
  }

  if(characterProfile.build!=="auto"){
    p+="Body build: "+characterProfile.build+". ";
  }

  p+="Keep the same character identity, face, age, hairstyle and physical appearance across scenes.";

  return p;
}

/* =========================================================
   SMART VISUAL ANALYSIS
========================================================= */

function analyzeScene(text){

  var t=normalize(text).toLowerCase();

  var location="a realistic everyday environment";
  var event="the protagonist carrying out the main action";
  var secondary="";
  var relationship="";
  var environmentDetails=
    "realistic surroundings with authentic materials and believable spatial depth";
  var props=
    "period appropriate everyday objects";
  var background=
    "subtle realistic background activity";
  var spatial=
    "clear separation between foreground subject and background";
  var emotion="focused, natural and believable";
  var period="period appropriate clothing, architecture and objects";
  var lighting="natural cinematic lighting";

  if(/wohnung|apart|zimmer|haus/.test(t)){
    location="a modest residential interior";
    environmentDetails=
      "modest apartment or house interior, realistic furniture, walls, windows and lived-in details";
  }

  if(/garage|werkstatt/.test(t)){
    location="a small working garage or workshop";
    environmentDetails=
      "garage workspace with workbench, tools, shelves, realistic industrial materials";
    props=
      "tools, workbench, equipment and practical objects";
  }

  if(/restaurant|küche|kitchen/.test(t)){
    location="a realistic restaurant kitchen";
    environmentDetails=
      "professional kitchen with stainless steel equipment, counters, cookware and staff activity";
    props=
      "cooking equipment, utensils, ingredients and realistic kitchen objects";
  }

  if(/café|cafe/.test(t)){
    location="a realistic neighborhood café";
    environmentDetails=
      "warm café interior with tables, chairs, coffee equipment and softly blurred customers";
    props=
      "coffee cup, notebook, pen and realistic café objects";
  }

  if(/büro|office|firma|unternehmen/.test(t)){
    location="a modest early-stage business office";
    environmentDetails=
      "small office with desk, documents, practical equipment and realistic working environment";
    props=
      "desk, chair, computer, papers and business materials";
  }

  if(/labor|laboratorium|wissenschaft|erfinder/.test(t)){
    location="a realistic research laboratory";
    environmentDetails=
      "scientific workspace with workbench, instruments, prototype equipment and realistic materials";
    props=
      "prototype, instruments, tools and scientific equipment";
  }

  if(/sport|training|trainiert|athlet/.test(t)){
    location="a realistic sports training facility";
    environmentDetails=
      "sports facility with training equipment and subtle background athletes";
    props=
      "appropriate sports equipment";
  }

  if(/tochter|sohn|kind|familie/.test(t)){
    secondary="a realistically portrayed family member";
    relationship="natural family relationship";
  }

  if(/tochter/.test(t)){
    secondary="young daughter";
    relationship="mother and daughter";
  }

  if(/sohn/.test(t)){
    secondary="young son";
    relationship="parent and son";
  }

  if(/schreibt|schrieb|schreiben/.test(t)){
    event="the protagonist writing with focused concentration";
    props+=" notebook, pen and writing materials";
    emotion="deeply focused and determined";
  }

  if(/arbeitet|arbeitete|arbeiten/.test(t)){
    event="the protagonist working naturally in the environment";
  }

  if(/eröffnet|eroeffnet|eröffnete|eroeffnete/.test(t)){
    event="the protagonist opening a new business space";
    emotion="hopeful and determined";
  }

  if(/investor|geld|finanziell|arm|wenig geld/.test(t)){
    emotion="serious, determined and hopeful";
  }

  if(/brooklyn|new york|1990|1980|1970/.test(t)){
    period=
      "historically appropriate period details, architecture, clothing and objects";
  }

  return {
    location:location,
    event:event,
    secondary:secondary,
    relationship:relationship,
    environmentDetails:environmentDetails,
    props:props,
    background:background,
    spatial:spatial,
    emotion:emotion,
    period:period,
    lighting:lighting
  };
}

/* =========================================================
   IMAGE PROMPT
========================================================= */

function buildPrompt(text){

  var a=analyzeScene(text);

  var prompt=
    "Photorealistic cinematic documentary photograph. "+
    characterPrompt()+" "+
    "MAIN VISUAL EVENT: "+a.event+". "+
    "LOCATION: "+a.location+". "+
    (a.secondary?
      "SECONDARY PERSON: "+a.secondary+". ":"")+
    (a.relationship?
      "RELATIONSHIP: "+a.relationship+". ":"")+
    "ENVIRONMENT: "+a.environmentDetails+". "+
    "PROPS: "+a.props+". "+
    "BACKGROUND: "+a.background+". "+
    "SPATIAL RELATIONSHIP: "+a.spatial+". "+
    "EMOTION: "+a.emotion+". "+
    "PERIOD: "+a.period+". "+
    "LIGHTING: "+a.lighting+". "+
    "Professional documentary photography. "+
    "Realistic skin texture. "+
    "Believable anatomy. "+
    "Authentic clothing. "+
    "Realistic materials. "+
    "Natural perspective. "+
    "Subtle depth of field. "+
    "Subtle cinematic film grain. "+
    "Natural realistic colors. "+
    "Strong environmental storytelling. "+
    "16:9 landscape. "+
    noTextBlock()+".";

  return prompt;
}

/* =========================================================
   SCENE CREATION
========================================================= */

function createScenes(){

  try{

    var text=$("story").value;

    if(!normalize(text)){
      status("⚠️ Önce Almanca hikâyeyi gir.");
      return;
    }

    status("⏳ SAHNELER OLUŞTURULUYOR...");
    setProgress(5);

    detectCharacterFromStory();

    var groups=createSmartSceneGroups(text);

    scenes=[];

    for(var i=0;i<groups.length;i++){

      var sceneText=groups[i].join(" ");

      scenes.push({
        id:i+1,
        text:sceneText,
        prompt:buildPrompt(sceneText),
        image:null,
        imageURL:null,
        imageObject:null,
        audioBlob:null,
        audioURL:null,
        duration:0,
        audioBuffer:null,
        motion:"kenBurns"
      });

    }

    renderScenes();
    renderGallery();

    setProgress(15);

    status(
      "✅ "+scenes.length+
      " sahne oluşturuldu. "+
      "Akıllı gruplama aktif."
    );

  }
  catch(error){

    console.error(error);

    status(
      "❌ Sahne oluşturma hatası: "+
      error.message
    );

  }

}

/* =========================================================
   TTS MODULE
========================================================= */

async function loadTTS(){

  if(ttsModule){
    return ttsModule;
  }

  status("⏳ Piper TTS yükleniyor...");

  try{

    ttsModule=
      await import(
        "https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm"
      );

    status("✅ Piper TTS hazır.");

    return ttsModule;

  }
  catch(error){

    console.error(error);

    status(
      "❌ Piper TTS yüklenemedi: "+
      error.message
    );

    throw error;

  }

}

/* =========================================================
   WAV PARSING
========================================================= */

function readUint32(view,offset){
  return view.getUint32(offset,true);
}

function readUint16(view,offset){
  return view.getUint16(offset,true);
}

function parseWav(arrayBuffer){

  var view=new DataView(arrayBuffer);

  if(
    view.getUint8(0)!==82 ||
    view.getUint8(1)!==73 ||
    view.getUint8(2)!==70 ||
    view.getUint8(3)!==70
  ){
    throw new Error("Geçersiz WAV.");
  }

  var offset=12;
  var fmt=null;
  var data=null;

  while(offset+8<=view.byteLength){

    var id=
      String.fromCharCode(
        view.getUint8(offset),
        view.getUint8(offset+1),
        view.getUint8(offset+2),
        view.getUint8(offset+3)
      );

    var size=readUint32(view,offset+4);

    if(id==="fmt "){
      fmt={
        audioFormat:readUint16(view,offset+8),
        channels:readUint16(view,offset+10),
        sampleRate:readUint32(view,offset+12),
        byteRate:readUint32(view,offset+16),
        blockAlign:readUint16(view,offset+20),
        bitsPerSample:readUint16(view,offset+22)
      };
    }

    if(id==="data"){
      data={
        offset:offset+8,
        size:size
      };
      break;
    }

    offset+=8+size;

  }

  if(!fmt || !data){
    throw new Error("WAV format/data bulunamadı.");
  }

  return {
    fmt:fmt,
    data:data,
    buffer:arrayBuffer
  };

}

/* =========================================================
   WAV CONCATENATION
========================================================= */

function writeAscii(view,offset,text){

  for(var i=0;i<text.length;i++){
    view.setUint8(
      offset+i,
      text.charCodeAt(i)
    );
  }

}

function createWavFromPCM(
  pcmChunks,
  sampleRate,
  channels,
  bitsPerSample
){

  var total=0;

  for(var i=0;i<pcmChunks.length;i++){
    total+=pcmChunks[i].byteLength;
  }

  var headerSize=44;

  var buffer=
    new ArrayBuffer(headerSize+total);

  var view=new DataView(buffer);

  writeAscii(view,0,"RIFF");
  view.setUint32(4,36+total,true);
  writeAscii(view,8,"WAVE");

  writeAscii(view,12,"fmt ");
  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,channels,true);
  view.setUint32(24,sampleRate,true);

  var byteRate=
    sampleRate*
    channels*
    bitsPerSample/8;

  var blockAlign=
    channels*
    bitsPerSample/8;

  view.setUint32(28,byteRate,true);
  view.setUint16(32,blockAlign,true);
  view.setUint16(34,bitsPerSample,true);

  writeAscii(view,36,"data");
  view.setUint32(40,total,true);

  var out=new Uint8Array(buffer);
  var pos=44;

  for(var j=0;j<pcmChunks.length;j++){

    out.set(
      new Uint8Array(pcmChunks[j]),
      pos
    );

    pos+=pcmChunks[j].byteLength;

  }

  return new Blob(
    [buffer],
    {type:"audio/wav"}
  );

}

/* =========================================================
   TTS CHUNKING
========================================================= */

function splitTTSChunks(text){

  var sentences=splitSentences(text);

  if(!sentences.length){
    return [];
  }

  var chunks=[];
  var current="";

  for(var i=0;i<sentences.length;i++){

    var s=sentences[i];

    if(!current){

      current=s;
      continue;

    }

    if(
      (current+" "+s).length<=115
    ){

      current+=" "+s;

    }
    else{

      chunks.push(current);
      current=s;

    }

  }

  if(current){
    chunks.push(current);
  }

  return chunks;
}

async function synthesizePiper(
  session,
  text
){

  var result=
    await session.predict(text);

  var blob=null;

  if(result instanceof Blob){
    blob=result;
  }
  else if(
    result &&
    result.audio instanceof Blob
  ){
    blob=result.audio;
  }
  else if(
    result &&
    result.blob instanceof Blob
  ){
    blob=result.blob;
  }
  else if(
    result &&
    result.audio
  ){
    blob=
      new Blob(
        [result.audio],
        {type:"audio/wav"}
      );
  }

  if(!blob){
    throw new Error(
      "Piper WAV verisi alınamadı."
    );
  }

  return blob;
}

/* =========================================================
   GENERATE SCENE VOICE
========================================================= */

async function generateSceneVoice(index){

  var scene=scenes[index];

  try{

    status(
      "🔊 Sahne "+
      scene.id+
      "/"+
      scenes.length+
      " ses oluşturuluyor..."
    );

    var mod=await loadTTS();

    var TtsSession=
      mod.TtsSession ||
      (
        mod.default &&
        mod.default.TtsSession
      );

    if(!TtsSession){
      throw new Error(
        "TtsSession bulunamadı."
      );
    }

    var voiceId=
      $("voiceId").value ||
      "de_DE-thorsten-medium";

    var session=
      new TtsSession({
        voiceId:voiceId,
        allowLocalModels:true,
        fallbackStrategy:"auto",
        logger:function(message){
          console.log(
            "Piper:",
            message
          );
        },
        progress:function(progress){
          console.log(
            "Piper progress:",
            progress
          );
        }
      });

    var text=normalize(scene.text);

    if(!text){
      throw new Error(
        "Sahne metni boş."
      );
    }

    /*
      IMPORTANT FIX:
      Long scene text is synthesized in
      smaller chunks, then PCM is joined.
    */

    var chunks=splitTTSChunks(text);

    if(!chunks.length){
      throw new Error(
        "TTS parçaları oluşturulamadı."
      );
    }

    var pcmChunks=[];
    var sampleRate=22050;
    var channels=1;
    var bits=16;

    for(var c=0;c<chunks.length;c++){

      status(
        "🔊 Sahne "+
        scene.id+
        " — ses parçası "+
        (c+1)+
        "/"+
        chunks.length
      );

      var blob=
        await synthesizePiper(
          session,
          chunks[c]
        );

      var arrayBuffer=
        await blob.arrayBuffer();

      var parsed=
        parseWav(arrayBuffer);

      sampleRate=
        parsed.fmt.sampleRate;

      channels=
        parsed.fmt.channels;

      bits=
        parsed.fmt.bitsPerSample;

      pcmChunks.push(
        arrayBuffer.slice(
          parsed.data.offset,
          parsed.data.offset+
          parsed.data.size
        )
      );

    }

    var finalBlob=
      createWavFromPCM(
        pcmChunks,
        sampleRate,
        channels,
        bits
      );

    var duration=
      await getAudioDuration(
        finalBlob
      );

    if(!duration || duration<=0){
      throw new Error(
        "WAV süresi okunamadı."
      );
    }

    if(scene.audioURL){

      try{
        URL.revokeObjectURL(
          scene.audioURL
        );
      }
      catch(e){}

    }

    scene.audioBlob=finalBlob;

    scene.audioURL=
      URL.createObjectURL(
        finalBlob
      );

    scene.duration=duration;

    scene.audioBuffer=null;

    renderScenes();

    status(
      "✅ Sahne "+
      scene.id+
      " WAV hazır — "+
      duration.toFixed(2)+
      " saniye"
    );

    return true;

  }
  catch(error){

    console.error(
      "PIPER ERROR:",
      error
    );

    status(
      "❌ Sahne "+
      scene.id+
      " seslendirme hatası: "+
      (
        error &&
        error.message ?
        error.message:
        error
      )
    );

    return false;

  }

}

/* =========================================================
   AUDIO DURATION
========================================================= */

function getAudioDuration(blob){

  return new Promise(
    function(resolve,reject){

      var url=
        URL.createObjectURL(blob);

      var audio=
        document.createElement("audio");

      audio.preload="metadata";

      audio.onloadedmetadata=
        function(){

          var duration=
            audio.duration;

          URL.revokeObjectURL(url);

          if(
            !isFinite(duration) ||
            duration<=0
          ){
            reject(
              new Error(
                "Geçersiz WAV süresi."
              )
            );
            return;
          }

          resolve(duration);

        };

      audio.onerror=
        function(){

          URL.revokeObjectURL(url);

          reject(
            new Error(
              "WAV metadata okunamadı."
            )
          );

        };

      audio.src=url;

    }
  );

}

/* =========================================================
   ALL AUDIO
========================================================= */

async function ensureAllSceneAudio(){

  if(!scenes.length){
    throw new Error(
      "Önce sahneleri oluştur."
    );
  }

  for(
    var i=0;
    i<scenes.length;
    i++
  ){

    var scene=scenes[i];

    if(
      !scene.audioBlob ||
      !scene.audioURL ||
      !scene.duration ||
      scene.duration<=0
    ){

      var ok=
        await generateSceneVoice(i);

      if(!ok){

        throw new Error(
          "Sahne "+
          scene.id+
          " için WAV oluşturulamadı."
        );

      }

    }

    setProgress(
      ((i+1)/
      scenes.length)*30
    );

  }

}

/* =========================================================
   AUDIO BUFFER
========================================================= */

async function decodeSceneAudio(
  scene,
  audioContext
){

  if(scene.audioBuffer){
    return scene.audioBuffer;
  }

  if(!scene.audioBlob){
    throw new Error(
      "Sahne "+scene.id+
      " için WAV yok."
    );
  }

  var buffer=
    await scene.audioBlob.arrayBuffer();

  var decoded=
    await audioContext.decodeAudioData(
      buffer.slice(0)
    );

  scene.audioBuffer=decoded;

  /*
    Always use actual decoded duration.
  */

  scene.duration=
    decoded.duration;

  return decoded;

}

/* =========================================================
   IMAGE UPLOAD
========================================================= */

function uploadSceneImage(
  index,
  input
){

  if(
    !input.files ||
    !input.files[0]
  ){
    return;
  }

  var file=input.files[0];

  var scene=scenes[index];

  if(scene.imageURL){

    try{
      URL.revokeObjectURL(
        scene.imageURL
      );
    }
    catch(e){}

  }

  var url=
    URL.createObjectURL(file);

  var img=
    new Image();

  img.onload=
    function(){

      scene.image=file;
      scene.imageURL=url;
      scene.imageObject=img;
      scene.imageWidth=
        img.naturalWidth ||
        img.width;
      scene.imageHeight=
        img.naturalHeight ||
        img.height;

      renderScenes();
      renderGallery();

      status(
        "🟢 Sahne "+
        scene.id+
        " görseli hazır: "+
        scene.imageWidth+
        " × "+
        scene.imageHeight
      );

    };

  img.onerror=
    function(){

      URL.revokeObjectURL(url);

      status(
        "❌ Görsel yüklenemedi."
      );

    };

  img.src=url;

}

/* =========================================================
   SCENE IMAGE
========================================================= */

function loadSceneImage(index){

  var input=
    document.createElement("input");

  input.type="file";
  input.accept="image/*";

  input.onchange=
    function(){

      uploadSceneImage(
        index,
        input
      );

    };

  input.click();

}

/* =========================================================
   IMAGE PREVIEW
========================================================= */

function drawSmartImage(
  ctx,
  img,
  W,
  H,
  motionProgress,
  motion
){

  if(!img){
    return;
  }

  var iw=
    img.naturalWidth ||
    img.width;

  var ih=
    img.naturalHeight ||
    img.height;

  if(!iw || !ih){
    return;
  }

  /*
    Background:
    enlarged blurred-like dark layer.
  */

  ctx.save();

  var bgScale=
    Math.max(
      W/iw,
      H/ih
    );

  var bgW=iw*bgScale;
  var bgH=ih*bgScale;

  var bgX=(W-bgW)/2;
  var bgY=(H-bgH)/2;

  ctx.globalAlpha=.30;

  ctx.drawImage(
    img,
    bgX,
    bgY,
    bgW,
    bgH
  );

  ctx.globalAlpha=1;

  /*
    Foreground:
    contain image.
    No head crop.
  */

  var scale=
    Math.min(
      W/iw,
      H/ih
    );

  /*
    Very small motion only.
  */

  var zoom=
    1.0+
    Math.min(
      0.035,
      Math.max(
        0,
        motionProgress
      )*.035
    );

  if(motion==="zoomOut"){
    zoom=
      1.035-
      Math.min(
        .035,
        motionProgress*.035
      );
  }

  var fw=
    iw*scale*zoom;

  var fh=
    ih*scale*zoom;

  var fx=
    (W-fw)/2;

  var fy=
    (H-fh)/2;

  /*
    Never move image outside
    too aggressively.
  */

  if(motion==="panLeft"){
    fx-=motionProgress*8;
  }

  if(motion==="panRight"){
    fx+=motionProgress*8;
  }

  if(motion==="panUp"){
    fy-=motionProgress*8;
  }

  if(motion==="panDown"){
    fy+=motionProgress*8;
  }

  ctx.drawImage(
    img,
    fx,
    fy,
    fw,
    fh
  );

  ctx.restore();

  /*
    Subtle vignette.
  */

  var gradient=
    ctx.createRadialGradient(
      W/2,
      H/2,
      Math.min(W,H)*.25,
      W/2,
      H/2,
      Math.max(W,H)*.75
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.25)"
  );

  ctx.fillStyle=gradient;
  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}

/* =========================================================
   LOGO OVERLAY
========================================================= */

function drawLogo(
  ctx,
  W,
  H
){

  /*
    Real GeldStory logo placeholder.
    The actual logo is drawn separately,
    never generated inside AI images.
  */

  ctx.save();

  ctx.globalAlpha=.90;

  var size=
    Math.max(
      28,
      Math.round(W*.045)
    );

  ctx.font=
    "bold "+
    size+
    "px Arial";

  ctx.textAlign="right";
  ctx.textBaseline="top";

  ctx.fillStyle=
    "rgba(255,255,255,.92)";

  ctx.shadowColor=
    "rgba(0,0,0,.7)";

  ctx.shadowBlur=8;

  ctx.fillText(
    "GeldStory",
    W-28,
    22
  );

  ctx.restore();

}

/* =========================================================
   SUBTITLE
========================================================= */

function drawSubtitle(
  ctx,
  W,
  H,
  text
){

  if(
    $("subtitleMode").value!=="on"
  ){
    return;
  }

  ctx.save();

  var fontSize=
    Math.max(
      18,
      Math.round(W*.022)
    );

  ctx.font=
    "bold "+
    fontSize+
    "px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="bottom";

  var maxWidth=
    W*.82;

  var words=
    normalize(text).split(" ");

  var lines=[];
  var current="";

  for(var i=0;i<words.length;i++){

    var test=
      current?
      current+" "+words[i]:
      words[i];

    if(
      ctx.measureText(test).width>
      maxWidth &&
      current
    ){

      lines.push(current);
      current=words[i];

    }
    else{

      current=test;

    }

  }

  if(current){
    lines.push(current);
  }

  var lineHeight=
    fontSize*1.25;

  var y=
    H-35;

  for(
    var j=lines.length-1;
    j>=0;
    j--
  ){

    var line=lines[j];

    var width=
      ctx.measureText(line).width;

    ctx.fillStyle=
      "rgba(0,0,0,.65)";

    ctx.fillRect(
      W/2-width/2-14,
      y-fontSize-5,
      width+28,
      lineHeight
    );

    ctx.fillStyle="#fff";

    ctx.fillText(
      line,
      W/2,
      y
    );

    y-=lineHeight;

  }

  ctx.restore();

}

/* =========================================================
   RENDER SCENE FRAME
========================================================= */

function drawSceneFrame(
  ctx,
  scene,
  W,
  H,
  progress
){

  ctx.fillStyle="#050505";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(scene.imageObject){

    drawSmartImage(
      ctx,
      scene.imageObject,
      W,
      H,
      progress,
      scene.motion||"kenBurns"
    );

  }

  else{

    /*
      Placeholder until an image
      is uploaded.
    */

    ctx.fillStyle="#111";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.fillStyle="#888";

    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font=
      "bold 24px Arial";

    ctx.fillText(
      "Görsel bekleniyor",
      W/2,
      H/2
    );

  }

  drawLogo(
    ctx,
    W,
    H
  );

  drawSubtitle(
    ctx,
    W,
    H,
    scene.text
  );

}

/* =========================================================
   MEDIA RECORDER MIME
========================================================= */

function getSupportedMime(){

  var types=[
    "video/webm;codecs=vp8,opus",
    "video/webm;codecs=vp9,opus",
    "video/webm"
  ];

  for(var i=0;i<types.length;i++){

    if(
      MediaRecorder.isTypeSupported(
        types[i]
      )
    ){

      return types[i];

    }

  }

  return "";

}

/* =========================================================
   RENDER VIDEO
========================================================= */

async function renderVideo(){

  if(!scenes.length){

    status(
      "⚠️ Önce sahneleri oluştur."
    );

    return;

  }

  try{

    setProgress(0);

    status(
      "🎬 Video hazırlığı başlıyor..."
    );

    /*
      1 — Ensure all WAV files exist.
    */

    await ensureAllSceneAudio();

    /*
      2 — Validate images.
    */

    for(var i=0;i<scenes.length;i++){

      if(!scenes[i].imageObject){

        status(
          "⚠️ Sahne "+
          scenes[i].id+
          " için görsel yok. "+
          "Video yine de oluşturulacak."
        );

      }

    }

    /*
      3 — Canvas dimensions.
    */

    var format=$("format").value;

    var W=1280;
    var H=720;

    if(format==="9:16"){
      W=720;
      H=1280;
    }

    if(format==="1:1"){
      W=1080;
      H=1080;
    }

    var canvas=
      document.createElement("canvas");

    canvas.width=W;
    canvas.height=H;

    var ctx=
      canvas.getContext("2d");

    /*
      4 — Audio context.
    */

    var AudioCtx=
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx){

      throw new Error(
        "Web Audio desteklenmiyor."
      );

    }

    var audioContext=
      new AudioCtx();

    await audioContext.resume();

    /*
      5 — Decode every WAV BEFORE
          starting MediaRecorder.
    */

    status(
      "🔊 WAV dosyaları hazırlanıyor..."
    );

    for(
      var d=0;
      d<scenes.length;
      d++
    ){

      await decodeSceneAudio(
        scenes[d],
        audioContext
      );

      setProgress(
        30+
        (d/scenes.length)*10
      );

    }

    /*
      6 — Canvas stream.
    */

    var fps=
      parseInt(
        $("fps").value,
        10
      )||30;

    var canvasStream=
      canvas.captureStream(fps);

    /*
      7 — Audio destination.
    */

    var destination=
      audioContext.createMediaStreamDestination();

    /*
      8 — Combine streams.
    */

    var combinedStream=
      new MediaStream();

    canvasStream
      .getVideoTracks()
      .forEach(
        function(track){
          combinedStream.addTrack(track);
        }
      );

    destination
      .stream
      .getAudioTracks()
      .forEach(
        function(track){
          combinedStream.addTrack(track);
        }
      );

    /*
      9 — Recorder.
    */

    var mime=
      getSupportedMime();

    mediaRecorder=
      mime?
      new MediaRecorder(
        combinedStream,
        {
          mimeType:mime,
          videoBitsPerSecond:7000000
        }
      ):
      new MediaRecorder(
        combinedStream
      );

    recordedChunks=[];

    mediaRecorder.ondataavailable=
      function(event){

        if(
          event.data &&
          event.data.size>0
        ){

          recordedChunks.push(
            event.data
          );

        }

      };

    /*
      IMPORTANT:
      onstop is registered BEFORE start.
    */

    var stoppedPromise=
      new Promise(
        function(resolve){

          mediaRecorder.onstop=
            function(){

              resolve();

            };

        }
      );

    mediaRecorder.start(1000);

    /*
      10 — Render scenes.
    */

    for(
      var s=0;
      s<scenes.length;
      s++
    ){

      var scene=scenes[s];

      status(
        "🎥 Render: Sahne "+
        scene.id+
        "/"+
        scenes.length+
        " • "+
        scene.duration.toFixed(2)+
        " saniye"
      );

      var buffer=
        scene.audioBuffer;

      if(!buffer){

        throw new Error(
          "Sahne "+
          scene.id+
          " için WAV yok."
        );

      }

      /*
        Use actual decoded duration.
      */

      var exactDuration=
        buffer.duration;

      scene.duration=
        exactDuration;

      /*
        Audio source.
      */

      var source=
        audioContext.createBufferSource();

      source.buffer=buffer;

      /*
        Connect to recorder.
      */

      source.connect(destination);

      /*
        ALSO connect to local destination
        so audio context remains active.
      */

      source.connect(
        audioContext.destination
      );

      /*
        Critical:
        wait for actual onended.
      */

      var audioEnded=
        new Promise(
          function(resolve){

            source.onended=
              function(){

                resolve();

              };

          }
        );

      var startTime=
        performance.now();

      source.start(0);

      /*
        Draw continuously.
      */

      await new Promise(
        function(resolve){

          function draw(){

            var elapsed=
              (
                performance.now()-
                startTime
              )/1000;

            var p=
              Math.min(
                1,
                elapsed/exactDuration
              );

            drawSceneFrame(
              ctx,
              scene,
              W,
              H,
              p
            );

            if(
              elapsed<
              exactDuration
            ){

              requestAnimationFrame(
                draw
              );

            }
            else{

              resolve();

            }

          }

          draw();

        }
      );

      /*
        DO NOT stop source at exact duration.
        Let WebAudio emit onended.
      */

      await audioEnded;

      /*
        Small safety buffer so the final audio
        packet reaches MediaRecorder.
      */

      await sleep(180);

      setProgress(
        40+
        ((s+1)/scenes.length)*55
      );

    }

    /*
      11 — Give MediaRecorder a final
          packet window.
    */

    await sleep(300);

    mediaRecorder.stop();

    await stoppedPromise;

    /*
      12 — Close audio context.
    */

    try{
      await audioContext.close();
    }
    catch(e){}

    /*
      13 — Create WebM.
    */

    var blob=
      new Blob(
        recordedChunks,
        {
          type:
            mediaRecorder.mimeType ||
            "video/webm"
        }
      );

    if(!blob.size){

      throw new Error(
        "Video verisi oluşmadı."
      );

    }

    var url=
      URL.createObjectURL(blob);

    /*
      14 — Download.
    */

    var a=
      document.createElement("a");

    a.href=url;

    a.download=
      "GeldStory_Mina_V51_11.webm";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      function(){
        URL.revokeObjectURL(url);
      },
      10000
    );

    setProgress(100);

    status(
      "✅ VİDEO HAZIR! "+
      "Sesler sahne süreleriyle senkronlandı."
    );

  }
  catch(error){

    console.error(
      "RENDER ERROR:",
      error
    );

    try{

      if(
        mediaRecorder &&
        mediaRecorder.state!=="inactive"
      ){

        mediaRecorder.stop();

      }

    }
    catch(e){}

    status(
      "❌ Render başarısız: "+
      (
        error &&
        error.message?
        error.message:
        error
      )
    );

  }

}

function sleep(ms){

  return new Promise(
    function(resolve){
      setTimeout(
        resolve,
        ms
      );
    }
  );

}

function playSceneAudio(index){

/* =========================================================
   ALL VOICES
========================================================= */

async function generateAllVoices(){

  if(!scenes.length){

    status(
      "⚠️ Önce sahneleri oluştur."
    );

    return;

  }

  try{

    setProgress(0);

    for(
      var i=0;
      i<scenes.length;
      i++
    ){

      var ok=
        await generateSceneVoice(i);

      if(!ok){

        throw new Error(
          "Sahne "+
          (i+1)+
          " sesi oluşturulamadı."
        );

      }

      setProgress(
        ((i+1)/
        scenes.length)*100
      );

    }

    status(
      "✅ TÜM SAHNELERİN SESİ HAZIR."
    );

  }
  catch(error){

    status(
      "❌ Toplu ses hatası: "+
      error.message
    );

  }

}

/* =========================================================

========================================================= */

function renderScenes(){

  var container=
    $("scenes");

  container.innerHTML="";

  for(
    let i=0;
    i<scenes.length;
    i++
  ){

    let scene=scenes[i];

    var card=
      document.createElement("div");

    card.className="scene";

    var head=
      document.createElement("div");

    head.className="scene-head";

    head.innerHTML=
      "<div class='scene-id'>"+
      "🎬 Sahne "+
      scene.id+
      "</div>"+
      "<div class='small'>"+
      (
        scene.duration?
        scene.duration.toFixed(2)+
        " sn":
        "WAV yok"
      )+
      "</div>";

    card.appendChild(head);

    var body=
      document.createElement("div");

    body.className="scene-body";

    /*
      Canvas preview
    */

    var preview=
      document.createElement("div");

    preview.className="preview";

    var canvas=
      document.createElement("canvas");

    canvas.width=640;
    canvas.height=360;

    preview.appendChild(canvas);

    body.appendChild(preview);

    if(scene.imageObject){

      var pctx=
        canvas.getContext("2d");

      drawSceneFrame(
        pctx,
        scene,
        canvas.width,
        canvas.height,
        .25
      );

    }

    /*
      Story text
    */

    var textLabel=
      document.createElement("label");

    textLabel.textContent=
      "Sahne metni";

    body.appendChild(textLabel);

    var textArea=
      document.createElement("textarea");

    textArea.value=
      scene.text;

    textArea.oninput=
      function(){

        updateSceneText(
          i,
          this.value
        );

      };

    body.appendChild(textArea);

    /*
      Visual prompt
    */

    var promptLabel=
      document.createElement("label");

    promptLabel.textContent=
      "Görsel prompt";

    body.appendChild(promptLabel);

    var promptArea=
      document.createElement("textarea");

    promptArea.value=
      scene.prompt;

    promptArea.style.minHeight=
      "120px";

    promptArea.oninput=
      function(){

        updateScenePrompt(
          i,
          this.value

      };

    body.appendChild(promptArea);

    /*

      document.createElement("label");

    motionLabel.textContent=
      "Hareket";

    var motion=

    motion.style.width="100%";

    var motions=[
      ["kenBurns","Ken Burns"],
      ["static","Sabit"],
      ["zoomIn","Zoom In"],
      ["zoomOut","Zoom Out"],

      ["panRight","Pan Right"],

      ["panDown","Pan Down"]

    for(
      var m=0;
      m<motions.length;
      m++
    ){

      var option=
        document.createElement("option");

      option.value=
        motions[m][0];

      option.textContent=
        motions[m][1];

      if(
        scene.motion===
        motions[m][0]
      ){

        option.selected=true;

      }

      motion.appendChild(option);

    }

    motion.onchange=
      function(){

        updateMotion(
          i,
          this.value
        );

      };

    body.appendChild(motion);

    /*
      Image controls
    */

    var imgButtons=
      document.createElement("div");

    imgButtons.innerHTML=
      "<button>🖼️ GÖRSEL YÜKLE</button>"+
      "<button>🔄 PROMPT YENİLE</button>";

    var buttons=
      imgButtons.querySelectorAll(
        "button"
      );

    buttons[0].onclick=
      function(){

        loadSceneImage(i);

      };

    buttons[1].onclick=
      function(){

        scene.prompt=
          buildPrompt(
            scene.text
          );

        renderScenes();

        status(
          "🔄 Sahne "+
          scene.id+
          " promptu yenilendi."
        );

      };

    body.appendChild(imgButtons);

    /*
      Audio controls
    */

    var audioButtons=
      document.createElement("div");

    audioButtons.innerHTML=
      "<button>🔊 SES OLUŞTUR</button>"+
      "<button>▶ WAV DİNLE</button>"+
      "<button>⬇ WAV</button>";

    var ab=
      audioButtons.querySelectorAll(
        "button"
      );

    ab[0].onclick=
      async function(){

        await generateOne(i);

      };

    ab[1].onclick=
      function(){

        playSceneAudio(i);

      };

    ab[2].onclick=
      function(){

        downloadSceneAudio(i);

      };

    body.appendChild(audioButtons);

    */

    var info=
      document.createElement("div");

    info.className="audioInfo";

      scene.duration.toFixed(2)+

    body.appendChild(info);

    card.appendChild(body);

    container.appendChild(card);

  }

}

/* =========================================================
   PREVIEW
========================================================= */

async function previewVideo(){

  if(!scenes.length){

    status(
      "⚠️ Önce sahneleri oluştur."
    );

    return;

  }

  if(previewTimer){
    clearTimeout(previewTimer);
  }

  var scene=scenes[0];

  if(!scene.imageObject){

    status(
      "⚠️ İlk sahneye görsel yükle."
    );

    return;

  }

  var W=640;
  var H=360;

  var win=
    window.open(
      "",
      "_blank",
      "width=700,height=450"
    );

  if(!win){

    status(
      "⚠️ Tarayıcı popup'ı engelledi."
    );

    return;

  }

  win.document.body.style.margin="0";
  win.document.body.style.background="#000";

  var canvas=
    win.document.createElement(
      "canvas"
    );

  canvas.width=W;
  canvas.height=H;

  canvas.style.width="100%";
  canvas.style.height="100%";

  win.document.body.appendChild(
    canvas
  );

  var ctx=
    canvas.getContext("2d");

  var start=
    performance.now();

  function loop(){

    var elapsed=
      (performance.now()-start)/1000;

    var duration=
      scene.duration||
      5;

    var p=
      Math.min(
        1,
        elapsed/duration
      );

    drawSceneFrame(
      ctx,
      scene,
      W,
      H,
      p
    );

    if(
      elapsed<duration &&
      !win.closed
    ){

      requestAnimationFrame(
        loop
      );

    }

  }

  loop();

  if(scene.audioURL){

    var audio=
      win.document.createElement(
        "audio"
      );

    audio.src=
      scene.audioURL;

    audio.controls=true;
    audio.autoplay=true;

    win.document.body.appendChild(
      audio
    );

  }

}
