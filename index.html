<script>

/* =====================================================
   MINA VIDEO AI V3
   NO API / NO SERVER
===================================================== */

let project=null;
let videoBlob=null;


/* =====================================================
   HELPERS
===================================================== */

function esc(t){

return String(t)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function sceneCount(duration){

duration=Number(duration);

if(duration<=15)return 3;
if(duration<=30)return 4;
if(duration<=60)return 6;
return 8;

}


function styleName(style){

return {

cinematic:"Gerçekçi ve sinematik",
dark:"Karanlık ve gizemli",
documentary:"Belgesel",
hollywood:"Hollywood"

}[style]||style;

}


/* =====================================================
   SCRIPT
===================================================== */

function createScript(topic,tone,duration){

const opening={

dramatic:
`Bazı olaylar vardır ki yıllar geçse bile unutulmaz. ${topic}. Bu hikâyenin başlangıcında kimsenin fark etmediği ayrıntılar vardı.`,

mysterious:
`Gece her zamanki gibi sessizdi. Ta ki ${topic}. O andan sonra ortaya çıkan izler, olayın göründüğü kadar basit olmadığını gösterdi.`,

documentary:
`Bugün ${topic} olayını inceliyoruz. Olayın başlangıcından günümüze kadar ortaya çıkan bilgiler, dikkat çekici birçok ayrıntıyı ortaya koyuyor.`,

energetic:
`${topic}! Bu olay düşündüğünüzden çok daha ilginç. Şimdi hikâyenin en dikkat çekici ayrıntılarına birlikte bakalım.`

}[tone];


const middle={

dramatic:
`İlk ipucu ortaya çıktığında bunun ne kadar önemli olduğu henüz bilinmiyordu. Fakat ayrıntılar bir araya geldikçe cevaplardan çok yeni sorular ortaya çıktı.`,

mysterious:
`Asıl şaşırtıcı olan ise bundan sonra yaşandı. Bazı izler birbirleriyle örtüşüyor, bazı ayrıntılar ise hâlâ açıklanamıyor.`,

documentary:
`Araştırmalara göre olayın birkaç önemli aşaması bulunuyor. Ancak bazı noktalar kesin olarak doğrulanmış değil ve farklı açıklamalar mevcut.`,

energetic:
`İşte hikâyenin en ilginç kısmı burada başlıyor. Çünkü yeni ayrıntılar ortaya çıktıkça olayın tamamına bakışımız değişiyor.`

}[tone];


const ending={

dramatic:
`Bugün bile bütün soruların kesin bir cevabı yok. Belki de bu hikâyenin en büyük sırrı hâlâ ortaya çıkmayı bekliyor.`,

mysterious:
`Geride hâlâ cevaplanmamış sorular var. Belki de gerçek, bildiğimiz hikâyeden çok daha farklı.`,

documentary:
`Sonuç olarak bazı bilgiler doğrulanmış olsa da bütün ayrıntılar kesinlik kazanmış değil. Araştırmaların ortaya çıkaracağı yeni bilgiler bekleniyor.`,

energetic:
`İşte bu yüzden bu hikâye hâlâ merak uyandırıyor. Gerçek sizce ne olabilir?`

}[tone];


let text=
opening+" "+middle+" "+ending;


/* Uzun videolarda metni genişlet */

let target=Math.max(
50,
Math.round(duration*1.7)
);

while(text.split(/\s+/).length<target){

text+=" "+middle;

}

return text;

}


/* =====================================================
   SCENE DATA
===================================================== */

function buildScenes(topic,style,count,duration){

let arr=[];

let sceneDuration=
Math.max(3,Math.round(duration/count));


let descriptions=[

`Olayın gerçekleştiği çevrenin geniş sinematik görüntüsü.`,

`Kameranın olayın merkezindeki önemli ayrıntıya yaklaşması.`,

`Geçmişten gelen ipuçlarının ve gizemli atmosferin gösterilmesi.`,

`Ana olayın dramatik biçimde canlandırılması.`,

`Yeni bir ipucunun ortaya çıkması ve kameranın ayrıntıya odaklanması.`,

`Karakterlerin veya olayın merkezindeki nesnenin sinematik görüntüsü.`,

`Gizemli olayın sonuçlarının gösterildiği geniş plan.`,

`Finalde soru işareti bırakan güçlü sinematik görüntü.`

];


for(let i=0;i<count;i++){

let prompt=

`${styleName(style)}, cinematic scene, ${topic}, `+
`scene ${i+1}, realistic environment, `+
`dramatic lighting, detailed composition, `+
`depth of field, professional cinematography, `+
`high detail, 16:9, no text, no watermark`;


arr.push({

number:i+1,

duration:sceneDuration,

description:
descriptions[i%descriptions.length],

prompt:prompt

});

}

return arr;

}


/* =====================================================
   CREATE PROJECT
===================================================== */

function createProject(){

let topic=
document.getElementById("topic").value.trim();

if(!topic){

alert("Önce video konusunu yaz.");

return;

}


let duration=
Number(document.getElementById("duration").value);

let language=
document.getElementById("language").value;

let style=
document.getElementById("style").value;

let tone=
document.getElementById("tone").value;


document.getElementById("loading").style.display="block";
document.getElementById("result").style.display="none";


let messages=[
"Mina konuyu analiz ediyor...",
"Senaryo hazırlanıyor...",
"Sahneler oluşturuluyor...",
"Video zaman çizelgesi hazırlanıyor..."
];

let n=0;

let timer=setInterval(()=>{

document.getElementById("loadingText").innerText=
messages[n%messages.length];

n++;

},450);


setTimeout(()=>{

clearInterval(timer);


let count=sceneCount(duration);

let script=createScript(
topic,
tone,
duration
);


project={

id:Date.now(),

topic,

duration,

language,

style,

tone,

script,

voice:script,

scenes:buildScenes(
topic,
style,
count,
duration
),

createdAt:
new Date().toLocaleString("tr-TR")

};


renderProject();

saveProject();


document.getElementById("loading").style.display="none";

document.getElementById("result").style.display="block";


window.scrollTo({
top:document.getElementById("result").offsetTop-10,
behavior:"smooth"
});


},1100);

}

document.getElementById("scenes").innerHTML=html;

/* =====================================================
   SPEECH
===================================================== */

function speakVoice(){

if(!("speechSynthesis" in window)){

alert("Tarayıcın seslendirmeyi desteklemiyor.");

return;

}

speechSynthesis.cancel();


let u=
new SpeechSynthesisUtterance(
project.voice
);


u.lang=
project.language==="en"
?"en-US"
:
project.language==="de"
?"de-DE"
:
"tr-TR";


u.rate=.92;
u.pitch=.95;
u.volume=1;


speechSynthesis.speak(u);

}


function stopVoice(){

if("speechSynthesis" in window){

speechSynthesis.cancel();

}

}


/* =====================================================
   VIDEO ENGINE
===================================================== */

let animationId=null;

let recording=false;


function drawScene(ctx,canvas,scene,index,progress){

let w=canvas.width;
let h=canvas.height;


/* background */

let gradient=
ctx.createLinearGradient(
0,0,w,h
);

gradient.addColorStop(
0,
index%2===0
?"#17102f"
:"#07182b"
);

gradient.addColorStop(
1,
"#02050a"
);

ctx.fillStyle=gradient;

ctx.fillRect(0,0,w,h);


/* cinematic glow */

let glow=
ctx.createRadialGradient(
w*.5,
h*.45,
20,
w*.5,
h*.45,
w*.7
);

glow.addColorStop(
0,
"rgba(139,92,246,.20)"
);

glow.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=glow;

ctx.fillRect(0,0,w,h);


/* grid / atmosphere */

ctx.strokeStyle=
"rgba(255,255,255,.05)";

ctx.lineWidth=2;

for(let x=0;x<w;x+=100){

ctx.beginPath();

ctx.moveTo(x,0);
ctx.lineTo(x,h);

ctx.stroke();

}


for(let y=0;y<h;y+=100){

ctx.beginPath();

ctx.moveTo(0,y);
ctx.lineTo(w,y);

ctx.stroke();

}


/* moving cinematic light */

let x=
(progress*w*1.4)-w*.2;

let light=
ctx.createRadialGradient(
x,
h*.35,
0,
x,
h*.35,
300
);

light.addColorStop(
0,
"rgba(255,255,255,.13)"
);

light.addColorStop(
1,
"rgba(255,255,255,0)"
);

ctx.fillStyle=light;

ctx.fillRect(0,0,w,h);


/* scene number */

ctx.fillStyle=
"rgba(0,0,0,.55)";

ctx.fillRect(
45,
45,
180,
54
);

ctx.fillStyle="#fff";

ctx.font=
"bold 26px Arial";

ctx.fillText(
"MINA VIDEO AI",
65,
80
);


/* title */

ctx.textAlign="center";

ctx.font=
"bold 48px Arial";

ctx.fillStyle="#fff";

let title=
project.topic.length>45
?project.topic.slice(0,45)+"..."
:project.topic;

ctx.fillText(
title,
w/2,
h*.55
);


/* scene */

ctx.font=
"28px Arial";

ctx.fillStyle="#c4b5fd";

ctx.fillText(
`SAHNE ${scene.number}`,
w/2,
h*.64
);


/* bottom cinematic bar */

ctx.fillStyle=
"rgba(0,0,0,.7)";

ctx.fillRect(
0,
h-90,
w,
90
);

ctx.textAlign="left";

ctx.font=
"22px Arial";

ctx.fillStyle="#ddd";

ctx.fillText(
scene.description,
45,
h-48,
w-90
);


/* progress bar */

ctx.fillStyle=
"rgba(255,255,255,.18)";

ctx.fillRect(
0,
h-8,
w,
8
);

ctx.fillStyle="#8b5cf6";

ctx.fillRect(
0,
h-8,
w*progress,
8
);

}


/* =====================================================
   RENDER VIDEO
===================================================== */

async function renderVideo(){

if(!project){

alert("Önce proje oluştur.");

return;

}


if(!window.MediaRecorder){

alert(
"Tarayıcın video kaydını desteklemiyor. Güncel Chrome veya Edge kullan."
);

return;

}


const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");


let stream=
canvas.captureStream(30);


let mime="video/webm;codecs=vp9";

if(!MediaRecorder.isTypeSupported(mime)){

mime="video/webm";

}


let recorder=
new MediaRecorder(
stream,
{
mimeType:mime,
videoBitsPerSecond:5000000
}
);


let chunks=[];


recorder.ondataavailable=e=>{

if(e.data.size>0){

chunks.push(e.data);

}

};


let finished=
new Promise(resolve=>{

recorder.onstop=resolve;

});


recorder.start();


recording=true;

videoBlob=null;


document.getElementById(
"downloadVideo"
).classList.add("hidden");


let totalDuration=
project.duration*1000;


/*
Gerçek video süresi uzun olduğunda
tarayıcıyı kilitlememek için minimum
sahne süresi kullanılır.
*/

let startTime=
performance.now();


while(performance.now()-startTime<totalDuration){

let elapsed=
performance.now()-startTime;

let totalProgress=
Math.min(
1,
elapsed/totalDuration
);


let index=
Math.min(
project.scenes.length-1,
Math.floor(
totalProgress*project.scenes.length
)
);


let sceneProgress=
(
totalProgress*project.scenes.length
)-index;


let scene=
project.scenes[index];


drawScene(
ctx,
canvas,
scene,
index,
sceneProgress
);


document
.querySelectorAll(".timeline div")
.forEach(x=>x.classList.remove("active"));


let active=
document.getElementById(
"timeline-"+index
);

if(active){

active.classList.add("active");

}


let percent=
Math.round(totalProgress*100);


document.getElementById(
"progressBar"
).style.width=
percent+"%";


document.getElementById(
"renderStatus"
).innerText=
"Video oluşturuluyor... %"+percent;


await new Promise(
r=>requestAnimationFrame(r)
);

}


recorder.stop();

await finished;


videoBlob=
new Blob(
chunks,
{type:"video/webm"}
);


let url=
URL.createObjectURL(videoBlob);


let video=
document.getElementById("video");


video.src=url;

video.style.display="block";

canvas.style.display="none";


document.getElementById(
"downloadVideo"
).classList.remove("hidden");


document.getElementById(
"progressBar"
).style.width="100%";


document.getElementById(
"renderStatus"
).innerText=
"🎉 Video hazır!";


recording=false;

}


/* =====================================================
   RESET VIDEO
===================================================== */

function resetVideo(){

if(animationId){

cancelAnimationFrame(animationId);

}

videoBlob=null;


let canvas=
document.getElementById("canvas");

let video=
document.getElementById("video");


canvas.style.display="block";

video.style.display="none";

video.removeAttribute("src");


document.getElementById(
"downloadVideo"
).classList.add("hidden");


document.getElementById(
"progressBar"
).style.width="0%";


document.getElementById(
"renderStatus"
).innerText=
"Video henüz oluşturulmadı.";


let ctx=
canvas.getContext("2d");


ctx.fillStyle="#02050a";

ctx.fillRect(
0,0,
canvas.width,
canvas.height
);

}


/* =====================================================
   DOWNLOAD VIDEO
===================================================== */

function downloadVideo(){

if(!videoBlob){

alert("Önce videoyu oluştur.");

return;

}


let url=
URL.createObjectURL(videoBlob);


let a=
document.createElement("a");

a.href=url;

a.download=
"mina-video-"+Date.now()+".webm";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

}


/* =====================================================
   COPY
===================================================== */

function copyText(text){

navigator.clipboard.writeText(text)

.then(()=>alert("Kopyalandı ✅"))

.catch(()=>alert("Kopyalanamadı."));

}


/* =====================================================
   TXT
===================================================== */

function buildTXT(){

let text=
"MINA VIDEO AI V3\n"+
"====================\n\n";

text+=
"KONU:\n"+
project.topic+
"\n\n";

text+=
"SÜRE: "+

});

function downloadTXT(){

);

   JSON

function downloadJSON(){

project,
null,
2
)
],

);

URL.createObjectURL(blob);

a.remove();

/* =====================================================
   LOCAL STORAGE
===================================================== */

function saveProject(){

let list=
JSON.parse(
localStorage.getItem(
"mina_v3_projects"
)||"[]"
);


list.unshift(project);

list=list.slice(0,10);


localStorage.setItem(
"mina_v3_projects",
JSON.stringify(list)
);


renderHistory();

}


function renderHistory(){

let box=
document.getElementById("history");


let list=
JSON.parse(
localStorage.getItem(
"mina_v3_projects"
)||"[]"
);


if(!list.length){

box.innerHTML=
`<p class="small">
Henüz kayıtlı proje yok.
</p>`;

return;

}


box.innerHTML="";


list.forEach(item=>{

let div=
document.createElement("div");

div.className="history-item";


div.innerHTML=`

<b>🎬 ${esc(item.topic)}</b>

<div class="small">
${item.duration} saniye ·
${item.createdAt}
</div>

`;


div.onclick=()=>{

project=item;

renderProject();

document.getElementById(
"result"
).style.display="block";


window.scrollTo({

top:
document.getElementById(
"result"
).offsetTop-10,

behavior:"smooth"

});

};


box.appendChild(div);

});

}


function clearHistory(){

if(!confirm(
"Kayıtlı bütün projeler silinsin mi?"
))return;


localStorage.removeItem(
"mina_v3_projects"
);


renderHistory();

}


/* =====================================================
   INIT
===================================================== */

renderHistory();

</script>
