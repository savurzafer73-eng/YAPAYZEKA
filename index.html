<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#070b14;
color:white;
}

.container{
width:min(850px,94%);
margin:auto;
padding:25px 0 50px;
}

h1{
text-align:center;
font-size:34px;
margin:5px 0;
}

.subtitle{
text-align:center;
color:#8e9bb0;
margin-bottom:25px;
}

.card{
background:#101827;
border:1px solid #26364f;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}

label{
display:block;
font-weight:bold;
margin:12px 0 7px;
}

textarea,
select{
width:100%;
background:#080f1c;
color:white;
border:1px solid #34445d;
border-radius:10px;
padding:13px;
font-size:15px;
}

textarea{
min-height:110px;
resize:vertical;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:16px;
}

button{
background:#245cff;
border:0;
border-radius:11px;
color:white;
padding:13px 17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
filter:brightness(1.15);
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

.secondary{
background:#18263d;
border:1px solid #34445d;
}

.status{
background:#080d16;
border:1px solid #28364c;
border-radius:11px;
padding:13px;
margin-top:15px;
color:#b8c5d7;
}

.progress{
height:8px;
background:#080d16;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

.progressbar{
height:100%;
width:0%;
background:#3971ff;
transition:.3s;
}

.scene{
background:#0a1220;
border:1px solid #293951;
border-radius:14px;
padding:14px;
margin-top:12px;
}

.scene img{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
border-radius:10px;
margin-top:10px;
background:#05070a;
}

.hidden{
display:none;
}

video{
width:100%;
border-radius:14px;
background:#000;
margin-top:10px;
}

.small{
color:#8795aa;
font-size:13px;
}

@media(max-width:650px){
.row{
grid-template-columns:1fr;
}

h1{
font-size:28px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Mina Video AI</h1>

<div class="subtitle">
Ücretsiz video oluşturma sistemi
</div>


<div class="card">

<label>🎯 Video Konusu</label>

<textarea id="topic"
placeholder="Örneğin: Almanya'da çözülemeyen gizemli bir olay"></textarea>


<div class="row">

<div>

<label>🌍 Dil</label>

<select id="language">

<option value="de">
Deutsch
</option>

<option value="tr">
Türkçe
</option>

<option value="en">
English
</option>

</select>

</div>


<div>

<label>🎞️ Sahne Sayısı</label>

<select id="sceneCount">

<option value="1">
1 Sahne
</option>

<option value="4">
4 Sahne
</option>

<option value="5" selected>
5 Sahne
</option>

<option value="6">
6 Sahne
</option>

</select>

</div>

</div>


<div class="row">

<div>

<label>🎨 Görsel Stil</label>

<select id="style">

<option>
🎬 Sinematik
</option>

<option>
🌑 Karanlık / Gizemli
</option>

<option>
📸 Fotogerçekçi
</option>

<option>
🌌 Epik
</option>

<option>
🤖 Bilim Kurgu
</option>

<option>
🧙 Fantastik
</option>

</select>

</div>


<div>

<label>⏱️ Sahne Süresi</label>

<select id="duration">

<option value="4">
4 saniye
</option>

<option value="6" selected>
6 saniye
</option>

<option value="8">
8 saniye
</option>

</select>

</div>

</div>


<div class="buttons">

<button id="scriptBtn">
📝 Senaryo Oluştur
</button>

<button id="voiceBtn"
class="secondary"
disabled>
🔊 Sesli Oku
</button>

<button id="imageBtn"
class="secondary"
disabled>
🖼️ Görselleri Oluştur
</button>

<button id="videoBtn"
class="secondary"
disabled>
🎬 Video Oluştur
</button>

</div>


<div id="status"
class="status">
❤️ Mina hazır. Bir konu yaz.
</div>


<div class="progress">
<div id="progress"
class="progressbar"></div>
</div>

</div>



<div id="scriptCard"
class="card hidden">

<h2>📝 Senaryo</h2>

<div id="title"></div>

<div id="intro"></div>

<div id="scenes"></div>

<div id="ending"></div>

</div>



<div id="videoCard"
class="card hidden">

<h2>🎬 Hazır Video</h2>

<video id="video"
controls>
</video>

<div class="buttons">

<button id="downloadBtn">
⬇️ Videoyu İndir
</button>

</div>

</div>


</div>



<script>

/* =====================================================
   MINA VIDEO AI - BASIT MOTOR
===================================================== */

var data = null;
var videoBlob = null;


/* =====================================================
   ELEMENTLER
===================================================== */

var topic =
document.getElementById("topic");

var language =
document.getElementById("language");

var sceneCount =
document.getElementById("sceneCount");

var style =
document.getElementById("style");

var duration =
document.getElementById("duration");

var statusBox =
document.getElementById("status");

var progress =
document.getElementById("progress");

var scriptCard =
document.getElementById("scriptCard");

var videoCard =
document.getElementById("videoCard");

var scenesBox =
document.getElementById("scenes");

var video =
document.getElementById("video");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

statusBox.innerText =
text;

}


/* =====================================================
   PROGRESS
===================================================== */

function setProgress(value){

progress.style.width =
value + "%";

}


/* =====================================================
   DİL
===================================================== */

function getLanguage(){

if(language.value === "de")
return "Deutsch";

if(language.value === "en")
return "English";

return "Türkçe";

}


/* =====================================================
   SENARYO ÜRET
===================================================== */

function createScript(){

var subject =
topic.value.trim();

if(!subject){

alert(
"Önce video konusunu yaz canım ❤️"
);

return;

}


var count =
parseInt(sceneCount.value);


var lang =
getLanguage();


var title;

var intro;

var ending;


/* ==============================
   BAŞLIK
============================== */

if(lang === "Deutsch"){

title =
"Das Geheimnis von " +
subject;

intro =
"Eine rätselhafte Geschichte beginnt. Niemand konnte bisher erklären, was wirklich passiert ist.";

ending =
"Bis heute bleibt dieses Geheimnis ungelöst.";

}

else if(lang === "English"){

title =
"The Mystery of " +
subject;

intro =
"A mysterious story begins. Nobody has been able to explain what really happened.";

ending =
"Even today, the mystery remains unsolved.";

}

else{

title =
subject +
" | Gizemli Olay";

intro =
"Her şey sıradan bir gün gibi başlamıştı. Ancak kısa süre sonra kimsenin açıklayamadığı gizemli olaylar ortaya çıktı.";

ending =
"Aradan yıllar geçmesine rağmen bu gizem hâlâ çözülebilmiş değil.";

}


var scenes = [];


for(
var i=1;
i<=count;
i++
){

var narration;


if(lang === "Deutsch"){

narration =
"Szene " +
i +
": Die Ereignisse werden immer rätselhafter. Niemand weiß genau, was hier wirklich passiert ist.";

}

else if(lang === "English"){

narration =
"Scene " +
i +
": The events become even more mysterious. Nobody knows exactly what really happened here.";

}

else{

narration =
"Sahne " +
i +
": Olaylar giderek daha gizemli bir hâl almaya başladı. Kimse burada gerçekte ne olduğunu tam olarak bilmiyordu.";

}


scenes.push({

number:i,

narration:narration,

visual:
subject +
", mysterious cinematic atmosphere, dramatic lighting, realistic scene",

image:null

});

}


data = {

title:title,

intro:intro,

scenes:scenes,

ending:ending

};


renderScript();


setProgress(25);

setStatus(
"✅ Senaryo hazır! Şimdi görselleri oluşturabiliriz."
);


document.getElementById(
"voiceBtn"
).disabled = false;


document.getElementById(
"imageBtn"
).disabled = false;

}


/* =====================================================
   SENARYOYU GÖSTER
===================================================== */

function renderScript(){

scriptCard.classList.remove(
"hidden"
);


document.getElementById(
"title"
).innerHTML =
"<h2>🎬 " +
escapeHTML(data.title) +
"</h2>";


document.getElementById(
"intro"
).innerHTML =
"<p>" +
escapeHTML(data.intro) +
"</p>";


scenesBox.innerHTML = "";


for(
var i=0;
i<data.scenes.length;
i++
){

var scene =
data.scenes[i];


var div =
document.createElement("div");


div.className =
"scene";


div.innerHTML =

"<h3>🎞️ Sahne " +
scene.number +
"</h3>" +

"<div class='small'>ANLATIM</div>" +

"<p>" +
escapeHTML(scene.narration) +
"</p>" +

"<div class='small'>GÖRSEL</div>" +

"<p>" +
escapeHTML(scene.visual) +
"</p>" +

"<img id='image" +
i +
"' style='display:none'>";


scenesBox.appendChild(div);

}


document.getElementById(
"ending"
).innerHTML =

"<h3>🌙 Final</h3>" +

"<p>" +
escapeHTML(data.ending) +
"</p>";

}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   FALLBACK GÖRSEL
===================================================== */

function createImage(sceneNumber){

var svg =

'<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">' +

'<defs>' +

'<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +

'<stop offset="0%" stop-color="#05070c"/>' +

'<stop offset="100%" stop-color="#263653"/>' +

'</linearGradient>' +

'</defs>' +

'<rect width="1280" height="720" fill="url(#g)"/>' +

'<circle cx="950" cy="190" r="120" fill="#ffffff" opacity=".08"/>' +

'<text x="60" y="580" fill="white" font-size="42" font-family="Arial" font-weight="bold">' +

escapeSVG(data.title) +

'</text>' +

'<text x="60" y="635" fill="#b8c5d7" font-size="25" font-family="Arial">' +

"MYSTERY NACHT • SAHNE " +

sceneNumber +

'</text>' +

'</svg>';


return "data:image/svg+xml;charset=utf-8," +
encodeURIComponent(svg);

}


function escapeSVG(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&apos;");

}


/* =====================================================
   GÖRSELLER
===================================================== */

async function createImages(){

if(!data)
return;


document.getElementById(
"imageBtn"
).disabled = true;


for(
var i=0;
i<data.scenes.length;
i++
){

setStatus(
"🖼️ Görsel " +
(i+1) +
"/" +
data.scenes.length +
" hazırlanıyor..."
);


await new Promise(
function(resolve){

setTimeout(resolve,250);

});


var image =
createImage(
i+1
);


data.scenes[i].image =
image;


var element =
document.getElementById(
"image" + i
);


element.src =
image;

element.style.display =
"block";


setProgress(
25 +
(
(i+1) /
data.scenes.length
) * 50
);

}


setStatus(
"✅ Görseller hazır!"
);


document.getElementById(
"videoBtn"
).disabled = false;


document.getElementById(
"imageBtn"
).disabled = false;

}


/* =====================================================
   SES
===================================================== */

function speak(){

if(!data)
return;


if(!window.speechSynthesis){

alert(
"Tarayıcınız sesli okumayı desteklemiyor."
);

return;

}


speechSynthesis.cancel();


var text =
data.intro + " ";


for(
var i=0;
i<data.scenes.length;
i++
){

text +=
data.scenes[i].narration +
" ";

}


text +=
data.ending;


var speech =
new SpeechSynthesisUtterance(
text
);


if(language.value === "de")
speech.lang = "de-DE";

else if(language.value === "en")
speech.lang = "en-US";

else
speech.lang = "tr-TR";


speech.rate =
0.9;


speechSynthesis.speak(
speech
);


setStatus(
"🔊 Ses oynatılıyor..."
);

}


/* =====================================================
   GÖRSEL YÜKLE
===================================================== */

function loadImage(src){

return new Promise(
function(resolve,reject){

var img =
new Image();


img.onload =
function(){

resolve(img);

};


img.onerror =
function(){

reject(
new Error(
"Görsel yüklenemedi"
)
);

};


img.src =
src;

});

}


/* =====================================================
   TEXT WRAP
===================================================== */

function wrapText(
ctx,
text,
maxWidth
){

var words =
text.split(" ");

var lines = [];

var line = "";


for(
var i=0;
i<words.length;
i++
){

var test =
line ?
line + " " + words[i] :
words[i];


if(
ctx.measureText(test).width >
maxWidth
){

lines.push(line);

line =
words[i];

}else{

line =
test;

}

}


if(line)
lines.push(line);


return lines;

}


/* =====================================================
   SAHNE ÇİZ
===================================================== */

function drawScene(
ctx,
canvas,
img,
scene
){

ctx.fillStyle =
"#000";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


var scale =
Math.max(
canvas.width/img.width,
canvas.height/img.height
);


var width =
img.width * scale;

var height =
img.height * scale;


var x =
(canvas.width-width)/2;

var y =
(canvas.height-height)/2;


ctx.drawImage(
img,
x,
y,
width,
height
);


/* Koyu alt alan */

var gradient =
ctx.createLinearGradient(
0,
canvas.height*.45,
0,
canvas.height
);


gradient.addColorStop(
0,
"rgba(0,0,0,0)"
);

gradient.addColorStop(
1,
"rgba(0,0,0,.9)"
);


ctx.fillStyle =
gradient;


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* Başlık */

ctx.fillStyle =
"white";

ctx.font =
"bold 30px Arial";

ctx.fillText(
data.title,
40,
50
);


/* Altyazı */

ctx.font =
"bold 27px Arial";


var lines =
wrapText(
ctx,
scene.narration,
canvas.width-100
);


var lineHeight =
38;


var startY =
canvas.height -
80 -
lines.length *
lineHeight;


ctx.fillStyle =
"rgba(0,0,0,.65)";


ctx.fillRect(
25,
startY-25,
canvas.width-50,
lines.length *
lineHeight + 50
);


ctx.fillStyle =
"white";


for(
var i=0;
i<lines.length;
i++
){

ctx.fillText(
lines[i],
50,
startY +
i*lineHeight
);

}

}


/* =====================================================
   VIDEO OLUŞTUR
===================================================== */

async function createVideo(){

if(!data)
return;


document.getElementById(
"videoBtn"
).disabled = true;


setStatus(
"🎬 Video hazırlanıyor..."
);


setProgress(78);


var canvas =
document.createElement(
"canvas"
);


canvas.width =
1280;

canvas.height =
720;


var ctx =
canvas.getContext("2d");


var stream =
canvas.captureStream(30);


var mime =
"video/webm;codecs=vp9";


if(
!MediaRecorder.isTypeSupported(
mime
)
){

mime =
"video/webm";

}


var recorder =
new MediaRecorder(
stream,
{
mimeType:mime,
videoBitsPerSecond:5000000
}
);


var chunks = [];


recorder.ondataavailable =
function(event){

if(event.data.size)
chunks.push(
event.data
);

};


var stopped =
new Promise(
function(resolve){

recorder.onstop =
resolve;

});


recorder.start();


var sceneTime =
parseInt(
duration.value
) * 1000;


for(
var i=0;
i<data.scenes.length;
i++
){

setStatus(
"🎬 Sahne " +
(i+1) +
"/" +
data.scenes.length +
" işleniyor..."
);


var img =
await loadImage(
data.scenes[i].image
);


var start =
Date.now();


while(
Date.now()-start <
sceneTime
){

drawScene(
ctx,
canvas,
img,
data.scenes[i]
);


await new Promise(
function(resolve){

setTimeout(
resolve,
33
);

});

}


setProgress(
78 +
(
(i+1) /
data.scenes.length
)*18
);

}


/* Final */

ctx.fillStyle =
"#05070c";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


ctx.fillStyle =
"white";

ctx.textAlign =
"center";

ctx.font =
"bold 55px Arial";


ctx.fillText(
data.title,
canvas.width/2,
canvas.height/2
);


ctx.font =
"28px Arial";

ctx.fillStyle =
"#aeb9ca";


ctx.fillText(
"MYSTERY NACHT",
canvas.width/2,
canvas.height/2+55
);


await new Promise(
function(resolve){

setTimeout(
resolve,
1200
);

});


recorder.stop();

await stopped;


videoBlob =
new Blob(
chunks,
{
type:mime
}
);


var url =
URL.createObjectURL(
videoBlob
);


video.src =
url;


videoCard.classList.remove(
"hidden"
);


setProgress(100);


setStatus(
"🎉 Video hazır canım! Altyazılar videonun içine işlendi."
);


document.getElementById(
"videoBtn"
).disabled = false;

}


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadVideo(){

if(!videoBlob)
return;


var url =
URL.createObjectURL(
videoBlob
);


var a =
document.createElement("a");


a.href =
url;

a.download =
"mina-video.webm";


document.body.appendChild(a);

a.click();

a.remove();


setTimeout(
function(){

URL.revokeObjectURL(
url
);

},
1000
);

}


/* =====================================================
   BUTTONLAR
===================================================== */

document.getElementById(
"scriptBtn"
).onclick =
createScript;


document.getElementById(
"voiceBtn"
).onclick =
speak;


document.getElementById(
"imageBtn"
).onclick =
createImages;


document.getElementById(
"videoBtn"
).onclick =
createVideo;


document.getElementById(
"downloadBtn"
).onclick =
downloadVideo;


/* =====================================================
   BAŞLANGIÇ
===================================================== */

setStatus(
"❤️ Mina hazır. Konunu yazabilirsin."
);

</script>

</body>
</html>
