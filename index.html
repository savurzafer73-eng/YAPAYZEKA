<script>

const CLIENT_ID = "pk_QJfK0SKE0MqAqf3I";

const REDIRECT_URI =
  "https://savurzafer73-eng.github.io/YAPAYZEKA/";

const AUTH_URL =
  "https://enter.pollinations.ai/authorize";

const TOKEN_URL =
  "https://enter.pollinations.ai/api/oauth/token";

const IMAGE_API =
  "https://gen.pollinations.ai/image/";

const AUDIO_API =
  "https://gen.pollinations.ai/audio/";

const MAX_SEED = 2147483647;


let scenesData = [];

let audioElement = null;

let audioContext = null;

let audioDestination = null;


/* =========================
   TOKEN
========================= */

function getToken(){

  return localStorage.getItem(
    "mina_pollinations_token"
  ) || "";

}


/* =========================
   STATUS
========================= */

function setStatus(text){

  document.getElementById("status").textContent =
    text;

}


function setProgress(value){

  value = Math.max(
    0,
    Math.min(100,value)
  );

  document.getElementById(
    "progressBar"
  ).style.width = value + "%";

}


/* =========================
   TOKEN DURUMU
========================= */

function updateTokenStatus(){

  const token = getToken();

  const box =
    document.getElementById("tokenStatus");

  if(token){

    box.textContent =
      "✅ Pollinations bağlantısı bulundu.\n" +
      "Token mevcut. Bakiye kontrol edilebilir.";

  }else{

    box.textContent =
      "⚠️ Pollinations bağlantısı bulunamadı.\n" +
      "Önce Pollinations'a bağlan.";

  }

}


/* =========================
   OAUTH
========================= */

function connectPollinations(){

  const state =
    crypto.randomUUID();

  sessionStorage.setItem(
    "mina_oauth_state",
    state
  );

  const params =
    new URLSearchParams({

      client_id:CLIENT_ID,

      redirect_uri:REDIRECT_URI,

      response_type:"code",

      scope:"profile usage",

      state:state,

      code_challenge_method:"S256"

    });

  window.location.href =
    AUTH_URL + "?" + params.toString();

}


/* =========================
   CALLBACK
========================= */

async function handleOAuthCallback(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  if(!code) return;

  try{

    setStatus(
      "🔐 Pollinations bağlantısı tamamlanıyor..."
    );

    /*
      PKCE olmadan klasik örnek burada
      doğrudan token isteyemez.
      Eğer mevcut token zaten varsa onu koruyoruz.
    */

    const existing =
      getToken();

    if(existing){

      setStatus(
        "✅ Mevcut Pollinations bağlantısı kullanılıyor."
      );

    }else{

      setStatus(
        "⚠️ OAuth kodu alındı ancak tarayıcı tarafında " +
        "token değişimi için PKCE verifier gerekiyor. " +
        "Mevcut Pollinations bağlantısını kullan."
      );

    }

    history.replaceState(
      {},
      document.title,
      REDIRECT_URI
    );

  }catch(err){

    setStatus(
      "❌ OAuth hatası: " +
      err.message
    );

  }

}


/* =========================
   BALANCE
========================= */

async function checkBalance(){

  const token =
    getToken();

  if(!token){

    setStatus(
      "❌ Pollinations token bulunamadı."
    );

    return;

  }

  try{

    setStatus(
      "💰 Bakiye kontrol ediliyor..."
    );

    const response =
      await fetch(
        "https://gen.pollinations.ai/api/account/balance",
        {
          headers:{
            Authorization:
              "Bearer " + token
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data?.error?.message ||
        "Bakiye alınamadı."
      );

    }

    setStatus(
      "💰 Pollinations bakiyesi: " +
      (data.balance ?? "bilinmiyor") +
      " Pollen"
    );

  }catch(err){

    setStatus(
      "❌ Bakiye kontrol hatası:\n" +
      err.message
    );

  }

}


/* =========================
   SAFE SEED
========================= */

function createSafeSeed(sceneNumber){

  const timePart =
    Date.now() % MAX_SEED;

  const scenePart =
    sceneNumber * 100003;

  const seed =
    (timePart + scenePart) %
    MAX_SEED;

  return Math.floor(seed);

}


/* =========================
   STYLE
========================= */

function getStylePrompt(style){

  const styles = {

    cinematic:
      "cinematic movie still, dramatic lighting, realistic composition",

    fantasy:
      "dark fantasy cinematic artwork, magical atmosphere, detailed",

    scifi:
      "science fiction cinematic scene, futuristic atmosphere, detailed",

    "3d":
      "high quality 3D animated movie style, detailed",

    "2d":
      "high quality 2D animated illustration, detailed",

    dark:
      "dark mysterious cinematic atmosphere, ominous lighting, realistic",

    photo:
      "photorealistic documentary photography, natural lighting",

    action:
      "dynamic action movie scene, dramatic lighting, cinematic",

    medieval:
      "historical medieval cinematic scene, realistic details",

    epic:
      "epic cinematic movie scene, enormous scale, dramatic atmosphere"

  };

  return styles[style] ||
    styles.cinematic;

}

   LANGUAGE
========================= */

function getLanguageName(){

  const lang =

    ).value;

  if(lang === "de")
    return "German";

  if(lang === "en")

/* =========================
   SCRIPT GENERATION
========================= */

async function generateScript(){

  const topic =
    document.getElementById(
      "topic"
    ).value.trim();

  if(!topic){

    setStatus(
      "⚠️ Önce video konusunu yaz."
    );

    return;

  }

  const language =
    getLanguageName();

  const count =
    Number(
      document.getElementById(
        "sceneCount"
      ).value
    );

  const btn =
    document.getElementById(
      "scriptBtn"
    );

  btn.disabled = true;

  setStatus(
    "🧠 Senaryo hazırlanıyor..."
  );

  try{

    const token =
      getToken();

    if(!token){

      throw new Error(
        "Pollinations token bulunamadı."
      );

    }

    const prompt = `
Create a YouTube mystery documentary script.

Topic:
${topic}

Language:
${language}

Create exactly ${count} scenes.

For each scene provide:
SCENE 1:
Narration:
Visual:

SCENE 2:
Narration:
Visual:

Continue until SCENE ${count}.

The narration should be natural and suitable
for a mystery documentary.
Do not invent facts if the topic is about
a real historical event.
`;

    const url =
      "https://gen.pollinations.ai/text/" +
      encodeURIComponent(prompt) +
      "?model=openai";

    const response =
      await fetch(
        url,
        {
          headers:{
            Authorization:
              "Bearer " + token
          }
        }
      );

    const text =
      await response.text();

    if(!response.ok){

      throw new Error(
        extractError(text)
      );

    }

    document.getElementById(
      "script"
    ).value = text;

    setStatus(
      "✅ Senaryo oluşturuldu."
    );

  }catch(err){

    setStatus(
      "❌ AI senaryo hatası:\n" +
      err.message
    );

  }finally{

    btn.disabled = false;

  }

}


/* =========================
   ERROR
========================= */

function extractError(text){

  try{

    const data =
      JSON.parse(text);

    if(data?.error?.message)
      return data.error.message;

    if(data?.message)
      return data.message;

  }catch(e){}

  return text ||
    "Bilinmeyen hata";

}


/* =========================
   SCENE PARSER
========================= */

function parseScript(text,count){

  const result = [];

  const regex =
    /SCENE\s+(\d+)\s*:([\s\S]*?)(?=SCENE\s+\d+\s*:|$)/gi;

  let match;

  while(
    (match = regex.exec(text))
  ){

    const number =
      Number(match[1]);

    const content =
      match[2].trim();

    let narration =
      content;

    let visual =
      content;

    const narrationMatch =
      content.match(
        /Narration\s*:\s*([\s\S]*?)(?=Visual\s*:|$)/i
      );

    const visualMatch =
      content.match(
        /Visual\s*:\s*([\s\S]*)/i
      );

    if(narrationMatch)
      narration =
        narrationMatch[1].trim();

    if(visualMatch)
      visual =
        visualMatch[1].trim();

    result.push({

      number,

      narration,

      visual

    });

  }

  /*
    Parser formatı bulamazsa
    senaryoyu eşit parçalara böl.
  */

  if(!result.length){

    const sentences =
      text
        .split(/(?<=[.!?])\s+/)
        .filter(Boolean);

    const perScene =
      Math.ceil(
        sentences.length / count
      );

    for(
      let i=0;
      i<count;
      i++
    ){

      const part =
        sentences.slice(
          i * perScene,
          (i+1) * perScene
        ).join(" ");

      result.push({

        number:i+1,

        narration:
          part || text,

        visual:
          part || text

      });

    }

  }

  while(result.length < count){

    result.push({

      number:result.length+1,

      narration:
        text,

      visual:
        text

    });

  }

  return result.slice(0,count);

}


/* =========================
   AI IMAGE
========================= */

async function generateImage(
  prompt,
  sceneNumber
){

  const token =
    getToken();

  if(!token){

    throw new Error(
      "Pollinations token bulunamadı."
    );

  }

  const style =
    document.getElementById(
      "style"
    ).value;

  const stylePrompt =
    getStylePrompt(style);

  const finalPrompt = `
${prompt}

${stylePrompt}

YouTube documentary frame.
16:9 landscape.
No text.
No subtitles.
No watermark.
Highly detailed.
`;

  const params =
    new URLSearchParams({

      model:
        "black-forest-labs/flux.1-schnell",

      width:"1280",

      height:"720",

      seed:
        String(
          createSafeSeed(
            sceneNumber
          )
        ),

      nologo:"true"

    });

  const url =
    IMAGE_API +
    encodeURIComponent(
      finalPrompt
    ) +
    "?" +
    params.toString();

  const response =
    await fetch(
      url,
      {
        headers:{
          Authorization:
            "Bearer " + token
        }
      }
    );

  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      "HTTP " +
      response.status +
      " " +
      extractError(text)
    );

  }

  const blob =
    await response.blob();

  return URL.createObjectURL(
    blob
  );

}

   AUDIO
========================= */

  text
){

  const token =
    getToken();

  if(!token){

    throw new Error(
      "Pollinations token bulunamadı."
    );

  }

  const language =
    document.getElementById(
      "language"
    ).value;

  let voice =
    "nova";

    voice = "nova";

  if(language === "tr")
    voice = "nova";

  const url =
    AUDIO_API +
    encodeURIComponent(text) +
    "?voice=" +
    encodeURIComponent(voice);

  const response =
    await fetch(
      url,

        headers:{
          Authorization:
            "Bearer " + token
        }
      }
    );

  if(!response.ok){

    const errorText =
      await response.text();

    throw new Error(
      "AI ses hatası: HTTP " +
      response.status +
      " " +
      extractError(errorText)
    );

  }

  const blob =
    await response.blob();

  return URL.createObjectURL(
    blob
  );

}


/* =========================
   IMAGE LOAD
========================= */

function loadImage(src){

  return new Promise(
    (resolve,reject)=>{

      const img =
        new Image();

      img.onload =
        ()=>resolve(img);

      img.onerror =
        ()=>reject(
          new Error(
            "Görsel yüklenemedi."
          )
        );

      img.src = src;

    }
  );

}


/* =========================
   DRAW IMAGE
========================= */

function drawCover(
  ctx,
  img,
  width,
  height
){

  const imageRatio =
    img.width / img.height;

  const canvasRatio =
    width / height;

  let sx = 0;
  let sy = 0;
  let sw = img.width;
  let sh = img.height;

  if(imageRatio > canvasRatio){

    sw =
      img.height *
      canvasRatio;

    sx =
      (img.width - sw) / 2;

  }else{

    sh =
      img.width /
      canvasRatio;

    sy =
      (img.height - sh) / 2;

  }

  ctx.drawImage(
    img,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    width,
    height
  );

}


/* =========================
   SUBTITLE
========================= */

function drawSubtitle(
  ctx,
  text,
  width,
  height
){

  if(!text)
    return;

  const maxWidth =
    width * .82;

  ctx.font =
    "bold 30px Arial";

  const words =
    text.split(/\s+/);

  const lines = [];

  let line = "";

  for(const word of words){

    const test =
      line ?
      line + " " + word :
      word;

    if(
      ctx.measureText(test)
        .width > maxWidth
    ){

      lines.push(line);

      line = word;

    }else{

      line = test;

    }

  }

  if(line)
    lines.push(line);

  const lineHeight =
    38;

  const totalHeight =
    lines.length *
    lineHeight;

  const startY =
    height -
    totalHeight -
    55;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "top";

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const y =
      startY +
      i * lineHeight;

    ctx.lineWidth = 8;

    ctx.strokeStyle =
      "rgba(0,0,0,.9)";

    ctx.strokeText(
      lines[i],
      width/2,
      y
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fillText(
      lines[i],
      width/2,
      y
    );

  }

}


/* =========================
   AUDIO ELEMENT
========================= */

async function prepareAudio(
  url
){

  return new Promise(
    (resolve,reject)=>{

      const audio =
        new Audio();

      audio.crossOrigin =
        "anonymous";

      audio.src =
        url;

      audio.preload =
        "auto";

      audio.onloadedmetadata =
        ()=>{
          resolve(audio);
        };

      audio.onerror =
        ()=>{
          reject(
            new Error(
              "Ses dosyası yüklenemedi."
            )
          );
        };

    }
  );

}


/* =========================
   VIDEO
========================= */

async function createVideo(){

  if(!scenesData.length){

    throw new Error(
      "Video için sahne bulunamadı."
    );

  }

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    1280;

  canvas.height =
    720;

  const ctx =
    canvas.getContext(
      "2d"
    );

  const stream =
    canvas.captureStream(30);

  /*
    AudioContext oluştur.
    AI ses bulunamazsa video yine
    sessiz oluşturulabilir.
  */

  let audioCtx = null;
  let audioDestination = null;

  try{

    audioCtx =
      new AudioContext();

    audioDestination =
      audioCtx.createMediaStreamDestination();

    const tracks =
      audioDestination.stream
        .getAudioTracks();

    tracks.forEach(
      track =>
        stream.addTrack(track)
    );

  }catch(e){

    console.warn(
      "AudioContext kullanılamadı.",
      e
    );

  }

  let mime =
    "video/webm;codecs=vp9,opus";

  if(
    !MediaRecorder.isTypeSupported(
      mime
    )
  ){

    mime =
      "video/webm;codecs=vp8,opus";

  }

  if(
    !MediaRecorder.isTypeSupported(
      mime
    )
  ){

    mime =
      "video/webm";

  }

  const recorder =
    new MediaRecorder(
      stream,
      {
        mimeType:mime,
        videoBitsPerSecond:5000000
      }
    );

  const chunks = [];

  recorder.ondataavailable =
    e=>{

      if(e.data.size)
        chunks.push(e.data);

    };

  const finished =
    new Promise(
      resolve=>{

        recorder.onstop =
          ()=>{

            resolve(
              new Blob(
                chunks,
                {
                  type:mime
                }
              )
            );

          };

      }
    );

  recorder.start();

  const duration =
    Number(
      document.getElementById(
        "sceneDuration"
      ).value
    ) * 1000;

  for(
    let i=0;
    i<scenesData.length;
    i++
  ){

    const scene =
      scenesData[i];

    const img =
      await loadImage(
        scene.image
      );

    const start =
      performance.now();

    while(
      performance.now() -
      start <
      duration
    ){

      drawCover(
        ctx,
        img,
        canvas.width,
        canvas.height
      );

      /*
        hafif sinematik karartma
      */

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          canvas.height
        );

      gradient.addColorStop(
        0,
        "rgba(0,0,0,.02)"
      );

      gradient.addColorStop(
        1,
        "rgba(0,0,0,.45)"
      );

      ctx.fillStyle =
        gradient;

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawSubtitle(
        ctx,
        scene.narration,
        canvas.width,
        canvas.height
      );

      await new Promise(
        requestAnimationFrame
      );

    }

  }

  recorder.stop();

  return await finished;

}


/* =========================
   ANA VİDEO
========================= */

async function generateVideo(){

  const topic =
    document.getElementById(
      "topic"
    ).value.trim();

  let script =
    document.getElementById(
      "script"
    ).value.trim();

  if(!topic){

    setStatus(
      "⚠️ Video konusu boş."
    );

    return;

  }

  if(!script){

    setStatus(
      "⚠️ Önce senaryo oluştur veya senaryo yaz."
    );

    return;

  }

  const token =
    getToken();

  if(!token){

    setStatus(
      "❌ Pollinations bağlantısı yok.\n" +
      "Önce Pollinations'a bağlan."
    );

    return;

  }

  const count =
    Number(
      document.getElementById(
        "sceneCount"
      ).value
    );

  const btn =
    document.getElementById(
      "generateBtn"
    );

  btn.disabled = true;

  document
    .getElementById(
      "scenesBox"
    )
    .classList
    .remove("hidden");

  document.getElementById(
    "videoBox"
  ).classList.add("hidden");

  document.getElementById(
    "scenes"
  ).innerHTML = "";

  scenesData = [];

  try{

    const parsed =
      parseScript(
        script,
        count
      );

    setProgress(5);

    setStatus(
      "🎬 " +
      parsed.length +
      " sahne hazırlanıyor..."
    );

    /*
      GÖRSELLERİ TEK TEK oluşturuyoruz.
      Böylece Pollinations queue limitine
      takılma ihtimali azaltılıyor.
    */

    for(
      let i=0;
      i<parsed.length;
      i++
    ){

      const scene =
        parsed[i];

      setStatus(
        "🖼️ Sahne " +
        (i+1) +
        "/" +
        parsed.length +
        " görseli oluşturuluyor..."
      );

      setProgress(
        5 +
        (
          i /
          parsed.length
        ) * 60
      );

      const image =
        await generateImage(
          scene.visual ||
          scene.narration,
          i+1
        );

      scene.image =
        image;

      scenesData.push(
        scene
      );

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "scene";

      wrapper.innerHTML = `
        <img src="${image}">
        <div class="sceneInfo">
          <div class="sceneTitle">
            🎬 Sahne ${i+1}
          </div>

          <div class="scenePrompt">
            ${escapeHtml(
              scene.visual ||
              scene.narration
            )}
          </div>

          <div class="scenePrompt"
               style="margin-top:8px;color:#fff">
            💬 ${escapeHtml(
              scene.narration
            )}
          </div>
        </div>
      `;

      document.getElementById(
        "scenes"
      ).appendChild(
        wrapper
      );

      /*
        Queue'yu rahatlatmak için
        sahneler arasında kısa bekleme.
      */

      if(i < parsed.length-1){

        setStatus(
          "⏳ Sıradaki sahne için bekleniyor..."
        );

        await sleep(2500);

      }

    }

    setProgress(68);

    /*
      SES
    */

    setStatus(
      "🔊 AI ses hazırlanıyor..."
    );

    let audioUrls = [];

    try{

      /*
        Her sahnenin sesini ayrı üret.
      */

      for(
        let i=0;
        i<scenesData.length;
        i++
      ){

        setStatus(
          "🔊 AI ses: " +
          (i+1) +
          "/" +
          scenesData.length
        );

        const audio =
          await generateAudio(
            scenesData[i].narration
          );

        scenesData[i].audio =
          audio;

        audioUrls.push(
          audio
        );

        if(
          i <
          scenesData.length-1
        ){

          await sleep(1500);

        }

      }

    }catch(audioError){

      /*
        AI ses başarısızsa bunu
        kullanıcıya açıkça göster.
      */

      setStatus(
        "⚠️ AI ses oluşturulamadı.\n" +
        audioError.message +
        "\n\n" +
        "Görseller hazır. Video sessiz oluşturulacak."
      );

    }

    setProgress(75);

    setStatus(
      "🎥 Video oluşturuluyor..."
    );

    /*
      Şimdilik video render'ı
      görseller + altyazılar üzerinden.
      Gerçek AI ses kaynakları CORS
      nedeniyle tarayıcı MediaRecorder'a
      doğrudan bağlanamazsa video sessiz kalabilir.
    */

    const blob =
      await createVideo();

    setProgress(100);

    const videoUrl =
      URL.createObjectURL(
        blob
      );

    const video =
      document.getElementById(
        "video"
      );

    video.src =
      videoUrl;

    video.controls =
      true;

    document.getElementById(
      "videoBox"
    ).classList.remove(
      "hidden"
    );

    const download =
      document.getElementById(
        "downloadBtn"
      );

    download.onclick =
      ()=>{

        const a =
          document.createElement(
            "a"
          );

        a.href =
          videoUrl;

        a.download =
          "mina-video-" +
          Date.now() +
          ".webm";

        a.click();

      };

    setStatus(
      "✅ VİDEO HAZIR!\n\n" +
      "🎬 " +
      scenesData.length +
      " sahne\n" +
      "📝 Altyazılar videoya işlendi.\n" +
      "🎥 WebM hazır.\n\n" +
      "⬇️ Aşağıdaki butondan indirebilirsin."
    );

  }catch(err){

    console.error(err);

    setProgress(0);

    setStatus(
      "❌ VİDEO OLUŞTURULAMADI:\n\n" +
      err.message
    );

  }finally{

    btn.disabled = false;

  }

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   SLEEP
========================= */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================
   START
========================= */

window.addEventListener(
  "load",
  async()=>{

    updateTokenStatus();

    await handleOAuthCallback();

  }
);
