/* ==============================
   RANDOM
============================== */

function randomString(length){

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

let result="";

for(let i=0;i<length;i++){

result +=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

return result;
}


/* ==============================
   BASE64URL
============================== */

function base64Url(buffer){

let binary="";

const bytes =
new Uint8Array(buffer);

for(let i=0;i<bytes.length;i++){

binary +=
String.fromCharCode(
bytes[i]
);

}

return btoa(binary)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=+$/,"");
}


/* ==============================
   PKCE
============================== */

async function createPKCE(){

const verifier =
randomString(96);

const digest =
await crypto.subtle.digest(
"SHA-256",
new TextEncoder().encode(
verifier
)
);

return {
verifier:verifier,
challenge:base64Url(digest)
};

}

/* ==============================
   CALLBACK
============================== */

async function handleCallback(){

const params =
new URLSearchParams(
window.location.search
);

const code =
params.get("code");

const state =
params.get("state");

if(!code){

return;
}

const savedState =
sessionStorage.getItem(
"mina_state"
);

if(
savedState &&
state !== savedState
){

setStatus(
"OAuth güvenlik kontrolü başarısız.",
"error"
);

return;
}

const verifier =
sessionStorage.getItem(
"mina_verifier"
);

if(!verifier){

setStatus(
"PKCE bilgisi bulunamadı.",
"error"
);

return;
}

try{

setStatus(
"🔐 Mina bağlantısı doğrulanıyor..."
);

const body =
new URLSearchParams();

body.set(
"grant_type",
"authorization_code"
);

body.set(
"code",
code
);

body.set(
"client_id",
APP_KEY
);

body.set(
"redirect_uri",
REDIRECT_URI
);

body.set(
"code_verifier",
verifier
);

const response =
await fetch(
TOKEN_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

if(!response.ok){

const raw =
await response.text();

throw new Error(
raw.substring(0,500)
);

}

const data =
await response.json();

if(!data.access_token){

throw new Error(
"Access token alınamadı."
);

}

accessToken =
data.access_token;

sessionStorage.setItem(
"mina_access_token",
accessToken
);

sessionStorage.removeItem(
"mina_verifier"
);

sessionStorage.removeItem(
"mina_state"
);

window.history.replaceState(
{},
document.title,
REDIRECT_URI
);

updateAuth();

setStatus(
"🟢 Mina AI bağlantısı aktif.",
"success"
);

log(
"OAuth bağlantısı başarılı."
);

}catch(error){

setStatus(
"OAuth hatası: " +
error.message,
"error"
);

}

}

/* ==============================
   JSON
============================== */

function parseScenes(text){

let cleaned =
text
.trim()
.replace(/```json/gi,"")
.replace(/```/g,"")
.trim();

try{

return JSON.parse(cleaned);

}catch(e){}


const first =
cleaned.indexOf("[");

const last =
cleaned.lastIndexOf("]");

if(
first>=0 &&
last>first
){

try{

return JSON.parse(
cleaned.substring(
first,
last+1
)
);

}catch(e){}

}


const objStart =
cleaned.indexOf("{");

const objEnd =
cleaned.lastIndexOf("}");

if(
objStart>=0 &&
objEnd>objStart
){

try{

const obj =
JSON.parse(
cleaned.substring(
objStart,
objEnd+1
)
);

if(
obj &&
Array.isArray(obj.scenes)
){

return obj.scenes;

}

}catch(e){}

}

throw new Error(
"AI sahne JSON'u okunamadı."
);

}

/* ==============================

============================== */

function loadImage(blob){

return new Promise(
(resolve,reject)=>{

const url =
URL.createObjectURL(blob);

const img =
new Image();

img.onload =
()=>{
URL.revokeObjectURL(url);

};

reject(

)
);
};

}
);

}

/* ==============================
   AUDIO CONTEXT
============================== */

async function getAudioContext(){

const AudioCtx =
window.AudioContext ||
window.webkitAudioContext;

if(!AudioCtx){

throw new Error(
"Tarayıcı Web Audio desteklemiyor."
);

}

if(
!audioContext ||
audioContext.state==="closed"
){

audioContext =
new AudioCtx();

}

try{

await audioContext.resume();

}catch(e){}

return audioContext;

}


/* ==============================
   AUDIO DECODE
============================== */

async function decodeAudio(buffer){

const ctx =
await getAudioContext();

const copy =
buffer.slice(0);

return await ctx.decodeAudioData(
copy
);

}


/* ==============================
   CANVAS DRAW
============================== */

function drawImage(
ctx,
img,
canvas,
zoom
){

const cw =
canvas.width;

const ch =
canvas.height;

const iw =
img.naturalWidth ||
img.width;

const ih =
img.naturalHeight ||
img.height;

const scale =
Math.max(
cw/iw,
ch/ih
)*zoom;

const w =
iw*scale;

const h =
ih*scale;

const x =
(cw-w)/2;

const y =
(ch-h)/2;

ctx.drawImage(
img,
x,
y,
w,
h
);

}

*/

0,
0,
1280,
720
);

   Video stream.
*/

const stream =
canvas.captureStream(30);


/*
   Audio stream.
*/

const audioDestination =
ctxAudio.createMediaStreamDestination();


audioDestination
.stream
.getAudioTracks()
.forEach(
track=>{
stream.addTrack(track);
}
);

   Tarayıcının desteklediği kayıt formatı.
*/

let mime="";

const formats=[
"video/webm;codecs=vp9,opus",
"video/webm;codecs=vp8,opus",
"video/webm"
];

for(
let i=0;
i<formats.length;
i++
){

if(
MediaRecorder.isTypeSupported(
formats[i]
)
){

mime=formats[i];
break;

}

}

if(!mime){

throw new Error(
"WebM + ses kaydı desteklenmiyor."
);

}


const chunks=[];

const recorder =
new MediaRecorder(
stream,
{
mimeType:mime,
videoBitsPerSecond:5000000
}
);


recorder.ondataavailable =
e=>{

if(
e.data &&
e.data.size>0
){

chunks.push(e.data);

}

};

new Promise(
(resolve,reject)=>{

recorder.onstop =
()=>{

resolve(
new Blob(
chunks,
{type:mime}
)
);

};

e=>{

reject(
e.error ||
new Error(
"MediaRecorder hatası."
)
);

};

}
);


/*
   Ses kaynağı.
*/

const source =
ctxAudio.createBufferSource();

source.buffer =
audioBuffer;

source.connect(
audioDestination
);


/*
   Bilgisayarda da duyulabilsin.
*/

source.connect(
ctxAudio.destination
);


/*
   Toplam video süresi.
*/

let total=0;

sceneData.forEach(
scene=>{
total +=
Number(scene.duration)||6;
}
);

total =
Math.max(
total,
audioBuffer.duration
);


/*
   Kayıt.
*/

recorder.start(250);

log(
"🎥 Video + ses kaydı başladı."
);

setStatus(
"🔴 Video ve ses kaydediliyor..."
);


/*
   Ses başlat.
*/

await ctxAudio.resume();

source.start(0);


const start =
performance.now();

let previous=-1;


await new Promise(
resolve=>{

function render(){

const elapsed =
(
performance.now()-start
)/1000;


let time=0;

let index =
sceneData.length-1;

let local=0;


for(
let i=0;
i<sceneData.length;
i++
){

const duration =
Number(
sceneData[i].duration
)||6;

if(
elapsed<
time+duration
){

index=i;

local =
elapsed-time;

break;

}

time += duration;

}


const scene =
sceneData[index];

const duration =
Number(scene.duration)||6;


const p =
Math.max(
0,
Math.min(
1,
local/duration
)
);


const zoom =
1+(p*.08);


ctx.fillStyle="#000";

ctx.fillRect(
0,
0,
1280,
720
);


drawImage(
ctx,
scene.image,
canvas,
zoom
);


/*
   Alt gradient.
*/

const gradient =
ctx.createLinearGradient(
0,
400,
0,
720
);

gradient.addColorStop(
0,
"rgba(0,0,0,0)"
);

gradient.addColorStop(
1,
"rgba(0,0,0,.78)"
);

ctx.fillStyle =
gradient;

ctx.fillRect(
0,
0,
1280,
720
);


/*
   Mina watermark.
*/

ctx.fillStyle =
"rgba(255,255,255,.8)";

ctx.font =
"bold 24px Arial";

ctx.fillText(
"MINA AI",
40,
50
);


if(index!==previous){

previous=index;

log(
"Sahne " +
(index+1) +
" oynatılıyor."
);

}


progress(
55+
(elapsed/total)*40
);


if(
elapsed<total
){

requestAnimationFrame(
render
);

}else{

resolve();

}

}

requestAnimationFrame(
render
);

}
);


/*
   Son birkaç frame.
*/

await new Promise(
resolve=>
setTimeout(
resolve,
500
)
);


try{
source.stop();
}catch(e){}


recorder.stop();


stream
.getTracks()
.forEach(
track=>{
track.stop();
}
);


finalVideoBlob =
await finished;


if(
!finalVideoBlob ||
finalVideoBlob.size<1000
){

throw new Error(
"Video oluşturulamadı."
);

}


const url =
URL.createObjectURL(
finalVideoBlob
);

videoElement.src=url;

videoCard.classList.remove(
"hidden"
);

progress(100);

setStatus(
"🎉 Video + SES hazır!",
"success"
);

log(
"Final video: " +
Math.round(
finalVideoBlob.size/1024/1024*100
)/100 +
" MB"
);

}


/* ==============================
   SAHNELERİ GÖSTER
============================== */

function showScenes(data){

scenesBox.innerHTML="";

scenesCard.classList.remove(
"hidden"
);

data.forEach(
(scene,index)=>{

const box =
document.createElement("div");

box.className="scene";

const img =
document.createElement("img");

img.src =
scene.image.src;

const text =
document.createElement("div");

text.className="sceneText";

text.innerHTML =
"<b>Sahne " +
(index+1) +
"</b><br>" +
escapeHTML(
scene.narration
);

box.appendChild(img);

box.appendChild(text);

scenesBox.appendChild(box);

}
);

}


/* ==============================
   ESCAPE
============================== */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==============================
   ANA FONKSİYON
============================== */

async function generateVideo(){

generateBtn.disabled=true;

scenesCard.classList.add(
"hidden"
);

videoCard.classList.add(
"hidden"
);

logBox.textContent="";

progress(2);


try{

requireAuth();


if(
!topic.value.trim()
){

throw new Error(
"Önce video konusu yaz."
);

}


/*
   AudioContext'i buton tıklamasına
   mümkün olduğunca yakın başlat.
*/

await getAudioContext();


/* 1 */

setStatus(
"🧠 AI senaryo hazırlıyor..."
);

progress(8);

const rawScenes =
await createScenes();


if(
!Array.isArray(rawScenes) ||
!rawScenes.length
){

throw new Error(
"AI sahne oluşturamadı."
);

}


const scenes =
rawScenes
.slice(0,6)
.map(
scene=>({

narration:
String(
scene.narration||""
),

image_prompt:
String(
scene.image_prompt||""
),

duration:
Math.max(
5,
Math.min(
9,
Number(
scene.duration
)||6
)
)

})
);


/* 2 */

const prepared=[];


for(
let i=0;
i<scenes.length;
i++
){

setStatus(
"🖼️ " +
(i+1) +
"/" +
scenes.length +
" AI görsel oluşturuluyor..."
);

progress(
10+
(i/scenes.length)*25
);

const blob =
await createImage(
scenes[i].image_prompt
);

const image =
await loadImage(blob);

prepared.push({

narration:
scenes[i].narration,

image_prompt:
scenes[i].image_prompt,

duration:
scenes[i].duration,

image:image

});

}


/* 3 */

showScenes(prepared);


/* 4 */

setStatus(
"📝 Seslendirme metni hazırlanıyor..."
);

let narration="";

prepared.forEach(
scene=>{
narration +=
scene.narration.trim()+
" ";
}
);

narration =
narration.trim();


if(!narration){

throw new Error(
"Seslendirme metni boş."
);

}


/* 5 */

progress(45);

const audio =
await createAudio(
narration
);


/*
   Ses gerçekten decode ediliyor.
*/

setStatus(
"🔊 Ses kontrol ediliyor..."
);

const test =
await decodeAudio(
audio.arrayBuffer
);

if(
!test ||
test.duration<=0
){

throw new Error(
"AI sesi çözülemedi."
);

}


/* 6 */

progress(55);

await createVideo(
prepared,
audio
);


setStatus(
"🎉 Mina Video AI tamamlandı!",
"success"
);


}catch(error){

console.error(error);

log(
"HATA: " +
error.message
);

setStatus(
"❌ " +
error.message,
"error"
);


}finally{

generateBtn.disabled=false;

}

}


/* ==============================
   DOWNLOAD
============================== */

downloadBtn.onclick =
function(){

if(!finalVideoBlob){

return;
}

const url =
URL.createObjectURL(
finalVideoBlob
);

const a =
document.createElement("a");

a.href=url;

a.download =
"mina-video-" +
Date.now() +
".webm";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
3000
);

};


/* ==============================
   EVENTS
============================== */

connectBtn.onclick =
connectPollinations;

generateBtn.onclick =
generateVideo;


/* ==============================
   BAŞLAT
============================== */

loadAuth();

</script>
