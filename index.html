<script>

/* =========================================================
   MINA VIDEO AI
   TEK DOSYA SÜRÜMÜ
========================================================= */


/* =========================================================
   POLLINATIONS AYARLARI
========================================================= */

const CLIENT_ID = "pk_QJfK0SKE0MqAqf3I";

const REDIRECT_URI =
    "https://savurzafer73-eng.github.io/YAPAYZEKA/";

const AUTH_URL =
    "https://enter.pollinations.ai/authorize";

const TOKEN_URL =
    "https://enter.pollinations.ai/api/oauth/token";

const CHAT_URL =
    "https://gen.pollinations.ai/v1/chat/completions";


/* =========================================================
   DOM
========================================================= */

const topicEl = document.getElementById("topic");
const languageEl = document.getElementById("language");
const durationEl = document.getElementById("duration");
const sceneCountEl = document.getElementById("sceneCount");
const styleEl = document.getElementById("style");

const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");

const scriptOutput = document.getElementById("scriptOutput");
const scenesEl = document.getElementById("scenes");

const connectBtn = document.getElementById("connectBtn");
const scriptBtn = document.getElementById("scriptBtn");
const localScriptBtn = document.getElementById("localScriptBtn");
const imageBtn = document.getElementById("imageBtn");
const voiceBtn = document.getElementById("voiceBtn");
const audioVideoBtn = document.getElementById("audioVideoBtn");

const voiceStatus = document.getElementById("voiceStatus");
const voicePreview = document.getElementById("voicePreview");
const browserVoiceBtn = document.getElementById("browserVoiceBtn");

const videoPreview = document.getElementById("videoPreview");
const downloadVideo = document.getElementById("downloadVideo");


/* =========================================================
   STATE
========================================================= */

let accessToken =
    localStorage.getItem("mina_pollinations_token") || "";

let currentScript = null;
let currentScenes = [];
let currentAudioBlob = null;
let currentVideoBlob = null;


/* =========================================================
   HELPERS
========================================================= */

function setStatus(message, type=""){

    statusEl.textContent = message;

    statusEl.className = "status";

    if(type === "ok")
        statusEl.innerHTML =
            `<span class="ok">${escapeHtml(message)}</span>`;

    if(type === "err")
        statusEl.innerHTML =
            `<span class="err">${escapeHtml(message)}</span>`;

    if(type === "warn")
        statusEl.innerHTML =
            `<span class="warn">${escapeHtml(message)}</span>`;
}


function escapeHtml(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function setProgress(value){

    progressBar.style.width =
        Math.max(0,Math.min(100,value)) + "%";
}


function sleep(ms){

    return new Promise(resolve =>
        setTimeout(resolve,ms)
    );
}


/* =========================================================
   RESPONSE OKUMA
   JSON OLMAYAN CEVAPLARI DA GÜVENLİ OKUR
========================================================= */

async function readResponse(response){

    const raw = await response.text();

    let data = null;

    try{
        data = JSON.parse(raw);
    }catch(e){
        data = null;
    }

    return {
        ok: response.ok,
        status: response.status,
        raw,
        data
    };
}


/* =========================================================
   TOKEN
========================================================= */

function saveToken(token){

    accessToken = token || "";

    if(accessToken)
        localStorage.setItem(
            "mina_pollinations_token",
            accessToken
        );
}


function clearToken(){

    accessToken = "";

    localStorage.removeItem(
        "mina_pollinations_token"
    );
}


/* =========================================================
   PKCE
========================================================= */

function randomString(length=64){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    return Array.from(array)
        .map(x => chars[x % chars.length])
        .join("");
}


async function sha256Base64Url(value){

    const data =
        new TextEncoder().encode(value);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const bytes =
        new Uint8Array(hash);

    let binary = "";

    bytes.forEach(b =>
        binary += String.fromCharCode(b)
    );

    return btoa(binary)
        .replace(/\+/g,"-")
        .replace(/\//g,"_")
        .replace(/=/g,"");
}


/* =========================================================
   OAUTH
========================================================= */

async function connectPollinations(){

    try{

        setStatus(
            "🔐 Pollinations bağlantısı hazırlanıyor..."
        );

        const verifier =
            randomString(64);

        const challenge =
            await sha256Base64Url(verifier);

        const state =
            randomString(32);

        sessionStorage.setItem(
            "mina_pkce_verifier",
            verifier
        );

        sessionStorage.setItem(
            "mina_oauth_state",
            state
        );

        const params =
            new URLSearchParams({

                response_type:"code",

                client_id:CLIENT_ID,

                redirect_uri:REDIRECT_URI,

                scope:"profile usage",

                code_challenge:challenge,

                code_challenge_method:"S256",

                state:state

            });

        location.href =
            AUTH_URL + "?" + params.toString();

    }catch(error){

        setStatus(
            "❌ Bağlantı hazırlanamadı: " +
            error.message,
            "err"
        );

    }

}


/* =========================================================
   OAUTH CALLBACK
========================================================= */

async function handleOAuthCallback(){

    const params =
        new URLSearchParams(location.search);

    const code =
        params.get("code");

    const returnedState =
        params.get("state");

    if(!code)
        return;

    const savedState =
        sessionStorage.getItem(
            "mina_oauth_state"
        );

    if(
        savedState &&
        returnedState &&
        savedState !== returnedState
    ){

        setStatus(
            "❌ OAuth güvenlik doğrulaması başarısız.",
            "err"
        );

        return;
    }

    const verifier =
        sessionStorage.getItem(
            "mina_pkce_verifier"
        );

    if(!verifier){

        setStatus(
            "❌ PKCE doğrulaması bulunamadı.",
            "err"
        );

        return;
    }

    try{

        setStatus(
            "🔐 Pollinations hesabı doğrulanıyor..."
        );

        const body =
            new URLSearchParams({

                grant_type:"authorization_code",

                client_id:CLIENT_ID,

                code:code,

                redirect_uri:REDIRECT_URI,

                code_verifier:verifier

            });

        const response =
            await fetch(TOKEN_URL,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body

            });

        const result =
            await readResponse(response);

        if(!result.ok){

            throw new Error(
                result.data?.error_description ||
                result.data?.error?.message ||
                result.raw ||
                `HTTP ${result.status}`
            );

        }

        const token =
            result.data?.access_token;

        if(!token){

            throw new Error(
                "Access token alınamadı."
            );

        }

        saveToken(token);

        sessionStorage.removeItem(
            "mina_pkce_verifier"
        );

        sessionStorage.removeItem(
            "mina_oauth_state"
        );

        history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        setStatus(
            "✅ Pollinations bağlantısı başarılı.",
            "ok"
        );

    }catch(error){

        setStatus(
            "❌ Pollinations bağlantı hatası: " +
            error.message,
            "err"
        );

    }

}


/* =========================================================
   POLLINATIONS CHAT
========================================================= */

async function askPollinations(prompt){

    if(!accessToken){

        throw new Error(
            "Pollinations bağlantısı yok."
        );

    }

    const response =
        await fetch(CHAT_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":
                    "Bearer " + accessToken
            },

            body:JSON.stringify({

                model:"openai",

                messages:[

                    {
                        role:"system",
                        content:
                        "You are a professional documentary script writer. Return ONLY valid JSON. No markdown. No explanation."
                    },

                    {
                        role:"user",
                        content:prompt
                    }

                ],

                max_tokens:16000,

                temperature:.8

            })

        });

    const result =
        await readResponse(response);

    if(!result.ok){

        let message =
            result.data?.error?.message ||
            result.data?.message ||
            result.raw ||
            `HTTP ${result.status}`;

        throw new Error(
            message
        );

    }

    if(!result.data){

        throw new Error(
            "AI JSON yerine geçersiz cevap verdi: " +
            result.raw
        );

    }

    return result.data;
}


/* =========================================================
   JSON PARSER
========================================================= */

function parseJson(text){

    if(typeof text !== "string")
        return text;

    let cleaned =
        text.trim();

    cleaned =
        cleaned
        .replace(/^```json/i,"")
        .replace(/^```/i,"")
        .replace(/```$/i,"")
        .trim();

    try{
        return JSON.parse(cleaned);
    }catch(e){}

    const first =
        cleaned.indexOf("{");

    const last =
        cleaned.lastIndexOf("}");

    if(first >= 0 && last > first){

        const possible =
            cleaned.substring(
                first,
                last + 1
            );

        try{
            return JSON.parse(possible);
        }catch(e){}
    }

    throw new Error(
        "AI JSON yerine geçersiz cevap verdi: " +
        cleaned
    );
}


/* =========================================================
   DİL / WPM
========================================================= */

function getWpm(){

    const lang =
        languageEl.value;

    if(lang === "de")
        return 130;

    if(lang === "en")
        return 145;

    return 140;
}


/* =========================================================
   LOCAL SCRIPT FALLBACK
========================================================= */

function makeLocalScript(){

    const topic =
        topicEl.value.trim();

    if(!topic){

        throw new Error(
            "Önce bir konu yazmalısın."
        );

    }

    const language =
        languageEl.value;

    const count =
        Number(sceneCountEl.value);

    const duration =
        Number(durationEl.value);

    const titles = {

        de:[
            "Das Geheimnis beginnt",
            "Die erste Spur",
            "Eine unerwartete Wendung",
            "Was wirklich geschah",
            "Das ungelöste Rätsel",
            "Die letzte Spur"
        ],

        tr:[
            "Gizem Başlıyor",
            "İlk İz",
            "Beklenmedik Dönüş",
            "Gerçekte Ne Oldu?",
            "Çözülemeyen Gizem",
            "Son İz"
        ],

        en:[
            "The Mystery Begins",
            "The First Clue",
            "An Unexpected Turn",
            "What Really Happened?",
            "The Unsolved Mystery",
            "The Final Clue"
        ]

    };

    const intro = {

        de:
        `${topic}. Diese Geschichte beginnt mit einer Reihe ungewöhnlicher Ereignisse. Niemand ahnte zu diesem Zeitpunkt, welche Bedeutung die ersten Hinweise später bekommen würden.`,

        tr:
        `${topic}. Bu hikâye, sıradan görünen fakat zamanla büyük bir gizeme dönüşen olaylarla başlıyor. İlk başta kimse bu küçük ayrıntıların ileride ne kadar önemli olacağını bilmiyordu.`,

        en:
        `${topic}. This story begins with a series of unusual events. At first, nobody realized how important the earliest clues would become.`

    };

    const middle = {

        de:
        `Die Hinweise führten zu neuen Fragen. Je mehr Details bekannt wurden, desto schwieriger wurde es, zwischen Zufall und Zusammenhang zu unterscheiden. Einige Spuren verschwanden, andere tauchten plötzlich an völlig unerwarteten Orten auf.`,

        tr:
        `İpuçları yeni soruların ortaya çıkmasına neden oldu. Ayrıntılar arttıkça bunun basit bir tesadüf mü yoksa daha büyük bir bağlantının parçası mı olduğu belirsizleşti. Bazı izler kaybolurken bazıları beklenmedik yerlerde yeniden ortaya çıktı.`,

        en:
        `The clues raised even more questions. As more details emerged, it became increasingly difficult to separate coincidence from connection. Some traces disappeared while others suddenly appeared in unexpected places.`

    };

    const ending = {

        de:
        `Am Ende blieb eine soru unanswered. Obwohl zahlreiche Hinweise untersucht wurden, konnte die Geschichte nicht vollständig erklärt werden. Genau diese offenen Fragen machen den Fall bis heute so faszinierend.`,

        tr:
        `Sonunda ise cevaplanmamış önemli bir soru kaldı. Çok sayıda ipucu incelenmesine rağmen olayın bütün parçaları bir araya getirilemedi. Bugün bile bu hikâyeyi ilginç kılan şey, geride bıraktığı cevaplanmamış sorular.`,

        en:
        `In the end, one important question remained unanswered. Although many clues were examined, the entire story could never be completely explained. Those unanswered questions are what still make the case fascinating.`

    };

    const resultScenes = [];

    for(let i=0;i<count;i++){

        let text = "";

        if(i === 0)
            text = intro[language];

        else if(i === count - 1)
            text = ending[language];

        else
            text =
                middle[language] +
                " " +
                intro[language];

        resultScenes.push({

            scene:i + 1,

            title:
                titles[language][
                    i % titles[language].length
                ],

            narration:text,

            imagePrompt:
                buildImagePrompt(
                    text,
                    i + 1
                )

        });

    }

    return {

        title:topic,

        language,

        duration,

        scenes:resultScenes

    };

}


/* =========================================================
   IMAGE PROMPT
========================================================= */

function buildImagePrompt(text, number){

    const style =
        styleEl.value;

    const styles = {

        cinematic:
        "cinematic documentary photography, dramatic lighting, realistic",

        fantasy:
        "dark fantasy cinematic artwork, atmospheric, detailed",

        scifi:
        "cinematic science fiction scene, futuristic, dramatic lighting",

        "3d":
        "high quality 3D animation, cinematic composition",

        "2d":
        "detailed 2D animation illustration, cinematic",

        dark:
        "dark mysterious cinematic scene, atmospheric, realistic, dramatic shadows",

        photo:
        "photorealistic documentary photograph, realistic lighting",

        action:
        "dynamic cinematic action scene, dramatic lighting",

        medieval:
        "realistic medieval cinematic scene, atmospheric",

        epic:
        "epic cinematic scene, grand scale, dramatic atmosphere"

    };

    return (
        styles[style] ||
        styles.dark
    ) +
    ", no text, no subtitles, no watermark, scene " +
    number +
    ", based on: " +
    text.substring(0,500);

}


/* =========================================================
   AI SCRIPT
========================================================= */

async function createAIScript(){

    const topic =
        topicEl.value.trim();

    if(!topic){

        setStatus(
            "⚠️ Önce konu yaz.",
            "warn"
        );

        return;
    }

    const language =
        languageEl.value;

    const duration =
        Number(durationEl.value);

    const sceneCount =
        Number(sceneCountEl.value);

    const wpm =
        getWpm();

    const targetWords =
        duration * wpm;

    const langName = {

        de:"German",

        tr:"Turkish",

        en:"English"

    }[language];

    const prompt = `

Create a documentary-style mysterious story.

TOPIC:
${topic}

LANGUAGE:
${langName}

DURATION:
${duration} minutes

TARGET WORDS:
approximately ${targetWords}

SCENES:
${sceneCount}

Return ONLY valid JSON in exactly this structure:

{
  "title":"...",
  "language":"${language}",
  "duration":${duration},
  "scenes":[
    {
      "scene":1,
      "title":"...",
      "narration":"...",
      "imagePrompt":"..."
    }
  ]
}

The narration must be suitable for voice-over.
The story should have a strong opening, suspense,
progressive clues and a satisfying ending.

Do not use markdown.
Do not use code fences.
Return JSON only.

`;

    try{

        setStatus(
            "🧠 AI senaryosu hazırlanıyor..."
        );

        setProgress(10);

        const raw =
            await askPollinations(prompt);

        setProgress(60);

        let content =
            raw?.choices?.[0]?.message?.content;

        if(!content){

            if(typeof raw === "string")
                content = raw;

            else
                throw new Error(
                    "AI cevabında senaryo bulunamadı."
                );
        }

        const parsed =
            parseJson(content);

        validateScript(parsed);

        currentScript =
            parsed;

        renderScript(parsed);

        setProgress(100);

        imageBtn.disabled = false;

        voiceBtn.disabled = false;

        audioVideoBtn.disabled = false;

        setStatus(
            "✅ AI senaryosu hazır.",
            "ok"
        );

    }catch(error){

        console.error(error);

        const msg =
            String(error.message || error);

        if(
            msg.toLowerCase().includes(
                "not have enough credits"
            ) ||
            msg.toLowerCase().includes(
                "insufficient"
            ) ||
            msg.includes("402")
        ){

            setStatus(
                "💳 Pollinations AI hesabında yeterli kredi yok.\n\n" +
                "AI senaryosu yerine aşağıdaki ücretsiz yerel senaryo butonunu kullanabilirsin.",
                "warn"
            );

            return;
        }

        setStatus(
            "❌ Senaryo hatası:\n\n" +
            msg,
            "err"
        );

    }

}

function validateScript(data){

    if(!data || typeof data !== "object")
        throw new Error(
            "Senaryo formatı geçersiz."
        );

    if(!Array.isArray(data.scenes))
        throw new Error(
            "Senaryoda scenes bulunamadı."
        );

    if(!data.scenes.length)
        throw new Error(
            "Senaryo sahne içermiyor."
        );

    data.scenes.forEach((scene,index)=>{

        if(!scene.narration)
            scene.narration =
                "";

        if(!scene.title)
            scene.title =
                "Scene " + (index + 1);

        if(!scene.imagePrompt)
            scene.imagePrompt =
                buildImagePrompt(
                    scene.narration,
                    index + 1
                );

    });

}

/* =========================================================
   SAFE SEED
========================================================= */

const MAX_SEED =
    2147483647;


function createSafeSeed(sceneNumber){

    const timePart =
        Date.now() %
        MAX_SEED;

    const scenePart =
        sceneNumber *
        100003;

    const seed =
        (
            timePart +
            scenePart
        ) %
        MAX_SEED;

    return Math.floor(seed);
}


/* =========================================================
   IMAGE REQUEST
========================================================= */

async function generateImageAuthenticated(
    prompt,
    sceneNumber
){

    if(!accessToken)
        throw new Error(
            "Pollinations bağlantısı yok."
        );

    const models = [

        "black-forest-labs/flux.1-schnell",

        "tongyi-mai/z-image-turbo",

        "black-forest-labs/flux.2-klein-4b"

    ];

    let lastError =
        "";

    for(const model of models){

        const url =
            "https://gen.pollinations.ai/image/" +
            encodeURIComponent(prompt) +
            "?model=" +
            encodeURIComponent(model) +
            "&seed=" +
            createSafeSeed(sceneNumber);

        const response =
            await fetch(url,{

                headers:{
                    "Authorization":
                        "Bearer " +
                        accessToken
                }

            });

        if(response.ok){

            const blob =
                await response.blob();

            return URL.createObjectURL(
                blob
            );

        }

        const result =
            await readResponse(response);

        lastError =
            result.data?.error?.message ||
            result.data?.message ||
            result.raw ||
            `HTTP ${result.status}`;

        if(
            response.status === 402
        ){

            throw new Error(
                "IMAGE_CREDIT_REQUIRED"
            );

        }

        if(
            response.status === 429
        ){

            await sleep(5000);

            continue;

        }

    }

    throw new Error(
        lastError
    );

}


/* =========================================================
   LEGACY / ANONYMOUS IMAGE FALLBACK
========================================================= */

async function generateImageLegacy(
    prompt,
    sceneNumber
){

    const seed =
        createSafeSeed(sceneNumber);

    const url =
        "https://image.pollinations.ai/prompt/" +
        encodeURIComponent(prompt) +
        "?width=1024&height=576&seed=" +
        seed;

    const response =
        await fetch(url);

    if(!response.ok){

        const result =
            await readResponse(response);

        throw new Error(
            result.data?.error?.message ||
            result.raw ||
            `HTTP ${result.status}`
        );

    }

    const blob =
        await response.blob();

    return URL.createObjectURL(
        blob
    );

}

/*
   Bu bölüm harici TTS servisini denemek için hazırlanmıştır.
   Servis kullanılamazsa uygulama çökmez.
*/

async function generateExternalTTS(text){

    const voicesUrl =
        "https://ahm7xmakki.com/api/voices";

    const ttsUrl =
        "https://ahm7xmakki.com/api/tts";

    try{

        const voicesResponse =
            await fetch(
                voicesUrl
            );

        if(!voicesResponse.ok)
            throw new Error(
                `Ses servisi HTTP ${voicesResponse.status}`
            );

        const voicesResult =
            await readResponse(
                voicesResponse
            );

        if(!voicesResult.data)
            throw new Error(
                "Ses listesi geçersiz."
            );

        const voices =
            voicesResult.data.voices ||
            voicesResult.data ||
            [];

        let voice = null;

        const lang =
            languageEl.value;

        if(Array.isArray(voices)){

            voice =
                voices.find(v =>
                    String(
                        v.language ||
                        v.lang ||
                        ""
                    ).toLowerCase()
                    .startsWith(lang)
                ) ||
                voices[0];

        }

        const voiceId =
            voice?.id ||
            voice?.voice ||
            voice?.name;

        if(!voiceId)
            throw new Error(
                "Uygun ses bulunamadı."
            );

        const response =
            await fetch(
                ttsUrl,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        text:text,

                        voice:voiceId,

                        language:lang

                    })

                }
            );

        if(!response.ok){

            const result =
                await readResponse(
                    response
                );

            throw new Error(
                result.data?.error?.message ||
                result.raw ||
                `HTTP ${response.status}`
            );

        }

        const blob =
            await response.blob();

        return blob;

    }catch(error){

        throw error;

    }

}

/* =========================================================
   SUBTITLE TIMELINE
========================================================= */

function buildSubtitleTimeline(){

    if(!currentScript)
        return [];

    const total =
        Number(
            durationEl.value
        ) * 60;

    const scenes =
        currentScript.scenes;

    const sceneDuration =
        total /
        scenes.length;

    const timeline =
        [];

    scenes.forEach(
        (scene,index)=>{

            const start =
                index *
                sceneDuration;

            const words =
                String(
                    scene.narration || ""
                )
                .split(/\s+/)
                .filter(Boolean);

            const wordCount =
                Math.max(
                    1,
                    words.length
                );

            const each =
                sceneDuration /
                wordCount;

            words.forEach(
                (word,wIndex)=>{

                    timeline.push({

                        text:word,

                        start:
                            start +
                            wIndex * each,

                        end:
                            start +
                            (wIndex + 1) *
                            each

                    });

                }
            );

        }
    );

    return timeline;

}


/* =========================================================
   CANVAS IMAGE LOADER
========================================================= */

function loadImage(src){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.crossOrigin =
                "anonymous";

            img.onload =
                () => resolve(img);

            img.onerror =
                () =>
                reject(
                    new Error(
                        "Görsel yüklenemedi."
                    )
                );

            img.src =
                src;

        }
    );

}


/* =========================================================
   CANVAS TEXT
========================================================= */

function drawSubtitle(
    ctx,
    text,
    width,
    height
){

    if(!text)
        return;

    const maxWidth =
        width * .82;

    ctx.font =
        "bold 32px Arial";

    const words =
        text.split(" ");

    const lines =
        [];

    let line =
        "";

    words.forEach(word=>{

        const test =
            line
            ? line + " " + word
            : word;

        if(
            ctx.measureText(test).width >
            maxWidth
        ){

            lines.push(line);

            line =
                word;

        }else{

            line =
                test;

        }

    });

    if(line)
        lines.push(line);

    const lineHeight =
        40;

    const boxHeight =
        lines.length *
        lineHeight +
        30;

    const y =
        height -
        boxHeight -
        35;

    ctx.fillStyle =
        "rgba(0,0,0,.72)";

    ctx.fillRect(
        width*.07,
        y,
        width*.86,
        boxHeight
    );

    ctx.fillStyle =
        "#fff";

    ctx.textAlign =
        "center";

    lines.forEach(
        (line,index)=>{

            ctx.fillText(
                line,
                width/2,
                y +
                28 +
                index *
                lineHeight
            );

        }
    );

}


/* =========================================================
   VIDEO
========================================================= */

async function createVideo(){

    if(
        !currentScenes.length ||
        !currentScenes.some(
            s => s.imageUrl
        )
    ){

        setStatus(
            "⚠️ Önce görselleri oluştur.",
            "warn"
        );

        return;

    }

    try{

        setStatus(
            "🎥 Video hazırlanıyor..."
        );

        setProgress(0);

        const width =
            1280;

        const height =
            720;

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            width;

        canvas.height =
            height;

        const ctx =
            canvas.getContext(
                "2d"
            );

        const totalSeconds =
            Number(
                durationEl.value
            ) * 60;

        const sceneDuration =
            totalSeconds /
            currentScenes.length;

        const loadedImages =
            [];

        for(
            let i=0;
            i<currentScenes.length;
            i++
        ){

            if(!currentScenes[i].imageUrl){

                loadedImages.push(null);

                continue;

            }

            loadedImages.push(
                await loadImage(
                    currentScenes[i]
                    .imageUrl
                )
            );

        }

        const stream =
            canvas.captureStream(
                30
            );

        let finalStream =
            stream;

        let audioContext =
            null;

        let destination =
            null;

        let audioSources =
            [];

        /*
          Gerçek AI ses varsa Web Audio ile
          video stream'e bağlanır.
        */

        if(currentAudioBlob){

            try{

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                await audioContext.resume();

                destination =
                    audioContext.createMediaStreamDestination();

                const audioData =
                    await currentAudioBlob.arrayBuffer();

                const audioBuffer =
                    await audioContext.decodeAudioData(
                        audioData
                    );

                const source =
                    audioContext.createBufferSource();

                source.buffer =
                    audioBuffer;

                const gain =
                    audioContext.createGain();

                gain.gain.value =
                    1;

                source.connect(gain);

                gain.connect(
                    destination
                );

                finalStream =
                    new MediaStream([
                        ...stream.getVideoTracks(),
                        ...destination.stream.getAudioTracks()
                    ]);

                audioSources.push(
                    source
                );

            }catch(audioError){

                console.warn(
                    "Audio embedding error:",
                    audioError
                );

                finalStream =
                    stream;

            }

        }

        const mimeTypes = [

            "video/webm;codecs=vp9,opus",

            "video/webm;codecs=vp8,opus",

            "video/webm"

        ];

        let mimeType =
            "";

        for(
            const type of mimeTypes
        ){

            if(
                MediaRecorder.isTypeSupported(
                    type
                )
            ){

                mimeType =
                    type;

                break;

            }

        }

        const recorder =
            new MediaRecorder(
                finalStream,
                mimeType
                ? {mimeType}
                : undefined
            );

        const chunks =
            [];

        recorder.ondataavailable =
            event => {

                if(
                    event.data &&
                    event.data.size
                ){

                    chunks.push(
                        event.data
                    );

                }

            };

        const stopped =
            new Promise(
                resolve => {

                    recorder.onstop =
                        resolve;

                }
            );

        recorder.start(
            250
        );

        /*
          Ses kaynağını kayıt başladıktan sonra başlat.
        */

        if(
            audioSources.length &&
            audioContext
        ){

            const startAt =
                audioContext.currentTime +
                .15;

            audioSources.forEach(
                source => {

                    source.start(
                        startAt
                    );

                }
            );

        }

        const subtitleTimeline =
            buildSubtitleTimeline();

        const startTime =
            performance.now();

        let lastScene =
            -1;

        while(true){

            const elapsed =
                (
                    performance.now() -
                    startTime
                ) / 1000;

            if(
                elapsed >=
                totalSeconds
            )
                break;

            const sceneIndex =
                Math.min(
                    currentScenes.length - 1,
                    Math.floor(
                        elapsed /
                        sceneDuration
                    )
                );

            if(sceneIndex !== lastScene){

                lastScene =
                    sceneIndex;

                setStatus(
                    `🎥 Video oluşturuluyor... ${sceneIndex + 1}/${currentScenes.length}`
                );

            }

            const img =
                loadedImages[
                    sceneIndex
                ];

            ctx.fillStyle =
                "#000";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

            if(img){

                const scale =
                    Math.max(
                        width / img.width,
                        height / img.height
                    );

                const dw =
                    img.width *
                    scale;

                const dh =
                    img.height *
                    scale;

                const dx =
                    (width - dw) / 2;

                const dy =
                    (height - dh) / 2;

                ctx.drawImage(
                    img,
                    dx,
                    dy,
                    dw,
                    dh
                );

            }

            /*
              Hafif karartma
            */

            ctx.fillStyle =
                "rgba(0,0,0,.15)";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

            /*
              Başlık
            */

            ctx.fillStyle =
                "rgba(0,0,0,.55)";

            ctx.fillRect(
                35,
                30,
                width - 70,
                58
            );

            ctx.font =
                "bold 28px Arial";

            ctx.fillStyle =
                "#fff";

            ctx.textAlign =
                "left";

            ctx.fillText(
                currentScenes[
                    sceneIndex
                ].title || "",
                55,
                68
            );

            /*
              Kelime bazlı altyazı
            */

            const active =
                subtitleTimeline.find(
                    item =>
                        elapsed >= item.start &&
                        elapsed < item.end
                );

            if(active){

                drawSubtitle(
                    ctx,
                    active.text,
                    width,
                    height
                );

            }

            setProgress(
                (elapsed /
                totalSeconds) *
                100
            );

            await new Promise(
                requestAnimationFrame
            );

        }

        recorder.stop();

        await stopped;

        if(audioContext){

            try{
                await audioContext.close();
            }catch(e){}

        }

        currentVideoBlob =
            new Blob(
                chunks,
                {
                    type:
                        mimeType ||
                        "video/webm"
                }
            );

        const videoUrl =
            URL.createObjectURL(
                currentVideoBlob
            );

        videoPreview.src =
            videoUrl;

        videoPreview.style.display =
            "block";

        downloadVideo.href =
            videoUrl;

        downloadVideo.style.display =
            "block";

        setProgress(100);

        if(currentAudioBlob){

            setStatus(
                "🎉 Video hazır! Ses + altyazı + görseller WebM içine eklendi.",
                "ok"
            );

        }else{

            setStatus(
                "🎉 Video hazır! Görseller + altyazılar WebM içine eklendi. Gerçek AI ses mevcut olmadığı için ses eklenmedi.",
                "ok"
            );

        }

    }catch(error){

        console.error(error);

        setStatus(
            "❌ Video oluşturma hatası:\n\n" +
            error.message,
            "err"
        );

    }

}
