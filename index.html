<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mina AI Görsel Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#0b1020;
    color:white;
    padding:25px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aeb7cc;
    margin-bottom:25px;
}

.box{
    background:#151c31;
    border:1px solid #2b3655;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #394663;
    background:#0d1425;
    color:white;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#6d8cff;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#5865f2;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#6975ff;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#0d1425;
    color:#cbd5e1;
    line-height:1.5;
    white-space:pre-wrap;
}

.image-box{
    display:none;
    text-align:center;
}

.image-box img{
    width:100%;
    max-width:650px;
    border-radius:14px;
    display:block;
    margin:auto;
    border:1px solid #34405e;
}

.download{
    display:none;
    margin-top:15px;
    text-decoration:none;
    background:#1f9d55;
    color:white;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    text-align:center;
}

.small{
    font-size:13px;
    color:#8994aa;
    line-height:1.5;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎬 Mina AI Görsel Test</h1>

    <div class="subtitle">
        KONU → AI GÖRSEL → EKRANDA GÖSTER
    </div>

    <div class="box">

        <label>Hugging Face Token</label>

        <input
            id="token"
            type="password"
            placeholder="hf_ ile başlayan tokenını gir"
        >

        <div class="small">
            Token sadece bu tarayıcı oturumunda kullanılacak.
            GitHub'a yükleme.
        </div>

        <br>

        <label>Konu</label>

        <input
            id="topic"
            type="text"
            value="Gece yarısı terk edilmiş bir ormanda bulunan gizemli eski ev"
            placeholder="Örneğin: Berlin'de terk edilmiş gizemli bir bina"
        >

        <button id="generateBtn">
            🖼️ AI GÖRSEL OLUŞTUR
        </button>

        <div id="status" class="status">
            Hazır. Konuyu yaz ve butona bas.
        </div>

    </div>

    <div id="imageBox" class="box image-box">

        <h2>✨ Oluşturulan AI Görsel</h2>

        <img id="resultImage" alt="AI tarafından oluşturulan görsel">

        <a
            id="downloadBtn"
            class="download"
            download="mina-ai-gorsel.png"
        >
            ⬇️ GÖRSELİ KAYDET
        </a>

    </div>

</div>


<script type="module">

import { InferenceClient }
from "https://esm.sh/@huggingface/inference";


const tokenInput = document.getElementById("token");
const topicInput = document.getElementById("topic");
const generateBtn = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");

const imageBox = document.getElementById("imageBox");
const resultImage = document.getElementById("resultImage");
const downloadBtn = document.getElementById("downloadBtn");


function setStatus(text){
    statusBox.textContent = text;
}


generateBtn.addEventListener("click", async () => {

    const token = tokenInput.value.trim();
    const topic = topicInput.value.trim();

    if(!token){
        setStatus("❌ Önce Hugging Face tokenını gir.");
        tokenInput.focus();
        return;
    }

    if(!topic){
        setStatus("❌ Önce bir konu yaz.");
        topicInput.focus();
        return;
    }

    generateBtn.disabled = true;
    imageBox.style.display = "none";
    downloadBtn.style.display = "none";

    setStatus(
        "⏳ AI görsel hazırlanıyor...\n\n" +
        "Bu işlem biraz sürebilir. Lütfen butona tekrar basma."
    );

    try{

        const hf = new InferenceClient(token);

        const prompt =
            topic +
            ", cinematic mysterious atmosphere, " +
            "dramatic lighting, highly detailed, realistic photography, " +
            "dark cinematic composition, 16:9";

        const imageBlob = await hf.textToImage({
            model: "black-forest-labs/FLUX.1-dev",
            inputs: prompt
        });

        if(!imageBlob){
            throw new Error("AI görsel verisi alınamadı.");
        }

        const imageUrl = URL.createObjectURL(imageBlob);

        resultImage.src = imageUrl;

        downloadBtn.href = imageUrl;

        imageBox.style.display = "block";
        downloadBtn.style.display = "block";

        setStatus(
            "✅ BAŞARILI!\n\n" +
            "Konu:\n" + topic +
            "\n\nAI görsel ekranda gösterildi."
        );

    }catch(error){

        console.error(error);

        let message = error?.message || String(error);

        if(message.includes("401")){
            message =
                "Token geçersiz veya yetkisiz.\n\n" +
                "Hugging Face tokenını kontrol et.";
        }

        else if(message.includes("402")){
            message =
                "Hugging Face hesabının kullanılabilir kredisi olmayabilir.";
        }

        else if(message.includes("403")){
            message =
                "Hugging Face bu isteğe izin vermedi.\n\n" +
                "Token izinlerini kontrol et.";
        }

        else if(message.includes("429")){
            message =
                "Çok fazla istek gönderildi.\n\n" +
                "Biraz bekleyip tekrar dene.";
        }

        setStatus(
            "❌ AI GÖRSEL HATASI\n\n" +
            message
        );

    }finally{

        generateBtn.disabled = false;

    }

});

</script>

</body>
</html>
