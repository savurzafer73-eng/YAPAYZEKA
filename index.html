/* =========================================================
   TEXT
========================================================= */

function normalize(text){

return String(text||"")
.replace(/\r/g," ")
.replace(/\n+/g," ")
.replace(/\s+/g," ")
.trim();

}

function splitSentences(text){

text=normalize(text);

if(!text)return[];

var matches=text.match(
/[^.!?…]+(?:[.!?…]+|$)/g
);

if(!matches)return[text];

var result=[];

for(var i=0;i<matches.length;i++){

var s=matches[i].trim();

if(s)result.push(s);

}

return result;

}


/* =========================================================
   SMART GROUPING
========================================================= */

function sentenceType(sentence){

var words=normalize(sentence)
.split(/\s+/)
.filter(Boolean)
.length;

if(words<=9)return"short";
if(words<=19)return"normal";

return"long";

}

function groupSentences(sentences){

var result=[];
var i=0;

while(i<sentences.length){

var current=sentences[i];
var type=sentenceType(current);

if(type==="long"){

result.push([current]);
i++;
continue;

}

if(type==="short"){

var group=[current];

while(
group.length<3 &&
i+1<sentences.length &&
sentenceType(sentences[i+1])==="short"
){

group.push(sentences[i+1]);
i++;

}

result.push(group);
i++;
continue;

}

if(i+1<sentences.length){

var next=sentences[i+1];

if(sentenceType(next)!=="long"){

result.push([current,next]);
i+=2;
continue;

}

}

result.push([current]);
i++;

}

return result;

}


/* =========================================================
   CHARACTER

var characterProfile={
gender:"auto",
age:"auto",
hair:"auto",
hairLength:"auto",
skin:"auto",
eyes:"auto",
build:"auto",

function detectGenderStrong(text){

var t=normalize(text).toLowerCase();

var sentences=splitSentences(t);

var first=sentences.slice(0,4).join(" ");

var firstSentence=
sentences.length?
sentences[0]:
first;

var femaleScore=0;
var maleScore=0;

if(
/alleinerziehende mutter|mutter|frau|tochter|schriftstellerin|unternehmerin|gründerin|gruenderin|schauspielerin|köchin|koechin|studentin|ärztin|aerztin|sportlerin|erfinderin|sängerin|saengerin|ehefrau|freundin|verkäuferin|verkaeuferin/.test(first)
){

femaleScore+=20;

}

if(
/alleinerziehender vater|vater|mann|sohn|bruder|schriftsteller|unternehmer|gründer|gruender|schauspieler|koch|student|arzt|sportler|erfinder|sänger|saenger|ehemann|freund|verkäufer|verkaeufer/.test(first)
){

maleScore+=20;

}

if(/^\s*sie\b/.test(firstSentence))
femaleScore+=12;

if(/^\s*er\b/.test(firstSentence))
maleScore+=12;

if(/\bfrau\b/.test(first))
femaleScore+=10;

if(/\bmann\b/.test(first))
maleScore+=10;

if(femaleScore>maleScore && femaleScore>=8)
return"female";

if(maleScore>femaleScore && maleScore>=8)
return"male";

return"auto";

}

/* =========================================================
   SMART FIT
========================================================= */

function drawSmartFitToCanvas(ctx,img,cw,ch){

var iw=img.naturalWidth||img.width;
var ih=img.naturalHeight||img.height;

if(!iw||!ih)return;


/* ARKA PLAN */

var coverScale=Math.max(
cw/iw,
ch/ih
);

var bgW=iw*coverScale;
var bgH=ih*coverScale;

var bgX=(cw-bgW)/2;
var bgY=(ch-bgH)/2;

ctx.save();

ctx.filter=
"blur(22px) brightness(0.58) saturate(0.85)";

ctx.drawImage(
img,
bgX,
bgY,
bgW,
bgH
);

ctx.restore();


/* ANA GÖRSEL */

var containScale=Math.min(
cw/iw,
ch/ih
);

var mainW=iw*containScale;
var mainH=ih*containScale;

var mainX=(cw-mainW)/2;
var mainY=(ch-mainH)/2;

ctx.save();

ctx.shadowColor="rgba(0,0,0,0.45)";
ctx.shadowBlur=25;
ctx.shadowOffsetY=5;

ctx.drawImage(
img,
mainX,
mainY,
mainW,
mainH
);

ctx.restore();


/* VİNYET */

var gradient=ctx.createRadialGradient(
cw/2,
ch/2,
Math.min(cw,ch)*0.25,
cw/2,
ch/2,
Math.max(cw,ch)*0.72
);

gradient.addColorStop(
0,
"rgba(0,0,0,0)"
);

gradient.addColorStop(
1,
"rgba(0,0,0,0.28)"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,
0,
cw,
ch
);

}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

function uploadSceneImage(index,input){

if(!input.files||!input.files[0])return;

var file=input.files[0];

var scene=scenes[index];

if(scene.imageURL){

try{
URL.revokeObjectURL(scene.imageURL);
}catch(e){}

}

var url=URL.createObjectURL(file);

var img=new Image();

img.onload=function(){

scene.image=file;
scene.imageURL=url;
scene.imageObject=img;

renderScenes();

status(
"🟢 Sahne "+
(index+1)+
" görseli hazır: "+
img.naturalWidth+
" × "+
img.naturalHeight
);

};

img.onerror=function(){

URL.revokeObjectURL(url);

status("❌ Görsel yüklenemedi.");

};

img.src=url;

}


/* =========================================================
   ENSURE IMAGE
========================================================= */

function ensureSceneImage(scene){

return new Promise(function(resolve,reject){

if(scene.imageObject){

resolve(scene.imageObject);

return;

}

if(scene.imageURL){

var img=new Image();

img.onload=function(){

scene.imageObject=img;

resolve(img);

};

img.onerror=function(){

reject(
new Error(
"Sahne "+
scene.id+
" görseli yüklenemedi."
)
);

};

img.src=scene.imageURL;

return;

}

reject(
new Error(
"Sahne "+
scene.id+
" için görsel yok."
)
);

});

}

/* =========================================================
   PIPER
========================================================= */

async function loadTTS(){

if(ttsModule)return ttsModule;

status(
"⏳ Piper TTS yükleniyor..."
);

try{

ttsModule=await import(
"https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm"
);

status(
"✅ Piper TTS hazır."
);

return ttsModule;

}

catch(error){

console.error(error);

status(
"❌ Piper TTS yüklenemedi: "+
error.message
);

throw error;

}

}


/* =========================================================
   AUDIO DURATION
========================================================= */

function getAudioDuration(blob){

return new Promise(function(resolve,reject){

var url=URL.createObjectURL(blob);

var audio=new Audio();

audio.preload="metadata";

audio.onloadedmetadata=function(){

var d=audio.duration;

URL.revokeObjectURL(url);

if(!isFinite(d)||d<=0){

reject(
new Error("Geçersiz WAV süresi.")
);

return;

}

resolve(d);

};

audio.onerror=function(){

URL.revokeObjectURL(url);

reject(
new Error("WAV okunamadı.")
);

};

audio.src=url;

});

}


/* =========================================================
   GENERATE VOICE
========================================================= */

async function generateSceneVoice(index){

var scene=scenes[index];

try{

status(
"🔊 Sahne "+
scene.id+
"/"+
scenes.length+
" seslendiriliyor..."
);

var mod=await loadTTS();

var TtsSession=
mod.TtsSession||
(mod.default&&mod.default.TtsSession);

if(!TtsSession){

throw new Error(
"TtsSession bulunamadı."
);

}

var session=new TtsSession({

voice:"de_DE-thorsten-medium",

allowLocalModels:true,

fallbackStrategy:"auto"

});

var result=await session.predict(
scene.text.trim()
);

var blob=null;

if(result instanceof Blob){

blob=result;

}

else if(result&&result.audio){

blob=result.audio;

}

else if(result&&result.blob){

blob=result.blob;

}

else{

throw new Error(
"Piper WAV verisi alınamadı."
);

}

var duration=
await getAudioDuration(blob);

if(scene.audioURL){

try{
URL.revokeObjectURL(
scene.audioURL
);
}catch(e){}

}

scene.audioBlob=blob;

scene.audioURL=
URL.createObjectURL(blob);

scene.duration=duration;

scene.audioBuffer=null;

renderScenes();

status(
"✅ Sahne "+
scene.id+
" WAV hazır — "+
duration.toFixed(2)+
" saniye"
);

return true;

}

catch(error){

console.error(error);

status(
"❌ Sahne "+
scene.id+
" seslendirme hatası: "+
error.message
);

return false;

}

}


/* =========================================================
   AUTO GENERATE MISSING WAV
========================================================= */

async function ensureAllSceneAudio(){

for(var i=0;i<scenes.length;i++){

var scene=scenes[i];

if(
!scene.audioBlob||
!scene.audioURL||
!scene.duration||
scene.duration<=0
){

status(
"🔊 Otomatik seslendirme: Sahne "+
scene.id+
"/"+
scenes.length
);

var ok=
await generateSceneVoice(i);

if(!ok){

throw new Error(
"Sahne "+
scene.id+
" için WAV oluşturulamadı."
);

}

}

setProgress(
(i+1)/scenes.length*35
);

}

}

/* =========================================================
   LOGO
========================================================= */

$("logoInput").addEventListener(
"change",
function(){

var file=this.files[0];

if(!file)return;

var url=URL.createObjectURL(file);

var img=new Image();

img.onload=function(){

logoImage=img;

status(
"🟢 GeldStory logosu hazır."
);

};

}
);


/* =========================================================
   LOGO DRAW
========================================================= */

function drawLogo(ctx,canvas){

if(!logoImage)return;

var size=
parseInt(
$("logoSize").value,
10
)||100;

var opacity=
(parseInt(
$("logoOpacity").value,
10
)||90)/100;

var ratio=
logoImage.naturalWidth/
logoImage.naturalHeight;

var w=size;
var h=w/ratio;

var margin=28;

ctx.save();

ctx.globalAlpha=opacity;

ctx.drawImage(
logoImage,
canvas.width-w-margin,
margin,
w,
h
);

ctx.restore();

}


/* =========================================================
   MIME
========================================================= */

function getSupportedMime(){

var types=[

"video/webm;codecs=vp8,opus",

"video/webm;codecs=vp9,opus",

"video/webm"

];

for(var i=0;i<types.length;i++){

if(
MediaRecorder.isTypeSupported(
types[i]
)
){

return types[i];

}

}

return"";

}


/* =========================================================
   DECODE WAV
========================================================= */

async function decodeSceneAudio(
scene,
audioContext
){

if(scene.audioBuffer){

return scene.audioBuffer;

}

if(!scene.audioBlob){

throw new Error(
"Sahne "+
scene.id+
" için WAV yok."
);

}

var arrayBuffer=
await scene.audioBlob.arrayBuffer();

var buffer=
await audioContext.decodeAudioData(
arrayBuffer.slice(0)
);

scene.audioBuffer=buffer;

scene.duration=buffer.duration;

return buffer;

}


/* =========================================================
   FRAME
========================================================= */

function drawSceneFrame(
ctx,
canvas,
img,
ratio
){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="#000";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/*
    GÖRSELİN TAMAMI GÖRÜNÜR.
*/

drawSmartFitToCanvas(
ctx,
img,
canvas.width,
canvas.height
);


/*
    Çok hafif hareket.
    Görüntüyü kesmez.
*/

if(ratio>0){

ctx.save();

ctx.globalAlpha=
Math.min(
0.008,
ratio*0.008
);

ctx.fillStyle="#ffffff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.restore();

}

drawLogo(
ctx,
canvas
);

}


/* =========================================================
   RENDER
========================================================= */

async function renderVideo(){

if(renderBusy){

status(
"⏳ Render zaten devam ediyor."
);

return;

}

if(!scenes.length){

alert(
"Önce sahneleri oluştur."
);

return;

}

renderBusy=true;

$("downloadArea").innerHTML="";

setProgress(0);

var canvas=$("renderCanvas");

try{

/* FORMAT */

var format=$("format").value;

if(format==="16:9"){

canvas.width=1280;
canvas.height=720;

}

else if(format==="9:16"){

canvas.width=720;
canvas.height=1280;

}

else{

canvas.width=1080;
canvas.height=1080;

}


/* GÖRSELLER */

status(
"🖼️ Görseller hazırlanıyor..."
);

for(var i=0;i<scenes.length;i++){

await ensureSceneImage(
scenes[i]
);

setProgress(
(i/scenes.length)*20
);

}


/*
    ⭐ EN ÖNEMLİ YENİ SİSTEM ⭐

    WAV YOKSA OTOMATİK OLUŞTUR.
*/

status(
"🔊 Sesler kontrol ediliyor..."
);

await ensureAllSceneAudio();


/* AUDIO CONTEXT */

var audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

if(
audioContext.state==="suspended"
){

await audioContext.resume();

}


/* WAV BUFFER */

status(
"⏳ WAV dosyaları hazırlanıyor..."
);

for(var j=0;j<scenes.length;j++){

await decodeSceneAudio(
scenes[j],
audioContext
);

setProgress(
35+
(j/scenes.length)*10
);

}


/* STREAM */

var fps=
parseInt(
$("fps").value,
10
)||30;

var videoStream=
canvas.captureStream(fps);

var audioDestination=
audioContext.createMediaStreamDestination();

var finalStream=
new MediaStream();

var videoTracks=
videoStream.getVideoTracks();

for(var vt=0;vt<videoTracks.length;vt++){

finalStream.addTrack(
videoTracks[vt]
);

}

var audioTracks=
audioDestination
.stream
.getAudioTracks();

for(var at=0;at<audioTracks.length;at++){

finalStream.addTrack(
audioTracks[at]
);

}


/* RECORDER */

var mime=getSupportedMime();

var recorder;

if(mime){

recorder=new MediaRecorder(
finalStream,
{
mimeType:mime
}
);

}else{

recorder=new MediaRecorder(
finalStream
);

}

var chunks=[];

recorder.ondataavailable=
function(e){

if(
e.data&&
e.data.size>0
){

chunks.push(e.data);

}

};


var stoppedPromise=
new Promise(function(resolve){

recorder.onstop=resolve;

});


recorder.start(250);


/* TOTAL */

var totalDuration=
scenes.reduce(
function(sum,s){
return sum+s.duration;
},
0
);

var elapsedBefore=0;


/* SCENES */

for(
var s=0;
s<scenes.length;
s++
){

var scene=scenes[s];

status(
"🎬 Render: Sahne "+
scene.id+
"/"+
scenes.length+
" • "+
scene.duration.toFixed(2)+
" sn"
);

var img=scene.imageObject;

var buffer=scene.audioBuffer;


/* AUDIO */

var source=
audioContext.createBufferSource();

source.buffer=buffer;

source.connect(
audioDestination
);

source.start(0);


/* TIMER */

var sceneStart=
performance.now();

var sceneDuration=
scene.duration*1000;

while(true){

var now=
performance.now();

var elapsed=
now-sceneStart;

var ratio=
Math.min(
1,
elapsed/sceneDuration
);


/* DRAW */

drawSceneFrame(
canvas.getContext("2d",{
alpha:false
}),
canvas,
img,
ratio
);


/* GLOBAL */

var globalElapsed=
elapsedBefore+
elapsed/1000;

var globalRatio=
Math.min(
1,
globalElapsed/totalDuration
);

setProgress(
45+
globalRatio*55
);

if(elapsed>=sceneDuration){

break;

}

await new Promise(
function(resolve){

setTimeout(
resolve,
15
);

}
);

}


/*
    Sahne sesi ile görüntünün
    birbirine karışmaması için
    küçük güvenlik payı.
*/

await new Promise(
function(resolve){

setTimeout(
resolve,
100
);

}
);

elapsedBefore+=scene.duration;

}


/* FINAL FRAME */

drawSceneFrame(
canvas.getContext("2d",{
alpha:false
}),
canvas,
scenes[
scenes.length-1
].imageObject,
1
);


/* STOP */

await new Promise(
function(resolve){

setTimeout(
function(){

recorder.stop();

resolve();

},
300
);

}
);

await stoppedPromise;


/* CLOSE AUDIO */

try{

await audioContext.close();

}catch(e){}


/* VIDEO */

var blob=new Blob(
chunks,
{
type:"video/webm"
}
);

if(!blob.size){

throw new Error(
"Video dosyası boş oluştu."
);

}

var url=
URL.createObjectURL(blob);

var link=
document.createElement("a");

link.href=url;

link.download=
"GeldStory_V51.9_"+
Date.now()+
".webm";

link.textContent=
"⬇️ GELDSTORY VİDEOSUNU İNDİR";

link.style.display=
"inline-block";

link.style.padding=
"15px 22px";

link.style.background=
"#c7a96b";

link.style.color=
"#111";

link.style.borderRadius=
"10px";

link.style.textDecoration=
"none";

link.style.fontWeight=
"bold";

$("downloadArea")
.appendChild(link);

setProgress(100);

status(
"🎉 VİDEO HAZIR! "+
(
Math.round(
blob.size/1024/1024*100
)/100
)+
" MB"
);

}

catch(error){

console.error(error);

status(
"❌ Render başarısız: "+
error.message
);

alert(
"Video oluşturulamadı:\n\n"+
error.message
);

}

finally{

renderBusy=false;

}

}


/* =========================================================
   START
========================================================= */

status(
"🟢 Mina Video AI V51.9 hazır. WAV otomatik oluşturma aktif."
);

</script>
