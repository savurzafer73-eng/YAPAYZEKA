/* =========================================================
   PARSE
========================================================= */

function parseScenes(text){

    const parts =
    text.split(
        /SAHNE\s+\d+\s*:/gi
    )
    .map(x=>x.trim())
    .filter(Boolean);

    return parts.map(
        (part,index)=>{

            const visualMatch =
            part.match(
                /Görsel\s*:\s*([\s\S]*?)(?=Anlatım\s*:|$)/i
            );

            const narrationMatch =
            part.match(
                /Anlatım\s*:\s*([\s\S]*)/i
            );

            return {

                number:
                index+1,

                visual:
                visualMatch
                ? visualMatch[1].trim()
                : part,

                narration:
                narrationMatch
                ? narrationMatch[1].trim()
                : ""

            };

        }
    );

}

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(str){

    return String(str)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

async function getPublicAudioModels(){

    const response =
    await fetch(
        API_URL +
        "/audio/models"
    );

    const raw =
    await response.text();

    if(!response.ok){

        throw new Error(
            "audio/models HTTP " +
            response.status +
            ": " +
            raw
        );

    }

    return JSON.parse(raw);

}


/* =========================================================
   MODEL ID AL
========================================================= */

function getModelId(item){

    if(typeof item === "string")
        return item;

    return (
        item?.id ||
        item?.model ||
        item?.name ||
        ""
    );

}


/* =========================================================
   ADAY MODELLER
========================================================= */

async function buildAudioCandidates(){

    let models = [];

    try{

        const data =
        await getPublicAudioModels();

        if(
            Array.isArray(data)
        ){

            models = data;

        }
        else if(
            Array.isArray(data.data)
        ){

            models = data.data;

        }
        else if(
            Array.isArray(data.models)
        ){

            models = data.models;

        }

    }
    catch(e){

        console.warn(
            "Audio model listesi alınamadı:",
            e
        );

    }


    const discovered =
    models
    .map(getModelId)
    .filter(Boolean);


    /*
     * Kullanıcının anahtarında görünen
     * modeli özellikle ekliyoruz.
     */

    const candidates = [

        "community/NamanSoni78/FISH-AUDIO-S2.1-PRO",

        "fish-audio/s2.1-pro",

        "qwen/qwen3-tts-flash",

        "qwen/qwen3-tts-instruct-flash",

        "hexgrad/kokoro-82m",

        "sesame/csm-1b",

        "elevenlabs/eleven-flash-v2.5",

        "elevenlabs/eleven-multilingual-v2"

    ];


    discovered.forEach(
        model=>{

            const low =
            model.toLowerCase();

            if(
                low.includes("tts") ||
                low.includes("speech") ||
                low.includes("fish") ||
                low.includes("kokoro") ||
                low.includes("csm") ||
                low.includes("eleven")
            ){

                candidates.push(model);

            }

        }
    );


    return [
        ...new Set(candidates)
    ];

}

/* =========================================================
   POST TTS
========================================================= */

async function tryPostAudio(
    model,
    text,
    withVoice
){

    const body = {

        model:
        model,

        input:
        text,

        response_format:
        "mp3"

    };


    if(withVoice){

        body.voice =
        getVoice();

    }


    const response =
    await fetch(
        API_URL +
        "/v1/audio/speech",
        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/json",

                "Authorization":
                "Bearer " +
                accessToken
            },

            body:
            JSON.stringify(body)

        }
    );


    const raw =
    await response.text();


    return {

        ok:
        response.ok,

        status:
        response.status,

        raw:
        raw,

        contentType:
        response.headers
        .get("content-type")

    };

}

                            headers:{
                                "Content-Type":
                                "application/json",

                                "Authorization":
                                "Bearer " +
                                accessToken
                            },

                            body:
                            JSON.stringify({

                                model:
                                model,

                                input:
                                text,

                                voice:
                                getVoice(),

                                response_format:
                                "mp3"

                            })

                        }
                    );


                    if(binary.ok){

                        const audioBlob =
                        await binary.blob();

                        selectedAudioModel =
                        model;

                        generatedAudioURL =
                        URL.createObjectURL(
                            audioBlob
                        );

                        showAudioSuccess(
                            model
                        );

                        btn.disabled = false;

                        btn.textContent =
                        "🎙️ 4. AI Seslendirme Oluştur";

                        return;

                    }

                }


                failures.push(
                    model +
                    " / POST voice → HTTP " +
                    r2.status +
                    " → " +
                    cleanError(
                        r2.raw
                    )
                );

            }
            catch(e){

                failures.push(
                    model +
                    " / POST voice → " +
                    e.message
                );

            }


            /*
             * 3. GET endpoint
             */

            try{

                const r3 =
                await tryGetAudio(
                    model,
                    text
                );


                if(r3.ok){

                    const binary =
                    await fetch(
                        API_URL +
                        "/audio/" +
                        encodeURIComponent(text) +
                        "?model=" +
                        encodeURIComponent(model) +
                        "&voice=" +
                        encodeURIComponent(
                            getVoice()
                        ) +
                        "&key=" +
                        encodeURIComponent(
                            accessToken
                        )
                    );


                    if(binary.ok){

                        const audioBlob =
                        await binary.blob();

                        selectedAudioModel =
                        model;

                        generatedAudioURL =
                        URL.createObjectURL(
                            audioBlob
                        );

                        showAudioSuccess(
                            model
                        );

                        btn.disabled = false;

                        btn.textContent =
                        "🎙️ 4. AI Seslendirme Oluştur";

                        return;

                    }

                }


                failures.push(
                    model +
                    " / GET → HTTP " +
                    r3.status +
                    " → " +
                    cleanError(
                        r3.raw
                    )
                );

            }
            catch(e){

                failures.push(
                    model +
                    " / GET → " +
                    e.message
                );

            }

        }


        throw new Error(
            "Hiçbir ses yöntemi başarılı olmadı.\n\n" +
            failures.join("\n\n")
        );

    }
    catch(error){

        audioStatus.innerHTML =
        "<span class='error'>" +
        "❌ AI ses hatası:<br><br>" +
        escapeHTML(
            error.message
        ) +
        "</span>";

        console.error(
            error
        );

    }


    btn.disabled = false;

    btn.textContent =
    "🎙️ 4. AI Seslendirme Oluştur";

}


/* =========================================================
   HATA TEMİZLE
========================================================= */

function cleanError(raw){

    if(!raw)
        return "";

    let value =
    String(raw);

    try{

        const data =
        JSON.parse(value);

        if(
            data?.error?.message
        ){

            return data.error.message;

        }

        if(
            data?.message
        ){

            return data.message;

        }

    }
    catch(e){}

    return value
    .replace(/\s+/g," ")
    .slice(0,500);

}


/* =========================================================
   SES BAŞARILI
========================================================= */

function showAudioSuccess(model){

    audioBox.innerHTML = `

        <audio
            controls
            src="${generatedAudioURL}">
        </audio>

    `;


    audioStatus.innerHTML =
    "<span class='success'>" +
    "🟢 AI seslendirme hazır." +
    "</span><br>" +

    "<span class='badge'>" +
    escapeHTML(model) +
    "</span>";


    document.getElementById(
        "videoBtn"
    ).disabled = false;

}


/* =========================================================
   VIDEO
========================================================= */

async function createVideo(){

    if(
        !generatedImages.length
    ){

        alert(
            "Önce görselleri oluştur."
        );

        return;
    }


    if(
        !window.MediaRecorder
    ){

        alert(
            "Tarayıcın video kaydını desteklemiyor."
        );

        return;
    }


    const btn =
    document.getElementById(
        "videoBtn"
    );

    btn.disabled = true;

    videoStatus.innerHTML =
    "🎬 Video hazırlanıyor...";

    progressBar.style.width =
    "5%";


    try{

        const canvas =
        document.createElement(
            "canvas"
        );

        canvas.width =
        1280;

        canvas.height =
        720;


        const ctx =
        canvas.getContext("2d");


        const stream =
        canvas.captureStream(30);


        const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:
                "video/webm;codecs=vp9"
            }
        );


        const chunks = [];


        recorder.ondataavailable =
        function(e){

            if(e.data.size){

                chunks.push(
                    e.data
                );

            }

        };


        const stopped =
        new Promise(
            resolve=>{

                recorder.onstop =
                resolve;

            }
        );


        recorder.start();


        for(
            let i=0;
            i<generatedImages.length;
            i++
        ){

            const img =
            new Image();

            img.crossOrigin =
            "anonymous";

            img.src =
            generatedImages[i];


            await new Promise(
                resolve=>{

                    img.onload =
                    resolve;

                    img.onerror =
                    resolve;

                }
            );


            const start =
            performance.now();

            const duration =
            3500;


            await new Promise(
                resolve=>{

                    function draw(){

                        const elapsed =
                        performance.now() -
                        start;

                        const p =
                        Math.min(
                            elapsed /
                            duration,
                            1
                        );


                        ctx.fillStyle =
                        "#000";

                        ctx.fillRect(
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );


                        const scale =
                        Math.max(
                            canvas.width /
                            img.width,

                            canvas.height /
                            img.height
                        );


                        const w =
                        img.width *
                        scale *
                        (1+p*.04);

                        const h =
                        img.height *
                        scale *
                        (1+p*.04);


                        const x =
                        (canvas.width-w)/2;

                        const y =
                        (canvas.height-h)/2;


                        ctx.drawImage(
                            img,
                            x,
                            y,
                            w,
                            h
                        );


                        progressBar.style.width =
                        (
                            5 +
                            (
                                (i+p) /
                                generatedImages.length
                            ) *
                            90
                        ) +
                        "%";


                        if(
                            p<1
                        ){

                            requestAnimationFrame(
                                draw
                            );

                        }
                        else{

                            resolve();

                        }

                    }

                    draw();

                }
            );

        }


        recorder.stop();

        await stopped;


        const blob =
        new Blob(
            chunks,
            {
                type:
                "video/webm"
            }
        );


        const url =
        URL.createObjectURL(
            blob
        );


        videoBox.innerHTML = `

        <video
            controls
            src="${url}">
        </video>

        <a
            class="download"
            href="${url}"
            download="mina-video.webm">
            ⬇️ Videoyu Kaydet
        </a>

        `;


        progressBar.style.width =
        "100%";


        videoStatus.innerHTML =
        "<span class='success'>" +
        "🟢 Video başarıyla oluşturuldu." +
        "</span>";

    }
    catch(error){

        videoStatus.innerHTML =
        "<span class='error'>" +
        "❌ Video hatası: " +
        escapeHTML(
            error.message
        ) +
        "</span>";

    }


    btn.disabled = false;

}

</script>
