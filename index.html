<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
      radial-gradient(circle at top,#17244d 0%,#0b1020 45%,#060913 100%);
    color:#fff;
    min-height:100vh;
}

.container{
    max-width:760px;
    margin:auto;
    padding:22px 16px 50px;
}

.header{
    text-align:center;
    padding:15px 0 20px;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    background:linear-gradient(135deg,#7c4dff,#00d4ff);
    box-shadow:0 10px 35px rgba(0,180,255,.25);
}

h1{
    margin:14px 0 5px;
    font-size:30px;
}

.subtitle{
    color:#aeb9d5;
    font-size:14px;
}

.status{
    margin:15px 0;
    padding:12px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    text-align:center;
    font-size:14px;
}

.status.ok{
    color:#6dffad;
    border-color:rgba(80,255,150,.25);
}

.status.error{
    color:#ff8585;
    border-color:rgba(255,80,80,.25);
}

.card{
    background:rgba(13,19,38,.88);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 12px 35px rgba(0,0,0,.22);
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#b8c4df;
}

textarea,
select,
input{
    width:100%;
    background:#080d1d;
    color:#fff;
    border:1px solid #263252;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

textarea:focus,
select:focus{
    border-color:#6b7cff;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    margin-top:10px;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#6654ff,#00aeea);
    box-shadow:0 8px 20px rgba(49,119,255,.18);
}

button:hover{
    filter:brightness(1.08);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.secondary{
    background:#171e34;
    border:1px solid #293452;
}

.progress{
    width:100%;
    height:8px;
    background:#11182b;
    border-radius:10px;
    overflow:hidden;
    margin-top:14px;
}

.progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#6b55ff,#00d4ff);
    transition:width .3s;
}

#log{
    white-space:pre-wrap;
    color:#9faccc;
    font-size:13px;
    line-height:1.55;
    max-height:250px;
    overflow:auto;
}

.scene{
    padding:12px;
    border-radius:12px;
    background:#0a1022;
    border:1px solid #202b49;
    margin-top:10px;
}

.sceneTitle{
    font-weight:bold;
    margin-bottom:6px;
    color:#72dfff;
}

.sceneText{
    color:#c5cee2;
    font-size:14px;
    line-height:1.5;
}

.imageGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

.imageGrid img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #263252;
    background:#050814;
}

audio{
    width:100%;
    margin-top:12px;
}

video{
    width:100%;
    margin-top:12px;
    border-radius:15px;
    background:#000;
}

.small{
    color:#7f8ba9;
    font-size:12px;
    margin-top:7px;
    line-height:1.5;
}

.hidden{
    display:none;
}

.spinner{
    display:inline-block;
    width:14px;
    height:14px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:6px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:600px){
    .row{
        grid-template-columns:1fr;
    }

    h1{
        font-size:26px;
    }
}
</style>
</head>

Mina Video AI hazır.

<script>

/* =========================================================
   MINA VIDEO AI
========================================================= */

const APP_KEY = "pk_QJfK0SKE0MqAqf3I";

const REDIRECT_URI =
"https://savurzafer73-eng.github.io/YAPAYZEKA/";

const API_URL =
"https://gen.pollinations.ai";

const AUTH_URL =
"https://enter.pollinations.ai/authorize";

const TEXT_MODEL =
"openai/gpt-5.4-nano";

const IMAGE_MODEL =
"black-forest-labs/flux.1-schnell";

/*
   ÖNEMLİ:
   Güncel Pollinations ses modeli.
*/
const AUDIO_MODEL =
"fish-audio/s2.1-pro";


let accessToken = null;

let sceneData = [];

let imageData = [];

let audioURL = "";

let videoURL = "";


/* =========================================================
   ELEMENTLER
========================================================= */

const statusBox =
document.getElementById("status");

const logBox =
document.getElementById("log");

const progressBar =
document.getElementById("progressBar");

const scriptBox =
document.getElementById("script");

const scenesBox =
document.getElementById("scenes");

const imagesBox =
document.getElementById("images");

const audioPlayer =
document.getElementById("audio");

const videoPlayer =
document.getElementById("video");

const downloadBtn =
document.getElementById("downloadBtn");


/* =========================================================
   LOG
========================================================= */

function log(message){

    logBox.textContent +=
        "\n" + message;

    logBox.scrollTop =
        logBox.scrollHeight;
}


function setProgress(value){

    progressBar.style.width =
        Math.max(0,Math.min(100,value)) + "%";
}


function setStatus(text,type){

    statusBox.textContent = text;

    statusBox.className =
        "status " + (type || "");
}


/* =========================================================
   AUTH
========================================================= */

function checkAuth(){

    const hash =
        window.location.hash;

    if(hash){

        const params =
            new URLSearchParams(
                hash.substring(1)
            );

        const key =
            params.get("api_key");

        if(key){

            accessToken = key;

            sessionStorage.setItem(
                "mina_access_token",
                key
            );

            history.replaceState(
                null,
                document.title,
                window.location.pathname +
                window.location.search
            );

            setConnected();

            return;
        }
    }

    const saved =
        sessionStorage.getItem(
            "mina_access_token"
        );

    if(saved){

        accessToken = saved;

        setConnected();

        return;
    }

    setStatus(
        "🔴 Mina AI bağlantısı yapılmadı.",
        "error"
    );
}


function setConnected(){

    setStatus(
        "🟢 Mina AI bağlantısı aktif.",
        "ok"
    );

    log(
        "Mina AI bağlantısı başarılı."
    );
}


function connectAI(){

    const params =
        new URLSearchParams();

    params.set(
        "redirect_uri",
        REDIRECT_URI
    );

    params.set(
        "client_id",
        APP_KEY
    );

    params.set(
        "scope",
        "usage"
    );

    window.location.href =
        AUTH_URL + "?" +
        params.toString();
}


/* =========================================================
   API CHAT
========================================================= */

async function apiChat(messages){

    if(!accessToken){

        throw new Error(
            "Önce Mina AI bağlantısını yapmalısın."
        );
    }

    const response =
        await fetch(
            API_URL +
            "/v1/chat/completions",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " +
                        accessToken
                },

                body:JSON.stringify({

                    model:TEXT_MODEL,

                    messages:messages,

                    temperature:.8
                })
            }
        );

    const text =
        await response.text();

    if(!response.ok){

        throw new Error(
            "AI metin servisi HTTP " +
            response.status +
            " döndürdü.\n" +
            text
        );
    }

    let data;

    try{
        data = JSON.parse(text);
    }
    catch(e){

        throw new Error(
            "AI cevabı JSON olarak okunamadı."
        );
    }

    if(
        !data.choices ||
        !data.choices[0]
    ){

        throw new Error(
            "AI cevabında sonuç bulunamadı."
        );
    }

    return data.choices[0]
        .message
        .content;
}


/* =========================================================
   SENARYO
========================================================= */

    const topic =
        document.getElementById(
            "topic"
        ).value.trim();

    const language =

    if(!topic){

    }

    try{

            "\n✍️ Senaryo oluşturuluyor..."
        );

        let languageName =

            : language === "de"

        const result =

                    role:"system",

                    content:
                    "Sen profesyonel bir sinematik " +
                    "video senaryo yazarısın. " +
                    "Kısa sosyal medya videoları için " +

                    "senaryolar üret."
                },

                {
                    role:"user",

                    content:
                    "Video konusu: " +
                    topic +

                    "\nDil: " +
                    languageName +

                    "\n\nYaklaşık 60-90 saniyelik " +

                }

            ]);

        scriptBox.value =

        setProgress(25);

            "✅ Senaryo oluşturuldu."
        );

    }
    catch(error){

        log(

/* =========================================================
   SAHNELER
========================================================= */

async function generateScenes(){

    const script =
        scriptBox.value.trim();

    const count =
        Number(
            document.getElementById(
                "sceneCount"
            ).value
        );

    if(!script){

        alert(
            "Önce senaryo oluştur."
        );

        return;
    }

    try{

        disableButtons(true);

        setProgress(30);

        log(
            "\n🎬 Sahneler hazırlanıyor..."
        );

        const result =
            await apiChat([

                {
                    role:"system",

                    content:
                    "Sen profesyonel bir storyboard " +
                    "yönetmenisin. Verilen senaryoyu " +
                    "sinematik görsel sahnelere ayır."
                },

                {
                    role:"user",

                    content:
                    "Senaryo:\n" +
                    script +

                    "\n\nTam olarak " +
                    count +
                    " sahne oluştur.\n" +

                    "Her sahneyi şu formatta ver:\n" +
                    "SAHNE 1: kısa sahne açıklaması\n" +
                    "SAHNE 2: kısa sahne açıklaması\n" +
                    "...\n\n" +

                    "Her sahne görsel üretimine uygun " +
                    "olmalı."
                }

            ]);

        sceneData =
            parseScenes(
                result,
                count
            );

        renderScenes();

        setProgress(45);

        log(
            "✅ " +
            sceneData.length +
            " sahne oluşturuldu."
        );

    }
    catch(error){

        log(
            "❌ Sahne hatası: " +
            error.message
        );
    }

    finally{

        disableButtons(false);
    }
}


function parseScenes(text,count){

    let lines =
        text.split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    let result = [];

    for(let i=0;i<lines.length;i++){

        let line =
            lines[i];

        if(
            /^SAHNE\s*\d+/i.test(line) ||
            /^SCENE\s*\d+/i.test(line)
        ){

            line =
                line.replace(
                    /^SAHNE\s*\d+\s*:?\s*/i,
                    ""
                );

            line =
                line.replace(
                    /^SCENE\s*\d+\s*:?\s*/i,
                    ""
                );

            if(line){

                result.push(line);
            }
        }
    }

    if(result.length === 0){

        const chunks =
            text.split(/\n\s*\n/);

        result =
            chunks
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0,count);
    }

    while(result.length < count){

        result.push(
            "Sinematik bir sahne: " +
            scriptBox.value
        );
    }

    return result.slice(0,count);
}


function renderScenes(){

    scenesBox.innerHTML = "";

    sceneData.forEach(
        (scene,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "scene";

            div.innerHTML =
                '<div class="sceneTitle">' +
                "SAHNE " +
                (index+1) +
                "</div>" +

                '<div class="sceneText">' +
                escapeHTML(scene) +
                "</div>";

            scenesBox.appendChild(div);
        }
    );
}


/* =========================================================
   GÖRSELLER
========================================================= */

async function generateImages(){

    if(!sceneData.length){

        alert(
            "Önce sahneleri oluştur."
        );

        return;
    }

    try{

        disableButtons(true);

        imagesBox.innerHTML = "";

        imageData = [];

        setProgress(50);

        log(
            "\n🖼️ Görseller oluşturuluyor..."
        );

        const language =
            document.getElementById(
                "language"
            ).value;

        for(
            let i=0;
            i<sceneData.length;
            i++
        ){

            log(
                "🖼️ Görsel " +
                (i+1) +
                "/" +
                sceneData.length
            );

            const prompt =
                "Cinematic movie scene, " +
                "photorealistic, dramatic lighting, " +
                "high detail, realistic people, " +
                "professional film still, " +
                "16:9 composition. " +
                sceneData[i];

            const url =
                API_URL +
                "/image/" +
                encodeURIComponent(prompt) +

                "?model=" +
                encodeURIComponent(
                    IMAGE_MODEL
                ) +

                "&width=1280" +
                "&height=720" +

                "&nologo=true" +

                "&key=" +
                encodeURIComponent(
                    accessToken
                );

            const img =
                document.createElement("img");

            img.src = url;

            img.alt =
                "Sahne " +
                (i+1);

            imagesBox.appendChild(img);

            imageData.push(url);

            setProgress(
                50 +
                ((i+1) /
                sceneData.length) *
                25
            );

            await wait(1000);
        }

        log(
            "✅ Görseller hazır."
        );

    }
    catch(error){

        log(
            "❌ Görsel hatası: " +
            error.message
        );
    }

    finally{

        disableButtons(false);
    }
}


/* =========================================================
   SES
========================================================= */

async function generateAudio(){

    const script =
        scriptBox.value.trim();

    if(!script){

        alert(
            "Önce senaryo oluştur."
        );

        return;
    }

    if(!accessToken){

        alert(
            "Önce Mina AI'yi bağla."
        );

        return;
    }

    try{

        disableButtons(true);

        setProgress(78);

        log(
            "\n🎙️ Yapay zekâ sesi oluşturuluyor..."
        );

        const voice =
            document.getElementById(
                "voice"
            ).value;

        /*
           GÜNCEL POLLINATIONS TTS API

           model:
           fish-audio/s2.1-pro

           input:
           senaryo

           response_format:
           mp3
        */

        const response =
            await fetch(
                API_URL +
                "/v1/audio/speech",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            accessToken
                    },

                    body:JSON.stringify({

                        model:
                            AUDIO_MODEL,

                        input:
                            script,

                        voice:
                            voice,

                        response_format:
                            "mp3"
                    })
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                "AI ses servisi HTTP " +
                response.status +
                " döndürdü.\n" +
                errorText
            );
        }

        const blob =
            await response.blob();

        if(
            !blob ||
            blob.size < 100
        ){

            throw new Error(
                "AI ses servisi boş ses döndürdü."
            );
        }

        if(audioURL){

            URL.revokeObjectURL(
                audioURL
            );
        }

        audioURL =
            URL.createObjectURL(
                blob
            );

        audioPlayer.src =
            audioURL;

        audioPlayer.load();

        setProgress(88);

        log(
            "✅ Yapay zekâ sesi hazır."
        );

    }
    catch(error){

        log(
            "❌ AI ses hatası: " +
            error.message
        );

        alert(
            "AI ses hatası:\n\n" +
            error.message
        );
    }

    finally{

        disableButtons(false);
    }
}


/* =========================================================
   VİDEO
========================================================= */

async function createVideo(){

    if(!imageData.length){

        alert(
            "Önce sahne görsellerini oluştur."
        );

        return;
    }

    try{

        disableButtons(true);

        setProgress(90);

        log(
            "\n🎥 Video hazırlanıyor..."
        );

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width = 1280;

        canvas.height = 720;

        const ctx =
            canvas.getContext("2d");

        const stream =
            canvas.captureStream(30);

        let audioStream = null;

        /*
           Tarayıcı ses akışını videoya eklemeye
           çalışıyoruz. Bazı Chrome sürümlerinde
           MediaElement.captureStream desteklenebilir.
        */

        try{

            if(
                audioPlayer.captureStream
            ){

                audioStream =
                    audioPlayer.captureStream();

                audioStream
                    .getAudioTracks()
                    .forEach(track=>{
                        stream.addTrack(track);
                    });
            }

        }
        catch(e){

            log(
                "ℹ️ Ses video akışına eklenemedi; " +
                "video yine oluşturulacak."
            );
        }

        let mimeType =
            "";

        if(
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp9,opus"
            )
        ){

            mimeType =
                "video/webm;codecs=vp9,opus";

        }
        else if(
            MediaRecorder.isTypeSupported(
                "video/webm"
            )
        ){

            mimeType =
                "video/webm";
        }

        if(!mimeType){

            throw new Error(
                "Tarayıcın WebM video oluşturmayı desteklemiyor."
            );
        }

        const recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:mimeType
                }
            );

        const chunks = [];

        recorder.ondataavailable =
            function(event){

                if(event.data &&
                   event.data.size > 0){

                    chunks.push(
                        event.data
                    );
                }
            };

        const recordingFinished =
            new Promise(
                resolve => {

                    recorder.onstop =
                        resolve;
                }
            );

        recorder.start();

        const duration =
            3500;

        for(
            let i=0;
            i<imageData.length;
            i++
        ){

            await drawImage(
                ctx,
                imageData[i],
                canvas.width,
                canvas.height
            );

            /*
               Hafif sinematik zoom efekti.
            */

            await cinematicHold(
                ctx,
                imageData[i],
                canvas.width,
                canvas.height,
                duration
            );

            setProgress(
                90 +
                ((i+1) /
                imageData.length) * 8
            );
        }

        recorder.stop();

        await recordingFinished;

        const blob =
            new Blob(
                chunks,
                {
                    type:mimeType
                }
            );

        if(videoURL){

            URL.revokeObjectURL(
                videoURL
            );
        }

        videoURL =
            URL.createObjectURL(
                blob
            );

        videoPlayer.src =
            videoURL;

        videoPlayer.load();

        downloadBtn.classList.remove(
            "hidden"
        );

        setProgress(100);

        log(
            "✅ Video hazır!"
        );

    }
    catch(error){

        log(
            "❌ Video hatası: " +
            error.message
        );

        alert(
            "Video oluşturulamadı:\n\n" +
            error.message
        );
    }

    finally{

        disableButtons(false);
    }
}


/* =========================================================
   GÖRSEL YÜKLE
========================================================= */

function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.crossOrigin =
                "anonymous";

            img.onload =
                ()=>resolve(img);

            img.onerror =
                ()=>reject(
                    new Error(
                        "Görsel yüklenemedi."
                    )
                );

            img.src = url;
        }
    );
}


async function drawImage(
    ctx,
    url,
    width,
    height
){

    const img =
        await loadImage(url);

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const ratio =
        Math.max(
            width / img.width,
            height / img.height
        );

    const w =
        img.width * ratio;

    const h =
        img.height * ratio;

    const x =
        (width-w)/2;

    const y =
        (height-h)/2;

    ctx.drawImage(
        img,
        x,
        y,
        w,
        h
    );
}


/* =========================================================
   SİNEMATİK HAREKET
========================================================= */

async function cinematicHold(
    ctx,
    url,
    width,
    height,
    duration
){

    const img =
        await loadImage(url);

    const start =
        performance.now();

    return new Promise(
        resolve=>{

            function frame(now){

                const elapsed =
                    now-start;

                const p =
                    Math.min(
                        1,
                        elapsed/duration
                    );

                const zoom =
                    1 +
                    p * .07;

                const baseRatio =
                    Math.max(
                        width/img.width,
                        height/img.height
                    );

                const w =
                    img.width *
                    baseRatio *
                    zoom;

                const h =
                    img.height *
                    baseRatio *
                    zoom;

                const x =
                    (width-w)/2;

                const y =
                    (height-h)/2;

                ctx.fillStyle =
                    "#000";

                ctx.fillRect(
                    0,
                    0,
                    width,
                    height
                );

                ctx.drawImage(
                    img,
                    x,
                    y,
                    w,
                    h
                );

                /*
                   Hafif karartma.
                */

                const fade =
                    p < .08
                    ? p/.08
                    : p > .92
                    ? (1-p)/.08
                    : 1;

                ctx.fillStyle =
                    "rgba(0,0,0," +
                    (0.08*(1-fade)) +
                    ")";

                ctx.fillRect(
                    0,
                    0,
                    width,
                    height
                );

                if(p < 1){

                    requestAnimationFrame(
                        frame
                    );

                }else{

                    resolve();
                }
            }

            requestAnimationFrame(
                frame
            );
        }
    );
}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadVideo(){

    if(!videoURL){

        return;
    }

    const a =
        document.createElement("a");

    a.href =
        videoURL;

    a.download =
        "mina-video.webm";

    document.body.appendChild(a);

    a.click();

    a.remove();
}


/* =========================================================
   YARDIMCILAR
========================================================= */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );
}


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function disableButtons(disabled){

    const ids = [
        "connectBtn",
        "scriptBtn",
        "sceneBtn",
        "imageBtn",
        "audioBtn",
        "videoBtn"
    ];

    ids.forEach(id=>{

        const el =
            document.getElementById(id);

        if(el){
            el.disabled =
                disabled;
        }
    });
}
