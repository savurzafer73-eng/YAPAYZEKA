/* =====================================================
   PKCE
===================================================== */

function randomString(length=64){

  const chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  let result="";

  for(let i=0;i<length;i++){

    result +=
    chars[Math.floor(Math.random()*chars.length)];

  }

  return result;
}


async function sha256(text){

  const data =
  new TextEncoder().encode(text);

  return crypto.subtle.digest("SHA-256",data);

}


function base64url(buffer){

  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
  .replace(/\+/g,"-")
  .replace(/\//g,"_")
  .replace(/=/g,"");

}


/* =====================================================
   BAĞLAN
===================================================== */

connectBtn.onclick = async()=>{

  try{

    const verifier =
    randomString();

    const challenge =
    base64url(
      await sha256(verifier)
    );

    sessionStorage.setItem(
      "mina_code_verifier",
      verifier
    );

    const url =
    AUTH_URL+
    "?client_id="+encodeURIComponent(APP_KEY)+
    "&redirect_uri="+encodeURIComponent(REDIRECT_URI)+
    "&response_type=code"+
    "&code_challenge="+encodeURIComponent(challenge)+
    "&code_challenge_method=S256";

    location.href=url;

  }catch(e){

    connection.textContent =
    "❌ Bağlantı hatası: "+e.message;

  }

};


/* =====================================================
   CALLBACK
===================================================== */

async function handleCallback(){

  const params =
  new URLSearchParams(location.search);

  const code =
  params.get("code");

  if(!code)return;

  const verifier =
  sessionStorage.getItem(
    "mina_code_verifier"
  );

  if(!verifier){

    connection.textContent =
    "❌ PKCE doğrulama bilgisi bulunamadı.";

    return;

  }

  try{

    const response =
    await fetch(TOKEN_URL,{

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        grant_type:"authorization_code",

        code:code,

        client_id:APP_KEY,

        redirect_uri:REDIRECT_URI,

        code_verifier:verifier

      })

    });

    const data =
    await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        "Token alınamadı."
      );

    }

    accessToken =
    data.access_token;

    sessionStorage.setItem(
      "mina_access_token",
      accessToken
    );

    history.replaceState(
      {},
      document.title,
      REDIRECT_URI
    );

    setConnected();

  }catch(e){

    connection.textContent =
    "❌ Bağlantı hatası: "+e.message;

  }

}


/* =====================================================
   TOKEN KONTROL
===================================================== */

function setConnected(){

  connection.innerHTML =
  "🟢 Mina AI bağlantısı aktif.";

  scriptBtn.disabled=false;

}


(function(){

  const saved =
  sessionStorage.getItem(
    "mina_access_token"
  );

  if(saved){

    accessToken=saved;

    setConnected();

  }

  handleCallback();

})();


/* =====================================================
   API
===================================================== */

async function apiChat(messages){

  if(!accessToken){

    throw new Error(
      "Önce Mina AI'yi bağla."
    );

  }

  const response =
  await fetch(
    API_URL+"/v1/chat/completions",
    {

      method:"POST",

      headers:{

        "Content-Type":
        "application/json",

        "Authorization":
        "Bearer "+accessToken

      },

      body:JSON.stringify({

        model:TEXT_MODEL,

        messages:messages,

        temperature:.7

      })

    }
  );

  const data =
  await response.json();

  if(!response.ok){

    throw new Error(
      data.error?.message ||
      data.message ||
      "AI isteği başarısız."
    );

  }

  return data
  .choices?.[0]?.message?.content || "";

}

/* =====================================================
   JSON TEMİZLEME MOTORU
===================================================== */

/*
   Buradaki sistem özellikle
   Unexpected token '}' hatasını
   önlemek için hazırlandı.
*/

function cleanAIJson(text){

  if(!text)return null;


  let s=text.trim();


  /* Markdown kaldır */

  s=s.replace(/```json/gi,"");

  s=s.replace(/```/g,"");

  s=s.trim();


  /* İlk [ ve son ] arasını bul */

  const first =
  s.indexOf("[");

  const last =
  s.lastIndexOf("]");


  if(first>=0 && last>first){

    s=s.substring(
      first,
      last+1
    );

  }


  /* Akıllı tırnakları düzelt */

  s=s
  .replace(/[“”]/g,'"')
  .replace(/[‘’]/g,"'");


  /*
    En önemli düzeltme:
    }, }, {
    veya
    },, {
    gibi durumları düzelt.
  */

  s=s.replace(
    /,\s*},\s*}/g,
    "}}"
  );

  s=s.replace(
    /,\s*},\s*{/g,
    "},{"
  );

  s=s.replace(
    /,\s*,/g,
    ","
  );

  s=s.replace(
    /{\s*,/g,
    "{"
  );

  s=s.replace(
    /,\s*]/g,
    "]"
  );

  s=s.replace(
    /,\s*}/g,
    "}"
  );


  try{

    return JSON.parse(s);

  }catch(e){

    /*
      İkinci kurtarma yöntemi:
      Her satırdan ayrı obje çıkarmayı deniyoruz.
    */

    const objects=[];

    const regex=
    /\{[\s\S]*?\}/g;

    const matches =
    s.match(regex) || [];

    for(const item of matches){

      try{

        const obj =
        JSON.parse(item);

        if(
          obj &&
          (
            obj.visual ||
            obj.image ||
            obj.prompt ||
            obj.text ||
            obj.narration
          )
        ){

          objects.push(obj);

        }

      }catch(_){}

    }

    if(objects.length)
      return objects;

    throw e;

  }

}


/* =====================================================
   SAHNE VERİSİ NORMALİZE
===================================================== */

function normalizeScenes(data){

  if(!Array.isArray(data))
    return [];


  const result=[];


  for(let i=0;i<data.length;i++){

    const x=data[i];

    if(!x || typeof x!=="object")
      continue;


    const text =
    x.narration ||
    x.text ||
    x.description ||
    x.script ||
    "";


    const visual =
    x.visual ||
    x.image ||
    x.prompt ||
    x.description ||
    "cinematic scene";


    result.push({

      id:i+1,

      text:String(text),

      visual:String(visual),

      image:null

    });

  }


  return result;

}


/* =====================================================
   YEDEK SAHNELER
===================================================== */

function createFallbackScenes(){

  const text =
  script.value.trim();

  if(!text){

    return [

      {
        id:1,
        text:"Hikâyemiz burada başlıyor.",
        visual:
        "cinematic opening scene, dramatic lighting, realistic film still",
        image:null
      },

      {
        id:2,
        text:"Karakterimiz zorluklarla karşılaşıyor.",
        visual:
        "person facing difficulties, dramatic cinematic scene, realistic",
        image:null
      },

      {
        id:3,
        text:"Ama pes etmiyor ve yoluna devam ediyor.",
        visual:
        "determined person walking forward, cinematic lighting, realistic",
        image:null
      },

      {
        id:4,
        text:"Sonunda büyük değişim gerçekleşiyor.",
        visual:
        "successful person standing confidently, cinematic scene, realistic",
        image:null
      }

    ];

  }


  const parts =
  text
  .split(/[.!?]+/)
  .map(x=>x.trim())
  .filter(Boolean);


  const selected =
  parts.slice(0,6);


  return selected.map(
    (sentence,index)=>({

      id:index+1,

      text:sentence,

      visual:
      "cinematic realistic film scene illustrating: "+
      sentence,

      image:null

    })
  );

}


/* =====================================================
   SAHNELERİ OLUŞTUR
===================================================== */

sceneBtn.onclick = async()=>{

  sceneBtn.disabled=true;

  scenes.innerHTML="";

  sceneStatus.textContent =
  "⏳ AI sahneleri hazırlıyor...";


  try{

    const result =
    await apiChat([

      {
        role:"system",

        content:

        "Markdown kullanma. "+

        "JSON örneği: "+
        '[{"narration":"...","visual":"..."}]'
      },

      {
        role:"user",

        content:
        "Bu senaryoyu 5-6 sinematik sahneye ayır:\n\n"+
        script.value
      }

    ]);


    let parsed=null;


    try{

      parsed =
      cleanAIJson(result);

    }

    /*
      JSON bozuksa uygulama durmuyor.

    */

    if(scenesData.length<2){

      scenesData =
      createFallbackScenes();

      sceneStatus.textContent =
      "⚠️ AI JSON'u bozuk geldi. Otomatik sahne sistemi kullanıldı.";

    }else{

      sceneStatus.textContent =
      "✅ "+scenesData.length+
      " sahne hazır. Görseller hazırlanıyor...";

    }


    renderScenes();

    await generateImages();

    !selectedAudioBlob;

  }catch(e){

    scenesData =
    createFallbackScenes();

    renderScenes();

    sceneStatus.textContent =
    "⚠️ AI sahne formatı sorunlu. Yedek sahne sistemi kullanıldı.";

    try{

      await generateImages();

    }catch(_){}

/* =====================================================
   SAHNELERİ EKRANA BAS
===================================================== */

function renderScenes(){

  scenes.innerHTML="";


  scenesData.forEach((scene,index)=>{

    const div =
    document.createElement("div");

    div.className="scene";

    div.innerHTML=

      "<b>🎬 Sahne "+
      (index+1)+
      "</b>"+

      "<p>"+
      escapeHtml(scene.text)+
      "</p>"+

      "<div class='small'>"+
      escapeHtml(scene.visual)+
      "</div>"+

      "<div id='img-"+index+
      "'></div>";


    scenes.appendChild(div);

  });

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================================
   AI GÖRSELLER
===================================================== */

async function generateImages(){

  for(
    let i=0;
    i<scenesData.length;
    i++
  ){

    sceneStatus.textContent =
    "🖼️ Görsel "+
    (i+1)+
    "/"+
    scenesData.length+
    " hazırlanıyor...";


    try{

      const prompt =
      scenesData[i].visual+
      ", cinematic, realistic, high quality, 16:9";


      const url =
      API_URL+
      "/image/"+
      encodeURIComponent(prompt)+
      "?model="+
      encodeURIComponent(IMAGE_MODEL)+
      "&width=1280"+
      "&height=720";


      const response =
      await fetch(url);


      if(!response.ok)
        throw new Error(
          "Görsel alınamadı."
        );


      const blob =
      await response.blob();


      scenesData[i].image =
      await blobToDataURL(blob);


      const holder =
      document.getElementById(
        "img-"+i
      );


      if(holder){

        const img =
        document.createElement("img");

        img.src=
        scenesData[i].image;

        holder.appendChild(img);

      }

    }catch(e){

      console.warn(
        "Görsel hatası",
        e
      );

    }

  }


  sceneStatus.textContent =
  "✅ Sahneler hazır.";

  updateVideoButton();

}


/* =====================================================
   BLOB -> DATA URL
===================================================== */

function blobToDataURL(blob){

  return new Promise(
    (resolve,reject)=>{

      const reader =
      new FileReader();

      reader.onload=
      ()=>resolve(reader.result);

      reader.onerror=
      reject;

      reader.readAsDataURL(blob);

    }
  );

}


/* =====================================================
   SES DOSYASI
===================================================== */

audioFile.onchange = ()=>{

  const file =
  audioFile.files[0];

  if(!file)return;


  selectedAudioBlob=file;

  audioPreview.src =
  URL.createObjectURL(file);

  audioPreview.style.display="block";

  audioStatus.textContent =
  "🔊 Ses dosyası hazır: "+
  file.name;

  updateVideoButton();

};


/* =====================================================
   MİKROFON
===================================================== */

recordBtn.onclick =
async()=>{

  try{

    const stream =
    await navigator.mediaDevices
    .getUserMedia({
      audio:true
    });


    recordedChunks=[];


    recorder =
    new MediaRecorder(stream);


    recorder.ondataavailable =
    e=>{

      if(e.data.size>0)
        recordedChunks.push(e.data);

    };


    recorder.onstop = ()=>{

      selectedAudioBlob =
      new Blob(
        recordedChunks,
        {
          type:
          recorder.mimeType ||
          "audio/webm"
        }
      );


      audioPreview.src =
      URL.createObjectURL(
        selectedAudioBlob
      );

      audioPreview.style.display=
      "block";


      audioStatus.textContent =
      "🎙️ Mikrofon kaydı hazır.";

      updateVideoButton();


      stream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    };


    recorder.start();


    recordBtn.style.display="none";

    stopRecordBtn.style.display=
    "block";

    audioStatus.textContent =
    "🔴 Kayıt devam ediyor...";

  }catch(e){

    audioStatus.textContent =
    "❌ Mikrofon kullanılamadı: "+
    e.message;

  }

};


stopRecordBtn.onclick=()=>{

  if(recorder &&
     recorder.state!=="inactive"){

    recorder.stop();

  }

  recordBtn.style.display="block";

  stopRecordBtn.style.display=
  "none";

};


/* =====================================================
   VIDEO BUTONU
===================================================== */

function updateVideoButton(){

  videoBtn.disabled =
  !selectedAudioBlob ||
  scenesData.length===0;

}


/* =====================================================
   SESİ VİDEO STREAMİNE BAĞLA
===================================================== */

async function createAudioStream(blob){

  const audio =
  new Audio();

  audio.src =
  URL.createObjectURL(blob);

  audio.preload="auto";

  audio.crossOrigin="anonymous";


  await new Promise(
    (resolve,reject)=>{

      audio.onloadedmetadata=
      resolve;

      audio.onerror=
      ()=>reject(
        new Error(
          "Ses dosyası okunamadı."
        )
      );

    }
  );


  const AudioContextClass =
  window.AudioContext ||
  window.webkitAudioContext;


  if(!AudioContextClass){

    throw new Error(
      "Tarayıcı Web Audio desteklemiyor."
    );

  }


  const ctx =
  new AudioContextClass();


  const source =
  ctx.createMediaElementSource(
    audio
  );


  const destination =
  ctx.createMediaStreamDestination();


  source.connect(destination);

  source.connect(ctx.destination);


  return {

    audio,

    ctx,

    stream:
    destination.stream,

    duration:
    audio.duration

  };

}


/* =====================================================
   GÖRSEL YÜKLEME
===================================================== */

function loadImage(src){

  return new Promise(
    (resolve,reject)=>{

      const img =
      new Image();

      img.onload=
      ()=>resolve(img);

      img.onerror=
      ()=>reject(
        new Error(
          "Görsel yüklenemedi."
        )
      );

      img.src=src;

    }
  );

}


/* =====================================================
   VİDEO
===================================================== */

videoBtn.onclick =
async()=>{

  if(!selectedAudioBlob){

    alert(
      "Önce bir ses dosyası yükle veya mikrofon kaydı yap."
    );

    return;

  }


  if(!scenesData.length){

    alert(
      "Önce sahneleri oluştur."
    );

    return;

  }


  videoBtn.disabled=true;

  downloadBtn.style.display="none";

  preview.style.display="none";

  videoStatus.textContent =
  "⏳ Video hazırlanıyor...";


  try{

    const audioInfo =
    await createAudioStream(
      selectedAudioBlob
    );


    const canvas =
    document.createElement("canvas");

    canvas.width=1280;

    canvas.height=720;


    const ctx =
    canvas.getContext("2d");


    const videoStream =
    canvas.captureStream(30);


    const finalStream =
    new MediaStream();


    videoStream
    .getVideoTracks()
    .forEach(
      track=>
      finalStream.addTrack(track)
    );


    audioInfo.stream
    .getAudioTracks()
    .forEach(
      track=>
      finalStream.addTrack(track)
    );


    let mime =
    "video/webm;codecs=vp9,opus";


    if(!MediaRecorder
      .isTypeSupported(mime)){

      mime =
      "video/webm;codecs=vp8,opus";

    }


    if(!MediaRecorder
      .isTypeSupported(mime)){

      mime="video/webm";

    }


    const recorder =
    new MediaRecorder(
      finalStream,
      {mimeType:mime}
    );


    const chunks=[];


    recorder.ondataavailable=
    e=>{

      if(e.data.size>0)
        chunks.push(e.data);

    };


    const stopped =
    new Promise(
      resolve=>{

        recorder.onstop=
        resolve;

      }
    );


    recorder.start(250);


    audioInfo.audio.currentTime=0;

    await audioInfo.ctx.resume();

    audioInfo.audio.play();


    const duration =
    Math.max(
      audioInfo.duration || 30,
      10
    );


    const sceneDuration =
    duration /
    scenesData.length;


    const images=[];


    for(
      let i=0;
      i<scenesData.length;
      i++
    ){

      if(scenesData[i].image){

        try{

          images[i]=
          await loadImage(
            scenesData[i].image
          );

        }catch(_){}

      }

    }


    const start =
    performance.now();


    function draw(){

      const elapsed =
      (performance.now()-start)/1000;


      if(elapsed>=duration){

        recorder.stop();

        return;

      }


      const index =
      Math.min(
        scenesData.length-1,
        Math.floor(
          elapsed/sceneDuration
        )
      );


      const local =
      elapsed -
      index*sceneDuration;


      const img =
      images[index];


      ctx.fillStyle="#000";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      if(img){

        const scale =
        1+
        Math.min(
          .08,
          local/
          sceneDuration*.08
        );


        const iw=img.width;

        const ih=img.height;

        const ratio=
        Math.max(
          canvas.width/iw,
          canvas.height/ih
        );


        const w=
        iw*ratio*scale;

        const h=
        ih*ratio*scale;


        const x=
        (canvas.width-w)/2;

        const y=
        (canvas.height-h)/2;


        ctx.drawImage(
          img,
          x,
          y,
          w,
          h
        );

      }


      /* Alt yazı */

      const text =
      scenesData[index].text || "";


      if(text){

        ctx.fillStyle=
        "rgba(0,0,0,.65)";

        ctx.fillRect(
          40,
          canvas.height-135,
          canvas.width-80,
          90
        );


        ctx.fillStyle="#fff";

        ctx.font=
        "bold 30px Arial";

        ctx.textAlign="center";


        drawWrappedText(
          ctx,
          text,
          canvas.width/2,
          canvas.height-95,
          canvas.width-130,
          36
        );

      }


      progressBar.style.width =
      Math.min(
        100,
        elapsed/duration*100
      )+"%";


      requestAnimationFrame(draw);

    }


    draw();


    await stopped;


    audioInfo.audio.pause();

    audioInfo.ctx.close();


    videoBlob =
    new Blob(
      chunks,
      {type:mime}
    );


    const url =
    URL.createObjectURL(
      videoBlob
    );


    preview.src=url;

    preview.style.display="block";

    preview.load();


    downloadBtn.style.display=
    "block";


    downloadBtn.onclick=()=>{

      const a =
      document.createElement("a");

      a.href=url;

      a.download=
      "mina-video-"+
      Date.now()+
      ".webm";

      document.body.appendChild(a);

      a.click();

      a.remove();

    };


    videoStatus.textContent =
    "✅ Video hazır! Ses videonun içine eklendi.";


    progressBar.style.width="100%";


  }catch(e){

    console.error(e);

    videoStatus.textContent =
    "❌ Video hatası: "+
    e.message;

  }


  videoBtn.disabled=false;

};


/* =====================================================
   WRAPPED TEXT
===================================================== */

function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight
){

  const words =
  text.split(" ");

  let line="";

  const lines=[];


  for(
    let n=0;
    n<words.length;
    n++
  ){

    const test =
    line+
    words[n]+
    " ";

    const width =
    ctx.measureText(test).width;


    if(
      width>maxWidth &&
      n>0
    ){

      lines.push(line);

      line=
      words[n]+" ";

    }else{

      line=test;

    }

  }


  lines.push(line);


  const startY =
  y-
  (lines.length-1)*
  lineHeight/2;


  lines.forEach(
    (l,i)=>{

      ctx.fillText(
        l.trim(),
        x,
        startY+
        i*lineHeight
      );

    }
  );

}


/* =====================================================
   TOPIC DEĞİŞİRSE
===================================================== */

topic.addEventListener(
  "input",
  ()=>{

    sceneBtn.disabled=true;

    videoBtn.disabled=true;

  }
);

</script>
