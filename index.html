<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mina Görsel Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#080d18;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(720px,94%);
    margin:30px auto;
}

h1{
    text-align:center;
    margin:0 0 8px;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:#9da8bb;
    margin-bottom:25px;
}

.card{
    background:#121a2b;
    border:1px solid #293650;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:15px;
    border-radius:11px;
    border:1px solid #3a4968;
    background:#080e1d;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#687cff;
}

button{
    width:100%;
    margin-top:15px;
    padding:16px;
    border:0;
    border-radius:11px;
    background:#5865f2;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.status{
    margin-top:15px;
    padding:14px;
    border-radius:11px;
    background:#080e1d;
    color:#cbd5e1;
    white-space:pre-wrap;
    line-height:1.5;
}

#resultCard{
    display:none;
}

#result{
    display:block;
    width:100%;
    max-height:650px;
    object-fit:contain;
    border-radius:14px;
    background:#050810;
}

.caption{
    margin-top:12px;
    color:#aeb8ca;
    font-size:14px;
    line-height:1.5;
}

.download{
    display:block;
    width:100%;
    margin-top:15px;
    padding:14px;
    border-radius:10px;
    background:#159447;
    color:white;
    text-align:center;
    text-decoration:none;
    font-weight:bold;
}

.info{
    color:#8e9ab0;
    font-size:13px;
    line-height:1.5;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎬 Mina Görsel Test</h1>

    <div class="subtitle">
        KONU → ÜCRETSİZ GÖRSEL → EKRANDA
    </div>


    <div class="card">

        <label for="topic">
            Konu
        </label>

        <input
            id="topic"
            type="text"
            value="mysterious old house"
            placeholder="Örneğin: abandoned castle"
        >

        <button id="searchBtn">
            🔎 GÖRSEL BUL
        </button>

        <div id="status" class="status">
            Hazır. Bir konu yaz ve butona bas.
        </div>

        <div class="info">
            Görseller Wikimedia Commons üzerinden aranır.
            API anahtarı veya ödeme gerekmez.
        </div>

    </div>


    <div id="resultCard" class="card">

        <h2>🖼️ Bulunan Görsel</h2>

        <img
            id="result"
            alt="Bulunan görsel"
        >

        <div
            id="caption"
            class="caption">
        </div>

        <a
            id="download"
            class="download"
            target="_blank"
            rel="noopener">
            🔗 GÖRSELİ AÇ
        </a>

    </div>

</div>


<script>

const topicInput =
    document.getElementById("topic");

const searchBtn =
    document.getElementById("searchBtn");

const statusBox =
    document.getElementById("status");

const resultCard =
    document.getElementById("resultCard");

const resultImage =
    document.getElementById("result");

const caption =
    document.getElementById("caption");

const download =
    document.getElementById("download");


function status(text){
    statusBox.textContent = text;
}


/*
====================================================
 WIKIMEDIA COMMONS GÖRSEL ARAMA
====================================================
*/

async function findImage(query){

    const api =
        "https://commons.wikimedia.org/w/api.php";

    const params = new URLSearchParams({

        action:"query",

        generator:"search",

        gsrsearch:query,

        gsrnamespace:"6",

        gsrlimit:"10",

        prop:"imageinfo",

        iiprop:"url|mime|extmetadata",

        iiurlwidth:"1200",

        format:"json",

        origin:"*"

    });


    const response =
        await fetch(api + "?" + params.toString());


    if(!response.ok){

        throw new Error(
            "Görsel servisine bağlanılamadı. HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(
        !data.query ||
        !data.query.pages
    ){

        return null;

    }


    const pages =
        Object.values(data.query.pages);


    /*
      SVG, PDF ve ses dosyalarını geç.
    */

    for(const page of pages){

        if(!page.imageinfo ||
           !page.imageinfo[0]){

            continue;

        }


        const info =
            page.imageinfo[0];


        const mime =
            info.mime || "";


        if(!mime.startsWith("image/")){

            continue;

        }


        const url =
            info.thumburl ||
            info.url;


        if(!url){

            continue;

        }


        return {

            title:
                page.title
                .replace(/^File:/,""),

            url:url,

            original:
                info.url || url,

            description:
                info.extmetadata &&
                info.extmetadata.ImageDescription
                ? info.extmetadata.ImageDescription.value
                : ""

        };

    }


    return null;

}


/*
====================================================
 BUTON
====================================================
*/

searchBtn.addEventListener(
    "click",
    async function(){

        const query =
            topicInput.value.trim();


        if(!query){

            status(
                "❌ Önce bir konu yaz."
            );

            topicInput.focus();

            return;

        }


        searchBtn.disabled = true;

        resultCard.style.display = "none";


        status(
            "⏳ Görsel aranıyor...\n\n" +
            "Konu: " + query
        );


        try{

            const image =
                await findImage(query);


            if(!image){

                /*
                  İngilizce arama da dene.
                */

                status(
                    "🔎 İlk aramada sonuç bulunamadı.\n" +
                    "İkinci arama yapılıyor..."
                );


                const englishQuery =
                    query
                    .replace(
                        /gizemli/gi,
                        "mysterious"
                    )
                    .replace(
                        /eski/gi,
                        "old"
                    )
                    .replace(
                        /ev/gi,
                        "house"
                    )
                    .replace(
                        /orman/gi,
                        "forest"
                    )
                    .replace(
                        /kale/gi,
                        "castle"
                    );


                const second =
                    await findImage(
                        englishQuery
                    );


                if(!second){

                    throw new Error(
                        "Bu konu için görsel bulunamadı.\n\n" +
                        "Daha genel bir konu dene.\n\n" +
                        "Örnek:\n" +
                        "old castle\n" +
                        "dark forest\n" +
                        "Berlin\n" +
                        "abandoned house"
                    );

                }


                showImage(second,query);

            }else{

                showImage(image,query);

            }


        }catch(error){

            console.error(error);


            status(
                "❌ HATA\n\n" +
                error.message
            );

        }finally{

            searchBtn.disabled = false;

        }

    }
);


/*
====================================================
 GÖRSELİ EKRANA KOY
====================================================
*/

function showImage(image,query){

    resultImage.onload =
        function(){

            resultCard.style.display =
                "block";

            status(
                "✅ BAŞARILI!\n\n" +
                "Konu: " + query +
                "\n\n" +
                "Görsel ekranda gösterildi."
            );

        };


    resultImage.onerror =
        function(){

            status(
                "❌ Görsel yüklenemedi.\n\n" +
                "Başka bir sonuç aranabilir."
            );

        };


    resultImage.src =
        image.url;


    caption.innerHTML =
        "<b>Dosya:</b> " +
        escapeHtml(image.title);


    download.href =
        image.original;

}


/*
====================================================
 GÜVENLİ METİN
====================================================
*/

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
