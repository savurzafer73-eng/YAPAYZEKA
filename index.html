<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mina Video AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080d18;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(850px,94%);
    margin:25px auto 50px;
}

h1{
    text-align:center;
    font-size:32px;
    margin:0 0 7px;
}

.subtitle{
    text-align:center;
    color:#9ba8bd;
    margin-bottom:25px;
}

.card{
    background:#121a2b;
    border:1px solid #293752;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #394867;
    background:#080e1c;
    color:#fff;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    padding:15px;
    margin-top:14px;
    border:0;
    border-radius:10px;
    background:#5865f2;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.12);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.secondary{
    background:#293650;
}

.green{
    background:#168b4b;
}

.red{
    background:#9b3030;
}

.status{
    margin-top:15px;
    padding:14px;
    background:#080e1c;
    border-radius:10px;
    color:#cbd5e1;
    white-space:pre-wrap;
    line-height:1.5;
}

.progress{
    width:100%;
    height:10px;
    background:#080e1c;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.progressBar{
    height:100%;
    width:0%;
    background:#5865f2;
    transition:.3s;
}

.scene{
    background:#080e1c;
    border:1px solid #293752;
    border-radius:14px;
    padding:12px;
    margin-top:14px;
}

.scene img{
    width:100%;
    display:block;
    border-radius:10px;
    max-height:400px;
    object-fit:cover;
}

.sceneTitle{
    font-weight:bold;
    margin:10px 0 6px;
}

.sceneText{
    color:#adb8ca;
    font-size:14px;
    line-height:1.5;
}

video{
    width:100%;
    display:block;
    border-radius:14px;
    background:#000;
}

.download{
    display:block;
    width:100%;
    text-align:center;
    padding:15px;
    margin-top:14px;
    border-radius:10px;
    background:#168b4b;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

.small{
    color:#8995aa;
    font-size:13px;
    line-height:1.5;
    margin-top:8px;
}

.hidden{
    display:none;
}

@media(max-width:600px){

    .row{
        grid-template-columns:1fr;
    }

    h1{
        font-size:27px;
    }

}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Mina Video AI</h1>

<div class="subtitle">
KONU → SAHNELER → GÖRSELLER → ALTYAZI → VİDEO
</div>


<!-- =========================
     AYARLAR
========================= -->

<div class="card">

<label>Konu</label>

<input
    id="topic"
    value="Gece yarısı terk edilmiş bir ormanda bulunan gizemli eski ev"
    placeholder="Örneğin: Berlin'de gizemli şekilde kaybolan eski bir bina"
>


<div class="row" style="margin-top:15px">

<div>

<label>Sahne sayısı</label>

<select id="sceneCount">

<option value="1">1 Sahne</option>
<option value="4" selected>4 Sahne</option>
<option value="5">5 Sahne</option>
<option value="6">6 Sahne</option>

</select>

</div>


<div>

<label>Sahne süresi</label>

<select id="duration">

<option value="4">4 saniye</option>
<option value="5" selected>5 saniye</option>
<option value="6">6 saniye</option>
<option value="8">8 saniye</option>

</select>

</div>

</div>


<label style="margin-top:15px">
Dil
</label>

<select id="language">

<option value="tr">Türkçe</option>
<option value="de" selected>Almanca</option>
<option value="en">İngilizce</option>

</select>


<label style="margin-top:15px">
Görsel arama dili
</label>

<select id="imageLanguage">

<option value="en" selected>English</option>
<option value="de">Deutsch</option>
<option value="tr">Türkçe</option>

</select>


<button id="createBtn">
🎬 VİDEO OLUŞTUR
</button>

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<div id="status" class="status">
Hazır.
</div>

</div>


<!-- =========================
     SENARYO
========================= -->

<div id="scriptCard" class="card hidden">

<h2>📝 Senaryo</h2>

<textarea id="scriptText"></textarea>

<button id="speakBtn" class="secondary">
🔊 SENARYOYU SESLENDİR
</button>

<button id="stopSpeakBtn" class="red">
⏹️ SESİ DURDUR
</button>

</div>


<!-- =========================
     SAHNELER
========================= -->

<div id="scenesCard" class="card hidden">

<h2>🖼️ Sahneler</h2>

<div id="scenes"></div>

</div>


<!-- =========================
     VIDEO
========================= -->

<div id="videoCard" class="card hidden">

<h2>🎥 Video Önizleme</h2>

<video
    id="video"
    controls
    playsinline>
</video>

    id="download"
    class="download"
    download="mina-video.webm">
⬇️ VİDEOYU İNDİR
</a>

Video tarayıcı içinde oluşturuldu. Dosya WebM formatındadır.
</div>

</div>

<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const topicInput =
    document.getElementById("topic");

const sceneCountInput =
    document.getElementById("sceneCount");

const durationInput =
    document.getElementById("duration");

const languageInput =
    document.getElementById("language");

const imageLanguageInput =
    document.getElementById("imageLanguage");

const createBtn =
    document.getElementById("createBtn");

const statusBox =
    document.getElementById("status");

const progressBar =
    document.getElementById("progressBar");

const scriptCard =
    document.getElementById("scriptCard");

const scriptText =
    document.getElementById("scriptText");

const scenesCard =
    document.getElementById("scenesCard");

const scenesBox =
    document.getElementById("scenes");

const videoCard =
    document.getElementById("videoCard");

const video =
    document.getElementById("video");

const download =
    document.getElementById("download");

const speakBtn =
    document.getElementById("speakBtn");

const stopSpeakBtn =
    document.getElementById("stopSpeakBtn");


let generatedScenes = [];
let currentVideoURL = null;


/* =====================================================
   DURUM
===================================================== */

function setStatus(text){

    statusBox.textContent = text;

}


function progress(value){

    progressBar.style.width =
        Math.max(0,Math.min(100,value)) + "%";

}


/* =====================================================
   DİL
===================================================== */

function getLanguage(){

    return languageInput.value;

}


/* =====================================================
   SAHNE SENARYOLARI
===================================================== */

function createScenes(topic,count,lang){

    const sets = {

        tr:[
            `Bu hikâye ${topic} ile başlıyor. Her şey ilk bakışta normal görünüyordu.`,
            `Fakat gece ilerledikçe ${topic} hakkında kimsenin açıklayamadığı ayrıntılar ortaya çıktı.`,
            `Araştırma derinleştikçe olayın arkasında çok daha eski ve gizemli bir geçmiş olduğu anlaşıldı.`,
            `Ve sonunda geriye tek bir soru kaldı: Gerçekte o gece ne olmuştu?`,
            `Tanıkların anlattıkları olayın hâlâ tam olarak çözülemediğini gösteriyordu.`,
            `Bugün bile bu gizem hakkında kesin bir cevap bulunmuş değil.`
        ],

        de:[
            `Diese Geschichte beginnt mit ${topic}. Zunächst schien alles völlig normal zu sein.`,
            `Doch im Laufe der Nacht tauchten immer mehr unerklärliche Hinweise auf.`,
            `Je weiter die Ermittlungen gingen, desto geheimnisvoller wurde die Geschichte.`,
            `Am Ende blieb nur eine Frage: Was geschah in dieser Nacht wirklich?`,
            `Die Aussagen der Zeugen machten den Fall noch rätselhafter.`,
            `Bis heute gibt es keine eindeutige Erklärung für dieses Geheimnis.`
        ],

        en:[
            `This story begins with ${topic}. At first, everything seemed completely normal.`,
            `But as the night continued, strange and unexplained details began to appear.`,
            `The deeper the investigation went, the more mysterious the story became.`,
            `In the end, only one question remained: What really happened that night?`,
            `Witness statements made the mystery even harder to explain.`,
            `Even today, there is no definitive answer to this mystery.`
        ]

    };


    return sets[lang].slice(0,count);

}


/* =====================================================
   GÖRSEL ARAMA SORGULARI
===================================================== */

function imageQueries(topic,index,lang){

    const generic = {

        tr:[
            topic + " mysterious",
            topic + " dark",
            topic + " night",
            topic + " investigation",
            topic + " old",
            topic + " historical"
        ],

        de:[
            topic + " mysteriös",
            topic + " dunkel",
            topic + " Nacht",
            topic + " Untersuchung",
            topic + " alt",
            topic + " historisch"
        ],

        en:[
            topic + " mysterious",
            topic + " dark",
            topic + " night",
            topic + " investigation",
            topic + " old",
            topic + " historical"
        ]

    };

    return generic[lang][index] ||
           generic[lang][0];

}


/* =====================================================
   WIKIMEDIA COMMONS
===================================================== */

async function searchWikimedia(query){

    const api =
        "https://commons.wikimedia.org/w/api.php";


    const params =
        new URLSearchParams({

            action:"query",

            generator:"search",

            gsrsearch:query,

            gsrnamespace:"6",

            gsrlimit:"12",

            prop:"imageinfo",

            iiprop:"url|mime",

            iiurlwidth:"1280",

            format:"json",

            origin:"*"

        });


    const response =
        await fetch(
            api + "?" + params.toString()
        );


    if(!response.ok){

        throw new Error(
            "Wikimedia HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(
        !data.query ||
        !data.query.pages
    ){

        return null;

    }


    const pages =
        Object.values(data.query.pages);


    for(const page of pages){

        if(
            !page.imageinfo ||
            !page.imageinfo[0]
        ){

            continue;

        }


        const info =
            page.imageinfo[0];


        if(
            !info.mime ||
            !info.mime.startsWith("image/")
        ){

            continue;

        }


        if(!info.thumburl && !info.url){

            continue;

        }


        return {

            title:
                (page.title || "")
                .replace(/^File:/,""),

            url:
                info.thumburl ||
                info.url,

            original:
                info.url ||
                info.thumburl

        };

    }


    return null;

}


/* =====================================================
   GÖRSEL YÜKLEME
===================================================== */

function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.crossOrigin = "anonymous";

            img.onload =
                ()=>resolve(img);

            img.onerror =
                ()=>reject(
                    new Error(
                        "Görsel yüklenemedi."
                    )
                );

            img.src = url;

        }
    );

}


/* =====================================================
   SAHNELERİ OLUŞTUR
===================================================== */

async function buildScenes(){

    const topic =
        topicInput.value.trim();

    const count =
        Number(sceneCountInput.value);

    const lang =
        imageLanguageInput.value;

    generatedScenes = [];

    scenesBox.innerHTML = "";

    scenesCard.classList.remove("hidden");


    for(let i=0;i<count;i++){

        const query =
            imageQueries(
                topic,
                i,
                lang
            );


        setStatus(
            `🖼️ ${i+1}/${count} sahne aranıyor...\n\n` +
            `Arama: ${query}`
        );


        progress(
            15 +
            ((i / count) * 45)
        );


        let image = null;


        try{

            image =
                await searchWikimedia(query);

        }catch(error){

            console.warn(
                "Görsel arama hatası:",
                error
            );

        }


        /*
          Sonuç bulunmazsa daha basit arama
        */

        if(!image){

            try{

                image =
                    await searchWikimedia(topic);

            }catch(error){}

        }


        if(image){

            try{

                const loaded =
                    await loadImage(
                        image.url
                    );

                generatedScenes.push({

                    image:loaded,

                    url:image.url,

                    original:image.original,

                    title:image.title,

                    text:
                        createScenes(
                            topic,
                            count,
                            getLanguage()
                        )[i]

                });

            }catch(error){

                console.warn(
                    "Görsel yüklenemedi:",
                    error
                );

            }

        }


        await wait(700);

    }


    renderScenes();


    if(generatedScenes.length === 0){

        throw new Error(
            "Hiç görsel yüklenemedi. Daha genel bir konu dene."
        );

    }

}


/* =====================================================
   SAHNELERİ EKRANA BAS
===================================================== */

function renderScenes(){

    scenesBox.innerHTML = "";


    generatedScenes.forEach(
        (scene,index)=>{

            const div =
                document.createElement("div");

            div.className = "scene";


            div.innerHTML = `

                <div class="sceneTitle">
                    SAHNE ${index+1}
                </div>

                <img
                    src="${scene.url}"
                    alt=""
                >

                <div class="sceneText">
                    ${escapeHtml(scene.text)}
                </div>

                <div class="small">
                    Görsel: ${escapeHtml(scene.title)}
                </div>

            `;


            scenesBox.appendChild(div);

        }
    );

}


/* =====================================================
   CANVAS
===================================================== */

function fitImage(
    ctx,
   img,
   canvasW,
   canvasH
){

    const imageRatio =
        img.width / img.height;

    const canvasRatio =
        canvasW / canvasH;


    let width;
    let height;
    let x;
    let y;


    if(imageRatio > canvasRatio){

        height =
            canvasH;

        width =
            height * imageRatio;

        x =
            (canvasW-width)/2;

        y=0;

    }else{

        width =
            canvasW;

        height =
            width/imageRatio;

        x=0;

        y =
            (canvasH-height)/2;

    }


    ctx.drawImage(
        img,
        x,
        y,
        width,
        height
    );

}


/* =====================================================
   ALTYAZI
===================================================== */

function drawSubtitle(
    ctx,
    text,
    canvasW,
    canvasH
){

    if(!text) return;


    const maxWidth =
        canvasW - 100;

    let words =
        text.split(" ");

    let lines = [];

    let line = "";


    ctx.font =
        "bold 32px Arial";


    for(const word of words){

        const test =
            line
            ? line + " " + word
            : word;


        if(
            ctx.measureText(test).width >
            maxWidth
        ){

            lines.push(line);

            line = word;

        }else{

            line = test;

        }

    }


    if(line){

        lines.push(line);

    }


    const lineHeight =
        42;

    const totalHeight =
        lines.length *
        lineHeight;


    const startY =
        canvasH -
        totalHeight -
        65;


    /*
      Arka plan
    */

    const padding =
        18;

    const boxHeight =
        totalHeight +
        padding*2;


    ctx.fillStyle =
        "rgba(0,0,0,.68)";


    ctx.beginPath();

    ctx.roundRect(
        30,
        startY-padding,
        canvasW-60,
        boxHeight,
        15
    );

    ctx.fill();


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "top";

    ctx.font =
        "bold 32px Arial";


    ctx.fillStyle =
        "#ffffff";


    lines.forEach(
        (line,index)=>{

            ctx.fillText(
                line,
                canvasW/2,
                startY +
                index*lineHeight
            );

        }
    );

}


/* =====================================================
   VİDEO OLUŞTUR
===================================================== */

async function createVideo(){

    const canvas =
        document.createElement("canvas");


    canvas.width =
        1280;

    canvas.height =
        720;


    const ctx =
        canvas.getContext("2d");


    const fps =
        30;


    const stream =
        canvas.captureStream(fps);


    let mime =
        "";


    const formats = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for(const format of formats){

        if(
            MediaRecorder.isTypeSupported(
                format
            )
        ){

            mime =
                format;

            break;

        }

    }


    if(!mime){

        throw new Error(
            "Bu tarayıcı WebM video kaydını desteklemiyor."
        );

    }


    const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:mime,
                videoBitsPerSecond:5000000
            }
        );


    const chunks = [];


    recorder.ondataavailable =
        e=>{

            if(e.data.size > 0){

                chunks.push(e.data);

            }

        };


    const stopped =
        new Promise(
            resolve=>{

                recorder.onstop =
                    resolve;

            }
        );


    recorder.start(
        200
    );


    const seconds =
        Number(durationInput.value);


    for(
        let i=0;
        i<generatedScenes.length;
        i++
    ){

        const scene =
            generatedScenes[i];


        setStatus(
            `🎥 Video oluşturuluyor...\n\n` +
            `Sahne ${i+1}/${generatedScenes.length}`
        );


        const totalFrames =
            seconds * fps;


        for(
            let frame=0;
            frame<totalFrames;
            frame++
        ){

            /*
              Görsel
            */

            ctx.fillStyle =
                "#000";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
              Hafif zoom efekti
            */

            const scale =
                1 +
                (frame/totalFrames)*0.045;


            ctx.save();


            ctx.translate(
                canvas.width/2,
                canvas.height/2
            );


            ctx.scale(
                scale,
                scale
            );


            fitImage(
                ctx,
                scene.image,
                canvas.width,
                canvas.height
            );


            ctx.restore();


            /*
              Üst başlık
            */

            ctx.fillStyle =
                "rgba(0,0,0,.45)";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                75
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.font =
                "bold 28px Arial";


            ctx.textAlign =
                "left";


            ctx.textBaseline =
                "middle";


            ctx.fillText(
                "MYSTERY NACHT",
                35,
                38
            );


            /*
              Sahne numarası
            */

            ctx.textAlign =
                "right";


            ctx.font =
                "bold 24px Arial";


            ctx.fillText(
                `${i+1}/${generatedScenes.length}`,
                canvas.width-35,
                38
            );


            /*
              Altyazı
            */

            drawSubtitle(
                ctx,
                scene.text,
                canvas.width,
                canvas.height
            );


            /*
              Progress
            */

            const overall =
                60 +
                (
                    (
                        i +
                        frame/totalFrames
                    )
                    /
                    generatedScenes.length
                ) * 35;


            progress(overall);


            await wait(
                1000/fps
            );

        }

    }


    recorder.stop();

    await stopped;


    const blob =
        new Blob(
            chunks,
            {
                type:mime
            }
        );


    if(currentVideoURL){

        URL.revokeObjectURL(
            currentVideoURL
        );

    }


    currentVideoURL =
        URL.createObjectURL(blob);


    video.src =
        currentVideoURL;


    download.href =
        currentVideoURL;


    videoCard.classList.remove(
        "hidden"
    );


    progress(100);


    setStatus(
        "✅ VİDEO HAZIR!\n\n" +
        "Önizlemeden videoyu izle.\n" +
        "İstersen aşağıdaki düğmeyle WebM olarak kaydet."
    );

}


/* =====================================================
   ANA BUTON
===================================================== */

createBtn.addEventListener(
    "click",
    async function(){

        const topic =
            topicInput.value.trim();


        if(!topic){

            setStatus(
                "❌ Önce bir konu yaz."
            );

            topicInput.focus();

            return;

        }


        createBtn.disabled =
            true;


        scriptCard.classList.remove(
            "hidden"
        );


        videoCard.classList.add(
            "hidden"
        );


        progress(0);


        try{

            /*
              1 — SENARYO
            */

            const count =
                Number(
                    sceneCountInput.value
                );


            const lang =
                getLanguage();


            const texts =
                createScenes(
                    topic,
                    count,
                    lang
                );


            scriptText.value =
                texts.join(
                    "\n\n"
                );


            progress(8);


            /*
              2 — GÖRSELLER
            */

            await buildScenes();


            progress(60);


            /*
              3 — VİDEO
            */

            await createVideo();


        }catch(error){

            console.error(error);


            setStatus(
                "❌ HATA\n\n" +
                error.message
            );

        }finally{

            createBtn.disabled =
                false;

        }

    }
);


/* =====================================================
   TARAYICI SESİ
===================================================== */

speakBtn.addEventListener(
    "click",
    function(){

        if(!("speechSynthesis" in window)){

            setStatus(
                "❌ Bu tarayıcı seslendirmeyi desteklemiyor."
            );

            return;

        }


        speechSynthesis.cancel();


        const text =
            scriptText.value.trim();


        if(!text){

            return;

        }


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        const lang =
            getLanguage();


        if(lang === "de"){

            utterance.lang =
                "de-DE";

        }

        else if(lang === "en"){

            utterance.lang =
                "en-US";

        }

        else{

            utterance.lang =
                "tr-TR";

        }


        utterance.rate =
            0.92;


        utterance.pitch =
            1;


        utterance.volume =
            1;


        speechSynthesis.speak(
            utterance
        );


        setStatus(
            "🔊 Senaryo tarayıcının sesiyle okunuyor..."
        );

    }
);


/* =====================================================

===================================================== */

function wait(ms){

    return new Promise(
        resolve=>
            setTimeout(
                resolve,
                ms
            )
    );

}


function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
