<script>

/* =====================================================
GLOBAL
===================================================== */

var scenes=[];
var sceneCounter=1;

var character={
gender:"auto",
age:"auto",
hair:"auto",
hairLength:"auto",
eyes:"auto",
build:"auto",
clothing:""
};

var characterLocked=false;

var logoURL=null;
var logoImage=null;

var ttsModule=null;
var ttsSession=null;


/* =====================================================
HELPERS
===================================================== */

function $(id){
return document.getElementById(id);
}

function normalize(text){

return String(text||"")
.replace(/\r/g," ")
.replace(/\n+/g," ")
.replace(/\s+/g," ")
.trim();

}

function setStatus(text){
$("status").textContent=text;
}

function escapeHTML(text){

return String(text||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
SENTENCE SPLIT
===================================================== */

function splitSentences(text){

text=normalize(text);

if(!text){
return [];
}

var matches=text.match(
/[^.!?…]+(?:[.!?…]+|$)/g
);

if(!matches){
return [text];
}

var result=[];

for(var i=0;i<matches.length;i++){

var s=matches[i].trim();

if(s){
result.push(s);
}

}

return result;

}


/* =====================================================
WORD COUNT
===================================================== */

function wordCount(text){

var t=normalize(text);

if(!t){
return 0;
}

return t.split(/\s+/).length;

}


/* =====================================================
SMART SCENE GROUPING
===================================================== */

function sentenceType(text){

var n=wordCount(text);

if(n<=8){
return "short";
}

if(n<=18){
return "medium";
}

return "long";

}


function smartGrouping(sentences){

var groups=[];
var i=0;

while(i<sentences.length){

var current=sentences[i];
var type=sentenceType(current);

var count=2;

/*
SHORT:
3 kısa cümle = 1 sahne
*/

if(type==="short"){

if(
i+2<sentences.length &&
sentenceType(sentences[i+1])==="short" &&
sentenceType(sentences[i+2])==="short"
){

count=3;

}
else if(
i+1<sentences.length &&
sentenceType(sentences[i+1])==="short"
){

count=2;

}
else{

count=1;

}

}

/*
LONG:
1 cümle
*/

else if(type==="long"){

count=1;

}

/*
MEDIUM:
2 cümle
*/

else{

count=2;

}

var group=[];

for(
var j=0;
j<count &&
i+j<sentences.length;
j++
){

group.push(
sentences[i+j]
);

}

if(group.length){

groups.push(group);
i+=group.length;

}
else{

i++;

}

}

/*
Son tek kısa cümleyi
önceki sahneye bağla.
*/

if(groups.length>=2){

var last=
groups[groups.length-1];

if(
last.length===1 &&
sentenceType(last[0])==="short"
){

groups[groups.length-2]=
groups[groups.length-2].concat(last);

groups.pop();

}

}

return groups;

}


/* =====================================================
CHARACTER DETECTION
===================================================== */

function detectGender(text){

var t=normalize(text).toLowerCase();

var female=0;
var male=0;

/*
Güçlü kadın kelimeleri
*/

if(
/mutter|frau|tochter|schwester|schriftstellerin|unternehmerin|gründerin|gruenderin|schauspielerin|köchin|koechin|studentin|ärztin|aerztin|sportlerin|erfinderin|ehefrau|freundin/.test(t)
){

female+=20;

}

/*
Güçlü erkek kelimeleri
*/

if(
/vater|mann|sohn|bruder|schriftsteller|unternehmer|gründer|gruender|schauspieler|koch|student|arzt|sportler|erfinder|ehemann|freund/.test(t)
){

male+=20;

}

/*
İlk cümlede Sie / Er
*/

var sentences=splitSentences(t);

if(sentences.length){

var first=sentences[0];

if(/^\s*sie\b/.test(first)){
female+=12;
}

if(/^\s*er\b/.test(first)){
male+=12;
}

}

/*
Kız / erkek çocuk
*/

if(/mädchen|maedchen/.test(t)){
return "childFemale";
}

if(/\bjunge\b/.test(t)){
return "childMale";
}

if(female>male && female>=8){
return "female";
}

if(male>female && male>=8){
return "male";
}

return "auto";

}


function detectCharacter(){

if(characterLocked){
return;
}

var story=$("story").value;

character.gender=
$("gender").value==="auto"
?detectGender(story)
:$("gender").value;

if(
$("age").value==="auto"
){

var t=normalize(story).toLowerCase();

if(/kind|junge|mädchen|teenager/.test(t)){
character.age="young";
}
else if(/älter|senior|rentner/.test(t)){
character.age="elderly";
}
else{
character.age="adult";
}

}
else{

character.age=$("age").value;

}

character.hair=$("hair").value;
character.hairLength=$("hairLength").value;
character.eyes=$("eyes").value;
character.build=$("build").value;
character.clothing=$("clothing").value;

$("gender").value=character.gender;
$("age").value=character.age;

var g=
character.gender==="female"
?"👩 KADIN":
character.gender==="male"
?"👨 ERKEK":
character.gender==="childFemale"
?"👧 KIZ ÇOCUK":
character.gender==="childMale"
?"👦 ERKEK ÇOCUK":
"❔ BELİRSİZ";

$("characterStatus").textContent=
"🧠 Algılanan: "+g+
" • Yaş: "+character.age;

setStatus("🧠 Karakter: "+g);

}


function lockCharacter(){

character.gender=$("gender").value;
character.age=$("age").value;
character.hair=$("hair").value;
character.hairLength=$("hairLength").value;
character.eyes=$("eyes").value;
character.build=$("build").value;
character.clothing=$("clothing").value;

characterLocked=true;

$("characterStatus").textContent=
"🔒 Karakter kilitlendi.";

}


function resetCharacter(){

characterLocked=false;

character={
gender:"auto",
age:"auto",
hair:"auto",
hairLength:"auto",
eyes:"auto",
build:"auto",
clothing:""
};

$("gender").value="auto";
$("age").value="auto";
$("hair").value="auto";
$("hairLength").value="auto";
$("eyes").value="auto";
$("build").value="auto";
$("clothing").value="";

$("characterStatus").textContent=
"Karakter sıfırlandı.";

}


/* =====================================================
CHARACTER PROMPT
===================================================== */

function characterPrompt(){

var p="";

if(character.gender==="female"){

p=
"MAIN CHARACTER: ADULT WOMAN. FEMALE. WOMAN, NOT MAN. Clearly feminine facial features and natural feminine proportions.";

}
else if(character.gender==="male"){

p=
"MAIN CHARACTER: ADULT MAN. MALE. MAN, NOT WOMAN. Clearly masculine facial features and natural masculine proportions.";

}
else if(character.gender==="childFemale"){

p=
"MAIN CHARACTER: YOUNG GIRL. FEMALE CHILD. GIRL, NOT BOY.";

}
else if(character.gender==="childMale"){

p=
"MAIN CHARACTER: YOUNG BOY. MALE CHILD. BOY, NOT GIRL.";

}
else{

p=
"MAIN CHARACTER: HUMAN CHARACTER. Gender not explicitly specified.";

}

if(character.age!=="auto"){
p+=" Age appearance: "+character.age+".";
}

if(character.hair!=="auto"){
p+=" Hair color: "+character.hair+".";
}

if(character.hairLength!=="auto"){
p+=" Hair length: "+character.hairLength+".";
}

if(character.eyes!=="auto"){
p+=" Eyes: "+character.eyes+".";
}

if(character.build!=="auto"){
p+=" Body build: "+character.build+".";
}

if(character.clothing){
p+=" Clothing: "+character.clothing+".";
}

if(characterLocked){

p+=
" Keep the same character identity, facial appearance, hair, age appearance and body proportions across all scenes.";

}

return p;

}

SMART SCENE ANALYZER
===================================================== */

}


/* =====================================================
PROMPT
===================================================== */

function buildPrompt(text,index){

var a=analyzeScene(text);

var camera="cinematic medium-wide documentary shot";
var lens="35mm documentary lens";

if(
/gesicht|tränen|wein|emotional/.test(text.toLowerCase())
){

camera="cinematic emotional close-up";
lens="85mm portrait lens";

}
else if(
/café|cafe|restaurant|garage|familie|straße|stadt/.test(text.toLowerCase())
){

camera="cinematic wide environmental shot";
lens="28mm documentary lens";

}
else if(
/schreiben|arbeiten|büro|labor/.test(text.toLowerCase())
){

camera="cinematic medium environmental shot";
lens="50mm documentary lens";

}

var p=
characterPrompt()+" "+

"MAIN VISUAL EVENT: "+a.event+". "+

"LOCATION: "+a.location+". "+

(a.secondary
?"SECONDARY PERSON: "+a.secondary+". "
:"")+

(a.relationship
?"RELATIONSHIP: "+a.relationship+". "
:"")+

"ENVIRONMENT: "+a.environment+". "+

"PROPS: "+a.props+". "+

"BACKGROUND: "+a.background+". "+

"SPATIAL RELATIONSHIP: "+a.spatial+". "+

"EMOTION: "+a.emotion+". "+

"PERIOD: "+a.period+". "+

"LIGHTING: "+a.lighting+". "+

"CAMERA: "+camera+". "+

"LENS: "+lens+". "+

"Photorealistic cinematic documentary photography, realistic skin texture, believable anatomy, authentic clothing, realistic materials, natural perspective, cinematic composition, subtle film grain, high environmental detail. "+

"16:9 landscape composition. Keep the face and top of the head safely inside the frame. "+

noText()+".";

return p;

}


/* =====================================================
CREATE SCENES
===================================================== */

function createScenes(){

try{

var story=$("story").value.trim();

if(!story){

alert("Önce hikâyeyi gir.");

return;

}

/*
TTS'YE DOKUNMADAN
SADECE KARAKTER ALGILAMA
*/

if(!characterLocked){

detectCharacter();

}

var sentences=
splitSentences(story);

if(!sentences.length){

alert("Cümle bulunamadı.");

return;

}

var groups=
smartGrouping(sentences);

scenes=[];
sceneCounter=1;

for(var i=0;i<groups.length;i++){

var text=
groups[i].join(" ");

scenes.push({

id:sceneCounter++,

text:text,

subtitle:text,

subtitleEnabled:false,

prompt:
buildPrompt(
text,
i
),

image:null,

imageURL:null,

imageObject:null,

audio:null,

audioURL:null,

duration:4,

motion:"zoomIn",

ttsState:"Hazır"

});

}

renderScenes();
renderGallery();

setStatus(
"✅ "+scenes.length+
" SAHNE OLUŞTURULDU • "+
sentences.length+
" cümle analiz edildi."
);

}
catch(error){

console.error(error);

setStatus(
"❌ HATA: "+error.message
);

alert(
"Sahne oluşturma hatası:\n\n"+
error.message
);

}

}

' kelime</span>'+
'<span class="badge">'+
Number(s.duration).toFixed(2)+
' sn</span>'+
'</div>';

html+=
'<div class="scene-text">'+
escapeHTML(s.text)+
'</div>';

'<div class="preview">';

}
else{

'<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#64748b">'+
'🖼️ Görsel yüklenmedi'+

}

html+='</div>';

html+=

/* =====================================================
PROMPT ACTIONS
===================================================== */

function regeneratePrompt(index){

if(!scenes[index])return;

scenes[index].prompt=
buildPrompt(
scenes[index].text,
index
);

renderScenes();

}


function copyPrompt(index){

var text=scenes[index].prompt;

if(navigator.clipboard){

navigator.clipboard.writeText(text);

}
else{

var area=document.createElement("textarea");

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

document.body.removeChild(area);

}

setStatus(
"📋 Sahne "+(index+1)+" promptu kopyalandı."
);

}


/* =====================================================
SUBTITLE
===================================================== */

function toggleSubtitle(index){

scenes[index].subtitleEnabled=
!scenes[index].subtitleEnabled;

renderScenes();

}

LOGO

)return;

/* =====================================================
IMAGE PROCESS
===================================================== */

function processImage(img){

var canvas=
document.createElement("canvas");

canvas.width=1280;
canvas.height=720;

var ctx=
canvas.getContext("2d");

var iw=
img.naturalWidth ||
img.width;

var ih=
img.naturalHeight ||
img.height;

var target=16/9;

var ratio=iw/ih;

var sx=0;
var sy=0;
var sw=iw;
var sh=ih;

if(ratio>target){

sw=ih*target;

sx=(iw-sw)/2;

}
else if(ratio<target){

sh=iw/target;

/*
Kafa koruma.
Üstten sadece %8 boşluk.
*/

sy=(ih-sh)*0.08;

if(sy<0){
sy=0;
}

}

ctx.drawImage(
img,
sx,
sy,
sw,
sh,
0,
0,
1280,
720
);

return canvas;

}


/* =====================================================
IMAGE UPLOAD
===================================================== */

function uploadImage(index,input){

if(
!input.files ||
!input.files[0]
)return;

var url=
URL.createObjectURL(
input.files[0]
);

var img=
new Image();

img.onload=function(){

var canvas=
processImage(img);

var data=
canvas.toDataURL(
"image/jpeg",
0.94
);

var finalImg=
new Image();

finalImg.onload=function(){

scenes[index].image=
input.files[0];

scenes[index].imageURL=
data;

scenes[index].imageObject=
finalImg;

renderScenes();
renderGallery();

setStatus(
"🟢 Sahne "+(index+1)+
" görseli 16:9 olarak hazırlandı."
);

};

finalImg.src=data;

};

img.onerror=function(){

alert("Görsel yüklenemedi.");

};

img.src=url;

}

/* =====================================================
PIPER TTS
===================================================== */

async function loadTTS(){

if(ttsModule){
return ttsModule;
}

$("ttsStatus").textContent=
"⏳ Piper TTS yükleniyor...";

try{

ttsModule=
await import(
"https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm"
);

$("ttsStatus").textContent=
"✅ Piper TTS hazır.";

return ttsModule;

}
catch(error){

$("ttsStatus").textContent=
"❌ Piper TTS: "+
error.message;

throw error;

}

}


async function audioDuration(url){

return new Promise(
function(resolve){

var audio=
new Audio();

audio.onloadedmetadata=
function(){

if(
isFinite(audio.duration)
&&
audio.duration>0
){

resolve(audio.duration);

}
else{

resolve(0);

}

};

audio.onerror=
function(){
resolve(0);
};

audio.src=url;

});

}


/* =====================================================
ONE VOICE
===================================================== */

async function generateVoice(index){

var s=scenes[index];

if(!s)return;

s.ttsState=
"⏳ Ses oluşturuluyor...";

renderScenes();

try{

var tts=
await loadTTS();

var voice=
"de_DE-thorsten-medium";

var wav;

if(tts.TtsSession){

if(!ttsSession){

ttsSession=
new tts.TtsSession({

voiceId:voice,

allowLocalModels:true,

fallbackStrategy:"auto"

});

ttsSession.voiceId=voice;

}

wav=
await ttsSession.predict(
s.text
);

}
else{

wav=
await tts.predict({
text:s.text,
voiceId:voice
});

}

s.audio=wav;

if(s.audioURL){

try{
URL.revokeObjectURL(
s.audioURL
);
}catch(e){}

}

s.audioURL=
URL.createObjectURL(wav);

var d=
await audioDuration(
s.audioURL
);

if(d>0){
s.duration=d;
}

s.ttsState=
"✅ WAV hazır • "+
Number(s.duration).toFixed(2)+
" sn";

renderScenes();

$("ttsStatus").textContent=
"✅ Sahne "+(index+1)+" hazır.";

}
catch(error){

console.error(error);

s.ttsState=
"❌ "+error.message;

$("ttsStatus").textContent=
"❌ TTS hatası: "+
error.message;

renderScenes();

}

}

ALL VOICES
