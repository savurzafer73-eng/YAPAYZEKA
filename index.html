<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080d18;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(850px,94%);
    margin:25px auto 50px;
}

h1{
    text-align:center;
    font-size:32px;
    margin:0 0 7px;
}

.subtitle{
    text-align:center;
    color:#9ba8bd;
    margin-bottom:25px;
}

.card{
    background:#121a2b;
    border:1px solid #293752;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #394867;
    background:#080e1c;
    color:#fff;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    padding:15px;
    margin-top:14px;
    border:0;
    border-radius:10px;
    background:#5865f2;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.12);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.secondary{
    background:#293650;
}

.green{
    background:#168b4b;
}

.red{
    background:#9b3030;
}

.status{
    margin-top:15px;
    padding:14px;
    background:#080e1c;
    border-radius:10px;
    color:#cbd5e1;
    white-space:pre-wrap;
    line-height:1.5;
}

.progress{
    width:100%;
    height:10px;
    background:#080e1c;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.progressBar{
    height:100%;
    width:0%;
    background:#5865f2;
    transition:.3s;
}

.scene{
    background:#080e1c;
    border:1px solid #293752;
    border-radius:14px;
    padding:12px;
    margin-top:14px;
}

.scene img{
    width:100%;
    display:block;
    border-radius:10px;
    max-height:400px;
    object-fit:cover;
    background:#050810;
}

.sceneTitle{
    font-weight:bold;
    margin:10px 0 6px;
}

.sceneText{
    color:#adb8ca;
    font-size:14px;
    line-height:1.5;
}

video{
    width:100%;
    display:block;
    border-radius:14px;
    background:#000;
}

.download{
    display:block;
    width:100%;
    text-align:center;
    padding:15px;
    margin-top:14px;
    border-radius:10px;
    background:#168b4b;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

.small{
    color:#8995aa;
    font-size:13px;
    line-height:1.5;
    margin-top:8px;
}

.hidden{
    display:none;
}

@media(max-width:600px){
    .row{
        grid-template-columns:1fr;
    }

    h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Mina Video AI</h1>

<div class="subtitle">
KONU → SAHNELER → GÖRSELLER → ALTYAZI → VİDEO
</div>


<div class="card">

<label>Konu</label>

<input
    id="topic"
    value="dark forest mystery"
    placeholder="Örneğin: abandoned castle"
>

<div class="row" style="margin-top:15px">

<div>

<label>Sahne sayısı</label>

<select id="sceneCount">
<option value="1">1 Sahne</option>
<option value="4" selected>4 Sahne</option>
<option value="5">5 Sahne</option>
<option value="6">6 Sahne</option>
</select>

</div>

<div>

<label>Sahne süresi</label>

<select id="duration">
<option value="4">4 saniye</option>
<option value="5" selected>5 saniye</option>
<option value="6">6 saniye</option>
<option value="8">8 saniye</option>
</select>

</div>

</div>


<label style="margin-top:15px">
Dil
</label>

<select id="language">
<option value="tr">Türkçe</option>
<option value="de" selected>Almanca</option>
<option value="en">İngilizce</option>
</select>


<button id="createBtn">
🎬 VİDEO OLUŞTUR
</button>

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<div id="status" class="status">
Hazır.
</div>

</div>


<div id="scriptCard" class="card hidden">

<h2>📝 Senaryo</h2>

<textarea id="scriptText"></textarea>

<button id="speakBtn" class="secondary">
🔊 SENARYOYU SESLENDİR
</button>

<button id="stopSpeakBtn" class="red">
⏹️ SESİ DURDUR
</button>

</div>


<div id="scenesCard" class="card hidden">

<h2>🖼️ Sahneler</h2>

<div id="scenes"></div>

</div>


<div id="videoCard" class="card hidden">

<h2>🎥 Video Önizleme</h2>

<video id="video" controls playsinline></video>

<a
    id="download"
    class="download"
    download="mina-video.webm">
⬇️ VİDEOYU İNDİR
</a>

<div class="small">
Video WebM formatında oluşturulur.
</div>

</div>

</div>


<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const topicInput =
document.getElementById("topic");

const sceneCountInput =
document.getElementById("sceneCount");

const durationInput =
document.getElementById("duration");

const languageInput =
document.getElementById("language");

const createBtn =
document.getElementById("createBtn");

const statusBox =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const scriptCard =
document.getElementById("scriptCard");

const scriptText =
document.getElementById("scriptText");

const scenesCard =
document.getElementById("scenesCard");

const scenesBox =
document.getElementById("scenes");

const videoCard =
document.getElementById("videoCard");

const video =
document.getElementById("video");

const download =
document.getElementById("download");

const speakBtn =
document.getElementById("speakBtn");

const stopSpeakBtn =
document.getElementById("stopSpeakBtn");


let generatedScenes = [];

let currentVideoURL = null;


/* =====================================================
   DURUM
===================================================== */

function setStatus(text){
    statusBox.textContent = text;
}

function progress(value){
    progressBar.style.width =
    Math.max(0,Math.min(100,value)) + "%";
}

function wait(ms){
    return new Promise(resolve =>
        setTimeout(resolve,ms)
    );
}


/* =====================================================
   SENARYO
===================================================== */

function createScenes(topic,count,lang){

    const sets={

        tr:[
            `Bu hikâye ${topic} ile başlıyor. Her şey ilk bakışta normal görünüyordu.`,
            `Fakat gece ilerledikçe olayın arkasında açıklanamayan ayrıntılar ortaya çıktı.`,
            `Araştırma derinleştikçe hikâyenin çok daha eski ve gizemli bir geçmişi olduğu anlaşıldı.`,
            `Ve sonunda geriye tek bir soru kaldı: O gece gerçekte ne olmuştu?`,
            `Tanıkların anlattıkları gizemi daha da büyüttü.`,
            `Bugün bile bu olay için kesin bir cevap bulunmuş değil.`
        ],

        de:[
            `Diese Geschichte beginnt mit ${topic}. Zunächst schien alles völlig normal zu sein.`,
            `Doch im Laufe der Nacht tauchten immer mehr unerklärliche Hinweise auf.`,
            `Je weiter die Ermittlungen gingen, desto geheimnisvoller wurde die Geschichte.`,
            `Am Ende blieb nur eine Frage: Was geschah in dieser Nacht wirklich?`,
            `Die Aussagen der Zeugen machten den Fall noch rätselhafter.`,
            `Bis heute gibt es keine eindeutige Erklärung für dieses Geheimnis.`
        ],

        en:[
            `This story begins with ${topic}. At first, everything seemed completely normal.`,
            `But as the night continued, strange and unexplained details began to appear.`,
            `The deeper the investigation went, the more mysterious the story became.`,
            `In the end, only one question remained: What really happened that night?`,
            `Witness statements made the mystery even harder to explain.`,
            `Even today, there is no definitive answer to this mystery.`
        ]

    };

    return sets[lang].slice(0,count);
}


/* =====================================================
   WIKIMEDIA ARAMA
===================================================== */

async function searchWikimedia(query){

    const api =
    "https://commons.wikimedia.org/w/api.php";


    const params = new URLSearchParams();

    params.set("action","query");
    params.set("format","json");
    params.set("formatversion","2");

    params.set("generator","search");

    params.set("gsrsearch",query);

    params.set("gsrnamespace","6");

    params.set("gsrlimit","20");

    params.set("prop","imageinfo");

    params.set(
        "iiprop",
        "url|mime"
    );

    params.set(
        "iiurlwidth",
        "960"
    );

    params.set("origin","*");


    const url =
    api + "?" + params.toString();


    console.log(
        "Wikimedia:",
        url
    );


    const response =
    await fetch(url,{
        method:"GET",
        mode:"cors",
        credentials:"omit"
    });


    if(!response.ok){

        throw new Error(
            "Wikimedia HTTP " +
            response.status
        );

    }


    const data =
    await response.json();


    console.log(
        "Wikimedia sonucu:",
        data
    );


    if(
        !data.query ||
        !data.query.pages
    ){

        return [];

    }


    const pages =
    data.query.pages;


    const results=[];


    for(const page of pages){

        if(
            !page.imageinfo ||
            !page.imageinfo.length
        ){
            continue;
        }


        const info =
        page.imageinfo[0];


        if(
            !info.mime ||
            !info.mime.startsWith("image/")
        ){
            continue;
        }


        const imageUrl =
        info.thumburl ||
        info.url;


        if(!imageUrl){
            continue;
        }


        results.push({

            title:
            (page.title || "")
            .replace(/^File:/,""),

            url:imageUrl,

            original:
            info.url || imageUrl

        });

    }


    return results;
}


/* =====================================================
   GÖRSELİ EKRANA KOY
===================================================== */

function createSceneElement(scene,index){

    const div =
    document.createElement("div");

    div.className="scene";


    const title =
    document.createElement("div");

    title.className="sceneTitle";

    title.textContent =
    "SAHNE " + (index+1);


    const img =
    document.createElement("img");

    img.src=scene.url;

    img.alt=scene.title;

    img.loading="lazy";


    const text =
    document.createElement("div");

    text.className="sceneText";

    text.textContent=
    scene.text;


    const small =
    document.createElement("div");

    small.className="small";

    small.textContent=
    "Görsel: " + scene.title;


    div.appendChild(title);

    div.appendChild(img);

    div.appendChild(text);

    div.appendChild(small);


    return div;
}


/* =====================================================
   GÖRSELİ CANVAS İÇİN YÜKLE
===================================================== */

function loadImageForCanvas(url){

    return new Promise((resolve,reject)=>{

        const img =
        new Image();

        /*
          Wikimedia CDN CORS
        */

        img.crossOrigin="anonymous";

        img.onload=()=>{
            resolve(img);
        };

        img.onerror=()=>{
            reject(
                new Error(
                    "Canvas görseli yükleyemedi"
                )
            );
        };

        /*
          Cache'i aşmak için
          URL'ye küçük parametre
        */

        img.src =
        url +
        (url.includes("?") ? "&" : "?") +
        "mina=" +
        Date.now();

    });

}


/* =====================================================
   SAHNELERİ BUL
===================================================== */

async function buildScenes(){

    const topic =
    topicInput.value.trim();

    const count =
    Number(sceneCountInput.value);

    const lang =
    languageInput.value;


    const scriptScenes =
    createScenes(
        topic,
        count,
        lang
    );


    generatedScenes=[];

    scenesBox.innerHTML="";

    scenesCard.classList.remove(
        "hidden"
    );


    /*
      Her sahne için farklı arama.
    */

    const queries=[

        topic,

        topic + " night",

        topic + " mystery",

        topic + " old",

        topic + " dark",

        topic + " investigation"

    ];


    for(
        let i=0;
        i<count;
        i++
    ){

        const query =
        queries[i] || topic;


        setStatus(
            "🔎 Görsel aranıyor...\n\n" +
            "Sahne " +
            (i+1) +
            "/" +
            count +
            "\n\n" +
            query
        );


        progress(
            10 +
            (i/count)*40
        );


        let results=[];


        try{

            results =
            await searchWikimedia(
                query
            );

        }catch(error){

            console.error(error);

        }


        /*
          İlk arama başarısızsa
          sadece ana konuyu ara.
        */

        if(!results.length){

            try{

                results =
                await searchWikimedia(
                    topic
                );

            }catch(error){}

        }


        if(!results.length){

            continue;

        }


        /*
          İlk sonucu kullan.
        */

        const selected =
        results[0];


        /*
          Ekranda hemen göster.
        */

        const scene={

            url:selected.url,

            original:selected.original,

            title:selected.title,

            text:scriptScenes[i],

            image:null

        };


        generatedScenes.push(scene);


        scenesBox.appendChild(
            createSceneElement(
                scene,
                generatedScenes.length-1
            )
        );


        /*
          Canvas için görseli ayrıca dene.
        */

        try{

            scene.image =
            await loadImageForCanvas(
                selected.url
            );

        }catch(error){

            console.warn(
                "Canvas görseli alınamadı:",
                error
            );

            /*
              Ekranda yine de görsel kalır.
            */

        }


        await wait(500);

    }


    /*
      En azından ekranda görsel var mı?
    */

    if(!generatedScenes.length){

        throw new Error(
            "Wikimedia'dan görsel bulunamadı."
        );

    }


    setStatus(
        "✅ " +
        generatedScenes.length +
        " görsel bulundu.\n\n" +
        "Şimdi video hazırlanıyor..."
    );


    progress(55);

}


/* =====================================================
   CANVAS GÖRSEL
===================================================== */

function drawImageCover(
    ctx,
    img,
    cw,
    ch
){

    const iw=img.width;
    const ih=img.height;


    const scale =
    Math.max(
        cw/iw,
        ch/ih
    );


    const nw =
    iw*scale;

    const nh =
    ih*scale;


    const x =
    (cw-nw)/2;

    const y =
    (ch-nh)/2;


    ctx.drawImage(
        img,
        x,
        y,
        nw,
        nh
    );

}


/* =====================================================
   ALTYAZI
===================================================== */

function drawSubtitle(
    ctx,
    text,
    w,
    h
){

    if(!text)return;


    ctx.font=
    "bold 30px Arial";


    const max=
    w-100;


    const words=
    text.split(" ");


    const lines=[];

    let line="";


    for(const word of words){

        const test=
        line
        ? line+" "+word
        : word;


        if(
            ctx.measureText(test).width >
            max
        ){

            lines.push(line);

            line=word;

        }else{

            line=test;

        }

    }


    if(line){
        lines.push(line);
    }


    const lineHeight=40;

    const height=
    lines.length*lineHeight+35;


    const y=
    h-height-30;


    ctx.fillStyle=
    "rgba(0,0,0,.72)";


    ctx.fillRect(
        25,
        y,
        w-50,
        height
    );


    ctx.fillStyle="#fff";

    ctx.textAlign="center";

    ctx.textBaseline="top";


    lines.forEach(
        (line,i)=>{

            ctx.fillText(
                line,
                w/2,
                y+17+i*lineHeight
            );

        }
    );

}


/* =====================================================
   VİDEO
===================================================== */

async function createVideo(){

    /*
      Sadece canvas için gerçekten yüklenen
      görselleri kullan.
    */

    const usable =
    generatedScenes.filter(
        s=>s.image
    );


    /*
      Eğer canvas CORS izin vermediyse,
      videoyu zorlamıyoruz.
      Önce görselleri kullanıcıya gösteriyoruz.
    */

    if(!usable.length){

        setStatus(
            "✅ Görseller bulundu ve ekranda gösterildi.\n\n" +
            "⚠️ Tarayıcı bu görselleri video canvasına aktarmaya izin vermedi.\n\n" +
            "Bu nedenle video oluşturulmadı."
        );

        return;

    }


    const canvas =
    document.createElement("canvas");


    canvas.width=1280;

    canvas.height=720;


    const ctx=
    canvas.getContext("2d");


    const stream =
    canvas.captureStream(30);


    let mime="";


    const formats=[

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for(
        const f of formats
    ){

        if(
            MediaRecorder.isTypeSupported(f)
        ){

            mime=f;

            break;

        }

    }


    if(!mime){

        throw new Error(
            "Tarayıcı WebM desteklemiyor."
        );

    }


    const recorder =
    new MediaRecorder(
        stream,
        {
            mimeType:mime,
            videoBitsPerSecond:5000000
        }
    );


    const chunks=[];


    recorder.ondataavailable=
    e=>{

        if(e.data.size){

            chunks.push(e.data);

        }

    };


    const stopped =
    new Promise(
        resolve=>{

            recorder.onstop=
            resolve;

        }
    );


    recorder.start(200);


    const seconds =
    Number(durationInput.value);


    for(
        let s=0;
        s<usable.length;
        s++
    ){

        const scene=
        usable[s];


        const totalFrames=
        seconds*30;


        for(
            let frame=0;
            frame<totalFrames;
            frame++
        ){

            ctx.fillStyle="#000";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
              Hafif zoom
            */

            const zoom=
            1+
            frame/totalFrames*.04;


            ctx.save();

            ctx.translate(
                canvas.width/2,
                canvas.height/2
            );

            ctx.scale(
                zoom,
                zoom
            );

            ctx.translate(
                -canvas.width/2,
                -canvas.height/2
            );


            drawImageCover(
                ctx,
                scene.image,
                canvas.width,
                canvas.height
            );


            ctx.restore();


            /*
              Üst başlık
            */

            ctx.fillStyle=
            "rgba(0,0,0,.45)";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                70
            );


            ctx.fillStyle="#fff";

            ctx.font=
            "bold 27px Arial";

            ctx.textAlign="left";

            ctx.textBaseline="middle";


            ctx.fillText(
                "MYSTERY NACHT",
                30,
                35
            );


            ctx.textAlign="right";


            ctx.fillText(
                `${s+1}/${usable.length}`,
                canvas.width-30,
                35
            );


            /*
              Altyazı
            */

            drawSubtitle(
                ctx,
                scene.text,
                canvas.width,
                canvas.height
            );


            const p=
            55+
            (
                (
                    s+
                    frame/totalFrames
                )/
                usable.length
            )*40;


            progress(p);


            await wait(
                1000/30
            );

        }

    }


    recorder.stop();

    await stopped;


    const blob=
    new Blob(
        chunks,
        {type:mime}
    );


    if(currentVideoURL){

        URL.revokeObjectURL(
            currentVideoURL
        );

    }


    currentVideoURL=
    URL.createObjectURL(blob);


    video.src=
    currentVideoURL;


    download.href=
    currentVideoURL;


    videoCard.classList.remove(
        "hidden"
    );


    progress(100);


    setStatus(
        "✅ VİDEO HAZIR!\n\n" +
        "Videoyu yukarıdaki oynatıcıdan izleyebilirsin."
    );

}


/* =====================================================
   ANA BUTON
===================================================== */

createBtn.onclick=
async function(){

    const topic=
    topicInput.value.trim();


    if(!topic){

        setStatus(
            "❌ Önce konu yaz."
        );

        return;

    }


    createBtn.disabled=true;


    scriptCard.classList.remove(
        "hidden"
    );


    videoCard.classList.add(
        "hidden"
    );


    progress(0);


    try{

        /*
          SENARYO
        */

        const scenes=
        createScenes(
            topic,
            Number(sceneCountInput.value),
            languageInput.value
        );


        scriptText.value=
        scenes.join("\n\n");


        progress(8);


        /*
          GÖRSELLER
        */

        await buildScenes();


        /*
          VİDEO
        */

        await createVideo();


    }catch(error){

        console.error(error);


        setStatus(
            "❌ HATA\n\n"+
            error.message
        );

    }finally{

        createBtn.disabled=false;

    }

};


/* =====================================================
   TARAYICI SESİ
===================================================== */

speakBtn.onclick=
function(){

    if(
        !("speechSynthesis" in window)
    ){

        setStatus(
            "❌ Tarayıcı seslendirmeyi desteklemiyor."
        );

        return;

    }


    speechSynthesis.cancel();


    const text=
    scriptText.value.trim();


    if(!text)return;


    const u=
    new SpeechSynthesisUtterance(text);


    const lang=
    languageInput.value;


    if(lang==="de"){

        u.lang="de-DE";

    }else if(lang==="en"){

        u.lang="en-US";

    }else{

        u.lang="tr-TR";

    }


    u.rate=.92;

    u.pitch=1;

    u.volume=1;


    speechSynthesis.speak(u);


    setStatus(
        "🔊 Senaryo seslendiriliyor..."
    );

};


stopSpeakBtn.onclick=
function(){

    if(
        "speechSynthesis"
        in window
    ){

        speechSynthesis.cancel();

    }


    setStatus(
        "⏹️ Ses durduruldu."
    );

};


/* =====================================================
   BAŞLANGIÇ
===================================================== */

setStatus(
    "Hazır.\n\n"+
    "Konu yazıp VİDEO OLUŞTUR'a bas."
);

</script>

</body>
</html>
