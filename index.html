<script>

/* =========================================================
   AYARLAR
========================================================= */

const CLIENT_ID =
"pk_QJfK0SKE0MqAqf3I";

const REDIRECT_URI =
"https://savurzafer73-eng.github.io/YAPAYZEKA/";

const AUTH_URL =
"https://enter.pollinations.ai/authorize";

const TOKEN_URL =
"https://enter.pollinations.ai/api/oauth/token";

const IMAGE_API =
"https://gen.pollinations.ai/image/";


/* =========================================================
   DEĞİŞKENLER
========================================================= */

let accessToken =
localStorage.getItem("mina_pollinations_token") || "";

let scenesData = [];

let generatedImages = [];


/* =========================================================
   DOM
========================================================= */

const connectBtn =
document.getElementById("connectBtn");

const connectionStatus =
document.getElementById("connectionStatus");

const scriptBtn =
document.getElementById("scriptBtn");

const imageBtn =
document.getElementById("imageBtn");

const videoBtn =
document.getElementById("videoBtn");

document.getElementById("scriptStatus");

document.getElementById("scriptBox");

document.getElementById("imageStatus");

document.getElementById("scenes");

const videoStatus =
document.getElementById("videoStatus");

document.getElementById("videoBox");


/* =========================================================
   HELPER
========================================================= */

function setStatus(el,text,type=""){
    el.className="status "+type;
    el.textContent=text;
}


function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}


/* =========================================================
   PKCE
========================================================= */

function randomString(length=64){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result="";

    const values =
    crypto.getRandomValues(new Uint8Array(length));

    for(const v of values){
        result += chars[v % chars.length];
    }

    return result;
}


async function sha256(text){

    const data =
    new TextEncoder().encode(text);

    return await crypto.subtle.digest(
        "SHA-256",
        data
    );
}


function base64url(buffer){

    return btoa(
        String.fromCharCode(...new Uint8Array(buffer))
    )
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=/g,"");
}


/* =========================================================
   OAUTH
========================================================= */

async function startOAuth(){

    const verifier =
    randomString(64);

    const challenge =
    base64url(
        await sha256(verifier)
    );

    const state =
    randomString(32);

    localStorage.setItem(
        "mina_pkce_verifier",
        verifier
    );

    localStorage.setItem(
        "mina_oauth_state",
        state
    );

    const params =
    new URLSearchParams({

        client_id:CLIENT_ID,

        redirect_uri:REDIRECT_URI,

        response_type:"code",

        scope:"profile usage",

        code_challenge:challenge,

        code_challenge_method:"S256",

        state:state,

        expires:"7",

        budget:"5"

    });

    window.location.href =
    AUTH_URL+"?"+params.toString();
}


/* =========================================================
   TOKEN
========================================================= */

async function exchangeCode(code){

    const verifier =
    localStorage.getItem(
        "mina_pkce_verifier"
    );

    if(!verifier){

        throw new Error(
            "PKCE doğrulama bilgisi bulunamadı."
        );

    }

    const body =
    new URLSearchParams({

        grant_type:"authorization_code",

        client_id:CLIENT_ID,

        redirect_uri:REDIRECT_URI,

        code:code,

        code_verifier:verifier

    });

    const response =
    await fetch(
        TOKEN_URL,
        {
            method:"POST",
            headers:{
                "Content-Type":
                "application/x-www-form-urlencoded"
            },
            body
        }
    );

    const text =
    await response.text();

    if(!response.ok){

        throw new Error(
            "Token alınamadı: "+
            response.status+
            " "+
            text
        );

    }

    const data =
    JSON.parse(text);

    if(!data.access_token){

        throw new Error(
            "Access token alınamadı."
        );

    }

    accessToken =
    data.access_token;

    localStorage.setItem(
        "mina_pollinations_token",
        accessToken
    );

    localStorage.removeItem(
        "mina_pkce_verifier"
    );

    localStorage.removeItem(
        "mina_oauth_state"
    );

}


/* =========================================================
   CALLBACK
========================================================= */

async function checkCallback(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    const code =
    params.get("code");

    const state =
    params.get("state");

    if(!code){
        updateConnection();
        return;
    }

    const savedState =
    localStorage.getItem(
        "mina_oauth_state"
    );

    if(savedState && state !== savedState){

        setStatus(
            connectionStatus,
            "❌ OAuth güvenlik doğrulaması başarısız.",
            "error"
        );

        return;
    }

    setStatus(
        connectionStatus,
        "🔄 Pollinations bağlantısı kuruluyor..."
    );

    try{

        await exchangeCode(code);

        window.history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        updateConnection();

    }catch(error){

        setStatus(
            connectionStatus,
            "❌ Bağlantı hatası: "+
            error.message,
            "error"
        );

    }

}


/* =========================================================
   CONNECTION
========================================================= */

function updateConnection(){

    if(accessToken){

        setStatus(
            connectionStatus,
            "🟢 Pollinations bağlı. Görsel üretmeye hazırsın.",
            "success"
        );

        scriptBtn.disabled=false;

    }else{

        setStatus(
            connectionStatus,
            "🔴 Bağlı değil. Önce Pollinations'a bağlan."
        );

        scriptBtn.disabled=true;

    }

}


/* =========================================================
   CHAT
========================================================= */

async function generateScript(){

    if(!accessToken){

        alert(
            "Önce Pollinations'a bağlan."
        );

        return;
    }

    const topic =
    document.getElementById("topic").value.trim();

    const language =
    document.getElementById("language").value;

    const count =
    Number(
        document.getElementById("sceneCount").value
    );

    if(!topic){

        alert("Konu yazmalısın.");

        return;
    }

    scriptBtn.disabled=true;

    setStatus(
        scriptStatus,
        "🤖 AI senaryoyu hazırlıyor..."
    );

    scriptBox.innerHTML="";

    const languageName =
    language==="de"
    ? "German"
    : language==="tr"
    ? "Turkish"
    : "English";

    const prompt = `

Create a short cinematic mystery video script.

Topic:
${topic}

Language:
${languageName}

Number of scenes:
${count}

Return ONLY valid JSON.

Format:

{
 "title":"...",
 "scenes":[
   {
     "text":"short narration for this scene",
     "visual":"detailed cinematic visual description"
   }
 ]
}

Rules:
- exactly ${count} scenes
- narration must be short
- visuals must be highly descriptive
- realistic cinematic details
- mysterious atmosphere
- no markdown
`;

    try{

        const response =
        await fetch(
            "https://gen.pollinations.ai/v1/chat/completions",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer "+accessToken
                },

                body:JSON.stringify({

                    model:"openai",

                    messages:[
                        {
                            role:"user",
                            content:prompt
                        }
                    ],

                    temperature:.8
                })
            }
        );

        const raw =
        await response.text();

        if(!response.ok){

            throw new Error(
                "Senaryo API "+
                response.status+
                ": "+
                raw
            );

        }

        const data =
        JSON.parse(raw);

        let content =
        data?.choices?.[0]?.message?.content ||
        "";

        content =
        content
        .replace(/```json/gi,"")
        .replace(/```/g,"")
        .trim();

        const parsed =
        JSON.parse(content);

        scenesData =
        parsed.scenes || [];

        if(!scenesData.length){

            throw new Error(
                "AI sahne döndürmedi."
            );

        }

        scriptBox.innerHTML =
        `
        <div class="status success">
        <b>${parsed.title || "Mystery Video"}</b>
        <br>
        ${scenesData.length} sahne hazır.
        </div>
        `;

        setStatus(
            scriptStatus,
            "✅ Senaryo hazır.",
            "success"
        );

        imageBtn.disabled=false;

    }catch(error){

        console.error(error);

        setStatus(
            scriptStatus,
            "❌ Senaryo oluşturulamadı: "+
            error.message,
            "error"
        );

    }finally{

        scriptBtn.disabled=false;

    }

}


/* =========================================================
   STYLE
========================================================= */

function getStylePrompt(){

    const value =
    document.getElementById("style").value;

    const styles={

        cinematic:
        "cinematic movie still, dramatic lighting, film grain, professional cinematography",

        fantasy:
        "dark fantasy cinematic artwork, magical atmosphere, detailed environment",

        scifi:
        "cinematic science fiction, futuristic atmosphere, realistic technology",

        "3d":
        "high quality 3D animated movie style, detailed 3D environment",

        "2d":
        "beautiful 2D animated illustration, cinematic composition",

        dark:
        "dark mysterious horror atmosphere, realistic shadows, eerie cinematic lighting",

        photo:
        "ultra realistic photography, natural textures, realistic lighting",

        action:
        "dynamic action movie scene, dramatic movement, cinematic lighting",

        medieval:
        "historical medieval cinematic scene, realistic architecture and clothing",

        epic:
        "epic cinematic movie scene, huge scale, dramatic atmosphere"

    };

    return styles[value] || styles.cinematic;

}


/* =========================================================
   IMAGE URL
========================================================= */

function buildImageUrl(prompt,index){

    const style =
    getStylePrompt();

    const finalPrompt = `

${prompt}

${style}

YouTube mystery documentary visual.

No text.
No captions.
No watermark.
No logo.

16:9 composition.
Strong foreground and background depth.
Atmospheric lighting.
Highly detailed.
Professional cinematic composition.

`;

    const encoded =
    encodeURIComponent(
        finalPrompt
    );

    const seed =
    Date.now()+index*1000;

    const url =
    IMAGE_API+
    encoded+
    "?model=flux"+
    "&width=1280"+
    "&height=720"+
    "&seed="+seed+
    "&nologo=true"+
    "&private=true";

    return url;

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
            new Image();

            img.crossOrigin="anonymous";

            let finished=false;

            const timeout =
            setTimeout(()=>{

                if(finished)return;

                finished=true;

                reject(
                    new Error(
                        "Görsel 90 saniye içinde yüklenmedi."
                    )
                );

            },90000);


            img.onload=()=>{

                if(finished)return;

                finished=true;

                clearTimeout(timeout);

                resolve(img);

            };


            img.onerror=()=>{

                if(finished)return;

                finished=true;

                clearTimeout(timeout);

                reject(
                    new Error(
                        "Görsel sunucusundan cevap alınamadı."
                    )
                );

            };


            img.src=url;

        }
    );

}


/* =========================================================
   IMAGE GENERATION
========================================================= */

async function generateImages(){

    if(!accessToken){

        alert(
            "Önce Pollinations'a bağlan."
        );

        return;

    }

    if(!scenesData.length){

        alert(
            "Önce senaryo oluştur."
        );

        return;

    }

    imageBtn.disabled=true;

    videoBtn.disabled=true;

    scenesBox.innerHTML="";

    generatedImages=[];

    setStatus(
        imageStatus,
        "🎨 Görseller hazırlanıyor..."
    );


    for(
        let i=0;
        i<scenesData.length;
        i++
    ){

        const scene =
        scenesData[i];

        const sceneDiv =
        document.createElement("div");

        sceneDiv.className="scene";

        sceneDiv.innerHTML=`

        <div class="scene-title">
        🎬 Sahne ${i+1}
        </div>

        <div class="small">
        ⏳ Görsel oluşturuluyor...
        </div>

        `;

        scenesBox.appendChild(sceneDiv);


        try{

            /*
             * Token'ı URL'ye koymuyoruz.
             * Güncel API'de Authorization header
             * tercih edilen yöntem.
             */

            const url =
            buildImageUrl(
                scene.visual,
                i
            );


            const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                        "Bearer "+accessToken
                    }
                }
            );


            if(!response.ok){

                const errorText =
                await response.text();

                throw new Error(
                    "HTTP "+
                    response.status+
                    " - "+
                    errorText.slice(0,300)
                );

            }


            const blob =
            await response.blob();


            if(
                !blob.type.startsWith("image/")
            ){

                throw new Error(
                    "API görüntü yerine "+
                    blob.type+
                    " döndürdü."
                );

            }


            const blobUrl =
            URL.createObjectURL(blob);


            const img =
            await loadImage(blobUrl);


            generatedImages.push({

                img:img,

                blob:blob,

                url:blobUrl,

                text:scene.text

            });


            sceneDiv.innerHTML=`

            <div class="scene-title">
            🎬 Sahne ${i+1}
            </div>

            <img
                src="${blobUrl}"
                alt="AI generated scene"
            >

            <div class="scene-text">
            ${escapeHtml(scene.text)}
            </div>

            <div class="small success">
            ✅ Görsel başarıyla oluşturuldu.
            </div>

            `;


        }catch(error){

            console.error(
                "IMAGE ERROR",
                error
            );


            sceneDiv.innerHTML=`

            <div class="scene-title">
            🎬 Sahne ${i+1}
            </div>

            <div class="status error">
            ❌ Görsel oluşturulamadı.
            <br><br>
            ${escapeHtml(error.message)}
            </div>

            `;


            setStatus(
                imageStatus,
                "❌ En az bir görsel oluşturulamadı.",
                "error"
            );

            imageBtn.disabled=false;

            return;

        }


        setStatus(
            imageStatus,
            `🎨 ${i+1}/${scenesData.length} görsel hazır...`
        );


        /*
         * API'yi gereksiz yere arka arkaya
         * sıkıştırmamak için kısa bekleme.
         */

        await sleep(1200);

    }


    if(
        generatedImages.length ===
        scenesData.length
    ){

        setStatus(
            imageStatus,
            `✅ ${generatedImages.length} görsel başarıyla hazır.`,
            "success"
        );

        videoBtn.disabled=false;

    }

    imageBtn.disabled=false;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CANVAS
========================================================= */

function createCanvas(){

    const canvas =
    document.createElement("canvas");

    canvas.width=1280;

    canvas.height=720;

    return canvas;

}


function drawScene(
    ctx,
    canvas,
    image,
    subtitle
){

    ctx.fillStyle="#000";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const scale =
    Math.max(
        canvas.width/image.naturalWidth,
        canvas.height/image.naturalHeight
    );


    const w =
    image.naturalWidth*scale;

    const h =
    image.naturalHeight*scale;


    const x =
    (canvas.width-w)/2;

    const y =
    (canvas.height-h)/2;


    ctx.drawImage(
        image,
        x,
        y,
        w,
        h
    );


    /*
     * Altyazı arka planı
     */

    if(subtitle){

        const maxWidth =
        canvas.width-120;

        const fontSize=34;

        ctx.font=
        "bold "+
        fontSize+
        "px Arial";

        ctx.textAlign="center";

        ctx.textBaseline="middle";


        const words =
        subtitle.split(" ");

        const lines=[];

        let line="";


        for(
            const word of words
        ){

            const test =
            line
            ? line+" "+word
            : word;

            if(
                ctx.measureText(test).width >
                maxWidth
            ){

                lines.push(line);

                line=word;

            }else{

                line=test;

            }

        }

        if(line){
            lines.push(line);
        }


        const lineHeight=44;

        const totalHeight =
        lines.length*lineHeight;


        const boxY =
        canvas.height-
        totalHeight-
        45;


        ctx.fillStyle=
        "rgba(0,0,0,.68)";


        ctx.fillRect(
            40,
            boxY-20,
            canvas.width-80,
            totalHeight+40
        );


        ctx.fillStyle="#fff";

        lines.forEach(
            (line,index)=>{

                ctx.fillText(
                    line,
                    canvas.width/2,
                    boxY+
                    index*lineHeight+
                    lineHeight/2
                );

            }
        );

    }

}


/* =========================================================
   WEBM
========================================================= */

async function createVideo(){

    if(
        generatedImages.length===0
    ){

        return;

    }


    videoBtn.disabled=true;


    setStatus(
        videoStatus,
        "🎥 WebM hazırlanıyor..."
    );


    const canvas =
    createCanvas();


    const ctx =
    canvas.getContext("2d");


    const preview =
    document.createElement("div");

    preview.className="preview";


    const previewCanvas =
    canvas.cloneNode(true);

    previewCanvas.style.display="none";


    videoBox.innerHTML="";

    videoBox.appendChild(
        previewCanvas
    );


    const stream =
    canvas.captureStream(30);


    let mime =
    "";


    const types=[

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for(
        const type of types
    ){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            mime=type;

            break;

        }

    }


    if(!mime){

        setStatus(
            videoStatus,
            "❌ Tarayıcı WebM kayıt desteklemiyor.",
            "error"
        );

        videoBtn.disabled=false;

        return;

    }


    const recorder =
    new MediaRecorder(
        stream,
        {
            mimeType:mime
        }
    );


    const chunks=[];


    recorder.ondataavailable =
    e=>{

        if(e.data.size>0){

            chunks.push(e.data);

        }

    };


    const finished =
    new Promise(resolve=>{

        recorder.onstop=resolve;

    });


    recorder.start();


    const secondsPerScene=5;


    for(
        let i=0;
        i<generatedImages.length;
        i++
    ){

        const item =
        generatedImages[i];


        const start =
        performance.now();


        while(
            performance.now()-start
            <
            secondsPerScene*1000
        ){

            drawScene(
                ctx,
                canvas,
                item.img,
                item.text
            );


            /*
             * Aynı canvas'ı
             * görünür önizlemeye de çiz.
             */

            const pctx =
            previewCanvas.getContext("2d");

            pctx.drawImage(
                canvas,
                0,
                0,
                previewCanvas.width,
                previewCanvas.height
            );


            await new Promise(
                requestAnimationFrame
            );

        }


        setStatus(
            videoStatus,
            `🎥 ${i+1}/${generatedImages.length} sahne videoya ekleniyor...`
        );

    }


    recorder.stop();

    await finished;


    const videoBlob =
    new Blob(
        chunks,
        {
            type:mime
        }
    );


    const videoUrl =
    URL.createObjectURL(
        videoBlob
    );


    videoBox.innerHTML=`

    <video
        controls
        src="${videoUrl}"
    ></video>

    <a
        href="${videoUrl}"
        download="mina-video-${Date.now()}.webm"
        style="
            display:block;
            margin-top:12px;
            text-align:center;
            padding:13px;
            background:#16a34a;
            color:white;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
        "
    >
    ⬇️ WebM Videoyu İndir
    </a>

    `;


    setStatus(
        videoStatus,
        "✅ WebM video hazır.",
        "success"
    );


    videoBtn.disabled=false;

}
