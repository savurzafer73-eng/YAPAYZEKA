<meta charset="UTF-8">

<title>Mina Video AI V51.12 — GeldStory Studio</title>

<style>
*{
  box-sizing:border-box;
}

html,body{

  padding:0;
  background:#080808;

  font-family:Arial,Helvetica,sans-serif;
}

body{

}

header{

  top:0;

}

.header-inner{

  justify-content:space-between;

}

.logo-title{

.mn-logo{

.header-sub{

.grid{

.field label{

select,

button.danger{

.prompt{

<script>

"use strict";


/* =========================================================
   GLOBALS
========================================================= */

var scenes = [];

var ttsModule = null;

var logoImage = null;

var characterProfile = {

  gender:"auto",
  age:"auto",
  hair:"auto",
  hairLength:"auto",
  eyes:"auto",
  build:"auto",
  beard:"auto",
  clothing:"",

  locked:false

};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function status(text){

  var el=$("status");

  if(el){
    el.textContent=text;
  }

  console.log(text);
}


function setProgress(value){

  var p=$("progress");

  if(!p)return;

  value=Math.max(
    0,
    Math.min(100,value)
  );

  p.style.width=value+"%";
}


function normalize(text){

  return String(text||"")
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();
}


/* =========================================================
   SENTENCES
========================================================= */

function splitSentences(text){

  text=normalize(text);

  if(!text){
    return [];
  }

  var matches=text.match(
    /[^.!?…]+(?:[.!?…]+|$)/g
  );

  if(!matches){
    return [text];
  }

  var result=[];

  for(
    var i=0;
    i<matches.length;
    i++
  ){

    var s=matches[i].trim();

    if(s){
      result.push(s);
    }

  }

  return result;
}


function sentenceLength(sentence){

  return normalize(sentence)
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


/*
  Kısa:
  <= 11 kelime

  Normal:
  12-25

  Uzun:
  >25
*/

function groupSentences(sentences){

  var groups=[];

  var i=0;

  while(i<sentences.length){

    var current=sentences[i];

    var len=sentenceLength(current);

    if(len<=11){

      var group=[current];

      if(
        i+1<sentences.length &&
        sentenceLength(sentences[i+1])<=11
      ){
        group.push(sentences[i+1]);

        if(
          i+2<sentences.length &&
          sentenceLength(sentences[i+2])<=11
        ){
          group.push(sentences[i+2]);
        }
      }

      groups.push(
        group.join(" ")
      );

      i+=group.length;

    }else if(len<=25){

      if(
        i+1<sentences.length &&
        sentenceLength(sentences[i+1])<=25
      ){

        groups.push(
          current+" "+sentences[i+1]
        );

        i+=2;

      }else{

        groups.push(current);
        i++;

      }

    }else{

      groups.push(current);
      i++;

    }

  }

  /*
    Son kısa tek başına kaldıysa
    önceki sahneye ekle.
  */

  if(groups.length>=2){

    var last=groups[groups.length-1];

    if(
      sentenceLength(last)<=8 &&
      sentenceLength(groups[groups.length-2])<=30
    ){

      groups[
        groups.length-2
      ]+=" "+last;

      groups.pop();

    }

  }

  return groups;
}


/* =========================================================
   CHARACTER DETECTION
========================================================= */

function detectGenderStrong(text){

  var t=normalize(text).toLowerCase();

  var sentences=splitSentences(t);

  var first=sentences
    .slice(0,4)
    .join(" ");

  var firstSentence=
    sentences.length
      ? sentences[0]
      : first;

  var femaleScore=0;
  var maleScore=0;


  if(
    /alleinerziehende mutter|
      mutter|
      frau|
      tochter|
      schriftstellerin|
      unternehmerin|
      gründerin|
      gruenderin|
      schauspielerin|
      köchin|
      koechin|
      studentin|
      ärztin|
      aerztin|
      sportlerin|
      erfinderin|
      sängerin|
      saengerin|
      ehefrau|
      freundin|
      verkäuferin|
      verkaeuferin/x.test(first)
  ){

    femaleScore+=20;

  }


  if(
    /alleinerziehender vater|
      vater|
      mann|
      sohn|
      bruder|
      schriftsteller|
      unternehmer|
      gründer|
      gruender|
      schauspieler|
      koch|
      student|
      arzt|
      sportler|
      erfinder|
      sänger|
      saenger|
      ehemann|
      freund|
      verkäufer|
      verkaeufer/x.test(first)
  ){

    maleScore+=20;

  }


  if(
    /^\s*sie\b/.test(firstSentence)
  ){
    femaleScore+=12;
  }


  if(
    /^\s*er\b/.test(firstSentence)
  ){
    maleScore+=12;
  }


  if(/frau/.test(first)){
    femaleScore+=10;
  }


  if(/mann/.test(first)){
    maleScore+=10;
  }


  if(
    femaleScore>maleScore &&
    femaleScore>=8
  ){

    return "female";

  }


  if(
    maleScore>femaleScore &&
    maleScore>=8
  ){

    return "male";

  }


  return "auto";
}


/*
  Regex compatibility helper.
*/

function detectGender(text){

  var t=normalize(text).toLowerCase();

  if(
    /alleinerziehende mutter|mutter|frau|tochter|schriftstellerin|unternehmerin|gründerin|gruenderin|schauspielerin|köchin|koechin|studentin|ärztin|aerztin|sportlerin|erfinderin|sängerin|saengerin|ehefrau|freundin|verkäuferin|verkaeuferin/.test(t)
  ){
    return "female";
  }

  if(
    /alleinerziehender vater|vater|mann|sohn|bruder|schriftsteller|unternehmer|gründer|gruender|schauspieler|koch|student|arzt|sportler|erfinder|sänger|saenger|ehemann|freund|verkäufer|verkaeufer/.test(t)
  ){
    return "male";
  }

  return detectGenderStrong(t);
}


function detectAge(text){

  var t=normalize(text).toLowerCase();

  if(
    /kind|junge|mädchen|jugendlich|teenager/.test(t)
  ){
    return "young";
  }

  if(
    /älter|alt|rentner|rentnerin|senior/.test(t)
  ){
    return "elderly";
  }

  if(
    /mittelalt/.test(t)
  ){
    return "middle";
  }

  return "adult";
}


function detectBuild(text){

  var t=normalize(text).toLowerCase();

  if(
    /athlet|sportler|bodybuilder|trainiert/.test(t)
  ){
    return "athletic";
  }

  if(
    /schlank|dünn/.test(t)
  ){
    return "slim";
  }

  if(
    /breit|kräftig/.test(t)
  ){
    return "broad";
  }

  return "average";
}


function detectCharacterFromStory(force){

  if(
    characterProfile.locked &&
    !force
  ){
    return;
  }

  var text=$("story").value;

  if(!text)return;


  var gender=detectGender(text);

  if(gender!=="auto"){
    characterProfile.gender=gender;
  }


  characterProfile.age=
    detectAge(text);

  characterProfile.build=
    detectBuild(text);


  $("charGender").value=
    characterProfile.gender;

  $("charAge").value=
    characterProfile.age;

  $("charBuild").value=
    characterProfile.build;


  status(
    "👤 Karakter algılandı: "+
    characterProfile.gender+
    " / "+
    characterProfile.age+
    " / "+
    characterProfile.build
  );

}


/* =========================================================
   CHARACTER PROMPT
========================================================= */

function genderPrompt(){

  if(
    characterProfile.gender==="female"
  ){

    return(
      "MAIN CHARACTER IDENTITY: ADULT WOMAN. "+
      "FEMALE CHARACTER. WOMAN, NOT MAN. "+
      "Clearly feminine facial features and natural feminine body proportions."
    );

  }


  if(
    characterProfile.gender==="male"
  ){

    return(
      "MAIN CHARACTER IDENTITY: ADULT MAN. "+
      "MALE CHARACTER. MAN, NOT WOMAN. "+
      "Clearly masculine facial features and natural masculine body proportions."
    );

  }


  return(
    "MAIN CHARACTER IDENTITY: HUMAN CHARACTER. "+
    "Gender is not explicitly specified."
  );

}


function characterPrompt(){

  var p=[];

  p.push(
    genderPrompt()
  );


  if(
    characterProfile.age!=="auto"
  ){

    p.push(
      "AGE: "+
      characterProfile.age+
      "."
    );

  }


  if(
    characterProfile.hair!=="auto"
  ){

    p.push(
      "HAIR COLOR: "+
      characterProfile.hair+
      "."
    );

  }


  if(
    characterProfile.hairLength!=="auto"
  ){

    p.push(
      "HAIR LENGTH: "+
      characterProfile.hairLength+
      "."
    );

  }


  if(
    characterProfile.eyes!=="auto"
  ){

    p.push(
      "EYE COLOR: "+
      characterProfile.eyes+
      "."
    );

  }


  if(
    characterProfile.build!=="auto"
  ){

    p.push(
      "BODY BUILD: "+
      characterProfile.build+
      "."
    );

  }


  if(
    characterProfile.beard!=="auto"
  ){

    p.push(
      "FACIAL HAIR: "+
      characterProfile.beard+
      "."
    );

  }


  if(
    characterProfile.clothing
  ){

    p.push(
      "CLOTHING: "+
      characterProfile.clothing+
      "."
    );

  }


  p.push(
    "Maintain consistent facial identity, "+
    "hair, age, body proportions and clothing "+
    "across scenes."
  );


  return p.join(" ");
}

/* =========================================================
   SCENE ANALYSIS
========================================================= */

function analyzeScene(text){

  var t=normalize(text).toLowerCase();

  var result={

    event:"the main character performs the action described by the scene",

    location:"an authentic realistic environment appropriate to the scene",

    secondary:"",

    relationship:"",

    environmentDetails:"realistic architecture, furniture and natural materials",

    props:"period-appropriate everyday objects",

    background:"subtle realistic background activity",

    spatial:"natural spatial relationship between people and objects",

    emotion:"focused and emotionally believable",

    period:"period-appropriate visual details",

    lighting:"natural cinematic documentary lighting"

  };


  if(
    /wohnung|apartment|zimmer|haus/.test(t)
  ){

    result.location=
      "a modest realistic home interior";

    result.environmentDetails=
      "small lived-in apartment, realistic furniture, walls, windows and household materials";

  }


  if(
    /küche|restaurant|koch|kocht/.test(t)
  ){

    result.location=
      "a realistic restaurant kitchen";

      "professional kitchen equipment, stainless steel surfaces, worktables and natural restaurant activity";

    result.props=

  if(
    /garage|werkstatt/.test(t)

      "a modest working garage or workshop";

    result.environmentDetails=
      "workbench, tools, shelves, concrete floor and realistic workshop materials";

    result.props=
      "tools, workbench, equipment, boxes and practical workshop objects";

  }


  if(
    /büro|office|firma|unternehmen/.test(t)
  ){

    result.location=
      "a small early-stage business office";

    result.environmentDetails=
      "modest office, desk, chair, shelves, papers without readable writing and early business equipment";

    result.props=
      "desk, computer, folders, telephone and business equipment without readable text";

  if(
    /café|cafe/.test(t)
  ){

    result.location=
      "a realistic European café";

    result.environmentDetails=
      "wooden tables, coffee equipment, windows and softly active customers";

    result.props=
      "coffee cup, notebook without readable writing and personal belongings";

  }


  if(
    /labor|laboratorium|laboratory|wissenschaft/.test(t)
  ){

      "a realistic research laboratory";

    result.environmentDetails=
      "laboratory benches, scientific equipment, glassware and realistic technical materials";

    result.props=
      "prototype, tools, instruments and laboratory equipment";

  }


  if(
    /schule|universität|universitaet/.test(t)
  ){

    result.location=
      "a realistic educational environment";

  }


  if(
    /straße|strasse|stadt|straße|street/.test(t)
  ){

    result.location=
      "a realistic urban street";

    result.environmentDetails=
      "authentic buildings, sidewalks, vehicles and natural urban activity";

  }


  if(
    /tochter/.test(t)
  ){

    result.secondary=
      "young daughter";

    result.relationship=
      "mother and daughter relationship";

    result.spatial=
      "the adult woman and young daughter are naturally positioned together";

  }


  if(
    /sohn/.test(t)
  ){

    result.secondary=
      "young son";

    result.relationship=
      "parent and son relationship";

  }


  if(
    /familie/.test(t)
  ){

    result.secondary=
      "family members";

    result.relationship=
      "natural family relationship";

  }


  if(
    /schreibt|schreiben|schrieb|geschichte/.test(t)
  ){

    result.event=
      "the main character writes creatively with focused determination";

    result.props=
      "notebook, pen and writing materials with no readable text";

    result.emotion=
      "focused, thoughtful and quietly determined";

  }


  if(
    /arbeitet|arbeitete|arbeit/.test(t)
  ){

    result.event=
      "the main character works with realistic concentration";

  }


  if(
    /gründet|gründete|gruendet|gruendete|firma/.test(t)
  ){

    result.event=
      "the main character works on the early stage of building a business";

  }


  if(
    /arm|wenig geld|kaum geld|finanziell/.test(t)
  ){

  if(

  ){

      "authentic period details, clothing, architecture and technology for the historical setting";

  }else{

    result.period=
      "authentic details appropriate to the story's implied period";

  }


  return result;

/* =========================================================
   CAMERA
========================================================= */

function chooseShot(index){

  var shots=[

    {
      camera:"medium cinematic documentary shot",
      lens:"50mm natural perspective"
    },

    {
      camera:"medium-wide environmental documentary shot",
      lens:"35mm cinematic lens"
    },

    {
      camera:"close documentary portrait",
      lens:"85mm portrait lens"
    },

    {
      camera:"wide environmental establishing shot",
      lens:"28mm documentary lens"
    },

    {
      camera:"over-the-shoulder documentary composition",
      lens:"50mm natural lens"
    }

  ];

  return shots[
    index%shots.length
  ];

}


/* =========================================================
   PROMPT
========================================================= */

function buildPrompt(text,mode,index){

  var a=analyzeScene(text);

  var shot=chooseShot(index||0);

  var prompt=

    "Photorealistic cinematic documentary photograph. "+

    characterPrompt()+". "+

    "MAIN VISUAL EVENT: "+
    a.event+". "+

    "LOCATION: "+
    a.location+". "+

    "SECONDARY PERSON: "+
    (a.secondary||"none unless naturally required")+
    ". "+

    "RELATIONSHIP: "+
    (a.relationship||"none")+
    ". "+

    "ENVIRONMENT: "+
    a.environmentDetails+". "+

    "PROPS: "+
    a.props+". "+

    "BACKGROUND: "+
    a.background+". "+

    "SPATIAL RELATIONSHIP: "+
    a.spatial+". "+

    "EMOTION: "+
    a.emotion+". "+

    "PERIOD: "+
    a.period+". "+

    "LIGHTING: "+
    a.lighting+". "+

    "CAMERA: "+
    shot.camera+". "+

    "LENS: "+
    shot.lens+". "+

    "VISUAL STYLE: photorealistic cinematic documentary photography, realistic skin texture, believable anatomy, authentic clothing, realistic materials, natural perspective, subtle depth of field, professional documentary photography, subtle film grain, realistic colors, cinematic composition, high environmental detail. "+

    "16:9 landscape composition. "+

    noTextBlock()+".";

  if(mode==="zimage"){

    prompt+=
      " Z-IMAGE FAST. Concise direct photographic description.";

  }

  if(mode==="flux"){

    prompt+=
      " FLUX FAST. Clear subject separation and concrete environmental storytelling.";

  }

  if(mode==="realistic"){

    prompt+=
      " Premium realistic photography, natural lens rendering and authentic documentary realism.";

  }

  return prompt;

}


/* =========================================================
   CREATE SCENES
========================================================= */

function createScenes(){

  var text=$("story").value;

  text=normalize(text);

  if(!text){

    status("⚠️ Önce Almanca hikâyeyi yapıştır.");

    return;

  }


  if(!characterProfile.locked){

    detectCharacterFromStory(true);

  }


  var sentences=
    splitSentences(text);

  if(!sentences.length){

    status("⚠️ Cümle bulunamadı.");

    return;

  }


  var groups=
    groupSentences(sentences);


  scenes=[];


  for(
    var i=0;
    i<groups.length;
    i++
  ){

    scenes.push({

      id:i+1,

      text:groups[i],

      prompt:
        buildPrompt(
          groups[i],
          "zimage",
          i
        ),

      image:null,

      imageURL:null,

      imageObject:null,

      imageWidth:0,

      imageHeight:0,

      audioBlob:null,

      audioURL:null,

      audioBuffer:null,

      duration:0,

      motion:
        [
          "static",
          "zoomIn",
          "zoomOut",
          "panLeft",
          "panRight",
          "panUp",
          "panDown",
          "kenBurns"
        ][i%8]

    });

  }


  renderScenes();

  renderGallery();

  setProgress(0);


  status(
    "✅ "+
    scenes.length+
    " sahne oluşturuldu. "+
    "Cümle sırası korunuyor."
  );

}

/* =========================================================
   IMAGE UPLOAD
========================================================= */

function uploadSceneImage(
  index,
  input
){

  if(
    !input.files ||
    !input.files[0]
  ){
    return;
  }


  var file=
    input.files[0];

  var scene=
    scenes[index];


  if(scene.imageURL){

    try{
      URL.revokeObjectURL(
        scene.imageURL
      );
    }catch(e){}

  }


  var url=
    URL.createObjectURL(file);

  var img=
    new Image();


  img.onload=function(){

    scene.image=file;

    scene.imageURL=url;

    scene.imageObject=img;

    scene.imageWidth=
      img.naturalWidth||
      img.width;

    scene.imageHeight=
      img.naturalHeight||
      img.height;


    renderScenes();

    renderGallery();


    status(
      "🟢 Sahne "+
      scene.id+
      " görseli hazır: "+
      scene.imageWidth+
      " × "+
      scene.imageHeight
    );

  };


  img.onerror=function(){

    try{
      URL.revokeObjectURL(url);
    }catch(e){}

    status(
      "❌ Görsel yüklenemedi."
    );

  };


  img.src=url;

}


/* =========================================================
   CLEAN IMAGE RENDERER
   V51.12
========================================================= */

function drawCleanImage(
  ctx,
  img,
  W,
  H,
  motionProgress,
  motion
){

  /*
    V51.12:

    - Blur yok
    - Enlarged background yok
    - Duplicate background yok
    - Crop yok
    - Görsel oranı korunur
    - Boş alan siyah kalır
  */


  ctx.save();


  /*
    Siyah temiz zemin.
  */

  ctx.fillStyle="#000";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  if(!img){

    ctx.restore();

    return;

  }


  var iw=
    img.naturalWidth||
    img.width;

  var ih=
    img.naturalHeight||
    img.height;


  if(!iw || !ih){

    ctx.restore();

    return;

  }


  /*
    CONTAIN:

    Görsel hiçbir zaman kırpılmaz.
  */

  var scale=
    Math.min(
      W/iw,
      H/ih
    );


  /*
    V51.12 güvenli hareket.

    Static:
    %100 tam görüntü.

    Diğer hareketlerde maksimum
    %1.2 büyüme.

    Böylece yüz/kafa dışarı taşmaz.
  */

  var progress=
    Math.max(
      0,
      Math.min(
        1,
        motionProgress||0
      )
    );


  var zoom=1;


  if(
    motion==="zoomIn"
  ){

    zoom=
      1+
      progress*.012;

  }


  if(
    motion==="zoomOut"
  ){

    zoom=
      1.012-
      progress*.012;

  }


  if(
    motion==="kenBurns"
  ){

    zoom=
      1+
      progress*.012;

  }


  /*
    Güvenlik limiti.
  */

  zoom=
    Math.max(
      1,
      Math.min(
        1.012,
        zoom
      )
    );


  var dw=
    iw*scale*zoom;

  var dh=
    ih*scale*zoom;


  /*
    Merkez.
  */

  var dx=
    (W-dw)/2;

  var dy=
    (H-dh)/2;


  /*
    Çok küçük pan.
    Crop minimum tutulur.
  */

  var pan=4;


  if(
    motion==="panLeft"
  ){

    dx-=
      progress*pan;

  }


  if(
    motion==="panRight"
  ){

    dx+=
      progress*pan;

  }


  if(
    motion==="panUp"
  ){

    dy-=
      progress*pan;

  }


  if(
    motion==="panDown"
  ){

    dy+=
      progress*pan;

  }


  /*
    Görüntünün tamamının mümkün olduğunca
    görünür kalmasını sağla.

    Static'te kesinlikle contain.
  */

  if(
    motion==="static"
  ){

    dw=
      iw*scale;

    dh=
      ih*scale;

    dx=
      (W-dw)/2;

    dy=
      (H-dh)/2;

  }


  ctx.imageSmoothingEnabled=true;

  ctx.imageSmoothingQuality="high";


  ctx.drawImage(
    img,
    dx,
    dy,
    dw,
    dh
  );


  ctx.restore();

}


/* =========================================================
   SCENE PREVIEW
========================================================= */

function drawScenePreview(index){

  var scene=
    scenes[index];

  if(!scene)return;


  var canvas=
    $("sceneCanvas_"+index);

  if(!canvas)return;


  var ctx=
    canvas.getContext("2d");


  drawCleanImage(
    ctx,
    scene.imageObject,
    canvas.width,
    canvas.height,
    0.5,
    scene.motion
  );


  if(
    $("subtitles").value==="on"
  ){

    drawSubtitle(
      ctx,
      scene.text,
      canvas.width,
      canvas.height
    );

  }


  drawLogo(
    ctx,
    canvas.width,
    canvas.height
  );

}

/* =========================================================
   LOGO
========================================================= */

function createLogoImage(){

  var canvas=
    document.createElement("canvas");

  canvas.width=500;

  canvas.height=180;


  var ctx=
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    GeldStory yazısı ayrı overlay.
    Görsel üretim promptlarına dahil değildir.
  */

  ctx.fillStyle=
    "rgba(255,255,255,.96)";

  ctx.font=
    "bold 64px Arial";

  ctx.textAlign="right";

  ctx.textBaseline="middle";

  ctx.fillText(
    "GeldStory",
    475,
    90
  );


  var img=
    new Image();

  img.src=
    canvas.toDataURL(
      "image/png"
    );

  return img;

}


logoImage=
  createLogoImage();


function drawLogo(
  ctx,
  W,
  H
){

  if(
    !logoImage ||
    !logoImage.complete
  ){
    return;
  }


  var logoW=
    Math.max(
      100,
      W*.14
    );

  var logoH=
    logoW*.36;


  var margin=
    W*.025;


  ctx.save();

  ctx.globalAlpha=.88;


  ctx.drawImage(
    logoImage,
    W-logoW-margin,
    margin,
    logoW,
    logoH
  );


  ctx.restore();

}


/* =========================================================
   SUBTITLE
========================================================= */

function drawSubtitle(
  ctx,
  text,
  W,
  H
){

  ctx.save();


  var maxWidth=
    W*.82;

  var fontSize=
    Math.round(
      W*.026
    );


  ctx.font=
    "bold "+
    fontSize+
    "px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";


  var words=
    normalize(text)
      .split(/\s+/);


  var lines=[];

  var current="";


  words.forEach(function(word){

    var test=
      current
        ? current+" "+word
        : word;


    if(
      ctx.measureText(test).width>
      maxWidth &&
      current
    ){

      lines.push(current);

      current=word;

    }else{

      current=test;

    }

  });


  if(current){
    lines.push(current);
  }


  var lineHeight=
    fontSize*1.25;

  var total=
    lines.length*
    lineHeight;


  var y=
    H-total-40;


  /*
    Siyah arka plan.
  */

  ctx.fillStyle=
    "rgba(0,0,0,.72)";


  ctx.fillRect(
    W*.08,
    y-15,
    W*.84,
    total+30
  );


  ctx.fillStyle="#fff";


  lines.forEach(function(line,i){

    ctx.fillText(
      line,
      W/2,
      y+
      i*lineHeight+
      lineHeight/2
    );

  });


  ctx.restore();

}

/* =========================================================
   WAV PARSER
========================================================= */

function readUint16(
  view,
  offset
){

  return view.getUint16(
    offset,
    true
  );

}


function readUint32(
  view,
  offset
){

  return view.getUint32(
    offset,
    true
  );

}


function parseWav(arrayBuffer){

  var view=
    new DataView(
      arrayBuffer
    );


  if(
    view.getUint32(0,false)!==
    0x52494646
  ){

    throw new Error(
      "WAV RIFF header bulunamadı."
    );

  }


  if(
    view.getUint32(8,false)!==
    0x57415645
  ){

    throw new Error(
      "WAV formatı geçersiz."
    );

  }


  var offset=12;

  var audioFormat=1;

  var channels=1;

  var sampleRate=22050;

  var bits=16;

  var dataOffset=-1;

  var dataSize=0;


  while(
    offset+8<=view.byteLength
  ){

    var id=
      view.getUint32(
        offset,
        false
      );

    var size=
      readUint32(
        view,
        offset+4
      );


    if(
      id===0x666d7420
    ){

      audioFormat=
        readUint16(
          view,
          offset+8
        );

      channels=
        readUint16(
          view,
          offset+10
        );

      sampleRate=
        readUint32(
          view,
          offset+12
        );

      bits=
        readUint16(
          view,
          offset+22
        );

    }


    if(
      id===0x64617461
    ){

      dataOffset=
        offset+8;

      dataSize=
        size;

      break;

    }


    offset+=
      8+
      size;

  }


  if(dataOffset<0){

    throw new Error(
      "WAV data chunk bulunamadı."
    );

  }


  return {

    audioFormat,
    channels,
    sampleRate,
    bits,
    dataOffset,
    dataSize

  };

}


/* =========================================================
   WAV → PCM FLOAT
========================================================= */

function wavToFloat32(
  arrayBuffer
){

  var info=
    parseWav(
      arrayBuffer
    );


  var view=
    new DataView(
      arrayBuffer,
      info.dataOffset,
      info.dataSize
    );


  var bytesPerSample=
    info.bits/8;

  var frameSize=
    bytesPerSample*
    info.channels;


  var frames=
    Math.floor(
      info.dataSize/
      frameSize
    );


  var output=
    new Float32Array(
      frames
    );


  for(
    var i=0;
    i<frames;
    i++
  ){

    var sum=0;


    for(
      var ch=0;
      ch<info.channels;
      ch++
    ){

      var pos=
        i*frameSize+
        ch*bytesPerSample;


      var value=0;


      if(info.bits===16){

        value=
          view.getInt16(
            pos,
            true
          )/32768;

      }else if(info.bits===8){

        value=
          (
            view.getUint8(pos)-
            128
          )/128;

      }else if(info.bits===24){

        var b0=
          view.getUint8(pos);

        var b1=
          view.getUint8(pos+1);

        var b2=
          view.getUint8(pos+2);


        var n=
          b0|
          (b1<<8)|
          (b2<<16);


        if(n&0x800000){
          n|=0xff000000;
        }


        value=
          n/8388608;

      }else if(info.bits===32){

        value=
          view.getInt32(
            pos,
            true
          )/2147483648;

      }


      sum+=value;

    }


    output[i]=
      sum/
      info.channels;

  }


  return {

    pcm:output,

    sampleRate:
      info.sampleRate

  };

}


/* =========================================================
   FLOAT → WAV
========================================================= */

function float32ToWav(
  pcm,
  sampleRate
){

  var buffer=
    new ArrayBuffer(
      44+
      pcm.length*2
    );


  var view=
    new DataView(buffer);


  function writeString(
    offset,
    text
  ){

    for(
      var i=0;
      i<text.length;
      i++
    ){

      view.setUint8(
        offset+i,
        text.charCodeAt(i)
      );

    }

  }


  writeString(
    0,
    "RIFF"
  );


  view.setUint32(
    4,
    36+
    pcm.length*2,
    true
  );


  writeString(
    8,
    "WAVE"
  );


  writeString(
    12,
    "fmt "
  );


  view.setUint32(
    16,
    16,
    true
  );


  view.setUint16(
    20,
    1,
    true
  );


  view.setUint16(
    22,
    1,
    true
  );


  view.setUint32(
    24,
    sampleRate,
    true
  );


  view.setUint32(
    28,
    sampleRate*2,
    true
  );


  view.setUint16(
    32,
    2,
    true
  );


  view.setUint16(
    34,
    16,
    true
  );


  writeString(
    36,
    "data"
  );


  view.setUint32(
    40,
    pcm.length*2,
    true
  );


  var offset=44;


  for(
    var i=0;
    i<pcm.length;
    i++
  ){

    var s=
      Math.max(
        -1,
        Math.min(
          1,
          pcm[i]
        )
      );


    view.setInt16(
      offset,
      s<0
        ? s*32768
        : s*32767,
      true
    );


    offset+=2;

  }


  return new Blob(
    [buffer],
    {
      type:"audio/wav"
    }
  );

}


/* =========================================================
   TEXT CHUNKS
========================================================= */

function splitTextForTTS(
  text,
  maxChars
){

  maxChars=
    maxChars||
    115;


  var sentences=
    splitSentences(text);


  var chunks=[];

  var current="";


  sentences.forEach(
    function(sentence){

      sentence=
        normalize(sentence);


      if(!sentence){
        return;
      }


      if(
        (current+" "+sentence)
          .trim()
          .length<=maxChars
      ){

        current=
          (
            current
              ? current+" "
              : ""
          )+
          sentence;

        return;

      }


      if(current){

        chunks.push(
          current
        );

        current="";

      }


      /*
        Tek cümle bile uzunsa kelimelere böl.
      */

      if(
        sentence.length>
        maxChars
      ){

        var words=
          sentence.split(/\s+/);

        var part="";


        words.forEach(
          function(word){

            if(
              (part+" "+word)
                .trim()
                .length<=maxChars
            ){

              part=
                (
                  part
                    ? part+" "
                    : ""
                )+
                word;

            }else{

              if(part){
                chunks.push(part);
              }

              part=word;

            }

          }
        );


        if(part){
          chunks.push(part);
        }

      }else{

        current=sentence;

      }

    }
  );


  if(current){
    chunks.push(current);
  }


  return chunks;

}


/* =========================================================
   AUDIO DURATION
========================================================= */

async function getAudioDuration(
  blob
){

  var arrayBuffer=
    await blob.arrayBuffer();


  var audioData=
    wavToFloat32(
      arrayBuffer
    );


  return(
    audioData.pcm.length/
    audioData.sampleRate
  );

}


/* =========================================================
   GENERATE SCENE VOICE
========================================================= */

async function generateSceneVoice(
  index
){

  var scene=
    scenes[index];


  if(!scene){

    return false;

  }


  try{

    status(
      "🔊 Sahne "+
      scene.id+
      "/"+
      scenes.length+
      " ses oluşturuluyor..."
    );


    var mod=
      await loadTTS();


    var TtsSession=
      mod.TtsSession||
      (
        mod.default&&
        mod.default.TtsSession
      );


    if(!TtsSession){

      throw new Error(
        "TtsSession bulunamadı."
      );

    }


    var voiceId=
      $("voice").value||
      "de_DE-thorsten-medium";


    var chunks=
      splitTextForTTS(
        scene.text.trim(),
        115
      );


    if(!chunks.length){

      throw new Error(
        "Ses metni boş."
      );

    }


    var pcmParts=[];

    var sampleRate=22050;

    var totalFrames=0;


    for(
      var c=0;
      c<chunks.length;
      c++
    ){

      status(
        "🔊 Sahne "+
        scene.id+
        " — parça "+
        (c+1)+
        "/"+
        chunks.length
      );


      var session=
        new TtsSession({

          voiceId:
            voiceId,

          allowLocalModels:
            true,

          fallbackStrategy:
            "auto"

        });


      var result=
        await session.predict(
          chunks[c]
        );


      var blob=null;


      if(
        result instanceof Blob
      ){

        blob=result;

      }else if(
        result &&
        result.audio
      ){

        blob=result.audio;

      }else if(
        result &&
        result.blob
      ){

        blob=result.blob;

      }else{

        throw new Error(
          "Piper WAV verisi alınamadı."
        );

      }


      var buffer=
        await blob.arrayBuffer();


      var parsed=
        wavToFloat32(
          buffer
        );


      sampleRate=
        parsed.sampleRate;


      pcmParts.push(
        parsed.pcm
      );


      totalFrames+=
        parsed.pcm.length;


      /*
        Tarayıcının nefes alması.
      */

      await new Promise(
        function(resolve){
          setTimeout(
            resolve,
            20
          );
        }
      );

    }


    var merged=
      new Float32Array(
        totalFrames
      );


    var write=0;


    pcmParts.forEach(
      function(part){

        merged.set(
          part,
          write
        );

        write+=
          part.length;

      }
    );


    var finalBlob=
      float32ToWav(
        merged,
        sampleRate
      );


    var duration=
      merged.length/
      sampleRate;


    if(scene.audioURL){

      try{
        URL.revokeObjectURL(
          scene.audioURL
        );
      }catch(e){}

    }


    scene.audioBlob=
      finalBlob;

    scene.audioURL=
      URL.createObjectURL(
        finalBlob
      );

    scene.duration=
      duration;

    scene.audioBuffer=
      null;


    renderScenes();


    status(
      "✅ Sahne "+
      scene.id+
      " WAV hazır — "+
      duration.toFixed(2)+
      " saniye"
    );


    return true;

  }catch(error){

    console.error(
      "TTS ERROR",
      error
    );


    status(
      "❌ Sahne "+
      scene.id+
      " seslendirme hatası: "+
      error.message
    );


    return false;

  }

}


/* =========================================================
   ENSURE AUDIO
========================================================= */

async function ensureAllSceneAudio(){

  if(!scenes.length){

    throw new Error(
      "Önce sahneleri oluştur."
    );

  }


  for(
    var i=0;
    i<scenes.length;
    i++
  ){

    var scene=
      scenes[i];


    if(
      !scene.audioBlob||
      !scene.audioURL||
      !scene.duration||
      scene.duration<=0
    ){

      status(
        "🔊 Otomatik seslendirme: Sahne "+
        scene.id+
        "/"+
        scenes.length
      );


      var ok=
        await generateSceneVoice(
          i
        );


      if(!ok){

        throw new Error(
          "Sahne "+
          scene.id+
          " için WAV oluşturulamadı."
        );

      }

    }


    setProgress(
      (i+1)/
      scenes.length*
      30
    );

  }

}


/* =========================================================
   PRELOAD AUDIO
========================================================= */

async function preloadAudioBuffers(){

  var audioContext=
    new (
      window.AudioContext||
      window.webkitAudioContext
    )();


  if(
    audioContext.state==="suspended"
  ){

    try{
      await audioContext.resume();
    }catch(e){}

  }


  for(
    var i=0;
    i<scenes.length;
    i++
  ){

    var scene=
      scenes[i];


    var arrayBuffer=
      await scene.audioBlob
        .arrayBuffer();


    scene.audioBuffer=
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );


    /*
      Gerçek decode edilmiş WAV süresi.
    */

    scene.duration=
      scene.audioBuffer.duration;


    setProgress(
      30+
      (i+1)/
      scenes.length*
      15
    );

  }


  return audioContext;

}


/* =========================================================
   MEDIA RECORDER MIME
========================================================= */

function getSupportedMime(){

  var types=[

    "video/webm;codecs=vp8,opus",

    "video/webm;codecs=vp9,opus",

    "video/webm"

  ];


  for(
    var i=0;
    i<types.length;
    i++
  ){

    if(
      MediaRecorder.isTypeSupported(
        types[i]
      )
    ){

      return types[i];

    }

  }


  return "";

}


/* =========================================================
   VIDEO DIMENSIONS
========================================================= */

function getDimensions(){

  var format=
    $("format").value;


  if(format==="9:16"){

    return {
      width:720,
      height:1280
    };

  }


  if(format==="1:1"){

    return {
      width:1080,
      height:1080
    };

  }


  return {
    width:1280,
    height:720
  };

}

/* =========================================================
   RENDER VIDEO
========================================================= */

async function renderVideo(){

  if(!scenes.length){

    status(
      "⚠️ Önce SAHNELERİ OLUŞTUR."
    );

    return;

  }


  try{

    $("renderBtn").disabled=true;


    status(
      "🎬 Render hazırlanıyor..."
    );


    setProgress(0);


    /*
      Eksik WAV varsa otomatik oluştur.
    */

    await ensureAllSceneAudio();


    /*
      Görsel kontrol.
    */

    for(
      var i=0;
      i<scenes.length;
      i++
    ){

      if(
        !scenes[i].imageObject
      ){

        throw new Error(
          "Sahne "+
          scenes[i].id+
          " için görsel yok."
        );

      }

    }


    var audioContext=
      await preloadAudioBuffers();


    var dimensions=
      getDimensions();


    var W=
      dimensions.width;

    var H=
      dimensions.height;


    var canvas=
      document.createElement(
        "canvas"
      );


    canvas.width=W;

    canvas.height=H;


    var ctx=
      canvas.getContext(
        "2d"
      );


    ctx.imageSmoothingEnabled=true;

    ctx.imageSmoothingQuality=
      "high";


    /*
      Canvas stream.
    */

    var fps=
      parseInt(
        $("fps").value,
        10
      )||30;


    var videoStream=
      canvas.captureStream(
        fps
      );


    /*
      Audio destination.
    */

    var destination=
      audioContext.createMediaStreamDestination();


    var combined=
      new MediaStream();


    videoStream
      .getVideoTracks()
      .forEach(
        function(track){

          combined.addTrack(track);

        }
      );


    destination
      .stream
      .getAudioTracks()
      .forEach(
        function(track){

          combined.addTrack(track);

        }
      );


    var mime=
      getSupportedMime();


    if(!mime){

      throw new Error(
        "Bu Chrome sürümünde WebM MediaRecorder desteklenmiyor."
      );

    }


    var recorder=
      new MediaRecorder(
        combined,
        {
          mimeType:mime,
          videoBitsPerSecond:5000000
        }
      );


    var chunks=[];


    recorder.ondataavailable=
      function(event){

        if(
          event.data &&
          event.data.size>0
        ){

          chunks.push(
            event.data
          );

        }

      };


    var stoppedPromise=
      new Promise(
        function(resolve){

          recorder.onstop=
            function(){

              resolve();

            };

        }
      );


    recorder.start(
      250
    );


    status(
      "🎥 Video render başladı..."
    );


    /*
      Audio context aktif.
    */

    if(
      audioContext.state==="suspended"
    ){

      await audioContext.resume();

    }


    /*
      Her sahne:
      AudioBufferSourceNode
      + gerçek WAV duration
    */

    var totalDuration=
      scenes.reduce(
        function(sum,scene){

          return sum+
            scene.duration;

        },
        0
      );


    var completedDuration=0;


    for(
      var s=0;
      s<scenes.length;
      s++
    ){

      var scene=
        scenes[s];


      status(
        "🎬 Render: Sahne "+
        scene.id+
        "/"+
        scenes.length+
        " • "+
        scene.duration.toFixed(2)+
        " saniye"
      );


      /*
        Source oluştur.
      */

      var source=
        audioContext.createBufferSource();


      source.buffer=
        scene.audioBuffer;


      source.connect(
        destination
      );


      /*
        Audio başlat.
      */

      source.start(0);


      var startTime=
        performance.now();


      var exactDuration=
        scene.duration*1000;


      /*
        Render loop.
      */

      while(true){

        var elapsed=
          performance.now()-
          startTime;


        var localProgress=
          Math.max(
            0,
            Math.min(
              1,
              elapsed/
              exactDuration
            )
          );


        drawFrame(
          ctx,
          scene,
          W,
          H,
          localProgress
        );


        var globalProgress=
          (
            completedDuration+
            scene.duration*
            localProgress
          )/
          totalDuration;


        setProgress(
          45+
          globalProgress*50
        );


        if(
          elapsed>=
          exactDuration
        ){

          break;

        }


        /*
          Chrome 109 için rAF yerine
          kısa timeout daha stabil.
        */

        await new Promise(
          function(resolve){

            setTimeout(
              resolve,
              15
            );

          }
        );

      }


      /*
        Sesin doğal olarak bitmesini bekle.
      */

      await new Promise(
        function(resolve){

          var safety=
            setTimeout(
              resolve,
              150
            );


          source.onended=
            function(){

              clearTimeout(
                safety
              );

              resolve();

            };

        }
      );


      completedDuration+=
        scene.duration;


      /*
        Son kare.
      */

      drawFrame(
        ctx,
        scene,
        W,
        H,
        1
      );


      await new Promise(
        function(resolve){

          setTimeout(
            resolve,
            30
          );

        }
      );

    }


    status(
      "⏳ Video dosyası kapatılıyor..."
    );


    /*
      Recorder'ın son veriyi
      alması için küçük güvenlik beklemesi.
    */

    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          200
        );

      }
    );


    recorder.stop();


    await stoppedPromise;


    videoStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );


    destination
      .stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );


    audioContext.close();


    var blob=
      new Blob(
        chunks,
        {
          type:mime
        }
      );


    if(
      !blob.size
    ){

      throw new Error(
        "Video dosyası boş oluştu."
      );

    }


    var url=
      URL.createObjectURL(
        blob
      );


    var a=
      document.createElement("a");

    a.href=url;

    a.download=
      "GeldStory_V51_12.webm";

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      function(){

        URL.revokeObjectURL(
          url
        );

      },
      30000
    );


    setProgress(100);


    status(
      "✅ VİDEO HAZIR! "+
      "WebM dosyası oluşturuldu."
    );


  }catch(error){

    console.error(
      "RENDER ERROR",
      error
    );


    status(
      "❌ Render başarısız: "+
      error.message
    );


  }finally{

    $("renderBtn").disabled=false;

  }

}

    "transform:translate(-50%,-50%);"+
    "width:min(90vw,1280px);"+
    "height:auto;"+
    "background:#000;"+

  document.body.appendChild(

  );

      );

      720,
      progress
    );


    if(progress<1){

      requestAnimationFrame(
        loop
      );

    }else{

      setTimeout(
        function(){

          canvas.remove();

        },
        500
      );

    }

  }


  loop();

}


/* =========================================================
   TEST
========================================================= */

async function runTest(){

  status(
    "🧪 Sistem testi başladı..."
  );


  if(!scenes.length){

    createScenes();

  }


  if(!scenes.length){

    return;

  }


  var scene=
    scenes[0];


  if(!scene.imageObject){

    status(
      "🧪 Sahne 1 için test görseli yok."
    );

    return;

  }


  status(
    "🧪 Görsel sistemi çalışıyor. "+
    "V51.12 temiz görüntü modu aktif."
  );


  drawScenePreview(0);


  if(!scene.audioBlob){

    status(
      "🧪 Görsel hazır. Ses testi başlatılıyor..."
    );

    await generateSceneVoice(0);

  }


  if(scene.audioBlob){

    status(
      "✅ TEST BAŞARILI — "+
      scene.duration.toFixed(2)+
      " saniyelik WAV hazır."
    );

  }

}


/* =========================================================
   ALL VOICES
========================================================= */

async function generateAllVoices(){

  if(!scenes.length){

    status(
      "⚠️ Önce sahneleri oluştur."
    );

    return;

  }


  try{

    for(
      var i=0;
      i<scenes.length;
      i++
    ){

      var ok=
        await generateSceneVoice(
          i
        );


      if(!ok){

        throw new Error(
          "Sahne "+
          (i+1)+
          " seslendirmesi başarısız."
        );

      }


      setProgress(
        (i+1)/
        scenes.length*
        100
      );

    }


    status(
      "✅ TÜM SAHNELERİN SESLERİ HAZIR."
    );


  }catch(error){

    status(
      "❌ Toplu ses hatası: "+
      error.message
    );

  }

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
  blob,
  filename
){

  var url=
    URL.createObjectURL(
      blob
    );


  var a=
    document.createElement("a");


  a.href=url;

  a.download=filename;


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    function(){

      URL.revokeObjectURL(
        url
      );

    },
    5000
  );

}
