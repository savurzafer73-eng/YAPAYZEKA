<script>

let project={
 topic:"",
 script:"",
 scenes:[],
 duration:60,
 style:"cinematic"
};

let uploadedImages={};


/* =========================
   SESLER
========================= */

function loadVoices(){

 const voices=speechSynthesis.getVoices();

 const select=document.getElementById("voiceSelect");

 select.innerHTML="";

 let tr=voices.filter(v=>
   v.lang &&
   v.lang.toLowerCase().startsWith("tr")
 );

 if(!tr.length){
   tr=voices;
 }

 tr.forEach((voice,i)=>{

   const opt=document.createElement("option");

   opt.value=i;
   opt.textContent=voice.name+" ("+voice.lang+")";

   select.appendChild(opt);

 });

}

speechSynthesis.onvoiceschanged=loadVoices;

loadVoices();


/* =========================
   STATUS
========================= */

function status(text){

 document.getElementById("status").innerHTML=text;

}

function progress(value){

 document.getElementById("progressBar").style.width=value+"%";

}


/* =========================
   PROJE OLUŞTUR
========================= */

function createProject(){

 const topic=document.getElementById("topic").value.trim();

 if(!topic){

   alert("Önce bir konu yaz.");

   return;

 }

 project.topic=topic;

 project.duration=parseInt(
   document.getElementById("duration").value
 );

 project.style=document.getElementById("style").value;

 project.script=makeScript(topic);

 project.scenes=makeScenes(
   project.script,
   project.duration
 );

 document.getElementById("scriptBox").value=project.script;

 document.getElementById("projectCard").style.display="block";

 document.getElementById("scenesCard").style.display="block";

 document.getElementById("videoCard").style.display="block";

 document.getElementById("sceneCount").textContent=
   project.scenes.length;

 document.getElementById("wordCount").textContent=
   project.script.split(/\s+/).length;

 document.getElementById("durationInfo").textContent=
   project.duration;

 renderScenes();

 progress(25);

 status(
   "✅ Proje oluşturuldu.<br>"+
   "Şimdi <b>TÜM SAHNELERİ ÜRET</b> butonuna bas."
 );

}


/* =========================
   SENARYO
========================= */

function makeScript(topic){

 const base=
`Her şey küçük bir adımla başladı.

${topic}

O gün elinde büyük bir para, güçlü bir çevre ya da hazır bir başarı yoktu.

Sadece bir karar verdi:
Vazgeçmeyecekti.

İlk günler kolay değildi.
Hatalar yaptı.
Para kaybetti.
İnsanlar onun başarılı olacağına inanmadı.

Ama her başarısızlık ona yeni bir şey öğretti.

Gece herkes uyurken o çalışmaya devam etti.

Küçük kazançlarını tekrar işine yatırdı.

Aylar geçti.

Sonra yıllar...

Bir gün geriye dönüp baktığında, başladığı noktadan ne kadar uzaklaştığını fark etti.

Başarısının sırrı şans değildi.

Her gün biraz daha ileri gitmesiydi.

Çünkü bazen büyük başarı,
büyük bir başlangıçtan değil,
küçük ama kararlı adımlardan doğar.

Sen de bugün başlayabilirsin.`;

 return base;

}


/* =========================
   SAHNELER
========================= */

function makeScenes(script,duration){

 const sentences=script
   .split(/\n+/)
   .join(" ")
   .split(/[.!?]+/)
   .map(x=>x.trim())
   .filter(x=>x.length>5);

 const count=
   duration<=30 ? 5 :
   duration<=60 ? 7 : 9;

 const scenes=[];

 for(let i=0;i<count;i++){

   const start=Math.floor(
     i*sentences.length/count
   );

   const end=Math.max(
     start+1,
     Math.floor((i+1)*sentences.length/count)
   );

   let text=sentences
     .slice(start,end)
     .join(". ");

   if(!text) text="Hikâye devam ediyor.";

   scenes.push({

     id:i+1,

     text:text+".",

     prompt:makePrompt(text,i+1),

     image:null

   });

 }

 return scenes;

}


/* =========================
   PROMPT
========================= */

function makePrompt(text,no){

 const styles={

  cinematic:
  "cinematic movie still, realistic lighting, dramatic atmosphere, shallow depth of field",

  realistic:
  "photorealistic documentary photography, natural lighting, realistic human emotions",

  dark:
  "dark cinematic atmosphere, dramatic shadows, mysterious mood, realistic film still",

  business:
  "successful entrepreneur atmosphere, modern business environment, cinematic realistic photography"

 };

 return(
  styles[project.style]+
  ", scene "+no+
  ", a determined man building his life from nothing, "+
  text+
  ", 16:9, highly detailed, no text, no watermark"
 );

}


/* =========================
   SAHNELERİ GÖSTER
========================= */

function renderScenes(){

 const box=document.getElementById("scenes");

 box.innerHTML="";

 project.scenes.forEach(scene=>{

  const div=document.createElement("div");

  div.className="scene";

  div.id="scene-"+scene.id;

  div.innerHTML=`

   <div class="sceneTop">

    <div class="sceneNo">
     🎬 SAHNE ${scene.id}
    </div>

    <button
      class="secondary"
      onclick="uploadImage(${scene.id})">
      📁 GERÇEK GÖRSEL EKLE
    </button>

   </div>

   <div class="sceneText">
    ${escapeHTML(scene.text)}
   </div>

   <div class="prompt">
    ${escapeHTML(scene.prompt)}
   </div>

   <img
    class="sceneImage"
    id="img-${scene.id}"
    alt="Sahne ${scene.id}"
   >

   <div class="actions">

    <button
      class="secondary"
      onclick="generateScene(${scene.id})">
      ✨ SAHNEYİ OLUŞTUR
    </button>

    <button
      class="secondary"
      onclick="speakScene(${scene.id})">
      🔊 SESLENDİR
    </button>

   </div>

  `;

  box.appendChild(div);

 });

}


/* =========================
   HAFİF YEREL GÖRSEL
========================= */

function generateScene(id){

 const scene=
   project.scenes.find(x=>x.id===id);

 if(!scene)return;

 const svg=createSVGImage(
   scene.id,
   scene.text,
   project.style
 );

 const url=
   "data:image/svg+xml;charset=utf-8,"+
   encodeURIComponent(svg);

 scene.image=url;

 document.getElementById(
   "img-"+id
 ).src=url;

 status(
   "✅ Sahne "+id+
   " oluşturuldu. Hafif yerel sinematik görsel kullanıldı."
 );

}


/* =========================
   TÜM SAHNELER
========================= */

async function generateAllScenes(){

 if(!project.scenes.length){

   alert("Önce PROJE OLUŞTUR.");

   return;

 }

 for(let i=0;i<project.scenes.length;i++){

   generateScene(
     project.scenes[i].id
   );

   progress(
     25+
     ((i+1)/project.scenes.length)*50
   );

   await sleep(250);

 }

 status(
  "✅ Tüm sahneler hazır.<br>"+
  "İstersen gerçek fotoğraflar ekleyebilir veya "+
  "<b>VİDEOYU OLUŞTUR</b> butonuna basabilirsin."
 );

}

/* =========================
   DOSYADAN GÖRSEL EKLE
========================= */

function uploadImage(id){

 const input=document.createElement("input");

 input.type="file";
 input.accept="image/*";

 input.onchange=function(){

  const file=input.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){

   const url=reader.result;

   const scene=
     project.scenes.find(x=>x.id===id);

   if(scene){

    scene.image=url;

   }

   document.getElementById(
     "img-"+id
   ).src=url;

   status(
    "📷 Sahne "+id+
    " için gerçek görsel eklendi."
   );

  };

  reader.readAsDataURL(file);

 };

 input.click();

}


/* =========================
   SESLENDİR
========================= */

function speakText(text){

 speechSynthesis.cancel();

 const voices=
   speechSynthesis.getVoices();

 const select=
   document.getElementById("voiceSelect");

 let voice=null;

 if(select.value!=="" &&
    voices.length){

   const tr=
     voices.filter(v=>
       v.lang &&
       v.lang.toLowerCase().startsWith("tr")
     );

   voice=
     tr[parseInt(select.value)] ||
     tr[0];

 }

 const utter=
   new SpeechSynthesisUtterance(text);

 utter.lang="tr-TR";
 utter.rate=.92;
 utter.pitch=1;

 if(voice){

   utter.voice=voice;

 }

 speechSynthesis.speak(utter);

}


function speakScript(){

 const text=
   document.getElementById("scriptBox").value;

 speakText(text);

 status("🎙️ Senaryo seslendiriliyor...");

}


function speakScene(id){

 const scene=
   project.scenes.find(x=>x.id===id);

 if(scene){

   speakText(scene.text);

 }

}


/* =========================
   VİDEO
========================= */

async function createVideo(){

 if(!project.scenes.length){

   alert("Önce proje oluştur.");

   return;

 }

 for(const scene of project.scenes){

   if(!scene.image){

     generateScene(scene.id);

   }

 }

 const canvas=
   document.getElementById("videoCanvas");

 const ctx=
   canvas.getContext("2d");

 const stream=
   canvas.captureStream(30);

 let mime="video/webm";

 if(MediaRecorder.isTypeSupported(
   "video/webm;codecs=vp9"
 )){
   mime="video/webm;codecs=vp9";
 }
 else if(MediaRecorder.isTypeSupported(
   "video/webm;codecs=vp8"
 )){
   mime="video/webm;codecs=vp8";
 }

 const recorder=
   new MediaRecorder(
     stream,
     {mimeType:mime}
   );

 const chunks=[];

 recorder.ondataavailable=e=>{

   if(e.data.size>0){

     chunks.push(e.data);

   }

 };

 recorder.onstop=()=>{

   const blob=
     new Blob(
       chunks,
       {type:"video/webm"}
     );

   const url=
     URL.createObjectURL(blob);

   const link=
     document.getElementById("downloadLink");

   link.href=url;

   link.download=
     "mina-video-"+Date.now()+".webm";

   document.getElementById(
     "downloadBox"
   ).style.display="block";

   status(
     "🎉 Video hazır! "+
     "Aşağıdaki butondan WebM olarak kaydedebilirsin."
   );

   progress(100);

 };

 recorder.start();

 const sceneTime=
   project.duration/
   project.scenes.length;

 for(let i=0;i<project.scenes.length;i++){

   const scene=
     project.scenes[i];

   const img=
     await loadImage(scene.image);

   const frames=
     Math.max(
       1,
       Math.floor(sceneTime*30)
     );

   for(let f=0;f<frames;f++){

     drawFrame(
       ctx,
       img,
       scene,
       f/frames
     );

     await sleep(33);

   }

   progress(
     75+
     ((i+1)/project.scenes.length)*25
   );

 }

 recorder.stop();

}


/* =========================
   VIDEO FRAME
========================= */

function drawFrame(ctx,img,scene,t){

 const w=ctx.canvas.width;
 const h=ctx.canvas.height;

 ctx.fillStyle="#000";

 ctx.fillRect(
   0,0,w,h
 );

 let scale=
   1.0+
   t*.07;

 let iw=img.width*scale;
 let ih=img.height*scale;

 let x=
   (w-iw)/2-
   t*25;

 let y=
   (h-ih)/2;

 ctx.drawImage(
   img,
   x,
   y,
   iw,
   ih
 );

 const grad=
   ctx.createLinearGradient(
     0,0,0,h
   );

 grad.addColorStop(
   0,
   "rgba(0,0,0,.15)"
 );

 grad.addColorStop(
   .65,
   "rgba(0,0,0,.2)"
 );

 grad.addColorStop(
   1,
   "rgba(0,0,0,.78)"
 );

 ctx.fillStyle=grad;

 ctx.fillRect(
   0,0,w,h
 );

 ctx.fillStyle="#fff";

 ctx.font=
   "bold 28px Arial";

 ctx.fillText(
   "MINA VIDEO AI",
   45,
   55
 );

 ctx.font=
   "bold 34px Arial";

 wrapText(
   ctx,
   scene.text,
   55,
   h-125,
   w-110,
   42
 );

 ctx.font=
   "20px Arial";

 ctx.fillStyle=
   "rgba(255,255,255,.7)";

 ctx.fillText(
   "Sahne "+scene.id,
   55,
   h-35
 );

}


/* =========================
   TEXT WRAP
========================= */

function wrapText(
 ctx,
 text,
 x,
 y,
 maxWidth,
 lineHeight
){

 const words=
   text.split(" ");

 let line="";

 for(let n=0;n<words.length;n++){

   const test=
     line+
     words[n]+" ";

   const width=
     ctx.measureText(test).width;

   if(
     width>maxWidth &&
     n>0
   ){

     ctx.fillText(
       line,
       x,
       y
     );

     line=
       words[n]+" ";

     y+=lineHeight;

   }else{

     line=test;

   }

 }

 ctx.fillText(
   line,
   x,
   y
 );

}


/* =========================
   IMAGE LOAD
========================= */

function loadImage(src){

 return new Promise(
   (resolve,reject)=>{

     const img=
       new Image();

     img.onload=()=>resolve(img);

     img.onerror=reject;

     img.src=src;

   }
 );

}

/* =========================
   GENERIC DOWNLOAD
========================= */

function downloadFile(
 filename,
 content,
 type
){

 const blob=
   new Blob(
     [content],
     {type:type}
   );

 const url=
   URL.createObjectURL(blob);

 const a=
   document.createElement("a");

 a.href=url;

 a.download=filename;

 document.body.appendChild(a);

 a.click();

 a.remove();

 setTimeout(
   ()=>URL.revokeObjectURL(url),
   1000
 );

}

function sleep(ms){

 return new Promise(
   resolve=>setTimeout(
     resolve,
     ms
   )
 );

}


function escapeHTML(str){

 return str
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");

}


function escapeXML(str){

 return str
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&apos;");

}
