/* =========================================================
   RANDOM
========================================================= */

function randomString(length=40){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

const arr=
new Uint8Array(length);

crypto.getRandomValues(arr);

let out="";

for(let i=0;i<length;i++){

out+=
chars[arr[i]%chars.length];

}

return out;

}


/* =========================================================
   PKCE
========================================================= */

function base64url(buffer){

return btoa(
String.fromCharCode(
...new Uint8Array(buffer)
)
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=+$/,"");

}

async function makePKCE(){

const verifier=
randomString(64);

const data=
new TextEncoder()
.encode(verifier);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return {

verifier,

challenge:
base64url(hash)

};

}

/* =========================================================
   TEST SESİ
=========================================================

   ÖNEMLİ:
   Bu ses konuşma değildir.

   Amaç:
   MediaRecorder'ın gerçekten
   ses kanalını WebM'e gömüp gömmediğini
   test etmektir.

========================================================= */

async function createTestAudio(){

const sampleRate=
44100;

const seconds=
Math.max(
5,
scenesData.length*5
);

const length=
sampleRate*seconds;

const buffer=
new AudioContext()
.createBuffer(
1,
length,
sampleRate
);

const channel=
buffer.getChannelData(0);

/*
   Konuşma benzeri olmayan,
   fakat net şekilde duyulabilen
   yumuşak test tonu.
*/

for(
let i=0;
i<length;
i++
){

const t=
i/sampleRate;

const pulse=
Math.sin(
2*Math.PI*
220*t
);

const envelope=
Math.min(
1,
t/.15
)*
Math.min(
1,
(seconds-t)/.3
);

channel[i]=
pulse*
0.12*
Math.max(
0,
envelope
);

}

finalAudioBlob=
audioBufferToWav(
buffer
);

const url=
URL.createObjectURL(
finalAudioBlob
);

audioContainer.innerHTML=
`<audio controls src="${url}"></audio>`;

audioInfo.innerHTML=
"🔊 Test sesi hazır. Bu ses WebM içine gömülecek.";

audioInfo.className=
"status success";

}

/* =========================================================
   WAV DÖNÜŞTÜRÜCÜ
========================================================= */

function audioBufferToWav(buffer){

const channels=
buffer.numberOfChannels;

const sampleRate=
buffer.sampleRate;

const data=
buffer.getChannelData(0);

const bytes=
data.length*2;

const array=
new ArrayBuffer(
44+bytes
);

const view=
new DataView(array);

writeString(
view,
0,
"RIFF"
);

view.setUint32(
4,
36+bytes,
true
);

writeString(
view,
8,
"WAVE"
);

writeString(
view,
12,
"fmt "
);

view.setUint32(
16,
16,
true
);

view.setUint16(
20,
1,
true
);

view.setUint16(
22,
1,
true
);

view.setUint32(
24,
sampleRate,
true
);

view.setUint32(
28,
sampleRate*2,
true
);

view.setUint16(
32,
2,
true
);

view.setUint16(
34,
16,
true
);

writeString(
view,
36,
"data"
);

view.setUint32(
40,
bytes,
true
);

let offset=44;

for(
let i=0;
i<data.length;
i++
){

let sample=
Math.max(
-1,
Math.min(
1,
data[i]
)
);

view.setInt16(
offset,
sample<0
?sample*0x8000
:sample*0x7fff,
true
);

offset+=2;

}

return new Blob(
[array],
{
type:"audio/wav"
}
);

}

function writeString(
view,
offset,
text
){

for(
let i=0;
i<text.length;
i++
){

view.setUint8(
offset+i,
text.charCodeAt(i)
);

}

}


/* =========================================================
   WAV -> AUDIOBUFFER
========================================================= */

async function blobToAudioBuffer(blob){

const arrayBuffer=
await blob.arrayBuffer();

const ctx=
new AudioContext();

const decoded=
await ctx.decodeAudioData(
arrayBuffer
);

return decoded;

}

if(!finalAudioBlob){

status(
"Önce ses oluştur.",
"warning"
);

return;

}

videoBtn.disabled=true;

try{

status(
"🎥 Sesli WebM hazırlanıyor..."
);

progress(76);


/* CANVAS */

const canvas=
document.createElement(
"canvas"
);

canvas.width=1280;
canvas.height=720;

const ctx=
canvas.getContext(
"2d"
);


/* VIDEO STREAM */

const videoStream=
canvas.captureStream(30);


/* AUDIO */

const audioCtx=
new AudioContext();

await audioCtx.resume();

const destination=
audioCtx
.createMediaStreamDestination();

const audioBuffer=
await blobToAudioBuffer(
finalAudioBlob
);

const source=
audioCtx
.createBufferSource();

source.buffer=
audioBuffer;

source.connect(
destination
);


/* FINAL STREAM */

const finalStream=
new MediaStream();

videoStream
.getVideoTracks()
.forEach(
track=>
finalStream.addTrack(
track
)
);

destination
.stream
.getAudioTracks()
.forEach(
track=>
finalStream.addTrack(
track
)
);


/* RECORDER */

let mime=
"video/webm;codecs=vp9,opus";

if(
!MediaRecorder
.isTypeSupported(mime)
){

mime=
"video/webm;codecs=vp8,opus";

}

if(
!MediaRecorder
.isTypeSupported(mime)
){

mime=
"video/webm";

}


const chunks=[];

const recorder=
new MediaRecorder(
finalStream,
{
mimeType:mime,
videoBitsPerSecond:5000000
}
);

recorder.ondataavailable=
e=>{

if(
e.data &&
e.data.size
){

chunks.push(e.data);

}

};


const stopped=
new Promise(
resolve=>
recorder.onstop=
resolve
);


/* BAŞLAT */

recorder.start(
250
);

source.start();


/* SAHNELER */

const sceneDuration=
5000;

for(
let i=0;
i<scenesData.length;
i++
){

const scene=
scenesData[i];

status(
`🎥 Sahne ${i+1}/${scenesData.length}...`
);

const img=
await loadImage(
scene.image
);

const start=
performance.now();

while(
performance.now()-
start<
sceneDuration
){

/* GÖRSEL */

ctx.drawImage(
img,
0,
0,
1280,
720
);


/* KARARTMA */

ctx.fillStyle=
"rgba(0,0,0,.18)";

ctx.fillRect(
0,
0,
1280,
720
);


/* SAHNE */

ctx.fillStyle=
"rgba(0,0,0,.65)";

roundRect(
ctx,
35,
30,
160,
48,
12
);

ctx.fill();

ctx.fillStyle=
"#fff";

ctx.font=
"bold 22px Arial";

ctx.fillText(
`SAHNE ${i+1}`,
55,
62
);


/* ALTYAZI */

drawSubtitle(
ctx,
scene.narration
);

await nextFrame();

}

progress(
76+
((i+1)/
scenesData.length)*20
);

}


/* BİTİR */

await new Promise(
resolve=>
setTimeout(
resolve,
300
)
);

recorder.stop();

source.stop();

await stopped;

audioCtx.close();


/* BLOB */

const blob=
new Blob(
chunks,
{
type:mime
}
);

const url=
URL.createObjectURL(
blob
);

video.src=
url;

download.href=
url;

download.download=
"mina-video-sesli-"+Date.now()+".webm";

download.style.display=
"block";

progress(100);

status(
"🎉 VİDEO HAZIR — SES WEBM DOSYASINA GÖMÜLDÜ.",
"success"
);

}catch(e){

console.error(e);

status(
"❌ Video hatası: "+
e.message,
"error"
);

}finally{

videoBtn.disabled=false;

}

}


/* =========================================================
   ALTYAZI
========================================================= */

function drawSubtitle(
ctx,
text
){

ctx.font=
"bold 30px Arial";

const max=1000;

const words=
String(text)
.split(/\s+/);

const lines=[];

let line="";

for(
const word of words
){

const test=
line
?line+" "+word
:word;

if(
ctx.measureText(test)
.width>max
){

if(line)
lines.push(line);

line=word;

}else{

line=test;

}

}

if(line)
lines.push(line);

const lineHeight=40;

const height=
lines.length*
lineHeight+
45;

const y=
720-height-25;

ctx.fillStyle=
"rgba(0,0,0,.75)";

roundRect(
ctx,
70,
y,
1140,
height,
16
);

ctx.fill();

ctx.fillStyle="#fff";

ctx.textAlign="center";

lines.forEach(
(l,i)=>{

ctx.fillText(
l,
640,
y+35+
i*lineHeight
);

}
);

ctx.textAlign="left";

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
ctx,
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.arcTo(
x+w,
y,
x+w,
y+h,
r
);

ctx.arcTo(
x+w,
y+h,
x,
y+h,
r
);

ctx.arcTo(
x,
y+h,
x,
y,
r
);

ctx.arcTo(
x,
y,
x+w,
y,
r
);

ctx.closePath();

}


/* =========================================================
   FRAME
========================================================= */

function nextFrame(){

return new Promise(
resolve=>
requestAnimationFrame(
resolve
)
);

}


/* =========================================================
   EVENTS
========================================================= */

connectBtn.onclick=
connect;

scriptBtn.onclick=
createScript;

imageBtn.onclick=
createImages;

audioBtn.onclick=
createAudio;

videoBtn.onclick=
createVideo;


/* =========================================================
   BAŞLAT
========================================================= */

callback();

</script>

</body>
</html>
